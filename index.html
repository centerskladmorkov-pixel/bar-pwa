      <div class="tabs" role="radiogroup" aria-label="Тема">
        <button type="button" class="tabs__tab" role="radio" :aria-checked="store.theme === 'light'" :aria-selected="store.theme === 'light'" @click="setTheme('light')">День</button>
        <button type="button" class="tabs__tab" role="radio" :aria-checked="store.theme === 'dark'" :aria-selected="store.theme === 'dark'" @click="setTheme('dark')">Ночь</button>
      </div>
    </div>
    <div class="wa-device__row">
      <span class="wa-device__label">Вид экрана</span>
      <div class="tabs" role="radiogroup" aria-label="Вид экрана">
        <button v-for="l in LAYOUTS" :key="l.id" type="button" class="tabs__tab" role="radio"
                :aria-checked="store.layout === l.id" :aria-selected="store.layout === l.id" @click="setLayout(l.id)">{{ l.label }}</button>
      </div>
    </div>
  </div>
</script>

<script>
window.MFC = window.Vue ? (function () {

  const { reactive, watch } = Vue;

  // ------------------------------------------------------------------ утилиты

  // localStorage может быть недоступен (приватный режим) — тогда просто не запоминаем
  const LS = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} },
  };

  // Работа без интернета (PWA, 2026-10-26; сборка tools/build_pwa.js задаёт MF_OFFLINE): данные экранов — копией на
  // устройстве, действия точки — очередью (outbox ниже). В приложении Apps Script выключено — там всё как раньше.
  const OFFLINE = !!window.MF_OFFLINE;

  // Хранилище на устройстве для копий данных (IndexedDB: большие объёмы, localStorage — маленький и занят фото).
  // Нет его (приватный режим) — копий просто нет
  const IDB = (() => {
    let dbp = null;
    const open = () => dbp || (dbp = new Promise((res, rej) => {
      const r = indexedDB.open('mf-bar', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    }));
    const run = (mode, fn) => open().then(db => new Promise((res, rej) => {
      const t = db.transaction('kv', mode);
      const q = fn(t.objectStore('kv'));
      t.oncomplete = () => res(q.result);
      t.onerror = () => rej(t.error);
    }));
    return {
      get: k => run('readonly', s => s.get(k)).catch(() => undefined),
      set: (k, v) => run('readwrite', s => s.put(v, k)).catch(() => {}),
      clear: () => run('readwrite', s => s.clear()).catch(() => {}),
    };
  })();

  // Форматтеры из design/demo.js: запятая, точность до 0,001
  const MF = {
    fmt: n => n == null || n === '' ? '' : String(Math.round(n * 1000) / 1000).replace('.', ','),
    num: s => s ? (parseFloat(String(s).replace(',', '.')) || 0) : 0,
    date(d) {
      const W = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
      const M = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
      return W[d.getDay()] + ', ' + d.getDate() + ' ' + M[d.getMonth()];
    },
    // 'yyyy-MM-dd' → «Вс, 4 октября»
    day: s => s ? MF.date(new Date(s + 'T12:00:00')) : '',
  };

  // 1 блюдо, 2 блюда, 5 блюд
  function plural(n, forms) {
    const a = Math.abs(n) % 100, b = a % 10;
    return forms[a > 10 && a < 20 ? 2 : b > 1 && b < 5 ? 1 : b === 1 ? 0 : 2];
  }

  // «Анна Смирнова» → «АС»
  const initials = name => String(name || '').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();

  const asset = name => (window.MF_ASSETS || {})[name] || '';

  // Заглушка вместо фото: класс .thumb--* → иллюстрация группы
  const THUMB_IMG = { smoothie: 'strawberry', fresh: 'lemon', bowl: 'avocado', dessert: 'plum' };
  const thumbImg = thumb => THUMB_IMG[thumb] ? asset(THUMB_IMG[thumb]) : '';

  const ROLE_LABELS = { point: 'Точка', admin: 'Администратор', owner: 'Руководитель' };
  const MODE_LABELS = { bar: 'Бар', prep: 'Заготовка', both: 'Бар и заготовка' };

  // ------------------------------------------------------------------ состояние

  const store = reactive({
    phase: 'boot',     // boot | login | app
    fatal: '',
    notice: '',
    user: null,
    points: [],
    settings: {},
    photos: {},        // id блюда → id картинки iiko (сами картинки — photoOf)
    news: [],          // новости за последние дни — слайды при входе (ui_news.html)
    training: null,    // обучение: { kind, version, done } (ui_training.html)
    salad: null,       // «Заготовки Салат БАЗА»: { tts } — раздел в меню (руководителю и админам точек раздела)
    saladTab: '',      // открыть раздел на этой вкладке (переход из «Настроек»)
    today: '',
    view: '',
    pointTt: '',       // админ открыл экраны этой точки (у учётной записи точки — пусто)
    theme: document.documentElement.getAttribute('data-theme') || 'light',
    layout: document.documentElement.getAttribute('data-layout') || 'auto',
    offline: !navigator.onLine,
  });

  // «Морковь IT» внизу заставки (ui_madeby.html) — только пока идёт загрузка
  const madeBy = document.getElementById('mf-made');
  if (madeBy) watch(() => store.phase !== 'boot' || !!store.fatal, hide => madeBy.classList.toggle('is-hidden', hide), { immediate: true });

  window.addEventListener('online', () => { store.offline = false; });
  window.addEventListener('offline', () => { store.offline = true; });

  // Тема и вид экрана запоминаются на устройстве (атрибуты ставит ui_index.html до отрисовки)
  function setTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    LS.set('mf-theme', theme);
    store.theme = theme;
  }

  const toggleTheme = () => setTheme(store.theme === 'dark' ? 'light' : 'dark');

  const LAYOUTS = [
    { id: 'auto', label: 'Авто' },
    { id: 'phone', label: 'Телефон' },
    { id: 'tablet', label: 'Планшет' },
    { id: 'desktop', label: 'ПК' },
  ];

  function setLayout(layout) {
    document.documentElement.setAttribute('data-layout', layout);
    LS.set('mf-layout', layout);
    store.layout = layout;
  }

  // Статус по факту — те же правила, что на сервере (waStatusFor_).
  // Больше плана сохранять можно: выше status_ready_max — перевыполнение, его видит администратор.
  function autoStatus(plan, fact, unit) {
    const lo = store.settings.status_ready_min || 0.75;
    const hi = store.settings.status_ready_max || 1.5;
    if (!(fact > 0)) return { tone: 'error', text: 'Фактическое количество должно быть больше нуля' };
    if (!(plan > 0)) return { tone: 'ok', text: 'Вне плана · будет отмечено «Готово»' };
    const k = fact / plan;
    if (k < lo - 1e-9) return { tone: 'partial', text: 'Частично готово · будет создан остаток ' + MF.fmt(plan - fact) + ' ' + unit };
    if (k > hi + 1e-9) {
      const typo = k >= 3 ? ' Проверьте, нет ли опечатки.' : '';
      return { tone: 'over', text: 'Готово · больше плана на ' + MF.fmt(fact - plan) + ' ' + unit + ' — увидит администратор.' + typo };
    }
    return { tone: 'ok', text: 'Готово' };
  }

  // ------------------------------------------------------------------ API

  class ApiError extends Error {
    constructor(e) {
      super((e && e.message) || 'Ошибка');
      this.code = (e && e.code) || 'INTERNAL';
      this.data = e || {};
    }
  }

  // PWA (интерфейс на своём адресе, tools/build_pwa.js задаёт MF_API_URL): тот же запрос — POST на /exec (doPost).
  // opId — номер действия из очереди: сервер не выполнит его дважды. Связь «висит» дольше 30 с — как нет связи
  async function fetchApi(method, params, opId) {
    let res = null;
    const ctl = window.AbortController ? new AbortController() : null;
    const timer = ctl ? setTimeout(() => ctl.abort(), 30000) : null;
    try {
      const r = await fetch(window.MF_API_URL, {
        method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, signal: ctl ? ctl.signal : undefined,
        body: JSON.stringify(Object.assign({ token: LS.get('mf-session'), method, params: params || {} }, opId ? { opId } : {})),
      });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      res = await r.json();
    } catch (e) {
      if (OFFLINE) store.offline = true;
      throw new ApiError({ code: 'NETWORK', message: 'Нет связи с сервером. Проверьте интернет и попробуйте ещё раз.' });
    } finally {
      clearTimeout(timer);
    }
    if (OFFLINE) store.offline = false;
    if (res && res.ok) return res.data;
    throw new ApiError(res && res.error ? res.error : {
      code: 'EMPTY', message: 'Сервер прислал пустой ответ (' + method + '). Попробуйте ещё раз; если повторится — пришлите скриншот.',
    });
  }

  function rawApi(method, params, opId) {
    if (window.MF_API_URL) return fetchApi(method, params, opId);
    return new Promise((resolve, reject) => {
      if (!window.google || !google.script) {
        reject(new ApiError({ code: 'NETWORK', message: 'Приложение открыто не из Apps Script' }));
        return;
      }
      google.script.run
        .withSuccessHandler(res => res && res.ok ? resolve(res.data) : reject(new ApiError(res ? res.error : {
          code: 'EMPTY', message: 'Сервер прислал пустой ответ (' + method + '). Попробуйте ещё раз; если повторится — пришлите скриншот.',
        })))
        .withFailureHandler(() => {
          if (OFFLINE) store.offline = true;
          reject(new ApiError({ code: 'NETWORK', message: 'Нет связи с сервером. Проверьте интернет и попробуйте ещё раз.' }));
        })
        .api(Object.assign({ token: LS.get('mf-session'), method, params: params || {} }, opId ? { opId } : {}));
    }).then(d => { if (OFFLINE) store.offline = false; return d; });
  }

  // Для экранов: истёкшую сессию молча восстанавливаем по токену устройства.
  // Без интернета (OFFLINE) чтение отдаёт последнюю копию с устройства — экран открывается, как был
  async function callApi(method, params, opId) {
    const key = OFFLINE && READ_CACHE.has(method) ? cacheKey(method, params) : '';
    try {
      const data = await callNet(method, params, opId);
      // Стартовые данные — под логином из ответа (вошёл другой пользователь — его ключ, не прошлого)
      if (key) IDB.set(method === 'app.bootstrap' && data && data.user ? cacheKey(method, params, data.user.login) : key, { at: Date.now(), data });
      return data;
    } catch (e) {
      if (key && e.code === 'NETWORK') {
        const hit = await IDB.get(key);
        if (hit) return hit.data;
      }
      throw e;
    }
  }

  async function callNet(method, params, opId) {
    try {
      return await rawApi(method, params, opId);
    } catch (e) {
      if (e.code !== 'AUTH') throw e;
      if (await resumeByDevice()) return rawApi(method, params, opId);
      toLogin('Сессия истекла — войдите снова');
      throw e;
    }
  }

  // Чтения, копия которых хранится на устройстве (без интернета экран показывает последнее загруженное)
  const READ_CACHE = new Set(['app.bootstrap', 'work.load', 'dir.list', 'dir.techCard', 'training.data', 'news.photo',
    'admin.dashboard', 'admin.analytics', 'admin.archive.summary', 'admin.archive.query', 'admin.prep.pending', 'admin.iiko.status',
    'admin.autoplan.preview', 'admin.autoplan.status', 'salad.ui', 'salad.day', 'salad.sales', 'salad.archive',
    'owner.settings', 'owner.users', 'owner.salad.settings', 'owner.pack.ui', 'owner.news.list', 'journal.query']);
  // Копии — под логином: на одном планшете не покажутся данные прошлого пользователя. Пока стартовых данных нет —
  // логин ключа входа (mf-session-login), иначе того, чьи копии на устройстве (mf-cache-login; mf-last-login — другое:
  // подсказка логина на экране входа)
  const cacheKey = (method, params, login) => 'api:' + (login || (store.user ? store.user.login : LS.get('mf-session-login') || LS.get('mf-cache-login')) || '') +
    ':' + method + ':' + JSON.stringify(params || {});
  // Экран точки меняет загруженные данные ответами очереди — копия на устройстве тоже должна быть свежей
  const cachePut = (method, params, data) => { if (OFFLINE) IDB.set(cacheKey(method, params), { at: Date.now(), data }); };

  // ------------------------------------------------------------------ очередь действий (OFFLINE, 2026-10-26)
  // Действия точки (отметки, «Вне плана», возврат в работу, смена, «Набор собран») — сразу на экране и в очередь на
  // устройстве (localStorage: переживает закрытие приложения), на сервер — по одному и по порядку, когда есть связь.
  // У действия свой номер (opId): потерялся ответ — сервер не выполнит его второй раз (api()). Сервер отказал
  // (позицию уже отметили с другого устройства, день закрыт…) — действие остаётся в журнале «Не принято» с причиной.
  // op: { id, login, method, params, at, label, tt, state: wait | send | fail, error, tries }
  const OUTBOX_KEY = 'mf-outbox';
  const RETRY_CODES = ['NETWORK', 'BUSY', 'AUTH', 'EMPTY', 'INTERNAL'];
  const outbox = reactive({ ops: readOps(), busy: false, open: false, tries: 0 });
  const opHandlers = {};   // method → (op, data) => { map, updated, failed } — экран точки: ответ сервера на экран; fail — отказ
  let opsTimer = null;

  function readOps() {
    try {
      const a = JSON.parse(LS.get(OUTBOX_KEY) || '[]');
      // «Отправлялось», когда приложение закрыли, — отправить снова (повтор сервер не выполнит дважды)
      return Array.isArray(a) ? a.filter(o => o && o.id && o.method && o.login).map(o => Object.assign(o, { state: o.state === 'send' ? 'wait' : o.state })) : [];
    } catch (e) { return []; }
  }
  function saveOps() { LS.set(OUTBOX_KEY, outbox.ops.length ? JSON.stringify(outbox.ops) : null); }
  const myOps = () => outbox.ops.filter(o => store.user && o.login === store.user.login);

  function queueOp(method, params, info) {
    const op = Object.assign({
      id: 'op' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8), login: store.user.login,
      method, params, at: Date.now(), label: method, tt: '', state: 'wait', error: '', tries: 0,
    }, info);
    outbox.ops.push(op);
    saveOps();
    kickOps(0);
    return op;
  }

  // Убрать действие из очереди: ещё не отправленное (сняли галочку без интернета) или не принятое. true — убрано
  function cancelOp(id) {
    const i = outbox.ops.findIndex(o => o.id === id && o.state !== 'send');
    if (i < 0) return false;
    outbox.ops.splice(i, 1);
    saveOps();
    return true;
  }

  function kickOps(ms) {
    if (!OFFLINE) return;
    clearTimeout(opsTimer);
    opsTimer = setTimeout(sendOps, ms == null ? 300 : ms);
  }

  async function sendOps() {
    if (outbox.busy || !store.user || store.phase !== 'app') return;
    outbox.busy = true;
    try {
      for (;;) {
        const op = myOps().find(o => o.state === 'wait');
        if (!op) { outbox.tries = 0; break; }
        op.state = 'send';
        saveOps();
        let data = null, err = null;
        // Копия параметров: в очереди они — живой объект Vue, а отправке нужен обычный
        try { data = await callNet(op.method, JSON.parse(JSON.stringify(op.params)), op.id); } catch (e) { err = e; }
        // Нет связи, сервер занят, нужен вход — действие ждёт; ошибка сервера — до трёх повторов
        if (err && RETRY_CODES.includes(err.code) && !(err.code === 'INTERNAL' && op.tries >= 2)) {
          Object.assign(op, { state: 'wait', error: err.code === 'NETWORK' ? '' : err.message, tries: op.tries + (err.code === 'INTERNAL' ? 1 : 0) });
          saveOps();
          outbox.tries++;
          if (err.code !== 'AUTH') kickOps(Math.min(60000, 2000 * Math.pow(2, Math.min(outbox.tries - 1, 5))));
          break;
        }
        let fx = {};
        if (!err && opHandlers[op.method]) {
          try { fx = opHandlers[op.method](op, data) || {}; } catch (e) { console.error('Очередь: ответ', op.method, e); }
        }
        // Часть пачки принята — её ответ всё равно правит следующие действия
        if (fx.map || fx.updated) rewriteOps(fx.map || {}, fx.updated || {});
        const failed = err ? err.message : fx.failed;
        if (failed) {
          Object.assign(op, { state: 'fail', error: failed });
          saveOps();
          if (opHandlers.fail) { try { opHandlers.fail(op, err); } catch (e) { console.error('Очередь: отказ', e); } }
          continue;
        }
        outbox.ops.splice(outbox.ops.indexOf(op), 1);
        saveOps();
        outbox.tries = 0;
      }
    } finally {
      outbox.busy = false;
    }
  }

  // Ответ сервера правит следующие действия очереди: временный uid (остаток «Частично», «Вне плана») — на настоящий,
  // expectedUpdatedAt — на время изменения позиции этим ответом (иначе сервер счёл бы их конфликтом)
  function rewriteOps(map, updated) {
    const fix = u => map[u] || u;
    const one = it => {
      if (!it || !it.uid) return;
      it.uid = fix(it.uid);
      if ('expectedUpdatedAt' in it && it.uid in updated) it.expectedUpdatedAt = updated[it.uid];
    };
    for (const o of outbox.ops) {
      if (o.state === 'send') continue;
      const p = o.params || {};
      if (Array.isArray(p.items)) p.items.forEach(one); else one(p);
      if (Array.isArray(p.uids)) p.uids = p.uids.map(fix);
    }
  }

  // Отправить, как только появилась связь, вернулись в приложение, вошли; ждущее — проверять раз в полминуты
  if (OFFLINE) {
    window.addEventListener('online', () => kickOps(0));
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') kickOps(0); });
    watch(() => store.phase === 'app' && store.user && store.user.login, on => { if (on) kickOps(500); });
    setInterval(() => { if (myOps().some(o => o.state === 'wait') && !outbox.busy) kickOps(0); }, 30000);
  }

  async function resumeByDevice() {
    const deviceToken = LS.get('mf-device');
    if (!deviceToken) return false;
    try {
      const r = await rawApi('auth.resume', { deviceToken });
      LS.set('mf-session', r.token);
      if (r.user) LS.set('mf-session-login', r.user.login);
      return true;
    } catch (e) {
      if (e.code === 'AUTH') LS.set('mf-device', null);
      return false;
    }
  }

  // ------------------------------------------------------------------ навигация

  const SCREENS = {
    shift:        { title: 'Смена',            icon: 'home',       stage: 3 },
    dishes:       { title: 'Блюда',            icon: 'utensils',   stage: 3 },
    preps:        { title: 'Заготовки',        icon: 'package',    stage: 3 },
    smoothies:    { title: 'Лимонады и смузи', icon: 'cup',        stage: 3 },
    directory:    { title: 'Справочник',       icon: 'book',       stage: 3 },
    dashboard:    { title: 'Дашборд сети',     icon: 'dashboard',  stage: 4, short: 'Дашборд' },
    calc:         { title: 'Расчёт заготовок', icon: 'calculator', stage: 4, short: 'Расчёт' },
    analytics:    { title: 'Аналитика',        icon: 'chart' },
    archive:      { title: 'Архив',            icon: 'archive',    stage: 4 },
    autoplan:     { title: 'Автоплан',         icon: 'calendar',   stage: 7 },
    employees:    { title: 'Сотрудники',       icon: 'user',       stage: 4 },
    dirs:         { title: 'Справочники',      icon: 'book',       stage: 4 },
    integrations: { title: 'Интеграции',       icon: 'plug',       stage: 4 },
    users:        { title: 'Пользователи',     icon: 'users',      stage: 5 },
    settings:     { title: 'Настройки',        icon: 'sliders',    stage: 5 },
    journal:      { title: 'Журнал',           icon: 'journal',    stage: 5 },
    packaging:    { title: 'Упаковка',         icon: 'cup-soda' },
    salad:        { title: 'Заготовки Салат БАЗА', icon: 'salad', short: 'Салат-база' },
    help:         { title: 'Инструкция',       icon: 'help' },
    training:     { title: 'Обучение',         icon: 'check' },   // не экран: окно поверх приложения (ui_training.html)
    planogram:    { title: 'Планограмма',      icon: 'layout' },
    support:      { title: 'Поддержка',        icon: 'phone' },   // не экран: окно с номером (ui_app.html)
    more:         { title: 'Ещё',              icon: 'more' },
  };

  const POINT_SCREENS = ['shift', 'dishes', 'preps', 'smoothies', 'directory'];
  // «Помощь» — всем ролям: у админа в «Ещё» и боковом меню, у точки — значок «?» в шапке и боковое меню
  const HELP_SCREENS = ['help', 'training', 'planogram', 'support'];

  const screen = id => Object.assign({ id }, SCREENS[id]);

  // Меню по роли. Точке — вкладки по режиму (бар / заготовка / оба).
  // Админ, открывший точку с дашборда, видит все её вкладки.
  function navFor(user, pointTt) {
    const help = HELP_SCREENS.map(screen);
    if (user.role === 'point' || pointTt) {
      const mode = user.role === 'point' ? user.mode : 'both';
      const main = POINT_SCREENS
        .filter(id => !(id === 'dishes' && mode === 'prep') && !(['preps', 'smoothies'].includes(id) && mode === 'bar'))
        .map(screen);
      return { main, more: [], help, sections: [{ title: '', items: main }, { title: 'Помощь', items: help }] };
    }

    // День закрывается сам в 23:00 (решение 2026-10-08) — на месте «Закрытия дня» аналитика
    const main = ['dashboard', 'calc', 'analytics', 'archive'].map(screen);
    // Журнал админ видит по своим точкам — в «Управлении»; у руководителя он в своём разделе
    // «Заготовки Салат БАЗА» — руководителю и админам точек раздела (store.salad приходит с app.bootstrap)
    const manage = (store.salad ? ['salad'] : []).concat(['autoplan', 'employees', 'dirs', 'integrations'],
      user.role === 'admin' ? ['journal'] : []).map(screen);
    const owner = user.role === 'owner' ? ['packaging', 'users', 'settings', 'journal'].map(screen) : [];
    const sections = [{ title: '', items: main }, { title: 'Управление', items: manage }];
    if (owner.length) sections.push({ title: 'Руководитель', items: owner });
    sections.push({ title: 'Помощь', items: help });
    return { main, more: manage.concat(owner, help), help, sections };
  }

  function allScreens(user, pointTt) {
    const nav = navFor(user, pointTt);
    return nav.main.concat(nav.more).map(s => s.id).concat(nav.more.length ? ['more'] : [], ['help', 'planogram']);
  }

  // ------------------------------------------------------------------ жизненный цикл

  // Повторная загрузка (кнопка «Обновить») оставляет пользователя на том же экране
  async function loadApp() {
    applyBoot(await callApi('app.bootstrap'));
  }

  function applyBoot(d) {
    if (OFFLINE) {
      const was = LS.get('mf-cache-login');
      if (was !== d.user.login) {
        LS.set('mf-cache-login', d.user.login);
        if (was) IDB.clear().then(() => IDB.set(cacheKey('app.bootstrap', {}, d.user.login), { at: Date.now(), data: d }));
      }
    }
    const same = store.user && store.user.login === d.user.login;
    const pointTt = same && d.user.role !== 'point' && d.points.some(p => p.tt === store.pointTt) ? store.pointTt : '';
    store.salad = d.salad || null;   // до меню: от него зависит, есть ли «Заготовки Салат БАЗА»
    const screens = allScreens(d.user, pointTt);
    const saved = LS.get('mf-view:' + d.user.login);
    Object.assign(store, {
      user: d.user,
      points: d.points,
      settings: d.settings,
      photos: d.photos || {},
      news: d.news || [],
      training: d.training || null,   // { kind, version, done } — не пройдено: обучение откроется само
      today: d.today,
      pointTt,
      view: same && screens.includes(store.view) ? store.view
        : screens.includes(saved) ? saved : navFor(d.user, pointTt).main[0].id,
      phase: 'app',
      fatal: '',
      notice: '',
    });
  }

  function toLogin(notice) {
    LS.set('mf-session', null);
    Object.assign(store, { phase: 'login', user: null, pointTt: '', notice: notice || '' });
  }

  // Админ открывает экраны точки (те же, что на её планшете) и возвращается к дашборду
  function enterPoint(tt) {
    Object.assign(store, { pointTt: tt, view: 'shift' });
    window.scrollTo(0, 0);
  }

  function leavePoint() {
    Object.assign(store, { pointTt: '', view: 'dashboard' });
    window.scrollTo(0, 0);
  }

  // 'yyyy-MM-dd' ± дни
  function addDays(day, n) {
    const d = new Date(day + 'T12:00:00Z');
    d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
  }

  // Метка 'yyyy-MM-dd HH:mm:ss' → «сегодня в 06:00», «вчера в 18:30», «02.10 в 09:15»
  function atText(at) {
    if (!at) return '';
    const day = at.slice(0, 10);
    const d = day === store.today ? 'сегодня' : day === addDays(store.today, -1) ? 'вчера' : day.slice(8, 10) + '.' + day.slice(5, 7);
    return d + ' в ' + at.slice(11, 16);
  }

  async function boot() {
    store.fatal = '';
    // Без интернета (OFFLINE): вход на устройстве есть и есть копия стартовых данных — приложение открывается сразу
    // из неё (и без сети), свежие данные и проверка входа — в фоне
    if (OFFLINE && (LS.get('mf-session') || LS.get('mf-device'))) {
      const hit = await IDB.get(cacheKey('app.bootstrap'));
      const owner = LS.get('mf-session-login');
      if (hit && hit.data && hit.data.user && (!owner || owner === hit.data.user.login)) {
        applyBoot(hit.data);
        refreshBoot();
        return;
      }
    }
    try {
      if (LS.get('mf-session') || await resumeByDevice()) {
        await loadApp();
      } else {
        store.phase = 'login';
      }
    } catch (e) {
      if (e.code === 'AUTH') return;  // callApi уже открыл экран входа
      store.fatal = e.message;
    }
  }

  // Открыли из копии — свежие стартовые данные с сервера. Нет связи — ещё раз, как появится (или через 20 с).
  // Вход отозван (токена устройства больше нет) — экран входа; очередь действий остаётся и уйдёт после входа
  let bootWait = null;
  async function refreshBoot() {
    try {
      if (!LS.get('mf-session') && !(await resumeByDevice())) {
        if (!LS.get('mf-device')) { toLogin('Войдите снова'); return; }
        throw new ApiError({ code: 'NETWORK' });
      }
      const d = await callNet('app.bootstrap');
      IDB.set(cacheKey('app.bootstrap', {}, d.user.login), { at: Date.now(), data: d });
      applyBoot(d);
    } catch (e) {
      if (e.code === 'NETWORK' && !bootWait) {
        const go = () => { clearTimeout(bootWait); bootWait = null; window.removeEventListener('online', go); refreshBoot(); };
        bootWait = setTimeout(go, 20000);
        window.addEventListener('online', go);
      }
    }
  }

  // Выход: копии данных на устройстве стираются (планшет могут отдать другой точке); очередь остаётся за своим логином
  function forgetDevice() {
    if (OFFLINE) IDB.clear();
  }

  // Настройки этого устройства: тема и вид экрана (Авто / Телефон / Планшет / ПК)
  const DeviceSettings = {
    template: '#tpl-device',
    setup() { return { store, LAYOUTS, setTheme, setLayout }; },
  };

  // ------------------------------------------------------------------ фото блюд
  // Картинка грузится один раз: с сервера пачкой, затем хранится на устройстве (ключ — id картинки,
  // поэтому сменённое в iiko фото придёт заново). Нет фото — у карточки остаётся заглушка.
  const photoData = reactive({});
  const photoQueue = new Set();
  const photoAsked = new Set();
  let photoTimer = null;

  function photoOf(dishId) {
    const img = dishId && store.photos[dishId];
    if (!img) return '';
    if (photoData[img]) return photoData[img];
    if (!photoAsked.has(img)) {
      photoAsked.add(img);
      photoQueue.add(img);
      clearTimeout(photoTimer);
      photoTimer = setTimeout(loadPhotos, 30);   // не во время отрисовки
    }
    return '';
  }

  // Новое фото после загрузки из iiko — сразу на экране, без перезагрузки приложения
  function setPhoto(dishId, imageId, uri) {
    store.photos[dishId] = imageId;
    photoData[imageId] = uri;
    LS.set('mf-ph:' + imageId, uri);
  }

  async function loadPhotos() {
    const ids = [...photoQueue];
    photoQueue.clear();
    const need = [];
    for (const id of ids) {
      const saved = LS.get('mf-ph:' + id);
      if (saved) photoData[id] = saved; else need.push(id);
    }
    for (let i = 0; i < need.length; i += 60) {
      try {
        const got = await callApi('dir.photos', { imageIds: need.slice(i, i + 60) });
        for (const [id, uri] of Object.entries(got)) {
          photoData[id] = uri;
          LS.set('mf-ph:' + id, uri);   // переполнение памяти устройства не страшно — фото просто придёт снова
        }
      } catch (e) { /* без фото — заглушка */ }
    }
  }

  // Конфетти из макета: 24 кусочка, удаляются через 3 с
  function confetti() {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const colors = ['var(--brand-carrot)', 'var(--group-fresh)', 'var(--group-smoothie)', 'var(--group-bowl)', 'var(--brand-green)'];
    const wrap = document.createElement('div');
    wrap.className = 'confetti';
    for (let i = 0; i < 24; i++) {
      const p = document.createElement('span');
      p.className = 'confetti__piece';
      p.style.setProperty('--x', Math.random() * 100 + '%');
      p.style.setProperty('--d', Math.random() * 0.6 + 's');
      p.style.setProperty('--c', colors[i % colors.length]);
      wrap.appendChild(p);
    }
    document.body.appendChild(wrap);
    setTimeout(() => wrap.remove(), 3200);
  }

  return {
    LS, MF, plural, initials, asset, thumbImg, ROLE_LABELS, MODE_LABELS,
    store, toggleTheme, setTheme, setLayout, LAYOUTS, autoStatus, DeviceSettings,
    ApiError, rawApi, callApi, resumeByDevice,
    OFFLINE, IDB, cachePut, outbox, myOps, queueOp, cancelOp, kickOps, opHandlers, forgetDevice,
    SCREENS, POINT_SCREENS, HELP_SCREENS, screen, navFor, allScreens,
    loadApp, toLogin, boot, confetti, enterPoint, leavePoint, addDays, atText, photoOf, setPhoto,
  };

})() : null;
</script>

  <!-- Экраны точки: смена, блюда (и план на завтра), заготовки, лимонады и смузи, справочник; шторка ввода факта, выбор сотрудника, отмена.

         :aria-label="work.sync === 'saving' ? 'Сохраняем' : work.sync === 'error' ? 'Ошибка сохранения' : ''"></div>

</script>

    <div class="screen-head" :class="{ 'screen-head--day': kind === 'preps' && nextPrep }">
      <h1 class="h-screen">{{ title }}</h1>
      <span v-if="kind === 'preps' && nextPrep" class="wa-dayline" :title="nextTitle" :aria-label="nextTitle">
        <span class="wa-dayline__day">на {{ shortDay(prepDay || nextPrep.day) }}</span>
        <prep-timer></prep-timer>
      </span>

    </div>

    <!-- Окно точки начинается раньше, чем кончается вчерашнее: видны два дня заготовок -->

    <!-- Фильтры; «План на завтра» (у блюд) — и когда на сегодня блюд нет -->
    <div v-if="(items.length && !closed) || canPlan" class="toolbar">
      <div class="chips wa-filter-chips" role="group" aria-label="Фильтр">
        <button v-for="f in shownFilters" :key="f.id" type="button" class="chip" :class="{ 'wa-chip-plan': f.id === 'tomorrow' }"
                :aria-pressed="filter === f.id" @click="toggleFilter(f.id)">
          {{ f.label }} <span class="chip__count">{{ counts[f.id] }}</span>
        </button>
      </div>
      <label class="field field--sm">
        <span class="visually-hidden">Поиск</span>
        <span class="field__control">
          <svg class="icon icon--sm field__icon"><use href="#i-search"></use></svg>
          <input class="field__input field__input--with-icon" type="search" v-model="query"
                 :placeholder="kind === 'dishes' ? 'Поиск блюда' : 'Поиск заготовки'">
        </span>
      </label>
    </div>

    <!-- План на завтра: только посмотреть — ни отметок, ни ввода -->
    <template v-if="planMode">
      <div class="banner banner--info wa-plan-note" role="status">
        <svg class="icon icon--sm"><use href="#i-eye"></use></svg>
        <span class="banner__text">План на {{ planDayLabel }} — только посмотреть
          <span class="banner__sub">Отмечать — завтра, когда он станет планом дня.</span>
        </span>
      </div>
      <div v-if="!planItems.length" class="empty-state">
        <img class="empty-state__art" :src="asset('leaf-pair')" alt="">
        <div class="empty-state__title">План на завтра ещё не внесён</div>
        <div class="empty-state__text">Его отправляет администратор — загляните позже.</div>
      </div>
      <section v-for="g in planGroups" :key="g.name" class="item-group">
        <div class="item-group__title eyebrow"><span>{{ g.name }}</span><span>{{ g.items.length }}</span></div>
        <div class="item-group__list">
          <plan-card v-for="it in g.items" :key="it.key" :item="it" :kind="kind"></plan-card>
        </div>
      </section>
      <p v-if="planItems.length && !planGroups.length" class="wa-hint wa-center">Ничего не нашлось</p>
    </template>

    <div v-else-if="closed" class="empty-state">
      <img class="empty-state__art" :src="asset('carrot')" alt="">
      <div class="empty-state__title">Заготовки на завтра — с {{ work.data.prepWindow.start }}</div>
      <div class="empty-state__text">Заготовки на сегодня принимались до {{ work.data.prepWindow.end }}.</div>
    </div>

    <template v-else>
      <div v-if="noShift && counts.todo + counts.work > 0" class="banner banner--warning" role="status">
        <svg class="icon icon--sm"><use href="#i-alert"></use></svg>
        <span class="banner__text">{{ noShift }}</span>
        <button type="button" class="btn btn--secondary" @click="$emit('go', 'shift')">К смене</button>
      </div>

      <div v-if="!items.length" class="empty-state">
        <img class="empty-state__art" :src="asset('leaf-pair')" alt="">
        <div class="empty-state__title">{{ kind === 'dishes' ? 'На сегодня блюд нет' : 'Заготовок нет' }}</div>
        <div class="empty-state__text">{{ kind === 'dishes' ? 'План на сегодня ещё не внесён.' : 'Расчёт заготовок на ' + dayLabel + ' ещё не сделан.' }}</div>
      </div>
      <div v-else-if="allDone && !filter && !query" class="empty-state">
        <img class="empty-state__art" :src="asset('heart')" alt="">
        <div class="empty-state__title">Всё на {{ kind === 'dishes' ? 'сегодня' : dayLabel }} готово</div>
        <div class="empty-state__text">Отличная смена!</div>
      </div>

      <section v-for="g in groups" :key="g.name" class="item-group">
        <div class="item-group__title eyebrow"><span>{{ g.name }}</span><span>{{ g.items.length }}</span></div>
        <transition-group tag="div" name="wa-list" class="item-group__list">
          <item-card v-for="it in g.items" :key="it.uid" :item="it" :selected="selectedUid === it.uid" @open="$emit('open', it)"></item-card>
        </transition-group>
      </section>

      <details v-if="showDone && doneItems.length" class="done-section" :open="filter === 'done' || null">
        <summary class="done-section__summary">
          <span style="display:flex;align-items:center;gap:8px"><svg class="icon icon--sm" style="stroke-width:2.2"><use href="#i-check"></use></svg>Готово · {{ doneItems.length }}</span>
          <svg class="icon icon--sm done-section__chevron"><use href="#i-chevron-down"></use></svg>
        </summary>
        <transition-group tag="div" name="wa-list" class="done-section__list">
          <item-card v-for="it in doneItems" :key="it.uid" :item="it" :selected="selectedUid === it.uid" @open="$emit('open', it)"></item-card>
        </transition-group>
      </details>

      <button type="button" class="btn btn--ghost btn--block wa-add-btn" @click="$emit('add', kind)">
        <svg class="icon"><use href="#i-plus"></use></svg>Внеплановая позиция
      </button>
    </template>
  </div>
</script>

<!-- ===================================================================== Лимонады и смузи (наборы заготовок под блюдо) -->
<script type="text/x-template" id="tpl-smoothies">
  <div class="wa-screen">
    <div class="screen-head" :class="{ 'screen-head--day': nextPrep }">
      <h1 class="h-screen wa-h-sets">Лимонады <span>и смузи</span></h1>
      <span v-if="nextPrep" class="wa-dayline" :title="nextTitle" :aria-label="nextTitle">
        <span class="wa-dayline__day">на {{ shortDay(prepDay || nextPrep.day) }}</span>
        <prep-timer></prep-timer>
      </span>
      <span v-if="list.length" class="screen-head__count"><b>{{ doneCount }}</b> из {{ list.length }}</span>
    </div>

    <div v-if="prepDays.length > 1" class="chips wa-prepday" role="group" aria-label="День заготовок">
      <button v-for="d in prepDays" :key="d.date" type="button" class="chip" :aria-pressed="d.date === prepDay" @click="pickPrepDay(d.date)">
        {{ d.label }}<span class="chip__count">{{ d.sets }}</span>
      </button>
    </div>

    <div v-if="!prepDay" class="empty-state">
      <img class="empty-state__art" :src="asset('strawberry')" alt="">
      <div class="empty-state__title">Наборы на завтра — с {{ work.data.prepWindow.start }}</div>
      <div class="empty-state__text">Наборы на сегодня принимались до {{ work.data.prepWindow.end }}.</div>
    </div>
    <div v-else-if="!list.length" class="empty-state">
      <img class="empty-state__art" :src="asset('strawberry')" alt="">
      <div class="empty-state__title">Лимонадов и смузи на {{ dayLabel }} нет</div>
      <div class="empty-state__text">В расчёте заготовок нет наборов под лимонады и смузи.</div>
    </div>

    <section v-for="sec in sections" :key="sec.id" class="wa-smoothies">
      <div class="item-group__title eyebrow"><span>{{ sec.title }}</span><span>{{ sec.items.length }}</span></div>
      <article v-for="s in sec.items" :key="s.key" class="wa-smoothie"
               :class="{ 'wa-smoothie--open': openKey === s.key, 'wa-smoothie--done': s.complete }">
        <button type="button" class="wa-smoothie__head" :aria-expanded="openKey === s.key" @click="toggle(s.key)">
          <span class="thumb thumb--sm" :class="[s.set === 'lemonade' ? 'thumb--fresh' : 'thumb--smoothie', { 'thumb--photo': photoOf(s.dishId) }]">
            <img v-if="photoOf(s.dishId)" class="wa-photo" :src="photoOf(s.dishId)" alt=""><img v-else :src="asset(s.set === 'lemonade' ? 'lemon' : 'strawberry')" alt="">
          </span>
          <span class="wa-smoothie__body">
            <span class="wa-smoothie__title">{{ s.dish }}</span>
            <span class="progress-bar" :class="{ 'progress-bar--done': s.complete }">
              <span class="progress-bar__fill" :style="{ '--p': s.p }"></span>
            </span>
          </span>
          <span class="wa-smoothie__qty">
            <b>{{ s.amount ? fmt(s.amount) : '' }}</b> {{ s.unit }}
            <small>{{ s.collected ? 'Собран' : 'заготовки ' + s.done + '/' + s.total }}</small>
          </span>
        </button>

        <div v-if="openKey === s.key" class="wa-smoothie__list">
          <div v-if="!s.complete" class="wa-check wa-check--all">
            <button type="button" class="wa-check__box" @click="allDone(s)" :aria-label="'Отметить все заготовки: ' + s.dish">
              <svg class="icon"><use href="#i-check"></use></svg>
            </button>
            <button type="button" class="wa-check__name" @click="allDone(s)">Отметить все по плану</button>
            <span class="wa-check__qty">{{ s.total - s.done }}</span>
          </div>
          <div v-for="it in s.items" :key="it.uid" class="wa-check" :class="{ 'wa-check--done': it.status !== 'todo' }">
            <button type="button" class="wa-check__box" @click="it.status === 'todo' ? quickDone(it) : unmark(it)"
                    :aria-label="(it.status === 'todo' ? 'Готово по плану: ' : 'Снять отметку: ') + it.name">
              <svg class="icon"><use href="#i-check"></use></svg>
            </button>
            <button type="button" class="wa-check__name" @click="$emit('open', it)">
              {{ it.name }}<span v-if="it.parentUid" class="badge badge--rest">Остаток</span>
            </button>
            <span class="wa-check__qty">{{ fmt(it.fact != null ? it.fact : it.amount) }} {{ it.unit }}</span>
          </div>
          <p class="wa-hint">Галочка — готово по плану, ещё нажатие — снять отметку. Другое количество — нажмите на название.</p>
          <button type="button" class="btn btn--primary btn--block" :class="{ 'is-loading': collecting === s.key }"
                  :disabled="!s.complete || s.collected" @click="collect(s)">
            {{ s.collected ? 'Набор собран' : 'Набор собран' }}
          </button>
        </div>
      </article>
    </section>
  </div>
</script>


<!-- ===================================================================== Справочник -->
<script type="text/x-template" id="tpl-directory">
  <div class="wa-screen">
    <div class="screen-head">
      <h1 class="h-screen">{{ editable ? 'Справочники' : 'Справочник' }}</h1>
    </div>
    <p v-if="editable" class="wa-hint">Нажмите на позицию, чтобы изменить место хранения и доступность. Новые позиции приходят из iiko («Интеграции»).</p>

    <div class="toolbar">
      <div class="tabs" role="tablist">
        <button type="button" class="tabs__tab" role="tab" :aria-selected="kind === 'dishes'" @click="setKind('dishes')">Блюда</button>
        <button type="button" class="tabs__tab" role="tab" :aria-selected="kind === 'preps'" @click="setKind('preps')">Заготовки</button>
      </div>
      <label class="field field--sm">
        <span class="visually-hidden">Поиск</span>
        <span class="field__control">
          <svg class="icon icon--sm field__icon"><use href="#i-search"></use></svg>
          <input class="field__input field__input--with-icon" type="search" v-model="query" placeholder="Поиск">
        </span>
      </label>
    </div>

    <div v-if="error" class="banner banner--error" role="alert">
      <svg class="icon icon--sm"><use href="#i-alert"></use></svg>
      <span class="banner__text">{{ error }}</span>
      <button type="button" class="btn btn--secondary" @click="load">Повторить</button>
    </div>

    <div v-if="!items && !error" class="wa-dir-grid">
      <div v-for="i in 6" :key="i" class="skeleton" style="height:140px;border-radius:var(--radius-lg)"></div>
    </div>

    <div v-else-if="items" class="wa-dir-grid">
      <article v-for="d in shown" :key="d.name" class="card wa-dir-card" :class="{ 'wa-dir-card--open': openName === d.name }"
               tabindex="0" @click="toggle(d)" @keydown.enter="toggle(d)">
        <div class="wa-dir-card__head">
          <span class="thumb" :class="['thumb--' + d.thumb, { 'thumb--photo': kind === 'dishes' && photoOf(d.id) }]">
            <img v-if="kind === 'dishes' && photoOf(d.id)" class="wa-photo" :src="photoOf(d.id)" alt="">
            <img v-else-if="thumbImg(d.thumb)" :src="thumbImg(d.thumb)" alt=""><template v-else>{{ (d.name[0] || '').toUpperCase() }}</template>
          </span>
          <span class="wa-dir-card__title">
            <b>{{ d.name }}</b>
            <span>{{ [d.group, d.unit].filter(Boolean).join(' · ') }}</span>
          </span>
          <span class="wa-dir-card__badges">
            <span v-if="d.available" class="badge" :class="d.available === 'Да' ? 'badge--done' : 'badge--todo'">
              {{ d.available === 'Да' ? 'Доступно к заказу' : 'Не заказывается' }}
            </span>
            <span v-if="editable && kind === 'dishes'" class="badge" :class="planOn(d) ? 'badge--done' : 'badge--todo'">{{ planBadge(d) }}</span>
          </span>
        </div>
        <div v-for="pl in d.place" :key="pl" class="sheet__place wa-dir-card__place">
          <svg class="icon" style="width:14px;height:14px"><use href="#i-pin"></use></svg>{{ pl }}
        </div>
        <div class="wa-dir-card__row"><span>Остаток</span><b>{{ fmt(d.remains) }} {{ d.unit }}</b></div>

        <!-- Админ: место хранения и доступность -->
        <form v-if="editable && openName === d.name" class="wa-dir-edit" @click.stop @keydown.enter.stop @submit.prevent="saveEdit(d)">
          <label v-for="(x, i) in edit.place" :key="i" class="field field--sm">
            <span class="field__label">Место хранения {{ i + 1 }}</span>
            <input class="field__input" v-model="edit.place[i]" maxlength="120" :placeholder="i ? 'необязательно' : 'например, Холодильник 1 · Полка 2'">
          </label>
          <div class="field">
            <span class="field__label">Доступность к заказу</span>
            <div class="tabs wa-dir-edit__avail" role="radiogroup">
              <button v-for="a in AVAIL" :key="a.v" type="button" class="tabs__tab" role="radio"
                      :aria-checked="edit.available === a.v" :aria-selected="edit.available === a.v" @click="edit.available = a.v">{{ a.label }}</button>
            </div>
          </div>
          <!-- Автоплан: для всех точек сразу или у каждой точки свой статус -->
          <div v-if="kind === 'dishes'" class="field">
            <span class="field__label">Автоплан — сохраняется сразу</span>
            <span class="wa-dir-plan__sub">Все точки</span>
            <div class="tabs wa-dir-edit__avail" role="radiogroup" aria-label="Автоплан во всех точках">
              <button type="button" class="tabs__tab" role="radio" :aria-checked="planAll(d) === 'Активно'" :aria-selected="planAll(d) === 'Активно'"
                      :disabled="edit.planBusy" @click="setPlanStatus(d, 'active')">Активно</button>
              <button type="button" class="tabs__tab" role="radio" :aria-checked="planAll(d) === 'Заблокировано'" :aria-selected="planAll(d) === 'Заблокировано'"
                      :disabled="edit.planBusy" @click="setPlanStatus(d, 'blocked')">Заблокировано</button>
            </div>
            <span class="wa-dir-plan__sub">По точкам</span>
            <div class="wa-dir-plan__pts">
              <div v-for="pt in store.points" :key="pt.tt" class="wa-switch-row wa-dir-plan__pt">
                <span><b>{{ pt.emoji }} {{ pt.name }}</b><small>{{ planAt(d, pt.tt) === 'Активно' ? 'в автоплане' : 'заблокировано' }}</small></span>
                <button type="button" class="switch" role="switch" :aria-checked="planAt(d, pt.tt) === 'Активно' ? 'true' : 'false'" :disabled="edit.planBusy"
                        :aria-label="'Автоплан: ' + pt.name" @click="setPlanStatus(d, planAt(d, pt.tt) === 'Активно' ? 'blocked' : 'active', pt.tt)"></button>
              </div>
            </div>
          </div>
          <div v-if="edit.error" class="banner banner--error" role="alert">
            <svg class="icon icon--sm"><use href="#i-alert"></use></svg><span class="banner__text">{{ edit.error }}</span>
          </div>
          <button type="submit" class="btn btn--primary btn--block" :class="{ 'is-loading': edit.saving }" :disabled="edit.saving">
            {{ edit.saving ? 'Сохраняем…' : edit.saved ? 'Сохранено' : 'Сохранить' }}
          </button>
        </form>

        <div v-if="openName === d.name && kind === 'dishes'" class="tech-card">
          <div class="tech-card__head eyebrow"><span>Тех. карта</span><span>на 1 {{ d.unit }}</span></div>
          <div v-if="tech === null" class="tech-card__row"><span class="spinner"></span></div>
          <div v-else-if="!tech.length" class="tech-card__row"><span>Тех. карта не найдена</span></div>
          <div v-for="t in tech || []" :key="t[0]" class="tech-card__row">
            <span>{{ t[0] }}</span><span class="tech-card__qty">{{ fmt(t[2]) }} {{ t[1] }}</span>
          </div>
        </div>
      </article>
    </div>

    <p v-if="items && filtered.length > shown.length" class="wa-hint wa-center">
      Показано {{ shown.length }} из {{ filtered.length }} — уточните поиск
    </p>
    <p v-if="items && !filtered.length" class="wa-hint wa-center">Ничего не нашлось</p>
  </div>
</script>


<!-- ===================================================================== Шторка позиции -->
<script type="text/x-template" id="tpl-item-sheet">
  <div class="sheet" :class="{ 'is-open': open }" role="dialog" aria-modal="true" aria-labelledby="sheet-title" @keydown="onKey">
    <span class="sheet__handle" aria-hidden="true"></span>

    <!-- Внеплановая позиция: сначала выбрать из справочника -->
    <div v-if="mode === 'add' && !picked" class="sheet__body">
      <div class="sheet__header">
        <div style="flex:1;min-width:0">
          <h2 class="sheet__title" id="sheet-title">Внеплановая позиция</h2>
          <div class="sheet__place">{{ kind === 'dishes' ? 'Блюдо' : 'Заготовка' }}, которого не было в плане</div>
        </div>
        <button type="button" class="sheet__close" @click="$emit('close')" aria-label="Закрыть"><svg class="icon icon--sm"><use href="#i-x"></use></svg></button>
      </div>
      <label class="field field--sm">
        <span class="visually-hidden">Поиск</span>
        <span class="field__control">
          <svg class="icon icon--sm field__icon"><use href="#i-search"></use></svg>
          <input class="field__input field__input--with-icon" type="search" v-model="addQuery" placeholder="Начните вводить название">
        </span>
      </label>
      <div v-if="!dirItems" class="wa-center"><span class="spinner"></span></div>
      <div v-else class="wa-more">
        <button v-for="d in addOptions" :key="d.name" type="button" class="wa-more__item" @click="pick(d)">
          {{ d.name }}<span class="wa-more__chevron wa-unit">{{ d.unit }}</span>
        </button>
        <p v-if="!addOptions.length" class="wa-hint wa-center">Ничего не нашлось</p>
      </div>
    </div>

    <div v-else-if="target" class="sheet__body">
      <div class="sheet__header">
        <span class="thumb" :class="['thumb--' + target.thumb, { 'thumb--photo': photo }]">
          <img v-if="photo" class="wa-photo" :src="photo" alt=""><img v-else-if="thumbImg(target.thumb)" :src="thumbImg(target.thumb)" alt=""><template v-else>{{ (target.name[0] || '').toUpperCase() }}</template>
        </span>
        <div style="flex:1;min-width:0">
          <h2 class="sheet__title" id="sheet-title">{{ target.name }}</h2>
          <div v-if="target.place && target.place.length" class="sheet__place">
            <svg class="icon" style="width:14px;height:14px"><use href="#i-pin"></use></svg><span>{{ target.place.join(' · ') }}</span>
          </div>
          <div v-if="target.dishFor" class="sheet__place">для: {{ target.dishFor }}</div>
        </div>
        <button type="button" class="sheet__close" @click="$emit('close')" aria-label="Закрыть"><svg class="icon icon--sm"><use href="#i-x"></use></svg></button>
      </div>

      <!-- Тех. карта — на введённый факт (сделаю 3 из 5 — состав на 3), без факта — на план -->
      <div v-if="tech.length && techQty > 0" class="tech-card">
        <div class="tech-card__head eyebrow"><span>Тех. карта</span><span>на {{ fmt(techQty) }} {{ target.unit }} · {{ techBasis }}</span></div>
        <div v-for="t in tech" :key="t[0]" class="tech-card__row">
          <span>{{ t[0] }}</span><span class="tech-card__qty">{{ fmt(t[2] * techQty) }} {{ t[1] }}</span>
        </div>
      </div>

      <!-- Уже отмечено: вернуть в работу может и точка, и администратор -->
      <template v-if="isDone">
        <div class="auto-status" :class="target.status === 'done' ? 'auto-status--ok' : 'auto-status--partial'">
          <span class="auto-status__dot"></span>
          <span class="auto-status__text">{{ doneText }}</span>
        </div>
        <p class="wa-hint">Отметил(а) {{ target.employee || '—' }}<template v-if="target.statusAt"> · {{ target.statusAt.slice(11, 16) }}</template></p>
        <p v-if="target.comment" class="wa-quote">«{{ target.comment }}»</p>
        <div v-if="banner" class="banner" :class="'banner--' + banner.tone" role="alert">
          <svg class="icon icon--sm"><use :href="banner.icon"></use></svg>
          <span class="banner__text">{{ banner.text }}</span>
        </div>
        <div v-else-if="confirmReset" class="banner banner--warning" role="alert">
          <svg class="icon icon--sm"><use href="#i-alert"></use></svg>
          <span class="banner__text">{{ resetText }}</span>
        </div>
        <button type="button" class="btn btn--danger btn--lg btn--block" :disabled="target.pending" @click="reset">
          <svg class="icon icon--sm"><use href="#i-undo"></use></svg>{{ confirmReset ? (unplanned ? 'Да, удалить' : 'Да, вернуть') : (unplanned ? 'Удалить позицию' : 'Вернуть в работу') }}
        </button>
        <button type="button" class="btn btn--ghost btn--lg btn--block" @click="$emit('close')">Закрыть</button>
      </template>

      <template v-else>
        <div v-if="banner" class="banner" :class="'banner--' + banner.tone" role="alert">
          <svg class="icon icon--sm"><use :href="banner.icon"></use></svg>
          <span class="banner__text">{{ banner.text }}</span>
          <button v-if="banner.go" type="button" class="btn btn--secondary" @click="$emit('go', banner.go)">К смене</button>
        </div>

        <div class="qty" :class="{ 'is-shake': shake }">
          <button type="button" class="qty__btn" @click="step(-1)" aria-label="Минус"><svg class="icon" style="stroke-width:2.2"><use href="#i-minus"></use></svg></button>
          <div class="qty__display">
            <div class="qty__caption">{{ target.amount > 0 ? 'Факт · план ' + fmt(target.amount) : 'Сделано' }}</div>
            <div class="qty__value" :class="{ 'is-empty': !fact }" aria-live="polite">{{ fact || '0' }}<span class="qty__unit">{{ target.unit }}</span></div>
          </div>
          <button type="button" class="qty__btn" @click="step(1)" aria-label="Плюс"><svg class="icon" style="stroke-width:2.2"><use href="#i-plus"></use></svg></button>
        </div>

        <div class="auto-status" :class="'auto-status--' + auto.tone" role="status">
          <span class="auto-status__dot"></span>
          <span class="auto-status__text">{{ auto.text }}</span>
          <button v-if="target.amount > 0" type="button" class="auto-status__plan" @click="setPlan">= план</button>
        </div>

        <div class="numpad" role="group" aria-label="Цифровая клавиатура">
          <button v-for="k in keys" :key="k" type="button" class="numpad__key"
                  :class="{ 'numpad__key--fn': k === ',' || k === 'del' }" :aria-label="k === 'del' ? 'Стереть' : null" @click="press(k)">
            <svg v-if="k === 'del'" class="icon" style="width:26px;height:26px"><use href="#i-delete"></use></svg><template v-else>{{ k }}</template>
          </button>
        </div>

        <textarea v-if="showComment" ref="commentEl" class="comment" v-model="comment" placeholder="Комментарий (необязательно)" rows="2"></textarea>
        <div class="sheet__actions">
          <button type="button" class="btn btn--ghost btn--icon" style="width:60px;height:60px;border-radius:999px"
                  :aria-pressed="showComment" aria-label="Комментарий" @click="toggleComment">
            <svg class="icon"><use href="#i-message"></use></svg>
          </button>
          <button type="button" class="btn btn--primary btn--lg" :class="{ 'is-loading': saving }"
                  :disabled="auto.tone === 'error'" @click="save">{{ saving ? 'Сохраняем…' : 'Сохранить' }}</button>
        </div>
      </template>
    </div>

    <div class="success" :class="{ 'is-visible': !!success, 'success--partial': success === 'partial' }">
      <div class="success__circle"><svg class="success__check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></div>
      <div class="success__text">{{ success === 'partial' ? 'Сохранено, создан остаток' : 'Готово!' }}</div>
    </div>
  </div>
  <div class="sheet-backdrop" :class="{ 'is-open': open }" @click="$emit('close')"></div>
</script>

<!-- ===================================================================== Уведомление с отменой -->
<script type="text/x-template" id="tpl-toast">
  <div class="toast" :class="{ 'is-visible': toast.visible }" role="status" aria-live="polite">
    <div class="toast__row">
      <svg class="icon toast__icon" :style="toast.error ? 'stroke: var(--brand-carrot)' : ''"><use :href="toast.error ? '#i-alert' : '#i-check'"></use></svg>
      <span class="toast__text">{{ toast.text }}</span>
      <button v-if="toast.undo" type="button" class="toast__action" :disabled="undoing" @click="undo">Отменить</button>
    </div>
    <div v-if="toast.undo" :key="toast.key" class="toast__bar"></div>
  </div>

<script>
(function (C) {
  if (!C) return;

  const { reactive, ref, computed, watch, nextTick, onMounted, onBeforeUnmount } = Vue;
  const { store, LS, MF, plural, initials, asset, thumbImg, callApi, autoStatus, confetti, photoOf, OFFLINE } = C;
  const fmt = MF.fmt;

  // ================================================================== данные точки

  const work = reactive({
    tt: '', data: null, error: '', at: 0,
    base: null,    // без интернета (OFFLINE): ответ сервера; data = base + очередь действий поверх (recompute)
    busy: 0,       // идут запросы — опрос сервера не перетирает данные
    pending: 0,    // сохранения в фоне
    sync: 'idle',  // полоска вверху экрана: idle | saving | done | error
    seq: 0,        // счётчик изменений: ответ опроса, начатого до изменения, отбрасываем
  });
  const toast = reactive({ visible: false, text: '', undo: null, error: false, key: 0 });
  const dirCache = reactive({ dishes: null, preps: null });
  const techCache = {};
  const inflight = {};   // uid → фоновое сохранение (его дожидается «Отменить»)
  let pollTimer = null;
  let toastTimer = null;
  let syncTimer = null;

  // Черновики фактов: введено, но не сохранено (карточка «В работе»). Переживают перезагрузку.
  const drafts = reactive((() => { try { return JSON.parse(LS.get('mf-drafts') || '{}'); } catch (e) { return {}; } })());
  function setDraft(uid, d) {
    if (d && (d.fact || d.comment)) drafts[uid] = d; else delete drafts[uid];
    LS.set('mf-drafts', JSON.stringify(drafts));
  }

  async function load(silent) {
    if (!work.tt) return;
    const tt = work.tt;
    const seq = work.seq;
    try {
      const data = await callApi('work.load', { tt });
      // Пока шёл запрос, на экране что-то отметили — ответ уже устарел
      if (work.tt !== tt || work.seq !== seq || work.pending) return;
      if (OFFLINE) { work.base = data; recompute(); } else work.data = data;
      work.error = '';
      work.at = Date.now();
    } catch (e) {
      if (e.code === 'AUTH') return;
      if (!silent || !work.data) work.error = e.message;
    }
  }

  function start(tt) {
    stop();
    work.tt = tt;
    load();
    const every = Math.max(15, store.settings.refresh_seconds || 45) * 1000;
    pollTimer = setInterval(() => {
      if (document.visibilityState === 'visible' && !work.busy && !work.pending) load(true);
    }, every);
  }

  function stop() {
    clearInterval(pollTimer);
    Object.assign(work, { tt: '', data: null, base: null, error: '', at: 0 });
  }

  // Вернулись на вкладку — обновить, если данные старше 15 секунд
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && work.tt && !work.busy && !work.pending && Date.now() - work.at > 15000) load(true);
  });

  const listOf = kind => kind === 'dishes' ? work.data.dishes : work.data.preps;

  function upsert(item) {
    const list = listOf(item.kind);
    const i = list.findIndex(x => x.uid === item.uid);
    if (i >= 0) list.splice(i, 1, item); else list.push(item);
  }

  function removeUid(kind, uid) {
    const list = listOf(kind);
    const i = list.findIndex(x => x.uid === uid);
    if (i >= 0) list.splice(i, 1);
  }

  // Состояние карточки: todo | work (есть черновик) | done | partial
  const stateOf = it => it.status !== 'todo' ? it.status : (drafts[it.uid] && drafts[it.uid].fact ? 'work' : 'todo');

  // Обёртка действий: пока идёт запрос, опрос сервера не перетирает данные
  async function busy(fn) {
    work.busy++;
    try { return await fn(); } finally { work.busy--; }
  }

  // Время отметки для показа до ответа сервера
  function nowStamp() {
    const d = new Date();
    const p = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  }

  // Сотрудник смены для отметки или пусто, если смена не выбрана
  const shiftEmployee = kind => work.data.shift[kind === 'dishes' ? 'bar' : 'prep'];

  // Мгновенное сохранение: результат сразу на экране, сервер пишет в фоне (полоска вверху).
  // entries: [{ item, fact, comment }]. Ошибка — позиция возвращается, введённое остаётся черновиком.
  function commitSave(entries, toastText) {
    if (OFFLINE) return commitSaveQ(entries, toastText);
    const kind = entries[0].item.kind;
    const employee = shiftEmployee(kind);
    const stamp = nowStamp();

    const local = entries.map(({ item, fact, comment }) => {
      const tone = autoStatus(item.amount, fact, item.unit).tone;
      const status = tone === 'partial' ? 'partial' : 'done';
      upsert(Object.assign({}, item, { fact, comment, status, employee, statusAt: stamp, over: tone === 'over', pending: true }));
      let rest = null;
      if (status === 'partial') {
        rest = Object.assign({}, item, {
          uid: 'tmp-' + item.uid, parentUid: item.uid, amount: Math.round((item.amount - fact) * 1000) / 1000,
          fact: null, comment: '', status: 'todo', employee: '', statusAt: '', updatedAt: '', over: false, pending: true,
        });
        upsert(rest);
      }
      setDraft(item.uid, null);
      return { before: item, fact, comment, rest };
    });

    work.seq++;
    work.pending++;
    work.sync = 'saving';
    clearTimeout(syncTimer);
    showToast(toastText || 'Сохранено · ' + entries[0].item.name, { kind, uids: entries.map(e => e.item.uid) });

    const params = { kind, items: entries.map(({ item, fact, comment }) => ({ uid: item.uid, fact, comment, expectedUpdatedAt: item.updatedAt })) };
    const tt = work.tt;
    const here = () => !!work.data && work.tt === tt;   // админ мог уйти из точки, пока шло сохранение
    const request = callApi('work.saveMany', params)
      .then(({ results }) => {
        if (!here()) return;
        let failed = null;
        for (const l of local) {
          const r = results.find(x => x.uid === l.before.uid);
          if (l.rest) removeUid(kind, l.rest.uid);
          if (r && r.ok) {
            upsert(Object.assign({}, l.before, {
              status: r.status, fact: r.fact, comment: r.comment, employee: r.employee,
              statusAt: r.statusAt, updatedAt: r.updatedAt, over: r.over, pending: false,
            }));
            if (r.rest) {
              upsert(Object.assign({}, l.before, {
                uid: r.rest.uid, parentUid: l.before.uid, amount: r.rest.amount, fact: null, comment: '',
                status: 'todo', employee: '', statusAt: '', updatedAt: r.rest.updatedAt, over: false, pending: false,
              }));
            }
          } else {
            revert(l);
            failed = failed || r || { code: 'INTERNAL', message: 'Сервер не подтвердил сохранение' };
          }
        }
        if (failed) fail(failed.code, failed.message);
        else if (work.sync !== 'error') work.sync = 'done';
      })
      .catch(e => {
        if (!here()) return;
        local.forEach(revert);
        if (e.code !== 'AUTH') fail(e.code, e.code === 'NETWORK' ? 'нет связи. Введённое осталось в карточке.' : e.message);
      })
      .finally(() => {
        work.pending--;
        work.seq++;
        local.forEach(l => { delete inflight[l.before.uid]; });
        settleSync();
      });

    local.forEach(l => { inflight[l.before.uid] = request; });
    return request;
  }

  function revert(l) {
    if (l.rest) removeUid(l.before.kind, l.rest.uid);
    upsert(l.before);
    setDraft(l.before.uid, { fact: fmt(l.fact), comment: l.comment });
  }

  function fail(code, message) {
    work.sync = 'error';
    showToast('Не сохранено: ' + message, null, true);
    if (code === 'CONFLICT') setTimeout(() => load(true), 300);
  }

  // Полоска гаснет, когда всё сохранено; ошибка висит дольше
  function settleSync() {
    clearTimeout(syncTimer);
    if (work.pending > 0) { work.sync = 'saving'; return; }
    syncTimer = setTimeout(() => { work.sync = 'idle'; }, work.sync === 'error' ? 3000 : 1200);
  }

  function addItem(kind, name, fact, comment, target) {
    if (OFFLINE) return addItemQ(kind, name, fact, comment, target);
    return busy(async () => {
      const r = await callApi('work.add', { kind, tt: work.tt, name, fact, comment, date: kind === 'preps' ? prepDay.value : undefined });
      upsert(r.item);
      work.seq++;
      showToast('Добавлено · ' + name);
      return r;
    });
  }

  async function undo() {
    const u = toast.undo;
    if (!u) return;
    toast.visible = false;
    toast.undo = null;
    // Без интернета: ещё не ушло на сервер — снять из очереди; ушло — вернуть позиции в работу (тоже очередью)
    if (OFFLINE && u.opId) {
      if (!C.cancelOp(u.opId)) {
        for (const id of u.uids) { const cur = listOf(u.kind).find(x => x.uid === id); if (cur && cur.status !== 'todo') unmarkItemQ(cur, true); }
      }
      showToast('Отменено');
      return;
    }
    try {
      // Сначала дождаться фонового сохранения — отменять нечего, пока оно не дошло до сервера
      await Promise.all(u.uids.map(id => inflight[id]).filter(Boolean));
      await busy(async () => {
        const r = await callApi('work.undo', { kind: u.kind, uids: u.uids });
        for (const it of r.items) {
          const cur = listOf(u.kind).find(x => x.uid === it.uid);
          if (cur) upsert(Object.assign({}, cur, it, { over: false, pending: false }));
        }
        for (const id of r.removedRestUids) removeUid(u.kind, id);
      });
      work.seq++;
      showToast('Отменено');
    } catch (e) {
      if (e.code !== 'AUTH') showToast(e.message, null, true);
    }
  }

  // Вернуть отмеченную позицию в «К выполнению» (точка, админ, руководитель — в любое время), внеплановую — удалить.
  // Сразу на экране, сервер — в фоне: нетронутый остаток пропадает, у заготовки смузи снимается «Набор собран».
  // Ошибка — отметка возвращается на место, причина — в уведомлении.
  async function unmarkItem(item) {
    if (OFFLINE) return unmarkItemQ(item);
    const kind = item.kind;
    const uid = item.uid;
    const tt = work.tt;
    // Пока шёл запрос, админ мог уйти из точки — тогда списка на экране уже нет
    const here = () => !!work.data && work.tt === tt;
    // Отметку только что поставили — сначала дождаться, пока она дойдёт до сервера
    if (inflight[uid]) { try { await inflight[uid]; } catch (e) { /* не сохранилась — снимать нечего */ } }
    if (!here()) return null;
    const cur = listOf(kind).find(x => x.uid === uid);
    if (!cur || cur.status === 'todo') return null;

    const unplanned = !cur.parentUid && /^Вне плана/.test(cur.comment || '');
    const rests = listOf(kind).filter(x => x.parentUid === uid && x.status === 'todo');
    const set = cur.dishFor ? work.data.smoothies.find(s => s.dish === cur.dishFor && (!s.date || s.date === cur.date)) : null;
    const wasCollected = set ? set.collected : false;

    upsert(Object.assign({}, cur, { status: 'todo', fact: null, comment: '', employee: '', statusAt: '', over: false, pending: true }));
    rests.forEach(r => removeUid(kind, r.uid));
    if (set) set.collected = false;
    setDraft(uid, null);
    work.seq++;
    work.pending++;
    work.sync = 'saving';
    clearTimeout(syncTimer);
    showToast((unplanned ? 'Удалено · ' : 'Возвращено в работу · ') + cur.name);

    try {
      const r = await callApi('work.reset', { kind, uid, expectedUpdatedAt: cur.updatedAt });
      if (!here()) return r;
      for (const id of r.removedUids) removeUid(kind, id);
      if (r.item) upsert(r.item);
      if (work.sync !== 'error') work.sync = 'done';
      return r;
    } catch (e) {
      if (!here()) return null;
      upsert(cur);
      rests.forEach(upsert);
      if (set) set.collected = wasCollected;
      if (e.code !== 'AUTH') {
        work.sync = 'error';
        showToast('Не вернули в работу: ' + (e.code === 'NETWORK' ? 'нет связи' : e.message), null, true);
        if (e.code === 'CONFLICT') setTimeout(() => load(true), 300);
      }
      return null;
    } finally {
      work.pending--;
      work.seq++;
      settleSync();
    }
  }

  // Смена — тоже сразу на экране; сервер подтверждает в фоне
  async function setShift(role, name) {
    if (OFFLINE) return setShiftQ(role, name);
    const before = Object.assign({}, work.data.shift);
    const next = Object.assign({}, before, { [role]: name });
    if (role === 'bar' && name && !before.prep) next.prep = name;
    work.data.shift = next;
    work.seq++;
    try {
      work.data.shift = await busy(() => callApi('work.shift', { tt: work.tt, role, name }));
    } catch (e) {
      work.data.shift = before;
      throw e;
    }
  }

  // ================================================================== без интернета (OFFLINE, 2026-10-26)
  // Данные точки = ответ сервера (work.base) + поверх ещё не принятые действия очереди (applyOp): экран показывает
  // своё и без интернета, и после перезапуска приложения. Ответ сервера на действие правит work.base (opHandlers) и
  // копию на устройстве; сервер отказал — действие уходит из «поверх», позиция — как на сервере, введённое — в черновик.

  // Экран заново: ответ сервера + действия очереди этой точки (кроме не принятых)
  function recompute() {
    const b = work.base;
    if (!b) return;
    const d = Object.assign({}, b, {
      dishes: b.dishes.map(x => Object.assign({}, x)),
      preps: b.preps.map(x => Object.assign({}, x)),
      smoothies: (b.smoothies || []).map(x => Object.assign({}, x)),
      shift: Object.assign({}, b.shift),
    });
    for (const op of C.myOps()) if (op.tt === work.tt && op.state !== 'fail') applyOp(d, op);
    work.data = d;
  }

  const round3 = n => Math.round(n * 1000) / 1000;
  const setOf = (d, it) => it.dishFor ? (d.smoothies || []).find(x => x.dish === it.dishFor && (!x.date || x.date === it.date)) : null;
  const smoothieOf = (d, p) => (d.smoothies || []).find(x => x.dish === p.dish && (!x.date || x.date === p.date));

  // Действие очереди — на данных экрана, так же, как его выполнит сервер (waSaveItems_, waApiWorkReset_, waApiWorkAdd_…).
  // Позиция на сервере уже не «К выполнению» (ушло, отметили с другого устройства) — показываем, как на сервере
  function applyOp(d, op) {
    const p = op.params || {};
    const m = op.meta || {};
    const list = p.kind === 'preps' ? d.preps : d.dishes;
    const find = uid => list.find(x => x.uid === uid);
    if (op.method === 'work.saveMany') {
      for (const it of p.items || []) {
        const cur = find(it.uid);
        if (!cur || cur.status !== 'todo') continue;
        const tone = autoStatus(cur.amount, it.fact, cur.unit).tone;
        const status = tone === 'partial' ? 'partial' : 'done';
        Object.assign(cur, { fact: it.fact, comment: it.comment || '', status, employee: m.employee || '', statusAt: m.stamp || '', over: tone === 'over', pending: true });
        if (status === 'partial' && !list.some(x => x.parentUid === cur.uid)) {
          list.push(Object.assign({}, cur, {
            uid: 'tmp-' + cur.uid, parentUid: cur.uid, amount: round3(cur.amount - it.fact),
            fact: null, comment: '', status: 'todo', employee: '', statusAt: '', updatedAt: '', over: false,
          }));
        }
      }
    } else if (op.method === 'work.reset') {
      const cur = find(p.uid);
      if (!cur || cur.status === 'todo') return;
      const unplanned = !cur.parentUid && /^Вне плана/.test(cur.comment || '');
      for (const r of list.filter(x => x.parentUid === cur.uid && x.status === 'todo')) list.splice(list.indexOf(r), 1);
      if (unplanned) list.splice(list.indexOf(cur), 1);
      else Object.assign(cur, { status: 'todo', fact: null, comment: '', employee: '', statusAt: '', over: false, pending: true });
      const set = setOf(d, cur);
      if (set) set.collected = false;
    } else if (op.method === 'work.add') {
      const tmp = 'tmp-' + op.id;
      if (m.item && !find(tmp)) list.push(Object.assign({}, m.item, { uid: tmp, pending: true }));
    } else if (op.method === 'work.smoothieDone') {
      const set = smoothieOf(d, p);
      if (set) set.collected = true;
    } else if (op.method === 'work.shift') {
      Object.assign(d.shift, m.shift || {});
    }
  }

  // Действия: сразу на экране (очередь меняется — recompute), на сервер — по очереди
  function commitSaveQ(entries, toastText) {
    const kind = entries[0].item.kind;
    const first = entries[0];
    const word = autoStatus(first.item.amount, first.fact, first.item.unit).tone === 'partial' ? 'Частично' : 'Готово';
    const label = entries.length === 1
      ? word + ' · ' + first.item.name + ' — ' + fmt(first.fact) + ' ' + first.item.unit
      : (toastText || 'Отмечено') + ' · ' + entries.length + ' ' + plural(entries.length, ['позиция', 'позиции', 'позиций']);
    const op = C.queueOp('work.saveMany', {
      kind, at: Date.now(),
      items: entries.map(({ item, fact, comment }) => ({ uid: item.uid, fact, comment, expectedUpdatedAt: item.updatedAt })),
    }, { tt: work.tt, label, meta: { employee: shiftEmployee(kind), stamp: nowStamp() } });
    entries.forEach(({ item }) => setDraft(item.uid, null));
    showToast(toastText || 'Сохранено · ' + first.item.name, { kind, uids: entries.map(e => e.item.uid), opId: op.id });
    return Promise.resolve();
  }

  // «Вне плана» — строка на экране сразу (временный uid tmp-<номер действия>), настоящий uid — с ответом сервера
  function addItemQ(kind, name, fact, comment, target) {
    const t = target || {};
    const date = kind === 'preps' ? prepDay.value : work.data.today;
    C.queueOp('work.add', { kind, tt: work.tt, name, fact, comment, date: kind === 'preps' ? date : undefined, at: Date.now() }, {
      tt: work.tt, label: 'Вне плана · ' + name + ' — ' + fmt(fact) + ' ' + (t.unit || ''),
      meta: { item: {
        kind, date, name, amount: fact, unit: t.unit || '', group: t.group || '', thumb: t.thumb || '', place: t.place || [],
        fact, comment: ['Вне плана', String(comment || '').trim()].filter(Boolean).join(': '), status: 'done',
        employee: shiftEmployee(kind), statusAt: nowStamp(), updatedAt: '', parentUid: '', dishFor: '', dishId: t.dishId || '', over: false,
      } },
    });
    showToast('Добавлено · ' + name);
    return Promise.resolve({ item: null });
  }

  // Вернуть в работу. Отметка или «Вне плана» ещё не ушли на сервер — просто снять их из очереди
  function unmarkItemQ(item, quiet) {
    const uid = item.uid;
    const unplanned = !item.parentUid && /^Вне плана/.test(item.comment || '');
    const waiting = C.myOps().filter(o => o.state === 'wait' && o.tt === work.tt);
    const add = waiting.find(o => o.method === 'work.add' && 'tmp-' + o.id === uid);
    const save = waiting.find(o => o.method === 'work.saveMany' && o.params.items.length === 1 && o.params.items[0].uid === uid);
    if (!(add && C.cancelOp(add.id)) && !(save && C.cancelOp(save.id))) {
      C.queueOp('work.reset', { kind: item.kind, uid, expectedUpdatedAt: item.updatedAt },
        { tt: work.tt, label: (unplanned ? 'Удалить «Вне плана» · ' : 'В работу · ') + item.name });
    }
    setDraft(uid, null);
    if (!quiet) showToast((unplanned ? 'Удалено · ' : 'Возвращено в работу · ') + item.name);
    return Promise.resolve(null);
  }

  // Смена: прошлый ещё не отправленный выбор той же роли заменяется новым
  function setShiftQ(role, name) {
    const before = Object.assign({}, work.data.shift);
    const next = Object.assign({}, before, { [role]: name });
    if (role === 'bar' && name && !before.prep) next.prep = name;
    for (const o of C.myOps()) if (o.state === 'wait' && o.method === 'work.shift' && o.tt === work.tt && o.params.role === role) C.cancelOp(o.id);
    C.queueOp('work.shift', { tt: work.tt, role, name }, {
      tt: work.tt, label: (role === 'bar' ? 'Бармен: ' : 'Заготовщик: ') + (name || 'снят со смены'), meta: { shift: next },
    });
    return Promise.resolve();
  }

  // Ответ сервера на действие очереди — в work.base и копию на устройстве (если эта точка открыта)
  function patchBase(tt, fn) {
    if (!work.base || work.tt !== tt) return;
    fn(work.base);
    work.seq++;   // опрос, начатый до ответа, устарел
    recompute();
    C.cachePut('work.load', { tt }, work.base);
  }
  const baseListOf = (b, kind) => kind === 'preps' ? b.preps : b.dishes;

  if (OFFLINE) {
    watch(() => C.outbox.ops.map(o => o.id + o.state).join('|'), recompute);
    watch(() => C.outbox.busy, b => { work.sync = b ? 'saving' : 'idle'; });
    Object.assign(C.opHandlers, {
      'work.saveMany': (op, data) => {
        const map = {}, updated = {}, bad = [];
        for (const r of data.results || []) {
          if (!r.ok) {
            bad.push(r.message);
            const it = (op.params.items || []).find(x => x.uid === r.uid);
            if (it && work.tt === op.tt) setDraft(r.uid, { fact: fmt(it.fact), comment: it.comment || '' });
            continue;
          }
          updated[r.uid] = r.updatedAt;
          if (r.rest) { map['tmp-' + r.uid] = r.rest.uid; updated[r.rest.uid] = r.rest.updatedAt; }
        }
        patchBase(op.tt, b => {
          const list = baseListOf(b, op.params.kind);
          for (const r of data.results || []) {
            const i = r.ok ? list.findIndex(x => x.uid === r.uid) : -1;
            if (i < 0) continue;
            const cur = list[i];
            list.splice(i, 1, Object.assign({}, cur, {
              status: r.status, fact: r.fact, comment: r.comment, employee: r.employee, statusAt: r.statusAt, updatedAt: r.updatedAt, over: r.over, pending: false,
            }));
            if (r.rest && !list.some(x => x.uid === r.rest.uid)) {
              list.push(Object.assign({}, cur, {
                uid: r.rest.uid, parentUid: cur.uid, amount: r.rest.amount, fact: null, comment: '', status: 'todo',
                employee: '', statusAt: '', updatedAt: r.rest.updatedAt, over: false, pending: false,
              }));
            }
          }
        });
        return { map, updated, failed: bad.join(' · ') };
      },
      'work.reset': (op, data) => {
        patchBase(op.tt, b => {
          const list = baseListOf(b, op.params.kind);
          for (const id of data.removedUids || []) { const i = list.findIndex(x => x.uid === id); if (i >= 0) list.splice(i, 1); }
          if (data.item) {
            const i = list.findIndex(x => x.uid === data.item.uid);
            if (i >= 0) list.splice(i, 1, data.item); else list.push(data.item);
            const set = setOf(b, data.item);
            if (set) set.collected = false;
          }
        });
        return { updated: data.item ? { [data.item.uid]: data.item.updatedAt } : {} };
      },
      'work.add': (op, data) => {
        if (!data.item) return {};
        patchBase(op.tt, b => { const list = baseListOf(b, op.params.kind); if (!list.some(x => x.uid === data.item.uid)) list.push(data.item); });
        return { map: { ['tmp-' + op.id]: data.item.uid }, updated: { [data.item.uid]: data.item.updatedAt } };
      },
      'work.shift': (op, data) => { patchBase(op.tt, b => { b.shift = data; }); return {}; },
      'work.smoothieDone': op => { patchBase(op.tt, b => { const set = smoothieOf(b, op.params); if (set) set.collected = true; }); return {}; },
      // Сервер отказал — на экране как на сервере, причина — в уведомлении и журнале
      fail: op => {
        if (work.tt !== op.tt) return;
        showToast('Не принято: ' + op.label + ' — ' + op.error, null, true);
        setTimeout(() => load(true), 300);
      },
    });
  }

  function showToast(text, undoInfo, error) {
    clearTimeout(toastTimer);
    Object.assign(toast, { visible: true, text, undo: undoInfo || null, error: !!error, key: toast.key + 1 });
