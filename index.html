  // tags — другие слова, которыми спрашивают о том же (для поиска)
  const FAQ = [
    { g: 'login', q: 'Что за обучение при входе?', a: 'При первом входе в учётную запись приложение показывает обучение: шаги на настоящих экранах (нажимайте на мигающие точки) и тест из 10 вопросов. Ошибётесь — объяснит и повторит вопрос в конце. Пока обучение не пройдено, приложение не откроется. Прогресс сохраняется — можно продолжить позже.', tags: 'обучение тест первый вход' },
    { g: 'login', q: 'Как пройти обучение ещё раз?', a: 'Точка — «?» в шапке → «Обучение». Администратор — «Помощь» → «Обучение» (на телефоне — «Ещё» → «Обучение»). Его можно закрыть в любой момент. Руководитель может назначить обучение заново: «Пользователи» → пользователь → «Пройти обучение заново» — оно откроется при следующем входе.', tags: 'обучение заново повторить новый сотрудник' },
    { g: 'login', q: 'Забыл пароль — что делать?', a: 'Позвоните руководителю: он сбросит пароль в разделе «Пользователи» и сообщит новый. Новый пароль показывается один раз.', tags: 'не помню пароль восстановить войти' },
    { g: 'login', q: 'Почему приложение снова просит войти?', a: 'Сессия закончилась, сменили пароль или руководитель нажал «Выйти на всех устройствах». Войдите заново и отметьте «Запомнить устройство».', tags: 'выкинуло вылетело разлогинило' },
    { g: 'login', q: 'Пишет «Слишком много попыток»', a: 'После нескольких неверных паролей вход блокируется на 5 минут. Подождите и проверьте раскладку и Caps Lock.', tags: 'заблокировали блокировка' },
    { g: 'login', q: 'Как включить ночную тему или крупный вид для планшета?', a: 'Тема — значок луны или солнца в шапке. Вид экрана (Авто, Телефон, Планшет, ПК) — внизу экрана «Смена» (у администратора — «Ещё»).', tags: 'тёмная темная светлая шрифт размер' },
    { g: 'shift', q: 'Не сохраняется: пишет «Выберите бармена»', a: 'Откройте «Смена» и выберите бармена (и заготовщика, если отмечаете заготовки). После этого сохранение заработает.', tags: 'не сохраняет заготовщика сотрудника' },
    { g: 'shift', q: 'Моего имени нет в списке сотрудников', a: 'Попросите администратора добавить вас в разделе «Сотрудники». Список обновится сразу.', tags: 'добавить сотрудника новый' },
    { g: 'shift', q: 'Днём сменился бармен — что делать?', a: 'На экране «Смена» выберите нового сотрудника. Уже сделанные отметки останутся за прежним, новые пойдут на нового.', tags: 'пересменка поменять' },
    { g: 'marks', q: 'Сделал меньше плана — что будет?', a: 'Если сделано меньше 75% плана, позиция станет «Частично готово», а на недостающее появится строка «Остаток» — её можно доделать позже.', tags: 'не успел частично недоделал' },
    { g: 'marks', q: 'Сделал больше плана — можно сохранить?', a: 'Да. Позиция станет «Готово» с пометкой «Больше плана» — её увидит администратор. Если получилось втрое больше, приложение попросит проверить опечатку.', tags: 'перевыполнение лишнее' },
    { g: 'marks', q: 'Ошибся в количестве. Как исправить?', a: 'Сразу после сохранения — «Отменить» в уведомлении внизу. Позже — в разделе «Готово» нажмите на позицию → «Вернуть в работу» и отметьте заново.', tags: 'отменить отмена отметку неправильно ошибка поправить вернуть' },
    { g: 'marks', q: 'Отметил лишнее — как вернуть позицию?', a: 'Нажмите на позицию в «Готово» → «Вернуть в работу» → «Да, вернуть». У лимонадов и смузи — просто нажмите галочку у заготовки ещё раз.', tags: 'вернуть снять отметку галочку случайно' },
    { g: 'marks', q: 'Что такое «Остаток»?', a: 'Строка на недоделанную часть позиции, отмеченной как «Частично готово». Её отмечают так же, как обычную позицию.', tags: 'остаток частично' },
    { g: 'marks', q: 'Что значит «В работе»?', a: 'Вы начали вводить количество, но ещё не нажали «Сохранить». Откройте позицию и сохраните.', tags: 'статус в работе черновик' },
    { g: 'marks', q: 'Как отметить то, чего не было в плане?', a: 'Внизу списка — «Внеплановая позиция»: выберите блюдо или заготовку из справочника, введите количество, «Сохранить».', tags: 'вне плана добавить лишнее дополнительно' },
    { g: 'marks', q: 'Как понять, что отметка сохранилась?', a: 'Внизу появится «Сохранено», позиция перейдёт в «Готово». Если связи нет — будет «Не сохранено»: нажмите «Сохранить» ещё раз.', tags: 'сохранилось проверить' },
    { g: 'marks', q: 'Пропал интернет — отметки потеряются?', a: 'Нет. В приложении, установленном на телефон, отмечайте как обычно: всё сохраняется на телефоне, вверху — «Нет интернета · не отправлено: N» (нажмите — журнал), а когда связь появится, уйдёт само. Приложение открывается и без интернета. По обычной ссылке в браузере введённое останется в карточке — нажмите «Сохранить», когда связь появится.', tags: 'нет связи оффлайн wi-fi вайфай без интернета журнал не отправлено очередь' },
    { g: 'marks', q: 'Вверху «Не принято» — что это?', a: 'Отметку, сделанную без интернета, сервер не принял — обычно потому, что позицию уже отметили с другого устройства или день уже закрыт. Нажмите полосу: в журнале видна причина. На экране позиция — как на сервере; если нужно, отметьте заново. «Убрать» — убрать запись из журнала.', tags: 'не принято журнал очередь конфликт без интернета' },
    { g: 'marks', q: 'Где посмотреть состав блюда?', a: 'В карточке блюда — тех. карта: на план, а как только введёте количество — на него (сделаю 3 из 5 — состав на 3). Все блюда и заготовки — во вкладке «Справочник».', tags: 'тех карта техкарта рецепт состав' },
    { g: 'preps', q: 'Почему не видно заготовок?', a: 'Заготовки видны в окне заготовок точки — обычно с 17:00 накануне до 15:00 этого дня (у точки может быть своё окно). Если окно открыто, а списка нет — администратор ещё не рассчитал заготовки.', tags: 'заготовки пусто нет окно' },
    { g: 'preps', q: 'Почему видно сразу «Сегодня» и «Завтра»?', a: 'У точки окно заготовок начинается раньше, чем кончается вчерашнее: например, завтрашние заготовки видны уже с 8:00. Переключайте день вкладками; внеплановая заготовка записывается на открытый день.', tags: 'два дня вкладки сегодня завтра' },
    { g: 'admin', q: 'Как сделать, чтобы точка видела заготовки на завтра с утра?', a: 'Руководитель: «Настройки» → «Окно заготовок» → «По точкам» → включите точку и поставьте «С (накануне)», например 08:00, → «Сохранить». Заготовки на завтра рассчитайте до этого времени («Расчёт» или «Рассчитать все»).', tags: 'окно заготовок утро своё точка настроить время' },
    { g: 'preps', q: 'Как отметить набор для лимонада или смузи?', a: 'Откройте «Лимонады и смузи», нажмите на лимонад или смузи, отметьте заготовки галочками (или «Отметить все по плану») и нажмите «Набор собран». Ошиблись — нажмите галочку ещё раз, отметка снимется.', tags: 'смузи лимонад набор собрать снять галочку' },
    { g: 'preps', q: 'Где заготовки для лимонадов?', a: 'В разделе «Лимонады и смузи»: у каждого лимонада — свой набор заготовок, как у смузи. В «Заготовках» остаётся только то, что нужно другим блюдам. Сок или сироп нужен и лимонаду, и другим блюдам — он есть и в «Заготовках» (на другие блюда), и в наборе лимонада (на лимонад).', tags: 'лимонад лимонады сироп заготовки пропали где' },
    { g: 'plan', q: 'Как посмотреть план на завтра?', a: '«Блюда» → кнопка «План на завтра» рядом с «Готово». Откроется план на завтра — только посмотреть: отметить или изменить ничего нельзя. Нажмите ещё раз — вернётся список на сегодня.', tags: 'завтра план на завтра посмотреть заранее' },
    { g: 'plan', q: 'На сегодня нет блюд — почему?', a: 'План на этот день ещё не отправлен. Администратор отправляет его в «Ещё → Автоплан» (или он уходит сам по расписанию).', tags: 'пустой план нет плана' },
    { g: 'plan', q: 'Откуда берутся цифры плана?', a: 'План дня — большее из двух: продажи и списания в такой же день прошлой недели и той же недели год назад, вверх до целого. С включённой Gemma — ИИ-план: та же неделя год назад × динамика × погода, праздники и заметки.', tags: 'как считается расчет расчёт формула' },
    { g: 'plan', q: 'Чем ИИ-план отличается от обычного?', a: 'Обычный план — «большее из двух» без роста. ИИ-план учитывает рост или спад продаж к прошлому году, погоду, праздники, акции из заметок и убирает разовые всплески. На экране видно, что ИИ увеличил ▲ и уменьшил ▼.', tags: 'gemma джемма ии искусственный интеллект' },
    { g: 'plan', q: 'Почему ИИ увеличил или уменьшил блюдо?', a: 'В «Автоплане» у блюда нажмите «Почему так?» (на ПК — наведите на цифру): основа год назад, динамика и каждая причина Gemma.', tags: 'почему больше меньше объяснение' },
    { g: 'plan', q: 'Как добавить в план новинку?', a: 'В «Заметках для Gemma» напишите: «Добавь новинку Сок …, 250 мл — минимум 3 на точку» и нажмите «Составить заново». Блюдо должно быть в справочнике — Gemma подберёт похожее блюдо и посчитает долю.', tags: 'новое блюдо новинка добавить сок' },
    { g: 'plan', q: 'Блюдо продаётся, но не попадает в план', a: 'Оно заблокировано в автоплане. В «Автоплане» внизу — «Продавались, но заблокированы»: нажмите «Включить», затем «Пересчитать».', tags: 'нет в плане заблокировано включить' },
    { g: 'plan', q: 'Как убрать блюдо из плана, чтобы автоплан его больше не ставил?', a: '«Автоплан» → точка → корзина у строки блюда → «Только» эта точка или «Во всех точках» → «Убрать». Строки плана с сегодняшнего дня уберутся, блюдо станет «Заблокировано» (в точке или везде). Вернуть — «Добавить блюдо» или «Справочники» → блюдо → «По точкам».', tags: 'удалить убрать блюдо из плана заблокировать корзина' },
    { g: 'plan', q: 'Как добавить в план блюдо, которого там нет?', a: '«Автоплан» → неделя → точка → «Добавить блюдо» → «Только эта точка» или «Во все точки» → найдите блюдо. Строка появится в списке; нажмите на цифру в нужном дне и введите количество — так по каждому дню. При «Во все точки» — одна цифра и дни в окне → «Поставить в план»: блюдо встанет всем точкам сразу. Без цифры блюдо в план точки не попадёт; точкам, которым план недели ещё не отправлен, цифра не встанет. Цифры ставятся сегодня и дальше в днях «в плане»: если план недели ещё не отправлен — сначала «Отправить в план». Строку без цифр можно убрать крестиком.', tags: 'добавить блюдо новое нет в плане строка вручную' },
    { g: 'plan', q: 'Как поправить цифру отправленного плана?', a: 'В «Автоплане» в дне «в плане» нажмите на цифру и введите новую; 0 — убрать блюдо из дня. Отмеченную на точке позицию изменить нельзя. Если заготовки на этот день уже рассчитаны — после правок «К расчёту» → «Пересчитать».', tags: 'изменить план исправить количество' },
    { g: 'plan', q: 'Зачем отправлять понедельник отдельно?', a: 'Заготовки на понедельник делают в воскресенье с 17:00, а неделя продаж закрывается только в 22:00. Поэтому план понедельника уходит раньше (по умолчанию в субботу в 9:00), а остальные дни — в воскресенье вечером.', tags: 'понедельник заранее' },
    { g: 'plan', q: 'Gemma не ответила — что будет?', a: 'План уйдёт «большее из двух» — как без ИИ. Можно нажать «Составить ИИ-план» ещё раз чуть позже.', tags: 'ошибка gemma не отвечает' },
    { g: 'plan', q: 'Как отправить план только одной точке?', a: 'В «Автоплане» нажмите «Отправить в план» (или «Только понедельник», «Заменить расчётом») и в окне выберите нужную точку вместо «Все точки».', tags: 'одна точка отдельно отправить' },
    { g: 'plan', q: 'Как убрать влияние погоды на план?', a: 'Руководитель: «Настройки» → «Gemma 4» → выключить «Учитывать погоду» → «Сохранить». Затем в «Автоплане» — «Составить заново».', tags: 'погода отключить прогноз' },
    { g: 'admin', q: 'Как исправить отметку на точке?', a: 'На «Дашборде» нажмите плитку точки, откройте позицию → «Вернуть в работу» → «Да, вернуть» и отметьте заново. Точка может сделать это и сама.', tags: 'сбросить исправить отметку вернуть' },
    { g: 'admin', q: 'Как пересчитать заготовки на день?', a: 'На завтра и позже: «Расчёт» → выберите день → «Пересчитать» → проверьте «было → станет» → «Пересчитать». Кнопка есть, только если план или тех. карты изменились после расчёта. Сегодняшние заготовки не пересчитываются. Точку, которой план внесли позже, можно рассчитать отдельно.', tags: 'повторно пересчитать расчет' },
    { g: 'admin', q: 'Поправил план после расчёта — заготовки изменятся?', a: 'Сами — нет. Закончите правки и пересчитайте: «Расчёт» → «Пересчитать» на этом дне или «Пересчитать все» на плашке «Заготовки устарели». Отмеченные на точке заготовки при пересчёте не меняются. Сегодняшние заготовки не пересчитываются — недостающее точка может добавить как внеплановое.', tags: 'изменил план заготовки пересчитать' },
    { g: 'admin', q: 'Как рассчитать заготовки сразу на всю неделю?', a: 'В «Расчёте» нажмите «Рассчитать все» на плашке «N дней без заготовок» и подтвердите.', tags: 'все дни неделя сразу' },
    { g: 'admin', q: 'Никто не рассчитал заготовки — что будет?', a: 'В 22:30 (время меняется в «Настройках») приложение само рассчитает заготовки на завтра для точек, где их нет.', tags: 'автозаготовки автоматически забыли' },
    { g: 'admin', q: 'Когда закрывать день?', a: 'Вручную — не нужно: день закрывается сам в 23:00 (время — в «Настройках»), смена точек сбрасывается.', tags: 'закрытие архив смена' },
    { g: 'admin', q: 'Что значит красная строка в «Аналитике»?', a: 'Сделано по приложению и продано + списано по iiko не сходятся больше допуска. «+» — отметили больше, чем ушло (не сделали или не списали), «−» — продали больше, чем отметили.', tags: 'аналитика расхождение красное жульничество излишек недостача' },
    { g: 'admin', q: 'Поменяли тех. карту в iiko — когда это увидят точки?', a: 'Сами — после ночной синхронизации (03:00): обновится состав блюд на экранах и пересчитаются заготовки с завтрашнего дня. Сразу — «Интеграции» → «Всё сразу и пересчёт заготовок» → «Запустить» (или «Настройки» → «Ночная синхронизация iiko» → «Запустить сейчас»): под кнопкой будет итог — сколько дней проверено и какие пересчитаны. В расчёт идёт версия тех. карты, которая действует в день заготовок — дата видна в «Расчёт» → «Детально».', tags: 'тех карта изменили iiko состав заготовки пересчитать ночь' },
    { g: 'admin', q: 'Тех. карту поменяли, а в заготовках старая заготовка', a: '«Расчёт» → нужный день → нажмите на эту заготовку: видно, из каких блюд она набирается и с какой даты их тех. карты. Обычно её дают другие блюда, где тех. карту ещё не меняли, — поменяйте их в iiko. Если у блюда тех. карта старая: в iiko новая версия начинается позже этого дня, или блюдо пересоздали — тогда в предупреждениях «Блюдо удалено в iiko», запустите «Интеграции» → «Всё сразу и пересчёт заготовок».', tags: 'старая заготовка тех карта не поменялась клубника почему' },
    { g: 'admin', q: 'Новое блюдо из iiko не видно', a: 'Откройте «Интеграции» и обновите справочник блюд (и тех. карты). Новые блюда приходят заблокированными в автоплане — включите нужные.', tags: 'iiko айко синхронизация справочник' },
    { g: 'admin', q: 'У блюда нет фото', a: '«Интеграции» → загрузить фото блюд. Фото берётся из iiko; если его нет в iiko — показывается заглушка.', tags: 'картинка фото изображение' },
    { g: 'admin', q: 'Итог конкурса не пришёл в «Пачку»', a: '«Настройки» → «Конкурсы»: под конкурсом написано, почему не ушло. Чаще всего бот не добавлен в чат — добавьте его в чат в «Пачке», приложение отправит само через полчаса.', tags: 'пачка конкурс мессенджер бот чат' },
    { g: 'admin', q: 'Кто изменил план или отметку?', a: '«Журнал» — кто, когда и что сделал, с фильтрами по дате, точке и действию.', tags: 'журнал история кто' },
    { g: 'admin', q: 'Салат-база: внизу «Не сохранено … Повторяем сами»', a: 'Пропала связь или сервер был занят. Ничего делать не нужно: цифры остаются на экране и в телефоне и уйдут сами, как только сервер ответит (можно нажать «Повторить сейчас»). Строки, которые ещё не сохранились, помечены «Не сохранено». Страницу можно закрыть и открыть снова — несохранённое отправится само (за прошлый день — если его документы ещё не созданы).', tags: 'салат база не сохранилось сервер занят нет связи пропало' },
    { g: 'admin', q: 'Салат-база: куда делась строка «со вчера»?', a: 'С 25.10 её нет. Остаток «оставить на завтра» раньше на следующий день сам прибавлялся к расчёту, хотя утром его и так взвешивают вместе со всем, — он считался дважды. Теперь утром взвесьте всё, что берёте в работу, вместе со вчерашним остатком и внесите в «Утро»; вычитать ничего не нужно. Акты, в которые остаток попал дважды, руководитель исправляет в «Настройках» раздела → «Акты в салат-базу с остатком «со вчера»» → «Исправить».', tags: 'салат база со вчера остаток оставить на завтра дважды ошибка исправить акт' },
    { g: 'admin', q: 'Салат-база: вчера забыли создать документы', a: 'Откройте этот день стрелкой «‹» у даты или в «Архиве». Если документов за день нет, вверху будет «Документы за этот день не созданы» → «Создать задним числом»: поля откроются, внесите или поправьте цифры и нажмите «Создать документы» внизу. В iiko документы будут от того дня, 23:50. Если за день уже есть хоть один документ, задним числом не создать.', tags: 'салат база задним числом вчера забыли прошлый день документы не создали' },
    { g: 'admin', q: 'Салат-база: вместо 0,23 записалось 23', a: 'До 22.10 так бывало, если во время набора приходил ответ сервера по другой строке: поле очищалось после «0,». Теперь набранное не стирается, а цифры от 5 кг подсвечиваются красным с вопросом «Нет ли пропущенной запятой?» и ещё раз — в окне документов (без галочки «Проверил» документы не создаются). Если документы с ошибкой уже созданы — исправьте их в iikoOffice.', tags: 'салат база запятая 23 кг ошибка вес неправильно' },
    { g: 'admin', q: 'Салат-база: романо в штуках — как внести?', a: 'В поле «с витрины … шт» (утро) или в первом поле окна «+» (днём). Если руководитель задал «1 шт ≈ … кг» в настройках раздела, вес посчитается сам; если нет — внесите и вес, иначе строка будет «Внесите вес» и документы не создадутся.', tags: 'салат база романо штуки шт вес' },
    { g: 'other', q: 'Куда обращаться, если что-то не работает?', a: 'В поддержку: Михаил Митюков, 8 952 824 32 59. Кнопка «Обратиться в поддержку» — внизу этой страницы и в меню.', tags: 'поддержка помощь телефон ошибка не работает' },
    { g: 'other', q: 'Что такое «Планограмма»?', a: 'Раздел в разработке — там появится планограмма бара.', tags: 'планограмма выкладка' },
  ].map((f, i) => Object.assign({ id: 'f' + i }, f));

  // Поиск без учёта регистра и «ё»; слово совпадает по началу (пароль — пароля, заготовки — заготовок)
  const norm = s => String(s || '').toLowerCase().replace(/ё/g, 'е');
  const stem = w => w.length > 5 ? w.slice(0, w.length - 2) : w;
  const hay = x => norm([x.q, x.a, x.tags, x.title, x.intro, x.tip].concat(x.steps || []).filter(Boolean).join(' '));
  const ALL_SECTIONS = [].concat(...['point', 'admin'].map(b => SECTIONS[b].map(s => Object.assign({ block: b }, s))));

  const HelpView = {
    template: '#tpl-help',
    emits: ['support'],
    setup() {
      const tab = ref(store.user && store.user.role === 'point' ? 'point' : 'admin');
      const openId = ref('');
      const query = ref('');
      const words = computed(() => norm(query.value).split(/[^a-zа-я0-9]+/).filter(w => w.length > 1).map(stem));
      // Сначала то, где нашлись все слова; если такого нет — где нашлось больше всего
      const scored = computed(() => {
        const score = x => { const h = hay(x); return words.value.filter(w => h.includes(w)).length; };
        const faq = FAQ.map(x => [x, score(x)]);
        const sec = ALL_SECTIONS.map(x => [x, score(x)]);
        const best = Math.max(0, ...faq.map(x => x[1]), ...sec.map(x => x[1]));
        const pick = list => best ? list.filter(x => x[1] === best).map(x => x[0]) : [];
        return { faq: pick(faq), sec: pick(sec) };
      });
      const faqHits = computed(() => scored.value.faq);
      const secHits = computed(() => scored.value.sec);
      const found = computed(() => faqHits.value.length + secHits.value.length);

      function setTab(id) { tab.value = id; openId.value = ''; }
      // Из поиска — в нужный раздел инструкции, раскрытым
      function openSection(s) {
        query.value = '';
        tab.value = s.block;
        openId.value = s.id;
        nextTick(() => { const el = document.getElementById('help-' + s.id); if (el) el.scrollIntoView({ block: 'start', behavior: 'smooth' }); });
      }

      return { BLOCKS, BLOCK_TITLE, START, SECTIONS, FAQ, FAQ_GROUPS, tab, openId, query, words, faqHits, secHits, found, setTab, openSection };
    },
  };

  const PlanogramView = {
    template: '#tpl-planogram',
    setup() { return { asset }; },
  };

  C.help = { components: { HelpView, PlanogramView } };

})(window.MFC);
</script>

  <!-- Новости: при входе в приложение — слайды непрочитанных новостей, внизу «Прочитать» (все роли).
     Прочитанное помнит устройство (localStorage) для этой учётной записи. Новости приходят в app.bootstrap. -->
<script type="text/x-template" id="tpl-news">
  <div v-if="item" class="wa-news" role="dialog" aria-modal="true" :aria-label="'Новости: ' + (state.index + 1) + ' из ' + state.queue.length">
    <div class="wa-news__card" :class="'wa-news--' + item.kind" :key="item.id + ':' + state.index">
      <div class="wa-news__bars" aria-hidden="true">
        <span v-for="(n, i) in state.queue" :key="n.id + i" class="wa-news__bar" :class="{ 'is-done': i < state.index, 'is-on': i === state.index }"></span>
      </div>

      <div class="wa-news__scroll">
        <header class="wa-news__hero">
          <img class="wa-news__art" :src="art" alt="">
          <span class="wa-news__chip">{{ kindLabel }} · {{ dateLabel }}</span>
          <h2 class="wa-news__title" :class="titleSize">{{ item.title }}</h2>
          <p v-if="lead" class="wa-news__lead">{{ lead }}</p>
        </header>

        <div class="wa-news__body">
          <!-- Фото к новости (своя новость, конкурс): грузится с сервера, пока нет — место под него -->
          <img v-if="photoSrc" class="wa-news__photo" :src="photoSrc" alt="">
          <div v-else-if="photoSrc === ''" class="wa-news__photo skeleton" aria-hidden="true"></div>
          <div v-else-if="photoFail" class="wa-news__photo-err" role="alert">
            <span>Фото не загрузилось{{ photoFail === true ? '' : ': ' + photoFail }}</span>
            <button type="button" class="btn btn--secondary" @click="retryPhoto">Повторить</button>
          </div>

          <!-- Своя новость -->
          <p v-if="item.kind === 'custom'" class="wa-news__text">{{ item.body.text }}</p>

          <!-- Тех. карты: одинаковые изменения у разных блюд — одним блоком -->
          <template v-else-if="item.kind === 'techcards'">
            <section v-for="(b, i) in item.body.blocks" :key="i" class="wa-nb">
              <div class="wa-nb__dishes">
                <span v-for="d in b.dishes" :key="d.id" class="wa-nb__dish">{{ d.kind === 'prep' ? 'п/ф · ' : '' }}{{ d.name }}</span>
                <span v-if="b.more" class="wa-nb__dish is-more">и ещё {{ b.more }}</span>
              </div>
              <ul class="wa-nb__list">
                <li v-if="b.first" class="wa-nb__row is-first"><span class="wa-nb__sign">★</span><span class="wa-nb__name">Новая тех. карта</span></li>
                <li v-for="x in b.add" :key="'a' + x.n" class="wa-nb__row is-add"><span class="wa-nb__sign">+</span><span class="wa-nb__name">{{ x.n }}</span><span class="wa-nb__qty">{{ q(x.a, x.u) }}</span></li>
                <li v-for="x in b.chg" :key="'c' + x.n" class="wa-nb__row is-chg"><span class="wa-nb__sign">↻</span><span class="wa-nb__name">{{ x.n }}</span><span class="wa-nb__qty"><s>{{ q(x.was, x.u) }}</s> {{ q(x.a, x.u) }}</span></li>
                <li v-for="x in b.del" :key="'d' + x.n" class="wa-nb__row is-del"><span class="wa-nb__sign">−</span><span class="wa-nb__name">{{ x.n }}</span><span class="wa-nb__qty">{{ q(x.a, x.u) }}</span></li>
              </ul>
            </section>
            <p v-if="item.body.moreBlocks" class="wa-hint">И ещё {{ item.body.moreBlocks }} изменений — тех. карты в «Справочнике».</p>
          </template>

          <!-- Новинки в плане -->
          <template v-else-if="item.kind === 'newplan'">
            <article v-for="d in item.body.items" :key="d.name" class="wa-np">
              <div class="wa-np__head">
                <span class="wa-np__photo"><img v-if="photo(d.id)" :src="photo(d.id)" alt=""><span v-else>{{ letter(d.name) }}</span></span>
                <span class="wa-np__title"><b>{{ d.name }}</b><small v-if="d.group">{{ d.group }}</small></span>
              </div>
              <div class="wa-np__points">
                <span v-for="p in d.points" :key="p.tt" class="wa-np__pt">{{ point(p.tt).emoji }} {{ point(p.tt).name }} · {{ fmt(p.amount) }} {{ d.unit }}</span>
              </div>
              <ul v-if="d.card.length" class="wa-np__card">
                <li v-for="(c, i) in d.card" :key="i"><span>{{ c[0] }}</span><span>{{ q(c[2], c[1]) }}</span></li>
              </ul>
              <p v-if="d.place && d.place.length" class="wa-np__place">Где лежит: {{ d.place.join(' · ') }}</p>
            </article>
          </template>

          <!-- Рейтинг: пьедестал, остальные места, лучшие сотрудники -->
          <template v-else-if="item.kind === 'rating'">
            <div v-if="podium.length" class="wa-rt-podium">
              <div v-for="p in podium" :key="p.place" class="wa-rt-step" :class="'is-' + p.place">
                <span class="wa-rt-step__medal">{{ MEDAL[p.place] }}</span>
                <b class="wa-rt-step__name">{{ p.name }}</b>
                <span class="wa-rt-step__val">{{ val(p) }}</span>
                <span class="wa-rt-step__col">{{ p.place }}</span>
              </div>
            </div>
            <ol v-if="rest.length" class="wa-rt-list">
              <li v-for="r in rest" :key="r.place" class="wa-rt-row">
                <span class="wa-rt-row__n">{{ r.place }}</span>
                <span class="wa-rt-row__main"><b>{{ r.name }}</b><span class="wa-rt-row__bar"><span :style="{ width: r.pct + '%' }"></span></span></span>
                <span class="wa-rt-row__val">{{ val(r) }}</span>
              </li>
            </ol>
            <section v-if="item.body.staff && item.body.staff.length" class="wa-rt-staff">
              <h3 class="wa-rt-staff__title">Лучшие сотрудники</h3>
              <p class="wa-rt-staff__sub">Больше всех сделали блюд {{ item.body.period.week ? 'за неделю' : 'за день' }}</p>
              <div v-for="(e, i) in item.body.staff" :key="e.name" class="wa-rt-emp" :class="{ 'is-top': i < 3 }">
                <span class="wa-rt-emp__ava">{{ initials(e.name) }}<i v-if="i < 3">{{ MEDAL[i + 1] }}</i></span>
                <span class="wa-rt-emp__main"><b>{{ e.name }}</b><small>{{ point(e.tt).emoji }} {{ point(e.tt).name }}</small></span>
                <span class="wa-rt-emp__val">{{ fmt(e.value) }} <small>порц</small></span>
              </div>
            </section>
            <p v-if="item.body.warning" class="wa-hint">{{ item.body.warning }}</p>
          </template>

          <!-- Конкурс: точки по продажам выбранных товаров — пьедестал и остальные места -->
          <template v-else-if="item.kind === 'contest'">
            <div class="wa-ct-items">
              <span v-for="n in item.body.items" :key="n" class="wa-ct-items__i">{{ n }}</span>
            </div>
            <div v-if="ctPodium.length" class="wa-rt-podium">
              <div v-for="p in ctPodium" :key="p.tt" class="wa-rt-step" :class="'is-' + p.slot">
                <span class="wa-rt-step__medal">{{ MEDAL[p.place] }}</span>
                <b class="wa-rt-step__name">{{ point(p.tt).name }} {{ point(p.tt).emoji }}</b>
                <span class="wa-rt-step__val">{{ ctVal(p) }}</span>
                <span class="wa-rt-step__col">{{ p.place }}</span>
              </div>
            </div>
            <ol v-if="ctRest.length" class="wa-rt-list">
              <li v-for="r in ctRest" :key="r.tt" class="wa-rt-row">
                <span class="wa-rt-row__n">{{ r.place }}</span>
                <span class="wa-rt-row__main"><b>{{ point(r.tt).name }} {{ point(r.tt).emoji }}</b>
                  <small v-if="r.mix" class="wa-ct-mix">{{ r.mix }}</small>
                  <span class="wa-rt-row__bar"><span :style="{ width: r.pct + '%' }"></span></span></span>
                <span class="wa-rt-row__val">{{ ctVal(r) }}</span>
              </li>
            </ol>
            <div class="wa-ct-total"><span>Всего по сети</span><b>{{ ctVal(item.body.total) }}</b></div>
          </template>
        </div>
      </div>

      <footer class="wa-news__foot">
        <button type="button" class="btn btn--primary btn--lg btn--block wa-news__read" @click="next">Прочитать</button>
        <span class="wa-news__count">{{ state.index + 1 }} из {{ state.queue.length }}</span>
      </footer>
    </div>
  </div>
</script>

<script>
(function (C) {
  if (!C) return;

  const { reactive, computed, watch } = Vue;
  const { store, LS, MF, asset, plural } = C;

  const state = reactive({ queue: [], index: 0, preview: false });
  const KIND = { custom: 'Новость', techcards: 'Тех. карты', newplan: 'Новинки в плане', rating: 'Рейтинг', contest: 'Конкурс' };
  // Иллюстрация контрастная к фону слайда: зелёный — морковь, жёлтый — авокадо, розовый — лимон, морковный — яблоко
  const ART = { custom: 'carrot', techcards: 'avocado', newplan: 'lemon', rating: 'apple-red', contest: 'lemon' };
  const MEDAL = { 1: '🥇', 2: '🥈', 3: '🥉' };
  const M = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
  const dm = d => Number(d.slice(8, 10)) + ' ' + M[Number(d.slice(5, 7)) - 1];

  // Прочитано: id новости и время её создания — исправленную новость покажем снова
  const readKey = () => 'mf-news-read:' + (store.user ? store.user.login : '');
  const mark = n => n.id + '|' + (n.created || '');
  function readSet() {
    try { return new Set(JSON.parse(LS.get(readKey()) || '[]')); } catch (e) { return new Set(); }
  }
  function markRead(n) {
    const list = [...readSet()].filter(x => x !== mark(n)).concat(mark(n)).slice(-300);
    LS.set(readKey(), JSON.stringify(list));
  }

  // При входе и после обновления данных: непрочитанные — по порядку публикации
  function openUnread() {
    if (state.queue.length) return;
    const read = readSet();
    const list = (store.news || []).filter(n => !read.has(mark(n)));
    if (list.length) { list.forEach(photoOf); Object.assign(state, { queue: list, index: 0, preview: false }); }
  }
  // Посмотреть, как увидят (из «Настроек»): прочитанным не отмечаем
  function preview(items) {
    items.forEach(photoOf);
    Object.assign(state, { queue: items.slice(), index: 0, preview: true });
  }

  // Фото новостей: id → картинка (data URI); '' — грузится, null — не загрузилось (текст ошибки — в photoErr).
  // Все фото очереди — сразу при открытии
  const photos = reactive({});
  const photoErr = reactive({});
  function photoOf(n) {
    const id = n && n.body && n.body.photo;
    if (!id) return null;
    if (!(id in photos)) {
      photos[id] = '';
      C.callApi('news.photo', { id }).then(d => { photos[id] = d && d.data ? d.data : null; if (!photos[id]) photoErr[id] = 'пустой ответ сервера'; })
        .catch(e => { photos[id] = null; photoErr[id] = (e && e.message) || ''; });
    }
    return photos[id];
  }

  watch(() => state.queue.length > 0, on => document.documentElement.classList.toggle('wa-news-open', on));

  const NewsStories = {
    template: '#tpl-news',
    setup() {
      const item = computed(() => state.queue[state.index] || null);
      const kindLabel = computed(() => {
        const n = item.value;
        if (n.kind === 'rating') return n.body.period && n.body.period.week ? 'Рейтинг недели' : 'Рейтинг дня';
        if (n.kind === 'contest') return n.body.period && n.body.period.week ? 'Конкурс · итоги недели' : 'Конкурс';
        return KIND[n.kind] || 'Новость';
      });
      // У рейтинга — за какой день или неделю он, у остальных — когда опубликовано
      const dateLabel = computed(() => {
        const n = item.value;
        const p = (n.kind === 'rating' || n.kind === 'contest') && n.body && n.body.period;
        if (p) return p.week ? dm(p.from) + ' – ' + dm(p.to) : 'за ' + dm(p.to);
        return n.date === store.today ? 'сегодня' : dm(n.date);
      });
      const art = computed(() => asset(ART[item.value.kind] || 'carrot'));

      const fmt = n => MF.fmt(n);
      const money = n => Math.round(n).toLocaleString('ru-RU') + ' ₽';
      // Количество с единицей: граммы и миллилитры — понятнее для малых долей кг и л
      const q = (a, u) => {
        if (a == null) return '';
        if (/^кг$/i.test(u) && a < 1) return fmt(Math.round(a * 1e4) / 10) + ' г';
        if (/^л$/i.test(u) && a < 1) return fmt(Math.round(a * 1e4) / 10) + ' мл';
        return String(Math.round(a * 1e6) / 1e6).replace('.', ',') + (u ? ' ' + u : '');   // 0,0032 шт — без округления до 0,003
      };
      const point = tt => {
        const p = store.points.find(x => x.tt === tt);
        if (p) return p;
        const m = String(tt || '').match(/^(.*?)\s*((?:\p{Extended_Pictographic}|️|‍)+)\s*$/u);
        return m ? { name: m[1], emoji: m[2] } : { name: tt || '', emoji: '' };
      };
      const photo = id => C.photoOf(id);
      const initials = name => C.initials(name) || '·';
      const letter = name => (String(name || '?').replace(/^[«"'\s]+/, '')[0] || '?').toUpperCase();

      const lead = computed(() => {
        const n = item.value;
        const b = n.body || {};
        if (n.kind === 'techcards') return 'С сегодняшнего дня новый состав у ' + b.total + ' ' + plural(b.total, ['позиции', 'позиций', 'позиций']) + '. Проверьте, как теперь готовить.';
        if (n.kind === 'newplan') return 'Не продавались больше ' + b.days + ' ' + plural(b.days, ['дня', 'дней', 'дней']) + ' и сегодня снова в плане. Вспомните состав и где лежат заготовки.';
        if (n.kind === 'rating') {
          const p = b.period || {};
          const t = b.total || {};
          return (p.week ? 'За неделю' : 'За ' + dm(p.to)) + (t.qty ? ' продано ' + fmt(t.qty) + ' ' + plural(Math.round(t.qty), ['блюдо', 'блюда', 'блюд']) + (t.sum ? ' на ' + money(t.sum) : '') : '') + '.';
        }
        if (n.kind === 'contest') {
          const p = b.period || {};
          return 'Кто больше продал ' + (p.week ? 'за неделю' : p.from === p.to ? 'за ' + dm(p.to) : 'с ' + dm(p.from) + ' по ' + dm(p.to)) + ' — ' +
            (b.measure === 'sum' ? 'по сумме продаж' : 'по количеству') + '.';
        }
        return '';
      });

      // Рейтинг: тройка лидеров на пьедестале (2-1-3), остальные — списком с полосой
      const ranked = computed(() => {
        const b = item.value.body || {};
        const key = b.measure === 'sum' ? 'sum' : 'qty';
        const max = (b.top && b.top[0] && b.top[0][key]) || 1;
        return (b.top || []).map((r, i) => Object.assign({ place: i + 1, pct: Math.max(4, Math.round(r[key] / max * 100)) }, r));
      });
      const podium = computed(() => [2, 1, 3].map(p => ranked.value.find(r => r.place === p)).filter(Boolean));
      const rest = computed(() => ranked.value.slice(3));
      const val = r => item.value.body.measure === 'sum' ? money(r.sum) : fmt(r.qty) + ' шт';

      // Конкурс: места уже посчитаны на сервере (одинаковый итог — одно место). На пьедестале — первые три с продажами
      const ctKey = () => item.value.body.measure === 'sum' ? 'sum' : 'qty';
      const ctRanked = computed(() => {
        const b = item.value.body || {};
        if (item.value.kind !== 'contest') return [];
        const k = ctKey();
        const max = Math.max(1, ...(b.points || []).map(p => p[k]));
        const many = (b.items || []).length > 1;
        return (b.points || []).map(p => Object.assign({}, p, { pct: Math.max(p[k] > 0 ? 4 : 0, Math.round(p[k] / max * 100)),
          mix: many ? (p.items || []).filter(x => x.qty > 0).slice(0, 4).map(x => x.name + ' ' + fmt(x.qty)).join(' · ') : '' }));
      });
      const ctTop = computed(() => ctRanked.value.filter((p, i) => i < 3 && p[ctKey()] > 0));
      const ctPodium = computed(() => [1, 0, 2].map(i => ctTop.value[i] && Object.assign({ slot: i + 1 }, ctTop.value[i])).filter(Boolean));
      const ctRest = computed(() => ctRanked.value.slice(ctTop.value.length));
      // Количество, а если считают по сумме — сумма и количество
      const ctVal = r => item.value.body.measure === 'sum' ? money(r.sum) + ' · ' + fmt(r.qty) + ' шт' : fmt(r.qty) + ' шт' + (item.value.body.hasSum && r.sum ? ' · ' + money(r.sum) : '');
      const photoSrc = computed(() => photoOf(item.value));
      // Не загрузилось — видно на слайде (с причиной), можно повторить
      const photoFail = computed(() => {
        const id = item.value && item.value.body && item.value.body.photo;
        return id && photos[id] === null ? (photoErr[id] || true) : false;
      });
      function retryPhoto() {
        const id = item.value.body.photo;
        delete photos[id];
        delete photoErr[id];
        photoOf(item.value);
      }
      // Длинный заголовок — мельче: иначе он занимает весь экран телефона
      const titleSize = computed(() => {
        const n = String(item.value.title || '').length;
        return n > 90 ? 'is-xlong' : n > 45 ? 'is-long' : '';
      });

      function next() {
        if (!state.preview) markRead(item.value);
        if (state.index < state.queue.length - 1) state.index++;
        else Object.assign(state, { queue: [], index: 0, preview: false });
      }

      // Рейтинг и конкурс — с конфетти
      watch(item, n => { if (n && (n.kind === 'rating' || n.kind === 'contest')) setTimeout(C.confetti, 250); }, { immediate: true });

      return { state, item, kindLabel, dateLabel, art, lead, fmt, q, point, photo, initials, letter, podium, rest, val, next, MEDAL, ctPodium, ctRest, ctVal, photoSrc, photoFail, retryPhoto, titleSize };
    },
  };

  C.news = { NewsStories, openUnread, preview, state, photos, photoOf };

})(window.MFC);
</script>

  text-align: left; font: 500 15px/1.4 var(--font-body); color: var(--text); cursor: pointer; transition: border-color .2s, background-color .2s, opacity .2s, transform .15s; }
.tr-opt:active { transform: scale(.985); }

.tr-opt.is-right { border-color: var(--fresh); background: var(--fresh-soft); }
.tr-opt.is-right .tr-opt__k { background: var(--fresh); color: #fff; }

.tr-why b { font: 700 16px var(--font-display); }
.tr-why p { margin: 0; }

.tr-stats small { font-size: 12px; color: var(--text-muted); }
.tr-toast { position: fixed; z-index: 60; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%); max-width: 90vw; padding: 12px 16px; border-radius: 16px; background: var(--inverse); color: var(--on-inverse); font-size: 14px; box-shadow: var(--shadow-lg); animation: tr-in .3s ease both; }
.tr-confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; overflow: hidden; }
.tr-confetti i { position: absolute; top: -12px; width: 8px; height: 14px; border-radius: 2px; animation: tr-fall linear forwards; }
@keyframes tr-fall { to { transform: translateY(110vh) rotate(720deg); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

/* Вид «ПК» (обучение администратора): шире, пояснение справа внизу */
.tr--desk .tr-main, .tr--desk .tr-top__in, .tr--desk .tr-bar__in { max-width: 1140px; }
.tr--desk .tr-main--narrow, .tr--desk .tr-bar__in--narrow { max-width: 640px; }
.tr--desk .tr-bar__in:not(.tr-bar__in--narrow) { justify-content: flex-end; }

  .tr--desk .tr-tip { left: auto; right: 24px; bottom: calc(84px + env(safe-area-inset-bottom)); width: 400px; padding: 0; }
  .tr--desk .tr-tip__card { max-width: none; }
}

</style>
<script>
// Обучение «Морковь Фрут · БАР»: шаги с пояснениями на снимках экранов и тест с повтором ошибок.
// Один движок — для отдельного HTML-файла (прототип) и для окна в приложении (ui_training.html).
// MFTraining(root, data, opts) → { destroy }. opts: scroller — элемент с прокруткой (по умолчанию окно),
// key — ключ прогресса в localStorage, closable + onClose — кнопка «Закрыть», onFinish — «Начать работу».
// Данные (собирает tools/build_training.js): { role, version, device: 'phone'|'desktop', intro, finish, steps, quiz }.
function MFTraining(root, D, opts) {
  'use strict';
  opts = opts || {};
  var sc = opts.scroller || window;
  var KEY = opts.key || 'mf-training:' + D.role + ':v' + D.version;
  var LETTERS = ['А', 'Б', 'В', 'Г', 'Д'];
  var DESK = D.device === 'desktop';
  root.classList.add('tr', DESK ? 'tr--desk' : 'tr--phone');

  // ---------- Прогресс — на этом устройстве (закрыли страницу — продолжится с того же места)
  function load() { try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { return null; } }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) { /* без сохранения */ } }
  function fresh() { return { phase: 'start', step: 0, seen: {}, quiz: null }; }
  var st = load() || fresh();
  if (st.phase === 'tour' && st.step >= D.steps.length) st.step = D.steps.length - 1;
  var tipOpen = -1;        // открытое пояснение на шаге
  var askRestart = false;  // «Начать сначала?» в шапке

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  // В текстах: **жирный**
  function rich(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'); }
  function plural(n, f) { var a = Math.abs(n) % 100, b = a % 10; return a > 10 && a < 20 ? f[2] : b > 1 && b < 5 ? f[1] : b === 1 ? f[0] : f[2]; }
  function shuffle(n) { var a = []; for (var i = 0; i < n; i++) a.push(i); for (var j = n - 1; j > 0; j--) { var k = Math.floor(Math.random() * (j + 1)); var t = a[j]; a[j] = a[k]; a[k] = t; } return a; }
  function toTop() { sc.scrollTo(0, 0); }

  var STEPS = D.steps.length;
  var QN = D.quiz.length;
  // Общий прогресс: шаги — 70%, тест — 30%
  function progress() {
    if (st.phase === 'start') return 0;
    if (st.phase === 'tour') return Math.round(70 * st.step / STEPS);
    if (st.phase === 'quizIntro') return 70;
    if (st.phase === 'quiz') { var q = st.quiz; return 70 + Math.round(30 * Math.min(q.pos, q.queue.length) / q.queue.length); }
    return 100;
  }
  function closeBtn() { return opts.closable ? '<button type="button" class="tr-top__close" data-act="close" aria-label="Закрыть обучение">Закрыть</button>' : ''; }
  function top(label, count) {
    var row = askRestart
      ? '<span class="tr-top__ask">Начать сначала? Пройденное сбросится.</span><button type="button" class="tr-top__yes" data-act="restart-yes">Да</button><button type="button" class="tr-top__restart" data-act="restart-no">Нет</button>'
      : '<span class="tr-top__brand">' + esc(label) + '</span><span class="tr-top__count">' + esc(count) + '</span><button type="button" class="tr-top__restart" data-act="restart">Сначала</button>' + closeBtn();
    return '<header class="tr-top"><div class="tr-top__in"><div class="tr-top__row">' + row + '</div>' +
      '<div class="tr-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + progress() + '"><span style="width:' + progress() + '%"></span></div></div></header>';
  }
  function bar(inner, narrow) { return '<div class="tr-bar"><div class="tr-bar__in' + (narrow ? ' tr-bar__in--narrow' : '') + '">' + inner + '</div></div>'; }

  // ====================================================================== Экраны
  function render() {
    if (st.phase === 'start') return renderStart();
    if (st.phase === 'tour') return renderStep();
    if (st.phase === 'quizIntro') return renderQuizIntro();
    if (st.phase === 'quiz') return renderQuiz();
    return renderDone();
  }

  function renderStart() {
    var resume = st.step > 0 || st.quiz;
    root.innerHTML = (opts.closable ? '<header class="tr-top"><div class="tr-top__in"><div class="tr-top__row"><span class="tr-top__brand">Обучение</span><span class="tr-top__count"></span>' + closeBtn() + '</div></div></header>' : '') +
      '<main class="tr-main tr-main--narrow">' +
      '<section class="tr-hero"><span class="tr-hero__dome" aria-hidden="true"></span>' +
      '<span class="tr-hero__eyebrow">Морковь Фрут · БАР</span>' +
      '<h1 class="tr-hero__title">' + esc(D.intro.title) + '</h1>' +
      '<p class="tr-hero__text">' + rich(D.intro.text) + '</p>' +
      '<div class="tr-meta"><span>' + STEPS + ' ' + plural(STEPS, ['шаг', 'шага', 'шагов']) + '</span><span>тест — ' + QN + ' ' + plural(QN, ['вопрос', 'вопроса', 'вопросов']) + '</span><span>≈ ' + D.intro.minutes + ' минут</span></div></section>' +
      (D.intro.gate ? '<p class="tr-gate">' + rich(D.intro.gate) + '</p>' : '') +
      '<div class="eyebrow">Что будет в обучении</div>' +
      '<ol class="tr-topics">' + D.steps.map(function (s) { return '<li>' + esc(s.title) + '</li>'; }).join('') + '<li class="is-quiz">Тест — ' + QN + ' ' + plural(QN, ['вопрос', 'вопроса', 'вопросов']) + '</li></ol>' +
      '<p class="tr-note">' + esc(D.intro.note || 'На шагах нажимайте на мигающие точки — откроется пояснение. В тесте ошибку объясним, а вопрос повторим в конце.') + '</p>' +
      '</main>' +
      bar(resume
        ? '<button type="button" class="btn btn--ghost btn--lg" data-act="restart-yes">Сначала</button><button type="button" class="btn btn--primary btn--lg" data-act="resume">Продолжить</button>'
        : '<button type="button" class="btn btn--primary btn--lg" data-act="begin">Начать обучение</button>', true);
  }

  function stepSeen(i) { return st.seen[D.steps[i].id] || []; }
  function allSeen(i) { return stepSeen(i).length >= D.steps[i].hot.length; }

  function renderStep() {
    var s = D.steps[st.step];
    var seen = stepSeen(st.step);
    var n = s.hot.length, k = seen.length;
    var stage;
    if (s.img) {
      var shot = '<div class="tr-shot" style="aspect-ratio:' + s.w + '/' + s.h + '"><img src="' + s.img + '" width="' + s.w + '" height="' + s.h + '" alt="' + esc(s.title) + '">' +
        s.hot.map(function (h, i) {
          var cls = 'tr-hot' + (seen.indexOf(i) >= 0 ? ' is-seen' : '') + (tipOpen === i ? ' is-open' : '');
          return '<button type="button" class="' + cls + '" data-hot="' + i + '" aria-label="' + esc((i + 1) + '. ' + h.title) + '" style="left:' + (100 * h.x / s.w) + '%;top:' + (100 * h.y / s.h) +
            '%;width:' + (100 * h.w / s.w) + '%;height:' + (100 * h.h / s.h) + '%"><span class="tr-dot">' + (seen.indexOf(i) >= 0 && tipOpen !== i ? '✓' : i + 1) + '</span></button>';
        }).join('') + '</div>';
      stage = DESK
        ? '<div class="tr-desk"><div class="tr-desk__bar" aria-hidden="true"><i></i><i></i><i></i><span>Морковь Фрут · БАР</span></div>' + shot + '</div>'
        : '<div class="tr-phone">' + shot + '</div>';
    } else {
      stage = '<div class="tr-flow' + (tipOpen >= 0 ? ' tr-flow--focus' : '') + '">' + s.hot.map(function (h, i) {
        var cls = 'tr-el' + (seen.indexOf(i) >= 0 ? ' is-seen' : '') + (tipOpen === i ? ' is-open' : '');
        return (i && s.arrows ? '<span class="tr-arrow" aria-hidden="true">↓</span>' : '') +
          '<button type="button" class="' + cls + '" data-hot="' + i + '"><span class="tr-dot">' + (seen.indexOf(i) >= 0 && tipOpen !== i ? '✓' : i + 1) + '</span>' +
          '<span class="tr-el__ico" aria-hidden="true">' + esc(h.icon || '•') + '</span><span class="tr-el__body"><b>' + esc(h.title) + '</b>' + (h.sub ? '<small>' + esc(h.sub) + '</small>' : '') + '</span>' +
          (h.time ? '<span class="tr-el__time">' + esc(h.time) + '</span>' : '') + '</button>';
      }).join('') + '</div>';
    }
    var done = k >= n;
    var tip = tipOpen >= 0 ? s.hot[tipOpen] : null;
    var nextUnseen = nextUnseenIdx(tipOpen);
    root.innerHTML = top('Обучение', 'Шаг ' + (st.step + 1) + ' из ' + STEPS) +
      '<main class="tr-main' + (s.img ? '' : ' tr-main--narrow') + '"><h1 class="h-screen tr-title">' + esc(s.title) + '</h1><p class="tr-lead">' + rich(s.lead) + '</p>' + stage +
      '<p class="tr-hint' + (done ? ' is-done' : '') + '"><span class="tr-hint__dot"></span>' +
      (done ? 'Всё просмотрено — можно дальше' : 'Нажимайте на мигающие точки · просмотрено ' + k + ' из ' + n) + '</p></main>' +
      bar('<button type="button" class="btn btn--ghost btn--lg" data-act="back">Назад</button>' +
        '<button type="button" class="btn btn--primary btn--lg" data-act="next"' + (done ? '' : ' disabled') + '>' + (done ? (st.step + 1 < STEPS ? 'Далее' : 'К тесту') : 'Осталось ' + (n - k)) + '</button>') +
      '<div class="tr-tip' + (tip ? ' is-open' : '') + '" role="dialog" aria-live="polite">' + (tip ?
        '<div class="tr-tip__card"><div class="tr-tip__head"><span class="tr-tip__n">' + (tipOpen + 1) + '</span><span class="tr-tip__title">' + esc(tip.title) + '</span></div>' +
        '<p class="tr-tip__text">' + rich(tip.text) + '</p><div class="tr-tip__row"><span class="tr-tip__cnt">' + (tipOpen + 1) + ' из ' + n + '</span>' +
        '<button type="button" class="btn btn--primary" data-act="tipnext">' + (nextUnseen >= 0 ? 'Следующее' : 'Понятно') + '</button></div></div>' : '') + '</div>';
    if (tip) revealOpen();
  }

  function nextUnseenIdx(from) {
    var s = D.steps[st.step], seen = stepSeen(st.step);
    for (var j = 1; j <= s.hot.length; j++) { var i = (from + j + s.hot.length) % s.hot.length; if (seen.indexOf(i) < 0 && i !== from) return i; }
    return -1;
  }
  function markSeen(i) {
    if (i < 0) return;
    var id = D.steps[st.step].id;
    var a = st.seen[id] = st.seen[id] || [];
    if (a.indexOf(i) < 0) a.push(i);
    save();
  }
  // Открытое место — не под пояснением и не под шапкой: прокрутить, если закрыто
  function revealOpen() {
    requestAnimationFrame(function () {
      var el = root.querySelector('[data-hot].is-open');
      var tip = root.querySelector('.tr-tip__card');
      var head = root.querySelector('.tr-top');
      if (!el || !tip) return;
      var r = el.getBoundingClientRect(), tr = tip.getBoundingClientRect();
      var topLimit = (head ? head.getBoundingClientRect().bottom : 0) + 12;
      // Пояснение справа (ПК) мешает только тому, что под ним по горизонтали
      var under = r.right > tr.left && r.left < tr.right;
      var bottomLimit = under ? tr.top - 16 : window.innerHeight - 16;
      if (r.bottom > bottomLimit || r.top < topLimit) {
        var want = r.height > bottomLimit - topLimit ? r.top - topLimit : r.bottom - bottomLimit;
        if (r.top - want < topLimit) want = r.top - topLimit;
        sc.scrollBy({ top: want, behavior: 'smooth' });
      }
    });
  }

  function renderQuizIntro() {
    root.innerHTML = top('Тест', QN + ' ' + plural(QN, ['вопрос', 'вопроса', 'вопросов'])) +
      '<main class="tr-main tr-main--narrow"><section class="tr-hero"><span class="tr-hero__dome" aria-hidden="true"></span><span class="tr-hero__eyebrow">Последний шаг</span>' +
      '<h1 class="tr-hero__title">Проверим, что запомнилось</h1><p class="tr-hero__text">' + QN + ' ' + plural(QN, ['вопрос', 'вопроса', 'вопросов']) +
      ' о работе в приложении. Ошибётесь — покажем, в чём дело, и вернём этот вопрос в конце, чтобы закрепить.</p></section></main>' +
      bar('<button type="button" class="btn btn--ghost btn--lg" data-act="back">Назад</button><button type="button" class="btn btn--primary btn--lg" data-act="quizgo">Начать тест</button>', true);
  }

  function quizState() {
    var q = st.quiz;
    if (!q) q = st.quiz = { queue: D.quiz.map(function (x, i) { return i; }), pos: 0, perm: null, answer: -1, first: {}, wrongs: 0 };
    if (!q.perm || q.perm.length !== D.quiz[q.queue[q.pos]].options.length) { q.perm = shuffle(D.quiz[q.queue[q.pos]].options.length); save(); }
    return q;
  }

  function renderQuiz() {
    var q = quizState();
    var qi = q.queue[q.pos];
    var Q = D.quiz[qi];
    var repeat = q.pos >= QN;
    var answered = q.answer >= 0;
    var right = answered && Q.options[q.answer].ok;
    var label = repeat ? 'Повтор ' + (q.pos - QN + 1) + ' из ' + (q.queue.length - QN) : 'Вопрос ' + (q.pos + 1) + ' из ' + QN;
    var opts2 = q.perm.map(function (oi, n) {
      var o = Q.options[oi];
      var cls = 'tr-opt';
      if (answered) cls += o.ok ? ' is-right' : oi === q.answer ? ' is-wrong' : ' is-dim';
      return '<button type="button" class="' + cls + '" data-opt="' + oi + '"' + (answered ? ' aria-disabled="true"' : '') + '><span class="tr-opt__k">' + LETTERS[n] + '</span><span>' + rich(o.t) + '</span></button>';
    }).join('');
    var correct = Q.options.filter(function (o) { return o.ok; })[0];
    var why = '';
    if (answered) {
      why = right
        ? '<div class="tr-why tr-why--ok" role="status"><b>Верно!</b><p>' + rich(Q.why) + '</p></div>'
        : '<div class="tr-why tr-why--bad" role="status"><b>Не совсем</b><p>' + rich(Q.options[q.answer].no || '') + '</p><p><span class="tr-why__label">Правильно:</span> ' + rich(correct.t) + '. ' + rich(Q.why) + '</p>' +
          '<p class="tr-why__again">Этот вопрос повторится в конце теста.</p></div>';
    }
    var last = q.pos + 1 >= q.queue.length;
    root.innerHTML = top('Тест', label) +
      '<main class="tr-main tr-main--narrow"><div class="tr-qhead"><span class="eyebrow">' + esc(label) + '</span>' + (repeat ? '<span class="tr-qchip">закрепляем</span>' : '') + '</div>' +
      '<h2 class="tr-q">' + rich(Q.q) + '</h2><div class="tr-opts' + (answered ? ' is-locked' : '') + '">' + opts2 + '</div>' + why + '</main>' +
      bar(answered ? '<button type="button" class="btn btn--primary btn--lg" data-act="qnext">' + (last ? 'Завершить тест' : 'Следующий вопрос') + '</button>'
        : '<p class="tr-note" style="flex:1;align-self:center">Выберите один ответ</p>', true);
    if (answered) requestAnimationFrame(function () { var w = root.querySelector('.tr-why'); if (w) w.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); });
  }

  function renderDone() {
    var q = st.quiz || { first: {}, wrongs: 0 };
    var firstOk = D.quiz.filter(function (x, i) { return q.first[i] === true; }).length;
    root.innerHTML =
      '<main class="tr-main tr-main--narrow"><div class="tr-done"><span class="tr-done__circle" aria-hidden="true">✓</span><h1 class="h-screen">' + esc(D.finish.title) + '</h1>' +
      '<p>' + rich(D.finish.text) + '</p><div class="tr-stats"><div><b>' + firstOk + ' из ' + QN + '</b><small>верно с первого раза</small></div>' +
      '<div><b>' + STEPS + '</b><small>' + plural(STEPS, ['шаг пройден', 'шага пройдено', 'шагов пройдено']) + '</small></div></div></div></main>' +
      bar('<button type="button" class="btn btn--ghost btn--lg" data-act="restart-yes">Ещё раз</button><button type="button" class="btn btn--primary btn--lg" data-act="finish">Начать работу</button>', true);
    confetti();
  }

  function confetti() {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var box = document.createElement('div');
    box.className = 'tr-confetti';
    var colors = ['#f7611e', '#225d2f', '#fccf00', '#f5355a', '#7e9c02'];
    for (var i = 0; i < 70; i++) {
      var p = document.createElement('i');
      p.style.left = Math.random() * 100 + '%';
      p.style.background = colors[i % colors.length];
      p.style.animationDuration = (1.8 + Math.random() * 1.6) + 's';
      p.style.animationDelay = (Math.random() * .6) + 's';
      box.appendChild(p);
    }
    root.appendChild(box);   // внутри обучения: в окне приложения оно поверх всего
    setTimeout(function () { box.remove(); }, 4200);
  }

  function toast(text) {
    var t = document.createElement('div');
    t.className = 'tr-toast';
    t.textContent = text;
    root.appendChild(t);
    setTimeout(function () { t.remove(); }, 3600);
  }

  // ====================================================================== Действия
  function go(phase, step) {
    st.phase = phase;
    if (step != null) st.step = step;
    tipOpen = -1;
    askRestart = false;
    save();
    render();
    toTop();
  }

  function onClick(e) {
    var hot = e.target.closest('[data-hot]');
    if (hot && st.phase === 'tour') {
      var i = Number(hot.getAttribute('data-hot'));
      if (tipOpen >= 0 && tipOpen !== i) markSeen(tipOpen);
      tipOpen = tipOpen === i ? -1 : i;
      if (tipOpen < 0) markSeen(i);
      render();
      return;
    }
    var opt = e.target.closest('[data-opt]');
    if (opt && st.phase === 'quiz') {
      var q = st.quiz;
      if (q.answer >= 0) return;
      var oi = Number(opt.getAttribute('data-opt'));
      var qi = q.queue[q.pos];
      var ok = !!D.quiz[qi].options[oi].ok;
      q.answer = oi;
      if (!(qi in q.first)) q.first[qi] = ok;
      if (!ok) { q.wrongs++; q.queue.push(qi); }   // неверно — вопрос повторится в конце
      save();
      render();
      return;
    }
    var act = e.target.closest('[data-act]');
    if (!act) {
      // Нажатие мимо — закрыть пояснение
      if (tipOpen >= 0 && !e.target.closest('.tr-tip')) { markSeen(tipOpen); tipOpen = -1; render(); }
      return;
    }
    var a = act.getAttribute('data-act');
    if (a === 'begin') return go('tour', 0);
    if (a === 'resume') return go(st.quiz ? 'quiz' : 'tour');
    if (a === 'restart') { askRestart = true; render(); return; }
    if (a === 'restart-no') { askRestart = false; render(); return; }
    if (a === 'restart-yes') { st = fresh(); return go('start', 0); }
    if (a === 'close') { if (opts.onClose) opts.onClose(); return; }
    if (a === 'tipnext') {
      markSeen(tipOpen);
      tipOpen = nextUnseenIdx(tipOpen);
      render();
      return;
    }
    if (a === 'next') {
      if (!allSeen(st.step)) return;
      if (st.step + 1 < STEPS) return go('tour', st.step + 1);
      return go('quizIntro');
    }
    if (a === 'back') {
      if (st.phase === 'quizIntro') return go('tour', STEPS - 1);
      if (st.step > 0) return go('tour', st.step - 1);
      return go('start');
    }
    if (a === 'quizgo') return go('quiz');
    if (a === 'qnext') {
      var qq = st.quiz;
      qq.pos++;
      qq.answer = -1;
      qq.perm = null;
      if (qq.pos >= qq.queue.length) return go('done');
      save();
      render();
      toTop();
      return;
    }
    if (a === 'finish') {
      if (opts.onFinish) opts.onFinish({ firstOk: D.quiz.filter(function (x, i) { return st.quiz && st.quiz.first[i] === true; }).length, total: QN });
      else toast(D.finish.toast || 'В приложении здесь откроется рабочий экран.');
    }
  }
  function onKey(e) {
    if (e.key === 'Escape' && tipOpen >= 0) { markSeen(tipOpen); tipOpen = -1; render(); }
  }

  root.addEventListener('click', onClick);
  document.addEventListener('keydown', onKey);
  render();
  return {
    destroy: function () { root.removeEventListener('click', onClick); document.removeEventListener('keydown', onKey); root.innerHTML = ''; },
    reset: function () { st = fresh(); save(); },
  };
}

<script type="text/x-template" id="tpl-training">
  <div v-if="state.open" ref="box" class="mf-tr-overlay" role="dialog" aria-modal="true" aria-label="Обучение">
    <div v-if="state.loading" class="mf-tr-state" aria-busy="true">
      <span class="spinner"></span><b>Загружаем обучение…</b><small>Обычно несколько секунд</small>
    </div>
    <div v-else-if="state.error" class="mf-tr-state">
      <div class="banner banner--error" role="alert"><svg class="icon icon--sm"><use href="#i-alert"></use></svg><span class="banner__text">{{ state.error }}</span></div>
      <button type="button" class="btn btn--primary" @click="load">Повторить</button>
      <button v-if="!state.required" type="button" class="btn btn--ghost" @click="close">Закрыть</button>
    </div>
    <div ref="host"></div>
    <div v-if="state.saving || state.saveError" class="banner mf-tr-save" :class="state.saveError ? 'banner--error' : 'banner--info'" role="status">
      <span v-if="state.saving" class="spinner"></span><svg v-else class="icon icon--sm"><use href="#i-alert"></use></svg>
      <span class="banner__text">{{ state.saving ? 'Сохраняем…' : state.saveError }}</span>
      <button v-if="state.saveError" type="button" class="btn btn--secondary" @click="finish(lastStats)">Повторить</button>
    </div>
  </div>

<script>
(function (C) {
  if (!C) return;

  const { reactive, ref, watch, nextTick } = Vue;
  const { store, callApi } = C;

  const state = reactive({ open: false, required: false, loading: false, error: '', saving: false, saveError: '', kind: '' });
  const box = ref(null);
  const host = ref(null);
  const cache = {};   // вид обучения → данные (до перезагрузки страницы)
  let run = null;
  let lastStats = null;

  const kindFor = () => (store.user && store.user.role === 'point' ? 'point' : 'admin');

  // Не пройдено — открыть обязательным. true — обучение открыто (новости подождут)
  function gate() {
    if (!state.open && store.phase === 'app' && store.training && !store.training.done) open({ required: true });
    return state.open;
  }

  function open(o) {
    if (state.open) return;
    Object.assign(state, { open: true, required: !!(o && o.required), loading: true, error: '', saving: false, saveError: '', kind: kindFor() });
    document.documentElement.classList.add('mf-tr-open');
    load();
  }

  function close() {
    if (run) { run.destroy(); run = null; }
    state.open = false;
    document.documentElement.classList.remove('mf-tr-open');
    if (C.news) C.news.openUnread();   // отложенные новости — после обучения
  }

  async function load() {
    Object.assign(state, { loading: true, error: '' });
    try {
      if (!cache[state.kind]) {
        const r = await callApi('training.data', { kind: state.kind });
        cache[state.kind] = JSON.parse(r.json);
      }
      state.loading = false;
      await nextTick();
      start(cache[state.kind]);
    } catch (e) {
      state.loading = false;
      if (e.code !== 'AUTH') state.error = 'Обучение не загрузилось: ' + (e.message || 'нет связи') + '. Проверьте интернет и нажмите «Повторить».';
    }
  }

  function start(data) {
    if (!host.value) return;
    if (run) run.destroy();
    const key = 'mf-training:' + (store.user ? store.user.login : '') + ':' + data.role + ':v' + data.version;
    // Пройденное открыли снова — с начала, а не с экрана «Пройдено»
    try { if ((JSON.parse(localStorage.getItem(key) || 'null') || {}).phase === 'done') localStorage.removeItem(key); } catch (e) { /* без сохранения */ }
    run = window.MFTraining(host.value, data, {
      scroller: box.value,
      key,
      closable: !state.required,
      onClose: close,
      onFinish: finish,
    });
  }

  // «Начать работу»: отметить на сервере и закрыть. Не сохранилось — обучение остаётся открытым с «Повторить»
  async function finish(stats) {
    lastStats = stats || lastStats;
    Object.assign(state, { saving: true, saveError: '' });
    try {
      store.training = await callApi('training.done', lastStats || {});
      state.saving = false;
      close();
    } catch (e) {
      state.saving = false;
      if (e.code !== 'AUTH') state.saveError = 'Не удалось сохранить, что обучение пройдено: ' + (e.message || 'нет связи');
    }
  }

  // Вышли из учётной записи — окно закрывается
  watch(() => store.phase, p => { if (p !== 'app' && state.open) { if (run) { run.destroy(); run = null; } state.open = false; document.documentElement.classList.remove('mf-tr-open'); } });

  const TrainingOverlay = {
    template: '#tpl-training',
    setup() {
      return { state, box, host, load, close, finish, lastStats };
    },
  };

  // current — данные открытого обучения (сценарии проверки)
  C.training = { TrainingOverlay, open, close, gate, state, current: () => cache[state.kind] || null };

})(window.MFC);
</script>

        <users-view v-else-if="store.view === 'users'"></users-view>
        <settings-view v-else-if="store.view === 'settings'"></settings-view>
        <journal-view v-else-if="store.view === 'journal'"></journal-view>
        <packaging-view v-else-if="store.view === 'packaging'"></packaging-view>
        <salad-view v-else-if="store.view === 'salad'"></salad-view>
        <autoplan-view v-else-if="store.view === 'autoplan'"></autoplan-view>
        <more-view v-else-if="store.view === 'more'" :items="nav.more" :theme="store.theme"
                   @go="go" @theme="toggleTheme" @logout="confirmLogout = true"></more-view>
        <placeholder-view v-else :key="store.view" :screen="currentScreen"></placeholder-view>
      </main>
    </div>

    <nav class="bottom-nav" :style="{ gridTemplateColumns: 'repeat(' + bottomItems.length + ', 1fr)' }">
      <a v-for="item in bottomItems" :key="item.id" href="#" class="bottom-nav__item"
         :class="{ 'bottom-nav__item--active': activeBottom === item.id }" @click.prevent="go(item.id)">
        <span class="bottom-nav__pill"><svg class="icon"><use :href="'#i-' + item.icon"></use></svg></span>
        {{ item.short || item.title }}
      </a>
    </nav>

    <div v-if="isPoint" class="modal-backdrop" :class="{ 'is-open': helpMenu }" @click.self="helpMenu = false">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="help-menu-title">
        <h2 class="modal__title" id="help-menu-title">Помощь</h2>
        <div class="wa-more">
          <button v-for="item in nav.help" :key="item.id" type="button" class="wa-more__item" @click="helpMenu = false; go(item.id)">
            <svg class="icon"><use :href="'#i-' + item.icon"></use></svg>{{ item.title }}
            <svg class="icon icon--sm wa-more__chevron"><use href="#i-chevron-right"></use></svg>
          </button>
        </div>
        <div class="modal__actions">
          <button type="button" class="btn btn--ghost" @click="helpMenu = false">Закрыть</button>
        </div>
      </div>
    </div>

    <div class="modal-backdrop" :class="{ 'is-open': supportOpen }" @click.self="supportOpen = false">
      <div class="modal wa-support" role="dialog" aria-modal="true" aria-labelledby="support-title">
        <h2 class="modal__title" id="support-title">Поддержка</h2>
        <p class="modal__text">Что-то не работает или непонятно — позвоните, поможем разобраться.</p>
        <div class="wa-support__card">
          <span class="user-avatar">ММ</span>
          <div class="wa-support__who">
            <b>{{ SUPPORT.name }}</b>
            <a class="wa-support__phone" :href="'tel:' + SUPPORT.tel">{{ SUPPORT.phone }}</a>
          </div>
          <button type="button" class="btn btn--icon" @click="copyPhone" :aria-label="copied ? 'Номер скопирован' : 'Скопировать номер'">
            <svg class="icon"><use :href="copied ? '#i-check' : '#i-copy'"></use></svg>
          </button>
        </div>
        <input ref="phoneEl" class="visually-hidden" :value="SUPPORT.phone" readonly tabindex="-1" aria-hidden="true">
        <p v-if="copied" class="wa-hint">Номер скопирован</p>
        <div class="modal__actions">
          <button type="button" class="btn btn--ghost" @click="supportOpen = false">Закрыть</button>
          <a class="btn btn--primary" :href="'tel:' + SUPPORT.tel"><svg class="icon icon--sm"><use href="#i-phone"></use></svg>Позвонить</a>
        </div>
      </div>
    </div>

    <div class="modal-backdrop" :class="{ 'is-open': confirmLogout }" @click.self="confirmLogout = false">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="logout-title">
        <h2 class="modal__title" id="logout-title">Выйти из приложения?</h2>
        <p v-if="hasDevice" class="modal__text">Это устройство перестанет входить автоматически — для входа понадобится пароль.</p>
        <p v-if="OFFLINE && journalWaiting" class="modal__text"><b>Не отправлено действий: {{ journalWaiting }}.</b> Они останутся на этом устройстве и уйдут, когда вы снова войдёте.</p>
        <div class="modal__actions">
          <button type="button" class="btn btn--ghost" @click="confirmLogout = false">Отмена</button>
          <button type="button" class="btn btn--danger" @click="logout">Выйти</button>
        </div>
      </div>
    </div>

    <!-- Журнал: действия в очереди на отправку и не принятые сервером (OFFLINE, ui_core: outbox) -->
    <div v-if="OFFLINE" class="modal-backdrop" :class="{ 'is-open': outbox.open }" @click.self="outbox.open = false">
      <div class="modal wa-journal" role="dialog" aria-modal="true" aria-labelledby="journal-title">
        <h2 class="modal__title" id="journal-title">{{ journalFailed ? 'Не принято и не отправлено' : 'Не отправлено' }}</h2>
        <p class="modal__text">{{ store.offline ? 'Нет интернета. Действия сохранены на этом устройстве и уйдут сами, как только появится связь — приложение можно закрывать.' : 'Действия уходят на сервер по очереди, в том порядке, в каком их сделали.' }}</p>
        <div class="wa-journal__list">
          <div v-for="o in journalOps" :key="o.id" class="wa-journal__row" :class="'is-' + o.state">
            <span class="wa-journal__time">{{ timeOf(o.at) }}</span>
            <span class="wa-journal__main"><b>{{ o.label }}</b><small>{{ [pointName(o.tt), stateText(o)].filter(Boolean).join(' · ') }}</small></span>
            <button v-if="o.state === 'fail'" type="button" class="btn btn--ghost wa-journal__x" @click="cancelOp(o.id)">Убрать</button>
          </div>
          <div v-if="saladWaiting" class="wa-journal__row">
            <span class="wa-journal__time">—</span>
            <span class="wa-journal__main"><b>Салат-база: {{ saladWaiting }} {{ plural(saladWaiting, ['изменение', 'изменения', 'изменений']) }}</b><small>уйдут сами, когда раздел «Салат-база» открыт и есть связь</small></span>
          </div>
          <p v-if="!journalOps.length && !saladWaiting" class="modal__text">Всё отправлено.</p>
        </div>
        <div class="modal__actions">
          <button type="button" class="btn btn--ghost" @click="outbox.open = false">Закрыть</button>
          <button type="button" class="btn btn--primary" :disabled="outbox.busy || !journalWaiting" @click="sendNow">{{ outbox.busy ? 'Отправляем…' : 'Отправить сейчас' }}</button>
        </div>
      </div>
    </div>

    <!-- Новости: слайды непрочитанных при входе (ui_news.html) -->
    <news-stories></news-stories>
    <!-- Обучение: при первом входе — раньше всего приложения (ui_training.html) -->
    <training-overlay></training-overlay>
    <!-- «Исправили ошибку» в салат-базе: 26–28.10 при входе, после обучения и новостей (ui_admin.html) -->
    <salad-notice></salad-notice>

  </div>
</script>

<script type="text/x-template" id="tpl-placeholder">

<script type="text/x-template" id="tpl-more">
  <div class="page">
    <div class="page-head">
      <h1 class="h-screen page-head__title">Ещё</h1>
    </div>
    <div class="wa-more">
      <button v-for="item in items" :key="item.id" type="button" class="wa-more__item" @click="$emit('go', item.id)">
        <svg class="icon"><use :href="'#i-' + item.icon"></use></svg>{{ item.title }}
        <svg class="icon icon--sm wa-more__chevron"><use href="#i-chevron-right"></use></svg>
      </button>
      <button type="button" class="wa-more__item wa-more__item--danger" @click="$emit('logout')">
