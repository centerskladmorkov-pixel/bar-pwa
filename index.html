            <div v-if="gmPending" class="wa-gm__apply">
              <p><b>Цифры в листе пока прежние.</b> План недели уже в листе «Блюда», а ИИ-план — только в расчёте.
                В таблице ниже новая цифра стоит рядом со старой: <span class="wa-ap-gm-to">→6</span>.</p>
              <button type="button" class="btn btn--primary" :class="{ 'is-loading': applying }" :disabled="applying" @click="ask = 'gemma'">
                Применить ИИ-план · {{ gmPending }} {{ plural(gmPending, ['позиция', 'позиции', 'позиций']) }}
              </button>
            </div>
          </template>
          <p v-else class="wa-hint">{{ gm.old ? 'Ответ Gemma старого вида — составьте ИИ-план заново. ' : '' }}ИИ-план: основа — та же неделя год назад, динамика — прошлая неделя
            к ней же год назад. Gemma оценит <template v-if="gm.weather">погоду{{ gm.city ? ' (' + gm.city + ')' : '' }} по трём неделям истории и прогнозу, </template>праздники, заметки и разовые всплески<template v-if="!gm.weather"> — погода отключена в «Настройках»</template>.
            Пока ИИ-плана нет — в расчёте «большее из двух». Обычно до минуты.</p>
          <label class="field field--sm wa-gm__notes">
            <span class="field__label">Заметки для Gemma на эту неделю</span>
            <textarea class="field__input" rows="2" maxlength="1500" v-model="notes" @blur="saveNotes"
                      placeholder="Например: акция 2+1 на смузи 14–16 октября; добавь новинку Сок Томат-Яблоко-Сельдерей, 250 мл — минимум 3 на точку"></textarea>
            <span class="field__hint">Акции, события, ремонт, закрытия, новинки. Новинка должна быть в справочнике блюд: Gemma подберёт похожее блюдо,
              план — его доля, не меньше минимума. После правки нажмите «Составить заново».</span>
          </label>
          <p v-if="gm.rec && notesChanged" class="wa-hint">Заметки изменились после ответа — составьте ИИ-план заново.</p>
          <div v-if="gemmaError" class="banner banner--error" role="alert">
            <svg class="icon icon--sm"><use href="#i-alert"></use></svg><span class="banner__text">{{ gemmaError }}</span>
          </div>
          <button type="button" class="btn btn--secondary wa-gm__ask" :class="{ 'is-loading': asking }" :disabled="asking || loading" @click="askGemma">
            {{ asking ? 'Gemma думает…' : gm.rec ? 'Составить заново' : 'Составить ИИ-план' }}
          </button>
        </template>
      </section>

      <div v-if="chg" class="banner banner--info wa-ai-filter" role="status">
        <span class="banner__text">Показаны блюда, где ИИ {{ chg === 'up' ? 'увеличил' : 'уменьшил' }} план</span>
        <button type="button" class="btn btn--secondary" @click="chg = ''">Показать все</button>
      </div>

      <!-- У точки — сколько штук в плане: на ПК — за неделю, на телефоне — за выбранный день (как итог ниже) -->
      <div class="chips wa-pt-chips" role="group" aria-label="Точка">
        <button v-for="p in data.points" :key="p.tt" type="button" class="chip" :aria-pressed="pt === p.tt" :title="p.name" @click="pt = p.tt">
          {{ p.emoji || '🥕' }}<span class="wa-chip-name">&nbsp;{{ p.name }}</span><span class="chip__count wa-ap-cnt-week" title="шт за неделю">{{ pointTotals[p.tt].week }}</span><span class="chip__count wa-ap-cnt-day" title="шт за день">{{ pointTotals[p.tt].days[day] }}</span>
        </button>
      </div>

      <!-- Блюдо, которого нет в плане: сначала строка, потом цифры по дням (в днях «в плане») -->
      <div v-if="point && data.days[6] >= store.today" class="wa-ap-addrow">
        <button type="button" class="btn btn--ghost wa-ap-add" @click="openAdd"><svg class="icon icon--sm"><use href="#i-plus"></use></svg>Добавить блюдо</button>
        <small v-if="!inPlan.some(Boolean)" class="wa-hint">Цифры ставятся в днях «в плане» — сначала отправьте план недели</small>
      </div>

      <div v-if="point && !prows.length" class="card">
        <div class="empty-state">
          <img class="empty-state__art" :src="asset('leaf-pair')" alt="">
          <div class="empty-state__title">Плана нет</div>
          <div class="empty-state__text">У активных блюд точки не было продаж и списаний ни на прошлой неделе, ни год назад.</div>
        </div>
      </div>

      <template v-else-if="point">
        <!-- ПК и планшет: блюда × дни -->
        <div class="table-wrap wa-ap-table">
          <table class="data-table">
            <thead>
              <tr>
                <th>Блюдо</th>
                <th v-for="(d, i) in data.days" :key="d" class="is-num" :class="{ 'wa-ap-th--plan': inPlan[i] }">
                  {{ WD[i] }}<small class="wa-ap-th-date">{{ inPlan[i] ? 'в плане' : dm(d) }}</small>
                </th>
                <th class="is-num">Неделя</th>
              </tr>
            </thead>
            <tbody>
              <!-- Итоги: точка и вся сеть — штук по дням и за неделю -->
              <tr class="wa-ap-totalrow">
                <td><b>Всего блюд</b> <span class="is-muted">· {{ prows.length }} {{ plural(prows.length, ['позиция', 'позиции', 'позиций']) }}</span></td>
                <td v-for="(d, i) in data.days" :key="d" class="is-num">{{ dayTotals[i] }}</td>
                <td class="is-num">{{ weekTotal }}</td>
              </tr>
              <tr v-if="data.points.length > 1" class="wa-ap-netrow">
                <td>Все точки</td>
                <td v-for="(d, i) in data.days" :key="d" class="is-num">{{ netTotals.days[i] }}</td>
                <td class="is-num">{{ netTotals.week }}</td>
              </tr>
              <template v-for="g in groups" :key="g.name">
                <tr class="wa-plan-grouprow wa-ap-grouprow">
                  <td>{{ g.name }} <span class="wa-ap-grouprow__n">· {{ g.rows.length }}</span></td>
                  <td v-for="(d, i) in data.days" :key="d" class="is-num">{{ groupDay(g, i) || '' }}</td>
                  <td class="is-num">{{ groupWeek(g) }}</td>
                </tr>
                <tr v-for="r in g.rows" :key="r.name">
                  <td :data-row="r.name"><b>{{ r.name }}</b><span v-if="r.newDish" class="wa-ap-new">новинка</span><span v-if="r.added" class="wa-ap-added">добавлено</span> <span v-if="r.unit" class="is-muted">· {{ r.unit }}</span>
                    <button v-if="r.added && !total(r)" type="button" class="wa-ap-unadd" :aria-label="'Убрать ' + r.name" @click="unadd(r)"><svg class="icon"><use href="#i-x"></use></svg></button>
                    <button v-else-if="canRemove" type="button" class="wa-ap-del" title="Убрать из плана и заблокировать" :aria-label="'Убрать из плана ' + r.name" @click.stop="askRemove(r)"><svg class="icon"><use href="#i-delete"></use></svg></button></td>
                  <td v-for="(c, i) in r.cells" :key="i" class="is-num wa-ap-cell"
                      :class="[{ 'is-muted': !value(r, i), 'is-plan': inPlan[i], 'is-edit': canEdit(r, i), 'is-done': isDone(r, i), 'is-changed': inPlan[i] && value(r, i) !== c[0], 'is-gemma': c[6] != null }, dirCls(aiDir(r, i))]"
                      :title="whyFull(r, i)" @click="startEdit(r, i)">
                    <input v-if="isEditing(r, i)" class="wa-ap-input" inputmode="numeric" v-model="edit.value"
                           @keydown.enter.prevent="saveEdit" @keydown.esc="edit.key = ''" @blur="saveEdit" v-focus>
                    <template v-else><small v-if="wasMax(r, i) !== null" class="wa-ap-was" title="«Большее из двух»">{{ wasMax(r, i) }}</small>{{ value(r, i) || '—' }}<small v-if="gemmaTo(r, i) !== null" class="wa-ap-gm-to">→{{ gemmaTo(r, i) }}</small></template>
                  </td>
                  <td class="is-num num">{{ total(r) }}</td>
                </tr>
              </template>
            </tbody>
          </table>
          <div class="data-table__foot"><svg class="icon icon--sm"><use href="#i-pencil"></use></svg>Наведите на цифру — из чего она посчитана<template v-if="aiOn">; маленькая серая цифра — «большее из двух», ▲/▼ — что изменил ИИ</template>. В днях «в плане» цифру можно изменить: нажмите на неё.</div>
        </div>

        <!-- Телефон: день → список с пояснением -->
        <div class="wa-ap-phone">
          <div class="chips wa-day-chips" role="group" aria-label="День">
            <button v-for="(d, i) in data.days" :key="d" type="button" class="chip" :aria-pressed="day === i" @click="day = i">
              <b>{{ WD[i] }}</b><small>{{ d.slice(8, 10) }}</small>
            </button>
          </div>
          <div class="card wa-ap-total">
            <span class="wa-ap-total__label">Всего блюд<small>{{ MF.day(data.days[day]) }}{{ inPlan[day] ? ' · в плане' : aiOn ? ' · ИИ-план' : ' · расчёт' }}</small></span>

            <span class="wa-ap-total__meta">{{ dayRows.length }} {{ plural(dayRows.length, ['позиция', 'позиции', 'позиций']) }}<template v-if="aiOn && !inPlan[day]"> · статистика {{ dayMaxTotal }}</template><template v-if="data.points.length > 1"> · все точки {{ netTotals.days[day] }} шт</template></span>
          </div>
          <p v-if="inPlan[day] && data.days[day] >= store.today" class="wa-hint">Чтобы изменить план, нажмите на цифру.</p>
          <div class="wa-plan-list">
            <section v-for="g in dayGroups" :key="g.name" class="wa-plan-group">
              <div class="eyebrow wa-plan-group__title"><span>{{ g.name }}</span><span>{{ g.total }} шт · {{ g.rows.length }}</span></div>
              <div v-for="r in g.rows" :key="r.name" class="wa-plan-item" :class="dirCls(aiDir(r, day))" :data-row="r.name">
                <div class="wa-plan-item__head">
                  <b>{{ r.name }}<span v-if="r.newDish" class="wa-ap-new">новинка</span><span v-if="r.added" class="wa-ap-added">добавлено</span>
                    <button v-if="r.added && !total(r)" type="button" class="wa-ap-unadd" :aria-label="'Убрать ' + r.name" @click="unadd(r)"><svg class="icon"><use href="#i-x"></use></svg></button></b>
                  <input v-if="isEditing(r, day)" class="wa-ap-input wa-ap-input--lg" inputmode="numeric" v-model="edit.value"
                         @keydown.enter.prevent="saveEdit" @keydown.esc="edit.key = ''" @blur="saveEdit" v-focus>
                  <button v-else type="button" class="wa-plan-item__total wa-ap-num" :class="{ 'is-edit': canEdit(r, day) }"
                          :disabled="!canEdit(r, day)" @click="startEdit(r, day)"><small v-if="wasMax(r, day) !== null" class="wa-ap-was">{{ wasMax(r, day) }}</small>{{ value(r, day) }}<small v-if="gemmaTo(r, day) !== null" class="wa-ap-gm-to">→{{ gemmaTo(r, day) }}</small><small>{{ r.unit }}</small></button>
                </div>

                  <small class="wa-ap-why">{{ why(r, day) }}</small>

                </div>
                <button v-if="aiOn && r.ai" type="button" class="wa-link wa-ap-whybtn" @click="toggleWhy(r)">{{ isOpen(r) ? 'Скрыть' : 'Почему так?' }}</button>
                <ul v-if="isOpen(r)" class="wa-ap-reasons"><li v-for="(t, n) in whyMore(r, day)" :key="n">{{ t }}</li></ul>
              </div>
            </section>
          </div>
        </div>
      </template>

      <!-- Продавались, но заблокированы: по умолчанию — только группы бара -->
      <section v-if="data.blocked.length" class="card card--pad wa-ap-blocked">
        <div>
          <b class="wa-set-card__title">Продавались, но заблокированы · {{ blockedList.length }}</b>

            <template v-if="!shopToo">Показаны группы, где уже есть блюда в автоплане.</template></p>
          <button v-if="shopCount" type="button" class="wa-link" @click="shopToo = !shopToo">
            {{ shopToo ? 'Скрыть товары магазина' : 'Показать товары магазина · ' + shopCount }}
          </button>
        </div>
        <p v-if="!blockedList.length" class="wa-hint">В группах бара заблокированных с продажами нет.</p>
        <div v-for="b in blockedShown" :key="b.name" class="wa-ap-brow">
          <span class="wa-ap-brow__name">
            <b>{{ b.name }}</b>

          </span>
          <button type="button" class="btn btn--secondary" :class="{ 'is-loading': busy === b.name }"
                  :disabled="!!b.on || !!busy" @click="activate(b)">{{ b.on ? 'Включено' : 'Включить' }}</button>
        </div>
        <button v-if="blockedList.length > blockedShown.length" type="button" class="wa-link" @click="showAll = true">
          Показать все {{ blockedList.length }}
        </button>
      </section>

    <div class="modal-backdrop" :class="{ 'is-open': addOpen }" @click.self="addOpen = false">
      <div class="modal wa-ap-pick" role="dialog" aria-modal="true" aria-labelledby="ap-add-title">
        <h2 class="modal__title" id="ap-add-title">Добавить блюдо</h2>
        <p class="modal__text">{{ addAll ? 'Все точки' : point ? (point.emoji ? point.emoji + ' ' : '') + point.name : '' }} · {{ weekLabel }}. {{ addAll ? 'Строка появится у каждой точки — цифры ставятся у каждой точки по дням.' : 'Строка появится в плане — цифры поставьте по дням.' }}</p>
        <div class="tabs wa-seg wa-ap-pick__to" role="radiogroup" aria-label="Куда добавить">
          <button type="button" class="tabs__tab" role="radio" :aria-checked="!addAll" :aria-selected="!addAll" @click="addAll = false">Только эта точка</button>
          <button type="button" class="tabs__tab" role="radio" :aria-checked="addAll" :aria-selected="addAll" @click="addAll = true">Во все точки</button>
        </div>
        <label class="field field--sm">
          <span class="visually-hidden">Поиск</span>
          <span class="field__control">
            <svg class="icon icon--sm field__icon"><use href="#i-search"></use></svg>
            <input ref="addInput" class="field__input field__input--with-icon" type="search" v-model="addQuery" placeholder="Начните вводить название">
          </span>
        </label>
        <div v-if="!dishDir" class="wa-center"><span class="spinner"></span></div>
        <div v-else class="wa-more wa-ap-pick__list">
          <button v-for="d in addOptions" :key="d.name" type="button" class="wa-more__item" @click="pickDish(d)">

          </button>
          <p v-if="!addOptions.length" class="wa-hint wa-center">Ничего не нашлось</p>
        </div>
        <div class="modal__actions">
          <button type="button" class="btn btn--ghost" @click="addOpen = false">Закрыть</button>
        </div>
      </div>
    </div>

    <!-- «Во все точки»: одно количество — каждой точке на выбранные дни (в днях с отправленным планом) -->
    <div class="modal-backdrop" :class="{ 'is-open': qa.open }" @click.self="qa.open = false">
      <div v-if="qa.dish" class="modal wa-ap-qa" role="dialog" aria-modal="true" aria-labelledby="ap-qa-title">
        <h2 class="modal__title" id="ap-qa-title">«{{ qa.dish.name }}» — в план всех точек</h2>
        <p class="modal__text">Одна цифра — каждой точке на каждый выбранный день. Потом её можно поправить у любой точки.</p>
        <label class="field field--sm"><span class="field__label">Сколько на точку в день{{ qa.dish.unit ? ', ' + qa.dish.unit : '' }}</span>
          <input ref="qaInput" class="field__input" inputmode="decimal" v-model="qa.amount" placeholder="Например, 3" @keydown.enter.prevent="qaSave"></label>
        <div class="field">
          <span class="field__label">Дни</span>
          <div class="chips wa-chips-wrap wa-ap-qa__days" role="group" aria-label="Дни">
            <button v-for="x in qaDays" :key="x.d" type="button" class="chip" :aria-pressed="qa.days.includes(x.i) ? 'true' : 'false'" :disabled="!x.ok" @click="qaToggle(x.i)">{{ WD[x.i] }} {{ dm(x.d) }}</button>
          </div>
          <span class="field__hint">{{ qaHint }}</span>
        </div>
        <p v-if="qa.error" class="wa-hint is-warn" role="alert">{{ qa.error }}</p>
        <div class="modal__actions">
          <button type="button" class="btn btn--ghost" :disabled="qa.busy" @click="qaSkip">Без цифр</button>
          <button type="button" class="btn btn--primary" :class="{ 'is-loading': qa.busy }" :disabled="qa.busy || !qa.days.length" @click="qaSave">Поставить в план</button>
        </div>
      </div>
    </div>

    <div class="modal-backdrop" :class="{ 'is-open': !!sc.kind }" @click.self="sc.kind = ''">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="ap-sc-title">
        <h2 class="modal__title" id="ap-sc-title">{{ scTitle }}</h2>
        <p class="modal__text">{{ scText }}</p>
        <div class="wa-ap-scope" role="radiogroup" aria-label="Точки">
          <button type="button" class="wa-ap-scope__opt" role="radio" :aria-checked="!sc.all" @click="sc.all = false">
            <b>Только {{ point ? (point.emoji ? point.emoji + ' ' : '') + point.name : '' }}</b><small>{{ sc.kind === 'remove' ? 'у остальных точек блюдо останется' : 'у остальных точек статус не изменится' }}</small>

          <button type="button" class="wa-ap-scope__opt" role="radio" :aria-checked="sc.all" @click="sc.all = true">
            <b>Во всех точках</b><small>{{ sc.kind === 'remove' ? 'убрать у всех и заблокировать везде' : sc.kind === 'add' ? 'включить везде и добавить строку каждой точке' : 'включить в автоплан везде' }}</small>
          </button>
        </div>
        <div class="modal__actions">
          <button type="button" class="btn btn--ghost" @click="sc.kind = ''">Отмена</button>
          <button type="button" class="btn" :class="sc.kind === 'remove' ? 'btn--danger' : 'btn--primary'" @click="scopeGo">{{ sc.kind === 'remove' ? 'Убрать' : sc.kind === 'add' ? 'Включить и добавить' : 'Включить' }}</button>
        </div>
      </div>
    </div>

    <div class="modal-backdrop" :class="{ 'is-open': !!ask }" @click.self="ask = ''">

        <!-- План можно отправить всей сети или одной точке -->
        <div v-if="ask && ask !== 'gemma' && data" class="wa-ap-scope" role="radiogroup" aria-label="Точки">
          <button type="button" class="wa-ap-scope__opt" role="radio" :aria-checked="!scope" @click="scope = ''">
            <b>Все точки</b><small>{{ scopeAllNote }}</small>
          </button>
          <button v-for="p in data.points" :key="p.tt" type="button" class="wa-ap-scope__opt" role="radio" :aria-checked="scope === p.tt"
                  :disabled="!scopeOk(p)" @click="scope = p.tt">
            <b>{{ p.emoji || '🥕' }} {{ p.name }}</b><small>{{ scopeNote(p) }}</small>
          </button>
        </div>
        <p class="modal__text" v-if="ask === 'gemma'">{{ weekLabel }}: {{ gmPending }} {{ plural(gmPending, ['позиция', 'позиции', 'позиций']) }} плана получат цифры ИИ-плана. Остальной план и ваши правки других позиций не изменятся, отмеченные на точках — тоже.</p>
        <p class="modal__text" v-else-if="ask === 'replace'">{{ weekLabel }}: неотмеченные позиции плана {{ scopeText }} заменятся расчётом — ручные правки на эту неделю пропадут. Отмеченные на точках позиции не изменятся.</p>
        <p class="modal__text" v-else-if="ask === 'monday'">{{ MF.day(ap.week) }}: план только на понедельник уйдёт в лист «Блюда» для {{ scopeText }}, где его ещё нет.
          Остальные дни недели отправятся позже — по свежей закрытой неделе.</p>
        <p class="modal__text" v-else>{{ weekLabel }}: план уйдёт в лист «Блюда» для {{ scopeText }}. Дни, где план уже есть, не изменятся.</p>
        <div class="modal__actions">
          <button type="button" class="btn btn--ghost" @click="ask = ''">Отмена</button>
          <button v-if="ask === 'gemma'" type="button" class="btn btn--primary" @click="applyGemma">Применить</button>
          <button v-else type="button" class="btn btn--primary" @click="send(ask === 'replace', ask === 'monday')">{{ ask === 'replace' ? 'Заменить' : 'Отправить' }}</button>
        </div>
      </div>
    </div>
  </div>
</script>


<script>
(function (C) {
  if (!C) return;

  const { reactive, ref, computed, watch, onMounted, nextTick } = Vue;
  const { store, MF, plural, asset, callApi, addDays, atText } = C;
  const fmt = MF.fmt;
  const WD = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
  const EVERY = ['каждый понедельник', 'каждый вторник', 'каждую среду', 'каждый четверг', 'каждую пятницу', 'каждую субботу', 'каждое воскресенье'];
  const norm = s => String(s || '').trim().toLowerCase().replace(/\s+/g, ' ').replace(/ё/g, 'е');

  // Понедельник следующей недели
  function nextMonday(today) {
    const wd = new Date(today + 'T12:00:00Z').getUTCDay();   // 0 — воскресенье
    return addDays(today, wd === 0 ? 1 : 8 - wd);
  }

  const ap = reactive({ week: '', byWeek: {} });

  const AutoplanView = {
    template: '#tpl-autoplan',
    directives: { focus: { mounted: el => { el.focus(); if (el.select) el.select(); } } },
    setup() {
      const loading = ref(false);
      const error = ref('');
      const status = ref(null);
      const filling = ref(false);
      const fillInfo = ref('');
      const pt = ref('');
      const day = ref(0);
      const busy = ref('');
      const showAll = ref(false);
      const shopToo = ref(false);
      const ask = ref('');
      const sending = ref(false);
      const sendInfo = ref(null);
      const edit = reactive({ key: '', value: '', row: null, i: 0 });

      const data = computed(() => ap.byWeek[ap.week] || null);
      const point = computed(() => data.value ? data.value.points.find(p => p.tt === pt.value) || data.value.points[0] : null);

      const dm = d => d.slice(8, 10) + '.' + d.slice(5, 7);
      const dmy = d => dm(d) + '.' + d.slice(2, 4);
      const span = (a, b) => dm(a) + '–' + dm(b);
      const MON = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
      const weekLabel = computed(() => {
        if (!ap.week) return '';
        const end = addDays(ap.week, 6);
        const m1 = Number(ap.week.slice(5, 7)) - 1, m2 = Number(end.slice(5, 7)) - 1;
        return Number(ap.week.slice(8)) + (m1 !== m2 ? ' ' + MON[m1] : '') + ' – ' + Number(end.slice(8)) + ' ' + MON[m2];
      });

      // ---------- Что уже в листе «Блюда»: точка → блюдо → { cells, done }
      const actualOf = tt => {
        const idx = {};
        const a = data.value && data.value.actual && data.value.actual[tt];
        if (a) for (const x of Object.values(a)) idx[norm(x.name)] = x;
        return idx;
      };
      const actual = computed(() => point.value ? actualOf(point.value.tt) : {});
      const dayInPlan = (idx, i) => Object.values(idx).some(x => x.cells[i] != null);
      const inPlan = computed(() => data.value ? data.value.days.map((d, i) => dayInPlan(actual.value, i)) : []);
      const entryOf = r => actual.value[norm(r.name)] || null;

      // Строки точки: расчёт + блюда, которые есть только в плане + выбранные в «Добавить блюдо».
      // Выбранные (pinned) видны на телефоне в каждом дне, даже где цифры ещё нет: цифры ставятся по дням;
      // added — блюда, которых не было ни в расчёте, ни в плане (значок «добавлено», пока без цифр — можно убрать)
      const added = reactive({});   // «неделя|точка» → [{ name, unit, group }]
      const addedOf = tt => added[ap.week + '|' + tt] || [];
      function rowsOf(p, idx) {
        const pinned = new Set(addedOf(p.tt).map(x => norm(x.name)));
        const rows = p.rows.map(r => pinned.has(norm(r.name)) ? Object.assign({}, r, { pinned: true }) : r);
        const seen = new Set(rows.map(r => norm(r.name)));
        const zero = () => data.value.days.map(() => [0, 0, 0, 0, 0, 0]);
        for (const [k, x] of Object.entries(idx)) {
          if (seen.has(k) || !x.cells.some(v => v > 0)) continue;
          seen.add(k);
          rows.push({ name: x.name, unit: x.unit, group: x.group, extra: true, pinned: pinned.has(k), added: pinned.has(k), cells: zero() });
        }
        for (const x of addedOf(p.tt)) {
          if (seen.has(norm(x.name))) continue;
          seen.add(norm(x.name));
          rows.push({ name: x.name, unit: x.unit, group: x.group, extra: true, pinned: true, added: true, cells: zero() });
        }
        return rows;
      }
      const prows = computed(() => point.value ? rowsOf(point.value, actual.value) : []);

      // Цифра дня: в днях с планом — из листа, иначе — расчёт
      function valueIn(idx, planDays, r, i) {
        if (!planDays[i]) return r.cells[i][0];
        const e = idx[norm(r.name)];
        return e && e.cells[i] != null ? e.cells[i] : 0;
      }
      const value = (r, i) => valueIn(actual.value, inPlan.value, r, i);
      const total = r => r.cells.reduce((s, c, i) => s + value(r, i), 0);

      // Итоги — те же цифры, что в таблице: точка по дням и за неделю, у каждой точки (для её кнопки) и по сети
      function totalsOf(p) {
        const idx = actualOf(p.tt);
        const planDays = data.value.days.map((d, i) => dayInPlan(idx, i));
        const rows = rowsOf(p, idx);
        const days = data.value.days.map((d, i) => rows.reduce((s, r) => s + valueIn(idx, planDays, r, i), 0));
        return { days, week: days.reduce((s, x) => s + x, 0) };
      }
      const pointTotals = computed(() => Object.fromEntries((data.value ? data.value.points : []).map(p => [p.tt, totalsOf(p)])));
      const netTotals = computed(() => {
        const days = data.value ? data.value.days.map((d, i) => Object.values(pointTotals.value).reduce((s, t) => s + t.days[i], 0)) : [];
        return { days, week: days.reduce((s, x) => s + x, 0) };
      });
      const dayTotals = computed(() => point.value ? pointTotals.value[point.value.tt].days : []);
      const weekTotal = computed(() => point.value ? pointTotals.value[point.value.tt].week : 0);
      const groupDay = (g, i) => g.rows.reduce((s, r) => s + value(r, i), 0);
      const groupWeek = g => g.rows.reduce((s, r) => s + total(r), 0);
      const isDone = (r, i) => { const e = entryOf(r); return !!(e && e.done[i]); };
      const canEdit = (r, i) => !!(data.value && inPlan.value[i] && data.value.days[i] >= store.today && !isDone(r, i));

      const byGroup = rows => {
        const groups = [];
        for (const r of rows) {
          const name = r.group || 'Без группы';
          let g = groups.find(x => x.name === name);
          if (!g) groups.push(g = { name, rows: [] });
          g.rows.push(r);
        }
        return groups;
      };
      // Фильтр «▲ больше / ▼ меньше»: что ИИ изменил по сравнению с «большим из двух»
      const chg = ref('');
      const chgOk = (r, i) => !chg.value || (chg.value === 'up' ? aiDir(r, i) > 0 : aiDir(r, i) < 0);
      const groups = computed(() => byGroup(prows.value.filter(r => r.cells.some((c, i) => chgOk(r, i)))));
      const dayRows = computed(() => prows.value.filter(r => chgOk(r, day.value) && (r.pinned ||
        value(r, day.value) > 0 || (inPlan.value[day.value] && r.cells[day.value][0] > 0) || (aiOn.value && r.cells[day.value][6] > 0))));
      const dayMaxTotal = computed(() => dayRows.value.reduce((s, r) => s + maxOf(r, day.value), 0));
      const dayGroups = computed(() => byGroup(dayRows.value.slice().sort((a, b) => value(b, day.value) - value(a, day.value)))
        .map(g => Object.assign(g, { total: g.rows.reduce((s, r) => s + value(r, day.value), 0) })));
      const dayTotal = computed(() => dayRows.value.reduce((s, r) => s + value(r, day.value), 0));

      // ---------- Заблокированные: по умолчанию только группы бара
      const blockedList = computed(() => data.value ? data.value.blocked.filter(b => shopToo.value || b.bar !== false) : []);
      const shopCount = computed(() => data.value ? data.value.blocked.filter(b => b.bar === false).length : 0);
      const blockedShown = computed(() => showAll.value ? blockedList.value : blockedList.value.slice(0, 15));
      const emojiOf = tt => { const p = store.points.find(x => x.tt === tt); return p ? p.emoji : tt; };

      // ---------- ИИ-план: сравнение с «большим из двух» и пояснения
      const aiOn = computed(() => !!(data.value && data.value.mode === 'ai' && data.value.ai));
      const ai = computed(() => aiOn.value ? data.value.ai : null);
      const maxOf = (r, i) => { const f = r.cells[i][5]; return f > 1e-9 ? Math.ceil(f - 1e-9) : 0; };
      // +1 — ИИ увеличил, −1 — уменьшил, 0 — так же
      const aiDir = (r, i) => !aiOn.value || r.cells[i][6] == null ? 0 : Math.sign(r.cells[i][0] - r.cells[i][6]);
      const dirCls = n => n > 0 ? 'is-up' : n < 0 ? 'is-down' : '';
      // «Большее из двух» рядом с ИИ-цифрой — в днях, которых ещё нет в листе
      const wasMax = (r, i) => aiOn.value && !r.newDish && r.cells[i][6] != null && !inPlan.value[i] ? r.cells[i][6] : null;
      const pct = x => Math.round((x || 0) * 100) + '%';
      const pctText = (a, b) => !a ? '' : (b >= a ? '+' : '−') + Math.round(Math.abs(b / a - 1) * 100) + '%';
      const TYPE = { weather: 'Погода', trend: 'Динамика', calendar: 'Календарь', event: 'Событие', closed: 'Закрыто',
        closed_history: 'Не учтён день', spike: 'Разовый всплеск', question: 'Вопрос', new_dish: 'Новинка' };
      const LVL = { dish: 'по блюду', group: 'по группе точки', point: 'по всей точке', none: 'не посчитана — мало продаж' };
      const kEff = (x, date) => x.t === 'weather' ? 1 + (x.k - 1) * ((ai.value.conf || {})[date] || 0) : x.k;
      const aiWhyText = computed(() => {
        const w = data.value && data.value.aiWhy;
        return w === 'none' ? 'ИИ-план ещё не составлен' : w === 'stale' ? 'ИИ-план устарел — составьте заново' : '';
      });

      // Коротко под блюдом: «ИИ: год назад 9 × динамика 1,14 × условия 1,1 → 12 · статистика 10»
      function why(r, i) {
        if (r.added) return canEdit(r, i) ? 'Добавлено вручную — нажмите на цифру и введите количество на этот день' : 'Добавлено вручную';
        if (r.extra) return 'Есть в плане, в расчёте нет: продаж не было или блюдо заблокировано';
        const c = r.cells[i];
        const d = data.value;
        const wd = WD[i].toLowerCase();
        let s;
        if (aiOn.value && r.ai) {
          const x = r.ai.cells[i];   // [точный ИИ, план, метод, множитель, пункты, предел, основа]
          const base = { ly: 'год назад ' + fmt(x[6]) + ' × динамика ' + fmt(r.ai.R), rd: 'прошлая нед. ' + fmt(x[6]), rc: 'прошлая нед. ' + fmt(x[6]) }[x[2]];
          if (x[2] === 'cl') s = 'ИИ: точка закрыта → 0';
          else if (x[2] === 'nw') {
            s = 'ИИ: новинка — ' + (r.ai.an ? 'аналог ' + fmt(x[6]) + ' × ' + fmt(x[3]) + ' → ' + fmt(x[0]) : 'без аналога') +
              (x[1] > Math.ceil(x[0] - 1e-9) ? ' → минимум ' + x[1] : fmt(x[0]) !== String(x[1]) ? ' → ' + x[1] : '');
          } else {
            s = 'ИИ: ' + base + (x[3] !== 1 ? ' × условия ' + fmt(x[3]) : '') + ' → ' + (fmt(x[0]) !== String(x[1]) ? fmt(x[0]) + ' → ' : '') + x[1];
          }
          s += r.newDish ? ' · продаж не было' : ' · статистика ' + maxOf(r, i);
        } else {
          const part = (label, date, sold, wo) => label + ' ' + wd + ' ' + date + ': ' + fmt(sold) + (wo ? ' + ' + fmt(wo) + ' спис.' : '');
          s = part('прошлая нед.', dm(d.lwDates[i]), c[1], c[2]) + ' · ' + part('год назад', dmy(d.lyDates[i]), c[3], c[4]) +
            ' → ' + fmt(c[5]) + (c[5] !== c[0] ? ' → ' + c[0] : '');
          if (r.py && r.py[i]) s += ' (прошлая нед. год назад: ' + fmt(r.py[i]) + ')';
        }
        if (inPlan.value[i] && value(r, i) !== c[0]) s = 'в плане ' + value(r, i) + ' · расчёт: ' + s;
        if (isDone(r, i)) s += ' · отмечено на точке';
        return s;
      }

      // Подробно: основа, динамика, каждый пункт Gemma с причиной, сравнение со статистикой
      function whyMore(r, i) {
        if (!aiOn.value || !r.ai) return [];
        const a = r.ai;
        const x = a.cells[i];
        const c = r.cells[i];
        const d = data.value;
        const items = ai.value.items;
        const wd = WD[i].toLowerCase();
        const out = [];
        if (r.newDish) {
          const it = items[x[4][0]];
          out.push('Новинка из заметок: ' + it.r);
          out.push(r.ai.an ? 'Аналог «' + r.ai.an + '» на этой точке в этот день: ' + fmt(x[6]) + ' × ' + fmt(it.k) + ' = ' + fmt(x[0]) : 'Аналога на этой точке нет');
          if (it.min) out.push('Минимум на точку в день: ' + fmt(it.min));
          if (it.blocked) out.push('В автоплане блюдо заблокировано — когда начнёт продаваться, включите его, чтобы оно считалось само');
        } else if (x[2] === 'ly') {
          out.push('Основа: год назад, ' + wd + ' ' + dmy(d.lyDates[i]) + ' — ' + fmt(x[6]) + (fmt(x[6]) !== fmt(c[3] + c[4]) ? ' (всплеск заменён обычным уровнем, было ' + fmt(c[3] + c[4]) + ')' : ''));
          out.push('Динамика ×' + fmt(a.R0) + ' ' + LVL[a.lvl] + (a.lvl !== 'none' ? ': прошлая неделя ' + fmt(a.sums[0]) + ' ÷ она же год назад ' + fmt(a.sums[1]) : ''));
          if (a.tr != null) out.push('Динамика поправлена ÷' + fmt(items[a.tr].k) + ' → ×' + fmt(a.R) + ': ' + items[a.tr].r);
        } else if (x[2] === 'rd') {
          out.push('Год назад в этот день продаж не было — взят такой же день прошлой недели: ' + fmt(x[6]));
        } else if (x[2] === 'rc') {
          out.push('Год назад блюда не было — взят такой же день прошлой недели: ' + fmt(x[6]));
        }
        for (const id of x[4]) {
          const it = items[id];
          if (it.t === 'closed') { out.push('Закрыто: ' + it.r); continue; }
          if (it.t === 'new_dish') continue;
          out.push(TYPE[it.t] + ' ×' + fmt(Math.round(kEff(it, d.days[i]) * 100) / 100) +
            (it.t === 'weather' ? ' (Gemma ×' + fmt(it.k) + ', вес прогноза ' + pct((ai.value.conf || {})[d.days[i]]) + ')' : '') + ': ' + it.r);
        }
        for (const id of a.sp) out.push('Разовый всплеск убран: ' + items[id].r);
        if (x[5]) out.push('Условия упёрлись в предел ±' + ai.value.limit + '%');
        if ((x[2] === 'rd' || x[2] === 'rc') && !r.newDish) out.push('Погода и календарь не учтены: Gemma оценивает их относительно того же дня год назад');
        if (r.newDish) return out.concat('Статистика («большее из двух»): продаж не было — 0');
        out.push('Статистика («большее из двух»): прошлая неделя ' + fmt(c[1] + c[2]) + ', год назад ' + fmt(c[3] + c[4]) + ' → ' + maxOf(r, i) +
          (x[1] > maxOf(r, i) ? ' · ИИ больше на ' + (x[1] - maxOf(r, i)) : x[1] < maxOf(r, i) ? ' · ИИ меньше на ' + (maxOf(r, i) - x[1]) : ' · так же'));
        return out;
      }
      const whyFull = (r, i) => [why(r, i)].concat(whyMore(r, i)).join('\n');
      const openWhy = reactive({});
      const toggleWhy = r => { openWhy[r.name] = !openWhy[r.name]; };
      const isOpen = r => !!openWhy[r.name];

      // Пункты Gemma: условия и исключения; вопросы — отдельно. Погода отключена — её пункты не показываем
      const itemAll = ref(false);
      const factors = computed(() => ai.value ? ai.value.items.filter(x => x.t !== 'question' && !x.off) :
        gm.value && gm.value.rec ? gm.value.rec.items.map((x, id) => Object.assign({ id }, x))
          .filter(x => x.t !== 'question' && (gm.value.weather || x.t !== 'weather')) : []);
      const factorsShown = computed(() => itemAll.value ? factors.value : factors.value.slice(0, 8));
      const questions = computed(() => gm.value && gm.value.rec ? gm.value.rec.items.filter(x => x.t === 'question') : []);
      function kText(x) {
        if (x.t === 'closed') return 'закрыто';
        if (x.t === 'closed_history') return 'не учтён';
        if (x.t === 'spike') return 'разовый';
        if (x.t === 'new_dish') return 'новинка';
        const k = x.t === 'trend' ? 1 / x.k : x.k;
        return (k >= 1 ? '+' : '−') + Math.round(Math.abs(k - 1) * 100) + '%';
      }
      const kCls = x => x.after > x.before || (x.before === x.after && (x.t === 'trend' ? x.k < 1 : x.k > 1)) ? 'is-up' : 'is-down';
      const pointName = tt => { const p = store.points.find(x => x.tt === tt); return p ? (p.emoji ? p.emoji + ' ' : '') + p.name : tt; };
      const itemWhat = x => x.t === 'new_dish' ? x.dish + ' · ' + (x.tt ? pointName(x.tt) : 'все точки')
        : x.s ? x.s.n + ' · ' + pointName(x.s.tt) : x.tt ? pointName(x.tt) : x.g ? x.g : 'вся сеть';
      // «аналог: Сок Морковь, 400мл × 0,5 · минимум 3 на точку в день»
      const newText = x => (x.an ? 'аналог: ' + x.an + ' × ' + fmt(x.k) : 'без аналога') + (x.min ? ' · минимум ' + fmt(x.min) + ' на точку в день' : '') +
        (x.had ? ' · уже продаётся на точках: ' + x.had : '') + (x.blocked ? ' · в автоплане заблокировано' : '');
      function itemWhen(x) {
        const SRC = { lw: 'прошлая неделя', ply: 'прошлая неделя год назад', ly: 'год назад' };
        if (x.s) return SRC[x.s.src] + ', ' + dmy(x.s.date);
        if (x.t === 'closed_history') return dmy(x.d);
        if (!x.d || x.d === 'all') return 'вся неделя';
        const i = data.value.days.indexOf(x.d);
        return (i >= 0 ? WD[i] + ' ' : '') + dm(x.d);
      }
      // «12 → 15»: план затронутых позиций без пункта → с ним
      function itemEffect(x) {
        if (!aiOn.value || x.before == null) return '';
        if (x.before !== x.after) return x.before + ' → ' + x.after;
        return x.n ? 'не изменило' : '';
      }
      function confText(x) {
        const conf = ai.value ? ai.value.conf || {} : (gm.value.rec.conf || {});
        if (x.d !== 'all') return pct(conf[x.d]);
        const v = data.value.days.map(d => conf[d] || 0);
        return pct(Math.min(...v)) + '–' + pct(Math.max(...v));
      }

      // ---------- Gemma
      const gm = computed(() => data.value && data.value.gemma);
      const notes = ref('');
      const asking = ref(false);
      const gemmaError = ref('');
      watch(data, d => { notes.value = d && d.gemma ? d.gemma.notes : ''; gemmaError.value = ''; }, { immediate: true });
      const notesChanged = computed(() => !!(gm.value && gm.value.rec) && (gm.value.rec.notes || '') !== notes.value.trim());

      const modelName = m => /31b/.test(m) ? 'Gemma 4 31B' : 'Gemma 4 26B';
      const showSeen = ref(false);

      // Ячейка уже в плане, Gemma предлагает другую цифру → её показываем стрелкой; null — показывать нечего
      function gemmaTo(r, i) {
        const c = r.cells[i];
        if (c[6] == null || !inPlan.value[i] || isDone(r, i) || data.value.days[i] < store.today) return null;
        return value(r, i) !== c[0] ? c[0] : null;
      }
      // Сколько позиций отправленного плана (все точки) ещё без поправок Gemma
      const gmPending = computed(() => {
        const d = data.value;
        if (!d || !gm.value || !gm.value.rec) return 0;
        let n = 0;
        for (const p of d.points) {
          const idx = actualOf(p.tt);
          d.days.forEach((date, i) => {
            if (date < store.today || !dayInPlan(idx, i)) return;
            for (const r of p.rows) {
              const c = r.cells[i];
              if (c[6] == null) continue;
              const e = idx[norm(r.name)];
              if (e && e.done[i]) continue;
              if ((e && e.cells[i] != null ? e.cells[i] : 0) !== c[0]) n++;
            }
          });
        }
        return n;
      });
      const gmState = computed(() => {
        const rec = gm.value && gm.value.rec;
        if (!rec) return { text: 'не составлен', cls: '' };
        if (gmStale.value) return { text: 'по старым данным', cls: 'is-warn' };
        if (gmPending.value) return { text: 'ещё не в листе', cls: 'is-warn' };
        return { text: plannedDays.value ? 'в плане' : 'в расчёте', cls: 'is-on' };
      });

      const applying = ref(false);
      async function applyGemma() {
        ask.value = '';
        applying.value = true;
        sendInfo.value = null;
        const week = ap.week;
        try {
          const r = await callApi('admin.gemma.apply', { weekStart: week });
          const d = ap.byWeek[week];
          if (d) d.actual = r.actual;
          sendInfo.value = { text: 'ИИ-план внесён в лист: ' + r.changed + ' ' + plural(r.changed, ['позиция', 'позиции', 'позиций']) +
            (r.skipped ? '; отмеченные на точках не изменены: ' + r.skipped : '') };
        } catch (e) {
          if (e.code !== 'AUTH') sendInfo.value = { error: true, text: e.message };
        } finally {
          applying.value = false;
        }
      }

      async function saveNotes() {
        const d = data.value;
        if (!d || !d.gemma || notes.value.trim() === (d.gemma.notes || '')) return;
        try {
          const r = await callApi('admin.gemma.notes', { weekStart: d.weekStart, notes: notes.value });
          d.gemma.notes = r.notes;
        } catch (e) {
          if (e.code !== 'AUTH') gemmaError.value = e.message;
        }
      }

      async function askGemma() {
        const week = ap.week;
        asking.value = true;
        gemmaError.value = '';
        try {
          const d = await callApi('admin.gemma.ask', { weekStart: week, notes: notes.value });
          ap.byWeek[week] = d;
        } catch (e) {
          if (e.code !== 'AUTH') gemmaError.value = e.message;
        } finally {
          asking.value = false;
        }
      }

      // ---------- Отправка в план
      const scheduleText = computed(() => {
        const s = data.value && data.value.schedule;
        if (!s || !s.enabled) return 'Автоотправка выключена — включается в «Настройках»';
        return 'Автоотправка: ' + EVERY[s.weekday - 1] + ' в ' + s.hour + ':00 — план на следующую неделю' +
          (s.monday ? '; понедельник — раньше, ' + EVERY[s.monday.weekday - 1] + ' в ' + s.monday.hour + ':00' : '');
      });
      // Понедельник недели ещё впереди и хотя бы у одной точки без плана — его можно отправить отдельно
      const mondayMissing = computed(() => {
        const d = data.value;
        if (!d || d.days[0] < store.today) return false;
        return d.points.some(p => !dayInPlan(actualOf(p.tt), 0) && p.rows.some(r => r.cells[0][0] > 0));
      });
      const gmStale = computed(() => !!(gm.value && gm.value.rec && gm.value.rec.p && data.value.weeks && gm.value.rec.p !== data.value.weeks.p.start));
      // «41-я неделя, 05.10–11.10»; прошлогодняя — с годом: «42-я неделя 2025, 13.10–19.10.25»
      function weekText(w, dates) {
        const other = w.year !== Number(data.value.weekStart.slice(0, 4));
        return w.week + '-я неделя' + (other ? ' ' + w.year : '') + ', ' + dm(dates[0]) + '–' + (other ? dmy(dates[6]) : dm(dates[6]));
      }
      // Открытые (не прошедшие) дни недели точки: с планом и без; есть ли что отправить на понедельник
      function coverageOf(p) {
        const out = { planned: 0, missing: 0, monday: false };
        const d = data.value;
        const idx = actualOf(p.tt);
        d.days.forEach((date, i) => {
          if (date < store.today) return;
          if (dayInPlan(idx, i)) out.planned++;
          else if (p.rows.some(r => r.cells[i][0] > 0)) { out.missing++; if (i === 0) out.monday = true; }
        });
        return out;
      }
      const coverage = computed(() => {
        const out = { planned: 0, missing: 0 };
        for (const p of data.value ? data.value.points : []) {
          const c = coverageOf(p);
          out.planned += c.planned;
          out.missing += c.missing;
        }
        return out;
      });

      // Куда отправить: все точки или одна (scope — её tt)
      const scope = ref('');
      watch(ask, v => { if (v) scope.value = ''; });
      function scopeOk(p) {
        const c = coverageOf(p);
        return ask.value === 'replace' ? c.planned > 0 : ask.value === 'monday' ? c.monday : c.missing > 0;
      }
      function scopeNote(p) {
        const c = coverageOf(p);
        const n = c.planned + c.missing;
        if (ask.value === 'monday') return c.monday ? 'понедельника в плане нет' : 'понедельник уже в плане';
        if (ask.value === 'replace') return c.planned ? 'в плане ' + c.planned + ' из ' + n + ' дн.' : 'плана ещё нет';
        return c.missing ? 'не отправлено ' + c.missing + ' из ' + n + ' дн.' : n ? 'план уже отправлен' : 'отправлять нечего';
      }
      const scopeAllNote = computed(() => {
        const ok = data.value ? data.value.points.filter(scopeOk).length : 0;
        return ok + ' из ' + (data.value ? data.value.points.length : 0) + ' — ' + (ask.value === 'replace' ? 'с планом' : 'есть что отправить');
      });
      const scopeText = computed(() => {
        const p = scope.value && data.value.points.find(x => x.tt === scope.value);
        return p ? 'точки ' + (p.emoji ? p.emoji + ' ' : '') + p.name : 'всех точек';
      });
      const missingDays = computed(() => coverage.value.missing);
      const plannedDays = computed(() => coverage.value.planned);
      const weekStateText = computed(() => {
        const d = data.value;
        if (!d) return '';
        if (d.days[6] < store.today) return 'Неделя прошла — план не изменить';
        const { planned, missing } = coverage.value;
        if (!planned && !missing) return 'Отправлять нечего: в расчёте пусто';
        if (!planned) return 'План на эту неделю ещё не отправлен';
        if (!missing) return 'План недели уже в листе «Блюда». Цифры можно поправить: нажмите на них';
        return 'План отправлен не на все дни: «Отправить в план» дополнит недостающие';
      });

      async function send(replace, monday) {
        const tts = scope.value ? [scope.value] : undefined;
        ask.value = '';
        sending.value = true;
        sendInfo.value = null;
        const week = ap.week;
        try {
          const r = await callApi('admin.autoplan.send', monday ? { weekStart: week, only: 'monday', tts } : { weekStart: week, replace, tts });
          const d = ap.byWeek[week];
          if (d) { d.actual = r.actual; d.last = r.last; }
          sendInfo.value = { text: 'Отправлено: ' + r.text };
        } catch (e) {
          if (e.code !== 'AUTH') sendInfo.value = { error: true, text: e.message };
        } finally {
          sending.value = false;
        }
      }

      // ---------- Правка цифры плана
      const keyOf = (r, i) => r.name + '|' + i;
      const isEditing = (r, i) => edit.key === keyOf(r, i);
      function startEdit(r, i) {
        if (!canEdit(r, i) || isEditing(r, i)) return;
        Object.assign(edit, { key: keyOf(r, i), value: String(value(r, i) || ''), row: r, i });
      }
      async function saveEdit() {
        if (!edit.key) return;
        const r = edit.row, i = edit.i;
        edit.key = '';
        const raw = String(edit.value).replace(',', '.').trim();
        const amount = raw === '' ? 0 : Number(raw);
        if (!isFinite(amount) || amount < 0) { sendInfo.value = { error: true, text: 'Введите число: ' + raw }; return; }
        if (amount === value(r, i)) return;

        const d = data.value;
        const tt = point.value.tt;
        const all = d.actual || (d.actual = {});
        const byTt = all[tt] || (all[tt] = {});
        let e = entryOf(r);
        if (!e) e = byTt[norm(r.name)] = { name: r.name, group: r.group, unit: r.unit, cells: d.days.map(() => null), done: d.days.map(() => false) };
        const was = e.cells[i];
        e.cells[i] = amount;   // сразу на экране; при ошибке — откат
        sendInfo.value = null;
        try {
          const res = await callApi('admin.autoplan.setCell', { tt, date: d.days[i], name: r.name, amount });
          if (res.warning) sendInfo.value = { warning: true, text: r.name + ', ' + MF.day(d.days[i]) + ': ' + res.warning, recalcDate: res.recalc ? d.days[i] : '' };
        } catch (err) {
          e.cells[i] = was;
          if (err.code === 'CONFLICT') e.done[i] = true;
          if (err.code !== 'AUTH') sendInfo.value = { error: true, text: r.name + ': ' + err.message };
        }
      }

      // ---------- Добавить блюдо: справочник блюд — один раз за открытие экрана
      const addOpen = ref(false);
      const addAll = ref(false);   // «Во все точки»: строка — у каждой точки (цифры — у каждой точки свои)
      const addQuery = ref('');
      const addInput = ref(null);
      const dishDir = ref(null);
      async function openAdd() {
        addQuery.value = '';
        addAll.value = false;
        addOpen.value = true;
        nextTick(() => addInput.value && addInput.value.focus());
        if (!dishDir.value) {
          try { dishDir.value = await callApi('dir.list', { kind: 'dishes' }); } catch (e) { dishDir.value = []; if (e.code !== 'AUTH') sendInfo.value = { error: true, text: e.message }; }
        }
      }
      // Уже в списке точки — помечены: выбор такого блюда не добавляет дубль, а показывает его строку во всех днях
      const inList = computed(() => new Set(prows.value.map(r => norm(r.name))));
      const addOptions = computed(() => {
        const q = norm(addQuery.value);
        return (dishDir.value || []).filter(d => !q || norm(d.name).includes(q))
          .sort((a, b) => inList.value.has(norm(a.name)) - inList.value.has(norm(b.name))).slice(0, 50)
          .map(d => Object.assign({ have: inList.value.has(norm(d.name)) }, d));
      });
      // Статус блюда в автоплане на точке: свой статус точки, иначе общий
      const statusAt = (d, tt) => (d.planTt && d.planTt[tt]) || d.planStatus || '';
      // Где блюдо заблокировано: на этой точке, а при «Во все точки» — хоть на одной
      const addTts = () => addAll.value ? data.value.points.map(p => p.tt) : [point.value.tt];
      function blockedText(d) {
        if (!point.value) return '';
        const off = addTts().filter(tt => statusAt(d, tt) !== 'Активно').length;
        return !off ? '' : addAll.value && off < data.value.points.length ? 'заблокировано в ' + off + ' ' + plural(off, ['точке', 'точках', 'точках']) : 'заблокировано в автоплане';
      }
      // Заблокированное — сначала включить (во всех точках или только здесь), потом в список
      function pickDish(d) {
        if (addTts().some(tt => statusAt(d, tt) !== 'Активно')) {
          addOpen.value = false;
          Object.assign(sc, { kind: 'add', all: addAll.value, dish: d });
          return;
        }
        pinDish(d, addAll.value ? undefined : [point.value.tt]);
      }
      // tts — точки, где строка появится; нет — все точки
      function pinDish(d, tts) {
        const list = tts || data.value.points.map(p => p.tt);
        for (const tt of list) {
          const k = ap.week + '|' + tt;
          if (!(added[k] || []).some(x => norm(x.name) === norm(d.name))) (added[k] = added[k] || []).push({ name: d.name, unit: d.unit, group: d.group });
        }
        addOpen.value = false;
        const many = list.length > 1;
        if (many && qaOpen(d)) return;
        const where = many ? ' во все точки (' + list.length + ')' : ' в список точки';
        sendInfo.value = !inPlan.value.some(Boolean)
          ? { warning: true, text: d.name + ' — строка добавлена' + (many ? ' во все точки' : '') + '. Цифры ставятся в днях «в плане»: сначала отправьте план недели.' }
          : { text: d.name + (d.enabled ? ' — включено в автоплан ' + d.enabled + ' и добавлено' + where : d.have && !many ? ' — уже в списке точки' : ' — добавлено' + where) + '. ' +
            (many ? 'Цифры ставятся у каждой точки отдельно: выберите точку вверху, нажмите на цифру в нужном дне и введите количество.' : 'Нажмите на цифру в нужном дне и введите количество.') };
        // К новой строке — прокруткой
        nextTick(() => {
          const el = [...document.querySelectorAll('.wa-ap [data-row]')].find(x => x.dataset.row === d.name && x.offsetParent !== null);
          if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
        });
      }
      // ---------- «Во все точки»: одно количество всем точкам (admin.autoplan.setCells)
      const qa = reactive({ open: false, dish: null, amount: '', days: [], busy: false, error: '' });
      const qaInput = ref(null);
      // День доступен, если он не прошёл и хоть у одной точки на него уже отправлен план
      const qaDays = computed(() => !data.value ? [] : data.value.days.map((d, i) => {
        const pts = data.value.points.filter(p => dayInPlan(actualOf(p.tt), i)).length;
        return { i, d, pts, ok: d >= store.today && pts > 0 };
      }));
      // Каким точкам цифра не встанет: нет плана ни в один из выбранных дней — или не во все
      const qaHint = computed(() => {
        if (!data.value || !qa.days.length) return 'Выберите дни.';
        const has = (p, i) => dayInPlan(actualOf(p.tt), i);
        const none = data.value.points.filter(p => qa.days.every(i => !has(p, i))).map(p => p.name);
        const part = data.value.points.filter(p => !none.includes(p.name) && qa.days.some(i => !has(p, i))).map(p => p.name);
        return [none.length ? 'План недели не отправлен: ' + none.join(', ') + ' — там цифра не встанет.' : '',
          part.length ? 'Не во все выбранные дни есть план: ' + part.join(', ') + '.' : '',
          'Прошедшие дни и дни без плана недоступны.'].filter(Boolean).join(' ');
      });
      // false — ставить некуда (план недели ещё не отправлен): остаётся строка и подсказка
      function qaOpen(d) {
        const days = qaDays.value.filter(x => x.ok).map(x => x.i);
        if (!days.length) return false;
        Object.assign(qa, { open: true, dish: { name: d.name, unit: d.unit || '' }, amount: '', days, busy: false, error: '' });
        nextTick(() => qaInput.value && qaInput.value.focus());
        return true;
      }
      function qaSkip() {
        qa.open = false;
        sendInfo.value = { text: qa.dish.name + ' — строка добавлена во все точки. Цифры ставятся у каждой точки отдельно: выберите точку вверху, нажмите на цифру в нужном дне и введите количество.' };
      }
      const qaToggle = i => { qa.days = qa.days.includes(i) ? qa.days.filter(x => x !== i) : qa.days.concat(i).sort(); };
      async function qaSave() {
        const amount = Number(String(qa.amount).replace(',', '.').trim());
        if (!(amount > 0)) { qa.error = 'Введите количество больше нуля'; return; }
        if (!qa.days.length) { qa.error = 'Выберите дни'; return; }
        const d = data.value;
        Object.assign(qa, { busy: true, error: '' });
        try {
          const res = await callApi('admin.autoplan.setCells', { name: qa.dish.name, amount, dates: qa.days.map(i => d.days[i]),
            tts: d.points.map(p => p.tt), weekStart: ap.week });
          if (res.actual) d.actual = res.actual;
          qa.open = false;
          const ptName = t => (d.points.find(p => p.tt === t) || { name: t }).name;
          const np = [...new Set(res.noPlan.map(x => x.tt))].map(ptName);
          const skip = [np.length ? 'план недели не отправлен — ' + np.join(', ') : '', res.marked.length ? 'уже отмечено на точке — ' + res.marked.length : '']
            .filter(Boolean).join(', ');
          sendInfo.value = {
            warning: !!(skip || res.recalcDate), recalcDate: res.recalcDate || '',
            text: '«' + qa.dish.name + '» в плане всех точек: по ' + fmt(amount) + (qa.dish.unit ? ' ' + qa.dish.unit : '') + ' на ' + qa.days.map(i => WD[i]).join(', ') +
              ' — ' + (res.written + res.same) + ' ' + plural(res.written + res.same, ['точко-день', 'точко-дня', 'точко-дней']) + (skip ? '; пропущено: ' + skip : '') + '.' +
              (res.recalcDate ? ' Заготовки на эти дни уже рассчитаны — пересчитайте их.' : ''),
          };
        } catch (e) {
          if (e.code !== 'AUTH') qa.error = e.message;
        } finally {
          qa.busy = false;
        }
      }

      function unadd(r) {
        const k = ap.week + '|' + point.value.tt;
        added[k] = (added[k] || []).filter(x => norm(x.name) !== norm(r.name));
      }

      // «К расчёту»: экран расчёта на этот день — там «Пересчитать»
      const toCalc = date => C.admin.openCalc(date);

      // ---------- Загрузка
      // Ответ устаревшего расчёта (до заполнения статусов, другая неделя) не должен перекрыть свежий
      let seq = 0;
      async function load() {
        const week = ap.week;
        const my = ++seq;
        loading.value = true;
        error.value = '';
        try {
          const d = await callApi('admin.autoplan.preview', { weekStart: week });
          ap.byWeek[week] = d;
          if (my !== seq) return;
          status.value = d.status;
          if (!d.points.some(p => p.tt === pt.value)) pt.value = d.points.length ? d.points[0].tt : '';
        } catch (e) {
          if (my === seq && e.code !== 'AUTH') error.value = e.message;
        } finally {
          if (my === seq) loading.value = false;
        }
      }

      function move(n) {
        ap.week = addDays(ap.week, n);
        showAll.value = false;
        sendInfo.value = null;
        edit.key = '';
        chg.value = '';
        itemAll.value = false;
        if (!ap.byWeek[ap.week]) load();
      }

      async function fill() {
        filling.value = true;
        error.value = '';
        try {
          const r = await callApi('admin.autoplan.fill');
          status.value = r.status;
          const done = 'Статусы заполнены: активно ' + r.status.active + ', заблокировано ' + r.status.blocked;
          fillInfo.value = done + '. Пересчитываем план…';
          await load();
          fillInfo.value = done + '.';
        } catch (e) {
          if (e.code !== 'AUTH') error.value = e.message;
        } finally {
          filling.value = false;
        }
      }

      // «Включить» в «Продавались, но заблокированы» — во всех точках или только в выбранной
      const activate = b => Object.assign(sc, { kind: 'activate', all: false, b });
      async function activateB(b, tts) {
        busy.value = b.name;
        try {
          await callApi('admin.autoplan.setStatus', { status: 'active', items: [{ id: b.id, name: b.name }], tts });
          b.on = true;
          dishDir.value = null;
        } catch (e) {
          if (e.code !== 'AUTH') error.value = e.message;
        } finally {
          busy.value = '';
        }
      }

      // ---------- Во всех точках или только в выбранной: убрать из плана, включить заблокированное
      const sc = reactive({ kind: '', all: false, row: null, dish: null, b: null });
      const canRemove = computed(() => !!(data.value && data.value.days[6] >= store.today));
      const askRemove = r => Object.assign(sc, { kind: 'remove', all: false, row: r });
      const scName = computed(() => sc.kind === 'remove' ? (sc.row && sc.row.name) : sc.kind === 'add' ? (sc.dish && sc.dish.name) : (sc.b && sc.b.name));
      const scTitle = computed(() => sc.kind === 'remove' ? 'Убрать «' + scName.value + '» из плана?'
        : sc.kind === 'add' ? '«' + scName.value + '» заблокировано в автоплане' : 'Включить «' + scName.value + '»?');
      const scText = computed(() => sc.kind === 'remove'
        ? 'Строки плана с сегодняшнего дня и дальше уберутся, блюдо станет «Заблокировано» — автоплан не будет его ставить. Отмеченные на точках позиции останутся.'
        : sc.kind === 'add' ? 'Чтобы добавить блюдо в план, включите его в автоплане.'
        : 'Автоплан начнёт ставить блюдо в план — нажмите «Пересчитать», чтобы увидеть его в расчёте.');
      async function scopeGo() {
        const kind = sc.kind;
        const tts = sc.all ? undefined : [point.value.tt];
        sc.kind = '';
        if (kind === 'remove') await removeRow(sc.row, tts);
        else if (kind === 'add') await enableAndAdd(sc.dish, tts);
        else if (kind === 'activate') await activateB(sc.b, tts);
      }
      async function removeRow(r, tts) {
        const d = data.value;
        const where = tts ? 'точки ' + point.value.name : 'всех точек';
        sending.value = true;
        sendInfo.value = null;
        try {
          const res = await callApi('admin.autoplan.remove', { name: r.name, id: r.id || '', tts, weekStart: ap.week });
          if (res.actual) d.actual = res.actual;
          // Из расчёта на экране — сразу (пересчёт его уже не поставит)
          const hit = tt => !tts || tts.includes(tt);
          d.points.forEach(p => { if (hit(p.tt)) p.rows = p.rows.filter(x => norm(x.name) !== norm(r.name)); });
          for (const k of Object.keys(added)) if (k.startsWith(ap.week + '|') && hit(k.slice(ap.week.length + 1))) added[k] = added[k].filter(x => norm(x.name) !== norm(r.name));
          dishDir.value = null;   // статусы изменились — справочник перечитается при «Добавить блюдо»
          sendInfo.value = {
            warning: !!res.recalcDate, recalcDate: res.recalcDate || '',
            text: '«' + r.name + '» убрано из плана ' + where + ': строк ' + res.removed + (res.kept ? ', отмеченных на точках осталось ' + res.kept : '') +
              '. Блюдо заблокировано — автоплан его не поставит.' + (res.recalcDate ? ' Заготовки на эти дни уже рассчитаны — пересчитайте их.' : ''),
          };
        } catch (e) {
          if (e.code !== 'AUTH') sendInfo.value = { error: true, text: r.name + ': ' + e.message };
        } finally {
          sending.value = false;
        }
      }
      async function enableAndAdd(dish, tts) {
        try {
          await callApi('admin.autoplan.setStatus', { status: 'active', items: [{ id: dish.id, name: dish.name }], tts });
          if (tts) dish.planTt = Object.assign({}, dish.planTt || {}, { [tts[0]]: 'Активно' });
          else Object.assign(dish, { planStatus: 'Активно', planTt: {} });
          pinDish(Object.assign({}, dish, { enabled: tts ? 'в точке ' + point.value.name : 'во всех точках' }), tts);
        } catch (e) {
          if (e.code !== 'AUTH') sendInfo.value = { error: true, text: dish.name + ': ' + e.message };
        }
      }

      // Пока статусы не заполнены, считать нечего — сначала «Заполнить статусы»
      onMounted(async () => {
        ap.week = ap.week || nextMonday(store.today);
        try { status.value = await callApi('admin.autoplan.status'); } catch (e) { /* покажем после расчёта */ }

          'Цифры сохраняются сами — при переходе к следующему полю (Enter) и через пару секунд после ввода. Статус — вверху («Сохраняем…», «Сохранено»). Пропала связь или сервер занят — внизу появится «Не сохранено … Повторяем сами»: ничего не делайте, внесённое остаётся на экране и в телефоне и уйдёт само (даже если закрыть и снова открыть страницу в тот же день). Цифры, которые внёс другой сотрудник, появляются после вашего сохранения и раз в минуту.',
          '5 кг и больше в одной цифре (кг, л) — поле красное и внизу вопрос «Нет ли пропущенной запятой?»: «Исправить» — к полю, «Верно» — если цифра правильная. Такие цифры ещё раз покажутся в окне документов — без галочки «Проверил — цифры верные» документы не создаются. Остатка нет — внесите 0.',
          'Удобнее на бумаге — «Бланк для печати» вверху экрана: лист А4 с ингредиентами дня (утро, пополнения днём, остаток, галочки «в» — с витрины и «з» — на завтра, у штучной витрины — «с витр. ___ шт») и строкой «Не продано готовых салатов». Сотрудник заполняет его за день, потом цифры вносят в приложение.',
          'Вечером, когда продажи остановлены, взвесьте остатки и внесите «Остаток вечером». Остаток, который остаётся на завтра, отметьте «оставить на завтра» — он не спишется и останется на складе; на следующий день он нигде не показывается: утром взвесьте его вместе со всем. Где руководитель перенос выключил, галочки нет — остаток всегда списывается. Enter или ↓ — к тому же полю следующего ингредиента; «Нужно внести» — только строки без остатка.',
          'Вверху — плитки продаж за день: салат-база и готовые салаты (большая цифра — сколько продано). Копии для кассы доставки (САЛАТ ЦЕЗАРЬ Д) отдельно не показываются — их продажи уже в цифре основного салата («в т. ч. доставка»).',
          '«В готовые салаты» — сколько ингредиента ушло в проданные готовые салаты (продано × тех. карта), «В салат-базу» — пришло − остаток − готовые салаты. «Обновить из iiko» — свежие продажи и тех. карты прямо из iiko. Обычно тех. карты готовых салатов берутся с листа «Тех.карта» — его каждую ночь обновляет синхронизация iiko; поменяли карту днём — «Интеграции» → синхронизация или «Обновить из iiko».',
          'Пока остаток внесён не везде, кнопка внизу — «К пустой строке»: переводит к первому незаполненному полю. Когда всё внесено — «Создать документы» → сначала укажите, сколько готовых салатов не продали (их ингредиенты не пойдут в салат-базу, а сами салаты спишутся отдельным актом) → «Далее» → проверьте список → «Создать и провести» (документы создаются по тем продажам, что в окне, если с его открытия прошло не больше 15 минут; иначе — по свежим). Создаются: переработка «витрина → бар» по каждому ингредиенту «с витрины», переработка ингредиентов в САЛАТ-БАЗА (выход — продано за день), списание непроданных готовых салатов, списание остатка.',
          'После создания цифры за день не меняются. Если iiko отказал на каком-то документе — «Повторить»: создадутся только недостающие. Документы создали для проверки или по ошибке — руководитель нажимает «Открыть день заново» в карточке документов (цифры можно оставить или очистить); сами документы в iiko остаются — их удаляют в iikoOffice, иначе спишется дважды.',
          'Забыли создать документы — откройте тот день (стрелка «‹» у даты или «Архив»): если документов за него нет, вверху «Создать задним числом» — поля откроются, внесите цифры и «Создать документы». В iiko документы будут от того дня, 23:50. День, за который уже есть документы, задним числом не открыть.',
          '«Архив» — прошлые дни и их документы. Руководитель: «Настройки» раздела — ключи iikoCloud, точки (организация и склад), блюдо САЛАТ-БАЗА, готовые салаты, счёт списания и ингредиенты (барный товар ← товар витрины; «перенос на завтра» — можно ли оставлять остаток; дни недели — «Все дни» или нужные дни; у штучной витрины — «1 шт ≈ … кг», средний вес штуки; порядок строк — перетаскиванием за точки слева).',
        ],
        tip: 'Расход меньше нуля (остаток и готовые салаты больше, чем пришло) — в салат-базу пойдёт 0, приложение предупредит. Не продано ни одной салат-базы — акта в салат-базу нет, создаются только «витрина → бар» и списание.',
