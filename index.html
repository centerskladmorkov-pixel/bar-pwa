<script>
(function (C) {
  if (!C) return;

  const { reactive, ref, computed, watch, onMounted, onBeforeUnmount } = Vue;
  const { store, MF, plural, asset, callApi, enterPoint, addDays, setPhoto } = C;
  const fmt = MF.fmt;

  // Данные дашборда по датам: к уже открытой дате возвращаемся без ожидания
  const dash = reactive({ date: '', byDate: {}, at: {}, loading: false, error: '' });

  async function load(date, silent) {
    dash.date = date;
    if (!silent) dash.loading = true;
    try {
      const data = await callApi('admin.dashboard', { date });
      dash.byDate[date] = data;
      dash.at[date] = Date.now();
      if (dash.date === date) dash.error = '';
    } catch (e) {
      if (e.code !== 'AUTH' && dash.date === date && (!silent || !dash.byDate[date])) dash.error = e.message;
    } finally {
      if (dash.date === date) dash.loading = false;
    }
  }

  const pct = p => Math.round(p * 100);
  const ratio = (done, total) => total ? done / total : 0;

  // «Набережная» → «Набер.» — для узких заголовков таблицы плана
  const shortName = name => {
    const w = String(name).split(/\s+/)[0];
    return w.length > 6 ? w.slice(0, 5) + '.' : w;
  };

  // Метки времени сервера 'yyyy-MM-dd HH:mm:ss' — в мс; пояс у них один, важна только разница
  const ms = s => Date.parse(String(s).replace(' ', 'T') + 'Z');

  function lastText(at, d, fetchedAt) {
    if (!at) return d.date === d.today ? 'Сегодня отметок ещё нет' : 'Отметок нет';
    const min = Math.floor((ms(d.serverTime) - ms(at) + (Date.now() - fetchedAt)) / 60000);
    if (at.slice(0, 10) === d.today && min < 60) return 'Последняя отметка ' + (min < 1 ? 'только что' : min + ' мин назад');
    const day = at.slice(0, 10);
    const when = day === d.today ? 'сегодня' : day === addDays(d.today, -1) ? 'вчера' : day.slice(8, 10) + '.' + day.slice(5, 7);
    return 'Последняя отметка ' + when + ' в ' + at.slice(11, 16);
  }

  // «Вс, 4 октября» и коротко для телефона: «Сегодня», «Вчера», «Сб, 3 окт»
  const MON = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
  function dayShort(d) {
    if (!d) return '';
    if (d === store.today) return 'Сегодня';
    if (d === addDays(store.today, -1)) return 'Вчера';
    if (d === addDays(store.today, 1)) return 'Завтра';
    return MF.day(d).split(', ')[0] + ', ' + Number(d.slice(8)) + ' ' + MON[Number(d.slice(5, 7)) - 1];
  }


  const DayPicker = {
    template: '#tpl-day-picker',
    props: { modelValue: String, max: String },
    emits: ['update:modelValue'],
    setup(props, { emit }) {
      const full = computed(() => {
        const label = MF.day(props.modelValue);
        if (props.modelValue === store.today) return 'Сегодня, ' + label.split(', ')[1];
        if (props.modelValue === addDays(store.today, 1)) return 'Завтра, ' + label.split(', ')[1];
        return label;
      });
      const short = computed(() => dayShort(props.modelValue));
      const set = d => emit('update:modelValue', props.max && d > props.max ? props.max : d);
      const move = n => set(addDays(props.modelValue, n));
      return { store, full, short, set, move };
    },
  };


  const DashboardView = {
    template: '#tpl-dashboard',
    components: { DayPicker },
    setup() {
      const tab = ref('points');
      const ready = ref(false);
      const allAlerts = ref(false);
      const tick = ref(0);   // раз в 30 с пересчитывает «N мин назад»

      const data = computed(() => dash.byDate[dash.date] || null);

      const tiles = computed(() => {
        tick.value;
        const d = data.value;
        if (!d) return [];
        const fetchedAt = dash.at[d.date] || Date.now();
        return d.points.map(p => {
          const metrics = [
            { label: 'Блюда', done: p.dishes.done, total: p.dishes.total },
            { label: 'Заготовки', done: p.preps.done, total: p.preps.total },
            { label: 'Лимонады и смузи', done: p.smoothies.done, total: p.smoothies.total },
          ].map(m => Object.assign(m, { p: ratio(m.done, m.total) }));
          const done = metrics.reduce((s, m) => s + m.done, 0);
          const total = metrics.reduce((s, m) => s + m.total, 0);
          return Object.assign({}, p, {
            metrics, done, total, p: ratio(done, total),
            // Один человек на обеих ролях — одно имя
            staff: p.shift ? [...new Set([p.shift.bar, p.shift.prep].filter(Boolean))].join(' · ') : null,
            lastText: lastText(p.lastAt, d, fetchedAt),
            hasError: p.alerts.some(a => a.tone === 'error'),
            ok: total > 0 && done === total && !p.alerts.length,
            empty: total === 0,
          });
        });
      });

      const net = computed(() => {
        const metrics = ['Блюда', 'Заготовки', 'Лимонады и смузи'].map((label, i) => {
          const done = tiles.value.reduce((s, t) => s + t.metrics[i].done, 0);
          const total = tiles.value.reduce((s, t) => s + t.metrics[i].total, 0);
          return { label, done, total, p: ratio(done, total) };
        });
        const done = metrics.reduce((s, m) => s + m.done, 0);
        const total = metrics.reduce((s, m) => s + m.total, 0);
        return { metrics, total, p: ratio(done, total) };
      });

      // Предупреждения всех точек: сначала ошибки
      const alerts = computed(() => {
        const list = [];
        for (const t of tiles.value) for (const a of t.alerts) list.push(Object.assign({ tt: t.tt, emoji: t.emoji, name: t.name }, a));
        return list.sort((a, b) => (a.tone === 'error' ? 0 : 1) - (b.tone === 'error' ? 0 : 1));
      });
      const shownAlerts = computed(() => allAlerts.value ? alerts.value : alerts.value.slice(0, 5));

      // План по группам блюд (сервер уже отсортировал: группа, затем количество ↓)
      const planGroups = computed(() => {
        const groups = [];
        for (const r of data.value ? data.value.plan : []) {
          const name = r.group || 'Без группы';
          let g = groups[groups.length - 1];
          if (!g || g.name !== name) groups.push(g = { name, rows: [] });
          g.rows.push(r);
        }
        return groups;
      });

      const dayLabel = computed(() => MF.day(dash.date));

      const syncText = computed(() => {
        tick.value;
        if (dash.loading) return 'Обновляем…';
        const at = dash.at[dash.date];
        if (!at) return '';
        const min = Math.floor((Date.now() - at) / 60000);
        return 'Обновлено ' + (min < 1 ? 'только что' : min + ' мин назад');
      });

      // Уже открытая дата — сразу на экране и обновляется в фоне, если данным больше 20 с
      function setDate(date) {
        allAlerts.value = false;
        if (date !== dash.date) dash.error = '';
        const cached = dash.byDate[date];
        if (date === dash.date && cached && Date.now() - (dash.at[date] || 0) < 20000) return;
        load(date, !!cached);
      }
      const refresh = () => load(dash.date, !!data.value);
      const open = tt => enterPoint(tt);

      // Полосы и кольцо заполняются после первого кадра
      watch(data, d => { if (d && !ready.value) setTimeout(() => { ready.value = true; }, 60); }, { immediate: true });

      // Автообновление, пока вкладка на экране
      let pollTimer = null;
      let tickTimer = null;
      const onVisible = () => {
        if (document.visibilityState === 'visible' && Date.now() - (dash.at[dash.date] || 0) > 20000) load(dash.date, true);
      };
      onMounted(() => {
        setDate(dash.date || store.today);
        const every = Math.max(30, store.settings.refresh_seconds || 45) * 1000;
        pollTimer = setInterval(() => { if (document.visibilityState === 'visible' && !dash.loading) load(dash.date, true); }, every);
        tickTimer = setInterval(() => { tick.value++; }, 30000);
        document.addEventListener('visibilitychange', onVisible);
      });
      onBeforeUnmount(() => {
        clearInterval(pollTimer);
        clearInterval(tickTimer);
        document.removeEventListener('visibilitychange', onVisible);
      });

      return {
        store, dash, tab, ready, allAlerts, data, tiles, net, alerts, shownAlerts, planGroups,
        dayLabel, syncText, setDate, refresh, open,
        pct, plural, fmt, shortName, asset,
      };
    },
  };

  // ================================================================== Расчёт заготовок

  const calc = reactive({
    date: '', byDate: {}, loading: false, error: '', saving: false, done: '', cmp: null, cmpLoading: false,
    pending: null, allSaving: false, allDone: null, allError: '',   // все дни без заготовок
    stale: null, recalcing: false, recalcDone: null, recalcError: '',   // устаревшие дни (завтра и позже) и пересчёт
  });

  // Дни без заготовок и устаревшие — подсказка: без неё экран работает как раньше
  async function loadPending() {
    try {
      const r = await callApi('admin.prep.pending', {});
      calc.pending = r.days;
      calc.stale = r.stale || [];
    } catch (e) { /* молча */ }
  }

  // Открыть расчёт на день (из «Автоплана»: план поправили — пересчитать заготовки)
  function openCalc(date) {
    if (date !== calc.date) Object.assign(calc, { cmp: null, error: '', allDone: null, allError: '', recalcDone: null, recalcError: '' });
    calc.date = date;
    store.view = 'calc';
    window.scrollTo(0, 0);
  }

  async function loadCalc(date, fresh) {
    calc.date = date;
    calc.loading = true;
    try {
      const data = await callApi('admin.prep.preview', { date, fresh: !!fresh });
      calc.byDate[date] = data;
      if (calc.date === date) calc.error = '';
    } catch (e) {
      if (e.code !== 'AUTH' && calc.date === date) calc.error = e.message;
    } finally {
      if (calc.date === date) calc.loading = false;
    }
  }

  const CalcView = {
    template: '#tpl-calc',
    components: { DayPicker },
    setup() {
      const tab = ref('preps');
      const pt = ref('');
      const ask = ref(false);
      const askAll = ref(false);
      const askRecalc = ref(false);
      const askRecalcAll = ref(false);

      const data = computed(() => calc.byDate[calc.date] || null);
      // Завтра и позже: записанные заготовки можно пересчитать
      const future = computed(() => calc.date > store.today);

      // Плашка «Без заготовок N дней» — если кроме открытого дня есть ещё хоть один
      const pendingN = computed(() => (calc.pending || []).length);
      const pendingShown = computed(() => (calc.pending || []).some(d => d.date !== calc.date));
      // «вт 6 – сб 10 окт», «завтра – сб 10 окт», «вт 30 сен – пн 6 окт»
      const pendingRange = computed(() => {
        const days = calc.pending || [];
        if (!days.length) return '';
        const a = days[0].date, b = days[days.length - 1].date;
        if (a === b) return dayShort(a);
        const short = (d, withMonth) => d === store.today ? 'сегодня' : d === addDays(store.today, 1) ? 'завтра'
          : MF.day(d).split(', ')[0].toLowerCase() + ' ' + Number(d.slice(8)) + (withMonth ? ' ' + MON[Number(d.slice(5, 7)) - 1] : '');
        return short(a, a.slice(0, 7) !== b.slice(0, 7)) + ' – ' + short(b, true);
      });
      const pendingNoCard = computed(() => (calc.pending || []).some(d => d.noCard));

      // Плашка «Заготовки устарели» — если устарел не только открытый день (для него — свой баннер)
      const staleN = computed(() => (calc.stale || []).length);
      const staleShown = computed(() => (calc.stale || []).some(d => d.date !== calc.date));
      const staleRange = computed(() => (calc.stale || []).map(d => dayShort(d.date)).join(' · '));
      const pointRef = tt => store.points.find(p => p.tt === tt) || { name: tt, emoji: '' };
      const pointName = tt => pointRef(tt).name;
      const pointEmoji = tt => pointRef(tt).emoji || pointRef(tt).name;
      const dayLabel = computed(() => MF.day(calc.date));
      const pointOf = tt => (data.value.points.find(p => p.tt === tt) || { tt, name: tt, emoji: '' });
      const point = computed(() => data.value && pt.value ? pointOf(pt.value) : null);
      const shown = computed(() => data.value ? data.value.points.filter(p => !pt.value || p.tt === pt.value) : []);

      // Обычные заготовки (не наборы лимонадов и смузи); по всем точкам — суммой
      const mainRows = computed(() => {
        const by = {};
        for (const p of shown.value) {
          for (const r of p.rows) {
            if (r.dishFor) continue;
            const x = by[r.name] = by[r.name] || Object.assign({}, r, { amount: 0 });
            x.amount = Math.round((x.amount + r.amount) * 10000) / 10000;
          }
        }
        return Object.values(by).sort((a, b) => (a.group || '').localeCompare(b.group || '', 'ru') || a.name.localeCompare(b.name, 'ru'));
      });

      const smoothies = computed(() => {
        const by = {};
        for (const s of data.value ? data.value.smoothies : []) {
          if (pt.value && s.tt !== pt.value) continue;
          const x = by[s.dish] = by[s.dish] || { dish: s.dish, qty: 0, unit: s.unit, n: 0, set: s.set === 'lemonade' ? 0 : 1 };
          x.qty += s.qty;
          x.n++;
        }
        // Сначала лимонады, потом смузи — как на экране точки
        return Object.values(by).sort((a, b) => a.set - b.set || a.dish.localeCompare(b.dish, 'ru'))
          .map(x => Object.assign(x, { points: x.n + ' ' + plural(x.n, ['точка', 'точки', 'точек']) }));
      });

      const label = tt => { const p = pointOf(tt); return pt.value ? '' : ' · ' + (p.emoji || p.name); };
      const warnings = computed(() => {
        const w = data.value ? data.value.warnings : null;
        if (!w) return [];
        const mine = list => list.filter(x => !pt.value || x.tt === pt.value);
        const out = [];
        const noCard = mine(w.noCard);
        if (noCard.length) out.push({ tone: 'err', title: 'Блюда без тех. карты — заготовки не посчитаны', text: noCard.map(x => x.dish + label(x.tt)).join(', ') });
        const zero = mine(w.zero);
        if (zero.length) out.push({ tone: 'warn', title: 'Нулевое количество в плане', text: zero.map(x => x.dish + label(x.tt)).join(', ') });
        const deleted = mine(w.deleted || []);
        if (deleted.length) out.push({ tone: 'err', title: 'Блюдо удалено в iiko — посчитано по его старой тех. карте',
          text: deleted.map(x => x.dish + label(x.tt)).join(', ') + '. Если в iiko есть новое блюдо с тем же названием — «Интеграции» → «Всё сразу и пересчёт заготовок»: код заменится, заготовки пересчитаются.' });
        if (w.excluded.length) out.push({ tone: 'info', title: 'Применены исключения', text: w.excluded.join(', ') });
        return out;
      });

      // Точки без плана на дату не мешают считать дату «рассчитанной»
      const planned = computed(() => shown.value.filter(p => p.locked || p.dishes));
      const lockedAll = computed(() => planned.value.length > 0 && planned.value.every(p => p.locked));
      const lockedSome = computed(() => lockedAll.value ? [] : planned.value.filter(p => p.locked));
      // Точки, где пересчёт что-то изменит, и сколько позиций он не тронет (уже отмечены)
      const recalcPoints = computed(() => future.value ? shown.value.filter(p => p.recalc) : []);
      const recalcKept = computed(() => recalcPoints.value.reduce((s, p) => s + p.recalc.kept, 0));
      // Свежие тех. карты нужны и для записи, и для пересчёта записанного
      const cardsLink = computed(() => writable.value.length > 0 || (future.value && planned.value.some(p => p.locked)));

      // Записываются все точки без заготовок на эту дату, где есть что записать
      const writable = computed(() => data.value ? data.value.points.filter(p => !p.locked && p.rows.length) : []);
      const writableRows = computed(() => writable.value.reduce((s, p) => s + p.rows.length, 0));

      const summary = computed(() => {
        const day = dayShort(calc.date).toLowerCase();
        if (calc.done === calc.date) return 'Заготовки на ' + day + ' записаны — точки увидят их в своём окне';
        if (writable.value.length) {
          const n = writable.value.length;
          return 'Запишем ' + writableRows.value + ' ' + plural(writableRows.value, ['строку', 'строки', 'строк']) +
            ' · ' + n + ' ' + plural(n, ['точка', 'точки', 'точек']) + ' · на ' + day;
        }
        if (data.value && data.value.points.every(p => p.locked || !p.dishes)) {
          return data.value.points.some(p => p.locked) ? 'Заготовки на ' + day + ' уже записаны' : 'На ' + day + ' плана нет';
        }
        return 'Нечего записывать — у блюд плана нет тех. карт';
      });

      const btnText = computed(() => calc.saving ? 'Записываем…' : !writable.value.length && lockedAll.value ? 'Уже рассчитано' : 'Записать');

      const emptyTitle = computed(() => point.value && !point.value.dishes ? 'Плана нет' : 'Заготовок нет');
      const emptyText = computed(() => point.value && !point.value.dishes
        ? 'План на ' + dayLabel.value + ' ещё не отправлен — это делается в «Автоплане».'
        : 'В плане нет блюд с тех. картой или все блюда уже отмечены.');

      const dmy = d => d.slice(8, 10) + '.' + d.slice(5, 7) + '.' + d.slice(2, 4);

      // Из каких блюд набирается заготовка (по разбивке «Детально»): блюдо — по всем показанным точкам вместе
      const openPrep = ref('');
      const togglePrep = name => { openPrep.value = openPrep.value === name ? '' : name; };
      function sourcesOf(name) {
        const by = {};
        for (const d of detailRows.value) {
          if (d.smoothie) continue;
          const hit = d.preps.find(x => x[0] === name);
          if (!hit) continue;
          const x = by[d.dish] = by[d.dish] || { dish: d.dish, unit: d.unit, qty: 0, amount: 0, emojis: [], cardFrom: d.cardFrom };
          x.qty = Math.round((x.qty + d.qty) * 1000) / 1000;
          x.amount = Math.round((x.amount + hit[1]) * 10000) / 10000;
          if (!x.emojis.includes(d.emoji || d.point)) x.emojis.push(d.emoji || d.point);
        }
        return Object.values(by).sort((a, b) => b.amount - a.amount);
      }
      // У записанных точек (завтра и позже) разбивка — по нынешним тех. картам
      const freshSrc = computed(() => future.value && shown.value.some(p => p.locked));
      const smoothiesWith = name => [...new Set(detailRows.value.filter(d => d.smoothie && d.preps.some(x => x[0] === name)).map(d => d.dish))].sort((a, b) => a.localeCompare(b, 'ru'));
      watch(() => [calc.date, pt.value], () => { openPrep.value = ''; });
      const detailRows = computed(() => (data.value ? data.value.detail : [])
        .filter(d => !pt.value || d.tt === pt.value)
        .map(d => Object.assign({}, d, { point: pointOf(d.tt).name, emoji: pointOf(d.tt).emoji })));
      const detailNote = computed(() => {
        if (!data.value) return '';
        const locked = shown.value.filter(p => p.locked);
        // Завтра и позже у записанных точек — разбивка по нынешним тех. картам (так посчитает «Пересчитать»)
        if (locked.length && future.value && detailRows.value.some(d => d.fresh)) {
          return 'Блюда без отметки и сколько каждой заготовки идёт на них. У точек с записанными заготовками — по нынешним тех. картам: так их посчитает «Пересчитать».';
        }
        if (locked.length && !detailRows.value.length) return 'Заготовки уже записаны — разбивка по блюдам показывается до записи.';
        if (locked.length) return 'У точек с записанными заготовками разбивка не показывается.';
        return detailRows.value.length ? 'Блюда без отметки и сколько каждой заготовки идёт на них.' : 'Нет блюд для разбивки.';
      });

      // Уже посчитанная дата — сразу на экране и пересчитывается в фоне (план могли поправить)
      function setDate(date) {
        if (date !== calc.date) Object.assign(calc, { cmp: null, error: '', allDone: null, allError: '', recalcDone: null, recalcError: '' });
        loadCalc(date);
      }
      // Свежие тех. карты могут добавить дни, где раньше нечего было записать
      const reload = fresh => loadCalc(calc.date, fresh).then(() => { if (fresh) loadPending(); });

      async function commit() {
        ask.value = false;
        const date = calc.date;
        calc.saving = true;
        try {
          await callApi('admin.prep.commit', { date });
          calc.done = date;
          await loadCalc(date);
        } catch (e) {
          if (e.code !== 'AUTH') calc.error = e.message;
          if (e.code === 'CONFLICT') loadCalc(date);
        } finally {
          calc.saving = false;
          loadPending();
        }
      }

      // Все дни без заготовок разом. Предпросмотры этих дней устарели — открытый день перечитываем
      async function commitAll() {
        askAll.value = false;
        const dates = (calc.pending || []).map(d => d.date);
        Object.assign(calc, { allSaving: true, allDone: null, allError: '' });
        try {
          const r = await callApi('admin.prep.commitAll', { dates });
          calc.allDone = r;
          calc.pending = [];
          for (const d of r.days) if (d.date !== calc.date) delete calc.byDate[d.date];
          if (r.days.some(d => d.date === calc.date)) {
            calc.done = calc.date;
            await loadCalc(calc.date);
          }
        } catch (e) {
          if (e.code !== 'AUTH') calc.allError = e.message;
        } finally {
          calc.allSaving = false;
          loadPending();
        }
      }

      // Пересчёт дней (открытого — только точек tts). Предпросмотры этих дней устарели — открытый перечитываем
      async function recalc(dates, tts) {
        askRecalc.value = false;
        askRecalcAll.value = false;
        Object.assign(calc, { recalcing: true, recalcDone: null, recalcError: '' });
        try {
          const r = await callApi('admin.prep.recalc', { dates, tts });
          calc.recalcDone = Object.assign(r, { changes: r.days.reduce((s, d) => s + d.changes, 0) });
          calc.stale = (calc.stale || []).filter(d => !r.days.some(x => x.date === d.date));
          for (const d of r.days) if (d.date !== calc.date) delete calc.byDate[d.date];
          if (r.days.some(d => d.date === calc.date)) await loadCalc(calc.date);
        } catch (e) {
          if (e.code !== 'AUTH') calc.recalcError = e.message;
          if (e.code === 'CONFLICT') loadCalc(calc.date);
        } finally {
          calc.recalcing = false;
          loadPending();
        }
      }

      async function compare() {
        calc.cmpLoading = true;
        calc.cmp = null;
        try {
          calc.cmp = await callApi('admin.prep.compare', { date: calc.date });
        } catch (e) {
          if (e.code !== 'AUTH') calc.cmp = { error: e.message, diffCount: 1 };
        } finally {
          calc.cmpLoading = false;
        }
      }

      // Обычно заготовки считают на завтра
      // Дни без заготовок — после расчёта дня: тех. карты к этому времени уже в кеше сервера
      onMounted(() => {
        const date = calc.date || addDays(store.today, 1);
        calc.date = date;
        loadCalc(date).then(loadPending);
      });

      return {
        store, calc, tab, pt, ask, askAll, data, dayLabel, point, mainRows, smoothies, warnings, lockedAll, lockedSome,
        writable, summary, btnText, emptyTitle, emptyText, detailRows, detailNote, dmy, openPrep, togglePrep, sourcesOf, smoothiesWith, freshSrc,
        pendingN, pendingShown, pendingRange, pendingNoCard, pointName, pointEmoji,
        askRecalc, askRecalcAll, future, staleN, staleShown, staleRange, recalcPoints, recalcKept, cardsLink,
        setDate, reload, commit, commitAll, recalc, compare, fmt, plural, asset, dayShort,
      };
    },
  };


  // ================================================================== Архив

  const ar = reactive({ rows: [], loading: false, error: '', truncated: false, employees: [] });
  const STATUS = {
    done: { cls: 'done', label: 'Готово' },
    partial: { cls: 'partial', label: 'Частично' },
    none: { cls: 'error', label: 'Не сделано' },
    rest: { cls: 'partial', label: 'Остаток не доделан' },   // строка на недоделанное после «Частично», не отмеченная
  };

  // Сводка архива по периодам: к уже открытому периоду возвращаемся без ожидания
  const sm = reactive({ byKey: {}, loading: false, error: '' });
  const CIRC = 2 * Math.PI * 60;

  const ArchiveView = {
    template: '#tpl-archive',
    setup() {
      const tab = ref('sum');
      const f = reactive({ from: addDays(store.today, -6), to: store.today, tt: '', kind: '', status: '', employee: '', q: '' });
      const sort = reactive({ key: 'date', dir: -1 });
      const page = ref(1);
      const csvDone = ref(false);
      const more = ref(false);
      const activeFilters = computed(() => [f.tt, f.kind, f.status, f.employee].filter(Boolean).length);
      const PER = 50;
      let seq = 0;
      let typing = null;

      async function query() {
        if (tab.value !== 'rows' || !f.from || !f.to || f.from > f.to) return;
        const my = ++seq;
        ar.loading = true;
        ar.error = '';
        try {
          const r = await callApi('admin.archive.query', Object.assign({}, f));
          if (my !== seq) return;
          Object.assign(ar, { rows: r.rows, truncated: r.truncated, employees: r.employees });
          page.value = 1;
        } catch (e) {
          if (my === seq && e.code !== 'AUTH') ar.error = e.message;
        } finally {
          if (my === seq) ar.loading = false;
        }
      }
      watch(() => [tab.value, f.from, f.to, f.tt, f.kind, f.status, f.employee], query);
      watch(() => f.q, () => { clearTimeout(typing); typing = setTimeout(query, 500); });

      // ---------- Сводка: счётчики с сервера, фильтры точки и вида — на устройстве
      const sf = reactive({ tt: '', kind: '' });
      const sp = reactive({ from: addDays(store.today, -6), to: store.today });   // период сводки (у строк — свой)
      const PERIODS = [{ v: 'yesterday', label: 'Вчера' }, { v: 'week', label: '7 дней' }, { v: 'month', label: '30 дней' }];
      const KINDS = [{ v: '', label: 'Всё' }, { v: 'dishes', label: 'Блюда' }, { v: 'preps', label: 'Заготовки' }];
      const period = computed(() => {
        const y = addDays(store.today, -1);
        if (sp.from === y && sp.to === y) return 'yesterday';
        if (sp.to === store.today && sp.from === addDays(store.today, -6)) return 'week';
        if (sp.to === store.today && sp.from === addDays(store.today, -29)) return 'month';
        return '';
      });
      function setPeriod(v) {
        const y = addDays(store.today, -1);
        if (v === 'yesterday') Object.assign(sp, { from: y, to: y });
        else Object.assign(sp, { from: addDays(store.today, v === 'week' ? -6 : -29), to: store.today });
      }

      const summaryKey = () => sp.from + '|' + sp.to;
      const summary = computed(() => sm.byKey[summaryKey()] || null);
      async function loadSummary(force) {
        if (!sp.from || !sp.to || sp.from > sp.to) return;
        const key = summaryKey();
        if (sm.byKey[key] && !force) return;
        sm.loading = true;
        sm.error = '';
        try {
          const r = await callApi('admin.archive.summary', { from: sp.from, to: sp.to });
          sm.byKey[r.from + '|' + r.to] = r;
        } catch (e) {
          if (e.code !== 'AUTH' && key === summaryKey()) sm.error = e.message;
        } finally {
          sm.loading = false;
        }
      }
      watch(() => [tab.value, sp.from, sp.to], () => { if (tab.value === 'sum') loadSummary(); });
      onMounted(() => loadSummary());

      const groups = computed(() => (summary.value ? summary.value.groups : [])
        .filter(g => (!sf.tt || g.tt === sf.tt) && (!sf.kind || g.kind === sf.kind)));
      // Остаток не доделан (rest) — не отдельная позиция, а недоделанная часть «Частично»: в позиции и «Не сделано» не входит
      const blank = () => ({ n: 0, done: 0, partial: 0, none: 0, rest: 0, over: 0, plan: 0, fact: 0 });
      const add = (t, g) => { if (g.st !== 'rest') t.n += g.n; t[g.st] += g.n; t.over += g.over; t.plan += g.plan; t.fact += g.fact; return t; };
      const tot = computed(() => groups.value.reduce(add, blank()));

      // Кольцо: готово → частично → не сделано
      const donut = computed(() => {
        const s = tot.value;
        const total = s.n || 1;
        let offset = 0;
        const segments = [['done', s.done], ['partial', s.partial], ['todo', s.none]].map(([cls, n]) => {
          const seg = { cls, len: CIRC * n / total, offset };
          offset += seg.len;
          return seg;
        });
        return {
          segments,
          legend: [['Готово', s.done, 'done'], ['Частично', s.partial, 'partial'], ['Не сделано', s.none, 'todo']].map(([label, n, cls]) => ({ label, n, cls })),
        };
      });

      // Все дни периода, и пустые (день без строк — тоже видно)
      const byDay = computed(() => {
        const out = [];
        if (!summary.value) return out;
        const from = summary.value.from, to = summary.value.to;
        const dates = [];
        for (let d = from; d <= to; d = addDays(d, 1)) dates.push(d);
        // Длинный период — подписан каждый N-й день, чтобы подписи не налезали
        const step = dates.length > 14 ? Math.ceil(dates.length / 8) : 1;
        const idx = {};
        dates.forEach((d, i) => {
          const label = i % step ? '' : Number(d.slice(8)) + (i === 0 || d.slice(8) === '01' ? '.' + d.slice(5, 7) : '');
          idx[d] = Object.assign(blank(), { date: d, label });
          out.push(idx[d]);
        });
        for (const g of groups.value) if (idx[g.date]) add(idx[g.date], g);
        return out;
      });
      const dayTitle = d => MF.day(d.date) + ': ' + (d.n ? 'готово ' + d.done + ', частично ' + d.partial + ', не сделано ' + d.none + (d.rest ? ', остаток не доделан ' + d.rest : '') : 'строк нет');

      const byPoint = computed(() => store.points.map(p => {
        const list = (summary.value ? summary.value.groups : []).filter(g => g.tt === p.tt && (!sf.kind || g.kind === sf.kind));
        const t = list.reduce(add, blank());
        const kind = k => list.filter(g => g.kind === k).reduce(add, blank());
        const d = kind('dishes'), pr = kind('preps');
        return Object.assign(t, {
          tt: p.tt, name: p.name, emoji: p.emoji, days: new Set(list.map(g => g.date)).size,
          metrics: [{ label: 'Блюда', done: d.done + d.partial, total: d.n }, { label: 'Заготовки', done: pr.done + pr.partial, total: pr.n }]
            .filter(m => !sf.kind || m.total),
          bad: t.n > 0 && t.none / t.n > 0.1,
        });
      }).filter(t => t.n));

      // Что чаще всего не делают (или делают частично): сколько раз за период
      const topNames = computed(() => {
        const by = {};
        for (const x of summary.value ? summary.value.names : []) {
          if ((sf.tt && x.tt !== sf.tt) || (sf.kind && x.kind !== sf.kind)) continue;
          if (x.st === 'rest') continue;   // недоделанный остаток — в «Частично», не «не сделано»
          const r = by[x.kind + '|' + x.name] = by[x.kind + '|' + x.name] || { kind: x.kind, name: x.name, none: 0, partial: 0, tts: [] };
          r[x.st] += x.n;
          if (!r.tts.includes(x.tt)) r.tts.push(x.tt);
        }
        return Object.values(by).sort((a, b) => (b.none * 2 + b.partial) - (a.none * 2 + a.partial)).slice(0, 10);
      });

      const byEmp = computed(() => {
        const by = {};
        for (const g of groups.value) {
          if (!g.emp || g.st === 'none' || g.st === 'rest') continue;
          const e = by[g.emp] = by[g.emp] || { name: g.emp, n: 0, partial: 0, over: 0, dishes: 0, preps: 0 };
          e.n += g.n;
          e[g.kind] += g.n;
          if (g.st === 'partial') e.partial += g.n;
          e.over += g.over;
        }
        return Object.values(by).sort((a, b) => b.n - a.n);
      });

      // Из сводки — в строки: те же период, точка и вид плюс то, на что нажали
      function drill(extra) {
        Object.assign(f, { from: sp.from, to: sp.to, tt: sf.tt, kind: sf.kind, status: '', employee: '', q: '' }, extra);
        tab.value = 'rows';
        window.scrollTo(0, 0);
      }

      const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
      const num = n => Math.round(n).toLocaleString('ru-RU');
      const pointRef = tt => store.points.find(p => p.tt === tt) || { name: tt, emoji: '' };
      const pointEmoji = tt => pointRef(tt).emoji || pointRef(tt).name;
      const pointLabel = tt => (pointRef(tt).emoji ? pointRef(tt).emoji + ' ' : '') + pointRef(tt).name;

      const pointOf = tt => store.points.find(p => p.tt === tt);
      const rows = computed(() => {
        const k = sort.key;
        const val = r => k === 'amount' || k === 'fact' ? (r[k] == null ? -1 : r[k]) : String(r[k] || '');
        return ar.rows.slice()
          .sort((a, b) => (val(a) > val(b) ? 1 : val(a) < val(b) ? -1 : 0) * sort.dir)
          .map(r => {
            const pt = pointOf(r.tt);
            // Остаток не доделан: в «План» и «Факт» — первая операция, сколько осталось — в статусе
            const left = r.status === 'rest' && r.root;
            return Object.assign({}, r, {
              dateLabel: r.date.slice(8, 10) + '.' + r.date.slice(5, 7) + '.' + r.date.slice(2, 4),
              ttLabel: pt ? pt.emoji + ' ' + pt.name : r.tt,
              unplanned: !r.rest && /^Вне плана/.test(r.comment || ''),
              showPlan: left ? r.root.plan : r.amount,
              showFact: left ? r.root.made : r.fact,
              statusText: STATUS[r.status].label + (r.status === 'rest' && r.amount != null ? ' · ' + fmt(r.amount) + (r.unit ? ' ' + r.unit : '') : ''),
            });
          });
      });
      const pageCount = computed(() => Math.max(1, Math.ceil(rows.value.length / PER)));
      const pageRows = computed(() => rows.value.slice((page.value - 1) * PER, page.value * PER));
      // Не больше 7 кнопок страниц вокруг текущей
      const pages = computed(() => {
        const n = pageCount.value;
        if (n <= 1) return [];
        const start = Math.max(1, Math.min(page.value - 3, n - 6));
        return Array.from({ length: Math.min(7, n) }, (_, i) => start + i);
      });
      const info = computed(() => ar.loading ? 'Загружаем…'
        : rows.value.length ? 'Показано ' + pageRows.value.length + ' из ' + rows.value.length : '');

      const heads = [
        { label: 'Дата', key: 'date' }, { label: 'Точка', key: 'tt' }, { label: 'Позиция', key: 'name' }, { label: 'Тип', key: 'kind' },
        { label: 'План', key: 'amount', num: true }, { label: 'Факт', key: 'fact', num: true },
        { label: 'Статус', key: 'status' }, { label: 'Сотрудник', key: 'employee' },
      ];
      function sortBy(key) {
        if (sort.key === key) sort.dir = -sort.dir;
        else Object.assign(sort, { key, dir: key === 'date' ? -1 : 1 });
        page.value = 1;
      }

      // CSV для Excel: точка с запятой, десятичная запятая, BOM — чтобы кириллица открылась сразу
      function csv() {
        const cell = v => {
          const s = v == null ? '' : typeof v === 'number' ? fmt(v) : String(v);
          return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
        };
        const lines = [['Дата', 'Точка', 'Тип', 'Позиция', 'Набор (лимонад, смузи)', 'Строка', 'План', 'Факт', 'Ед.', 'Статус', 'Первая операция: план / сделано', 'Сотрудник', 'Комментарий']]
          .concat(rows.value.map(r => [r.date, r.tt, r.kind === 'dishes' ? 'Блюдо' : 'Заготовка', r.name, r.dishFor,
            r.rest ? 'Остаток' : r.unplanned ? 'Вне плана' : '', r.amount, r.fact, r.unit, STATUS[r.status].label,
            r.root ? fmt(r.root.plan) + ' / ' + fmt(r.root.made) : '', r.employee, r.comment]));
        const blob = new Blob(['﻿' + lines.map(l => l.map(cell).join(';')).join('\r\n')], { type: 'text/csv;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'архив_' + f.from + '_' + f.to + '.csv';
        document.body.appendChild(a);
        a.click();
        setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
        csvDone.value = true;
        setTimeout(() => { csvDone.value = false; }, 1800);
      }

      // Правка строки — только руководителю (раздел 5 ТЗ)
      const canEdit = store.user.role === 'owner';
      const ed = reactive({ open: false, row: null, fact: '', status: 'done', comment: '', saving: false, error: '' });
      function edit(r) {
        if (!canEdit) return;
        Object.assign(ed, { open: true, row: r, fact: r.fact == null ? '' : fmt(r.fact), status: r.status === 'rest' ? 'none' : r.status, comment: r.comment, error: '' });
      }
      async function saveEdit() {
        Object.assign(ed, { saving: true, error: '' });
        try {
          const r = await callApi('owner.archive.update', { kind: ed.row.kind, uid: ed.row.uid, fact: ed.fact, status: ed.status, comment: ed.comment });
          const src = ar.rows.find(x => x.uid === r.uid && x.kind === ed.row.kind);
          if (src) Object.assign(src, { fact: r.fact, status: src.rest && r.status === 'none' ? 'rest' : r.status, comment: r.comment });
          ed.open = false;
        } catch (e) {
          if (e.code !== 'AUTH') ed.error = e.message;
        } finally {
          ed.saving = false;
        }
      }

      return {
        canEdit, ed, edit, saveEdit,
        EDIT_STATUS: [{ v: 'done', label: 'Готово' }, { v: 'partial', label: 'Частично' }, { v: 'none', label: 'Не сделано' }],
        store, ar, f, sort, page, pages, pageRows, rows, info, heads, sortBy, csv, csvDone, query, more, activeFilters,
        employees: computed(() => ar.employees), STATUS, fmt, asset,
        tab, sm, sf, sp, PERIODS, KINDS, period, setPeriod, summary, loadSummary, tot, donut, CIRC, byDay, dayTitle, byPoint, topNames, byEmp,
        drill, pct, num, plural, initials: C.initials, pointEmoji, pointLabel,
      };
    },
  };


  // ================================================================== Сотрудники

  const EmployeesView = {
    template: '#tpl-employees',
    setup() {
      const list = ref(null);
      const newName = ref('');
      const confirm = ref('');
      const busy = ref('');
      const error = ref('');

      async function call(method, params, mark) {
        busy.value = mark;
        error.value = '';
        try {
          list.value = (await callApi(method, params)).list;
          return true;
        } catch (e) {
          if (e.code !== 'AUTH') error.value = e.message;
          return false;
        } finally {
          busy.value = '';
        }
      }
      async function add() {
        if (await call('admin.employees.add', { name: newName.value }, '+')) newName.value = '';
      }
      async function remove(name) {
        if (await call('admin.employees.remove', { name }, name)) confirm.value = '';
      }

      onMounted(() => call('admin.employees', {}, ''));
      return { list, newName, confirm, busy, error, add, remove, initials: C.initials };
    },
  };


  // ================================================================== Интеграции

  const IntegrationsView = {
    template: '#tpl-integrations',
    setup() {
      const status = ref(null);
      const running = ref('');
      const error = ref('');

      const when = C.atText;

      async function load() {
        try { status.value = await callApi('admin.iiko.status'); } catch (e) { if (e.code !== 'AUTH') error.value = e.message; }
      }
      async function run(kind) {
        running.value = kind;
        error.value = '';
        try {
          status.value = kind === 'night' ? (await callApi('admin.iiko.nightly')).status : await callApi('admin.iiko.sync', { kind });
        } catch (e) {
          if (e.code !== 'AUTH') error.value = e.message;
          await load();
        } finally {
          running.value = '';
        }
      }

      // ---- Фото блюд: план → оригиналы по 3 → уменьшение в браузере → сохранение
      const ph = reactive({ phase: 'idle', total: 0, done: 0, failed: 0, message: '', tone: '' });
      const recent = ref([]);
      // «Всё сразу» (ночная синхронизация) — первой
      const syncList = computed(() => (status.value || []).filter(s => s.kind !== 'photos').sort((a, b) => (b.kind === 'night') - (a.kind === 'night')));
      const photoStatus = computed(() => (status.value || []).find(s => s.kind === 'photos'));
      const photoCount = computed(() => Object.keys(store.photos).length);

      async function loadPhotos() {
        Object.assign(ph, { phase: 'plan', total: 0, done: 0, failed: 0, message: '' });
        try {
          const plan = await callApi('admin.photos.plan');
          if (!plan.withImage) {
            Object.assign(ph, {
              tone: 'banner--warning',
              message: 'В iiko у блюд справочника нет картинок кнопок.' + (plan.fields.length ? ' Поля продукта в ответе iiko: ' + plan.fields.join(', ') : ''),
            });
            return;
          }
          Object.assign(ph, { phase: 'load', total: plan.todo.length });
          let firstError = '';
          const missing = [];   // ссылка на картинку есть, а в iiko её нет
          for (let i = 0; i < plan.todo.length; i += 3) {
            const part = plan.todo.slice(i, i + 3);
            let got = [];
            try {
              got = await callApi('admin.photos.fetch', { imageIds: part.map(x => x.imageId) });
            } catch (e) {
              if (e.code === 'AUTH') throw e;
              ph.failed += part.length;
              firstError = firstError || e.message;
              got = null;
            }
            const items = [];
            for (const x of got ? part : []) {
              const g = got.find(y => y.imageId === x.imageId);
              if (g && g.missing) { missing.push(x.name); continue; }
              try {
                if (!g || g.error) throw new Error(g && g.error ? 'iiko ответил: ' + g.error : 'iiko не прислал картинку');
                items.push({ id: x.id, imageId: x.imageId, name: x.name, thumb: await toThumb(g.data, g.mime) });
              } catch (e) {
                ph.failed++;
                firstError = firstError || x.name + ' — ' + e.message;
              }
            }
            // Первые две пачки целиком не загрузились — дальше будет то же самое, останавливаемся
            if (!ph.done && !items.length && ph.failed >= Math.min(6, plan.todo.length - missing.length)) {
              throw new Error('Фото не загружаются. ' + firstError);
            }
            if (!items.length) continue;
            await callApi('admin.photos.save', { items });
            for (const it of items) {
              setPhoto(it.id, it.imageId, it.thumb);
              recent.value = [it.thumb].concat(recent.value).slice(0, 8);
            }
            ph.done += items.length;
          }
          const text = (ph.done ? 'Загружено новых: ' + ph.done : 'Новых фото нет') +
            (ph.failed ? ' · не загрузилось: ' + ph.failed : '') +
            ' · с фото ' + (plan.loaded + ph.done) + ' из ' + plan.withImage + ' блюд с картинкой в iiko' +
            (missing.length ? ' · в iiko картинка не найдена: ' + missing.slice(0, 5).join(', ') + (missing.length > 5 ? ' и ещё ' + (missing.length - 5) : '') : '');
          await callApi('admin.photos.save', { items: [], remove: plan.stale, finish: { text, failed: ph.failed } });
          plan.stale.forEach(id => { delete store.photos[id]; });
          Object.assign(ph, {
            message: text + (firstError ? '. Пример ошибки: ' + firstError : ''),
            tone: ph.failed ? 'banner--warning' : 'banner--success',
          });
          await load();
        } catch (e) {
          if (e.code === 'AUTH') return;
          Object.assign(ph, { message: e.message, tone: 'banner--error' });
          // Итог неудачного запуска — тоже в «Последний запуск»
          try { await callApi('admin.photos.save', { items: [], finish: { text: e.message.slice(0, 200), failed: 1 } }); await load(); } catch (x) { /* не важно */ }
        } finally {
          ph.phase = 'idle';
        }
      }

      onMounted(load);
      return { store, status, running, error, when, run, ph, recent, syncList, photoStatus, photoCount, loadPhotos, plural };
    },
  };

  // Квадрат 192×192 (обрезка по центру), JPEG — ~15 КБ: на карточке фото 52 px, запас на чёткие экраны
  function toThumb(base64, mime) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const S = 192;
        const canvas = document.createElement('canvas');
        canvas.width = S;
        canvas.height = S;
        const g = canvas.getContext('2d');
        const k = Math.max(S / img.width, S / img.height);
        g.fillStyle = '#ffffff';   // прозрачный PNG — на белом
        g.fillRect(0, 0, S, S);
        g.drawImage(img, (S - img.width * k) / 2, (S - img.height * k) / 2, img.width * k, img.height * k);
        let q = 0.82;
        let uri = canvas.toDataURL('image/jpeg', q);
        while (uri.length > 46000 && q > 0.4) { q -= 0.12; uri = canvas.toDataURL('image/jpeg', q); }
        resolve(uri);
      };
      img.onerror = () => reject(new Error('картинка не открылась (' + (mime || 'тип неизвестен') + ', ' + Math.round(base64.length * 0.75 / 1024) + ' КБ)'));
      img.src = 'data:' + (mime || 'image/jpeg') + ';base64,' + base64;
    });
  }


  // ================================================================== Заготовки Салат БАЗА: загрузка экрана

  let saladPart = null;
  // HTML с сервера: стили и шаблоны остаются на странице, скрипты выполняются заново (как «Упаковка»)
  function loadSalad() {
    if (C.salad) return Promise.resolve();
    if (!saladPart) {
      saladPart = callApi('salad.ui').then(html => {
        const box = document.createElement('div');
        box.hidden = true;
        box.innerHTML = html;
        const scripts = [...box.querySelectorAll('script')].filter(s => !s.type || s.type === 'text/javascript');
        scripts.forEach(s => s.remove());
        document.body.appendChild(box);
        scripts.forEach(s => { const el = document.createElement('script'); el.textContent = s.textContent; document.body.appendChild(el); });
        if (!C.salad) throw new Error('Экран «Заготовки Салат БАЗА» не загрузился');
      }).catch(e => { saladPart = null; throw e; });
    }
    return saladPart;
  }

  // ---------------------------------------------------------------- «Исправили ошибку» в салат-базе (26–28.10)
  // Признак — store.salad.notice (сервер: waSaladAccess_, всем с разделом). Ждёт, пока закроют обучение и новости;
  // «Понятно» — через 10 секунд. Закрыли — до перезагрузки страницы не показывается
  const SaladNotice = {
    template: '#tpl-salad-notice',
    setup() {
      const SEC = 10;
      const open = ref(false);
      const left = ref(0);
      const seen = ref(false);
      let timer = null;
      const ready = computed(() => !seen.value && store.phase === 'app' && !!(store.salad && store.salad.notice)
        && !(C.training && C.training.state.open) && !(C.news && C.news.state.queue.length));
      function show() {
        if (open.value || !ready.value) return;
        open.value = true;
        left.value = SEC;
        clearInterval(timer);
        timer = setInterval(() => { if (--left.value <= 0) clearInterval(timer); }, 1000);
      }
      function close() {
        if (left.value > 0) return;
        seen.value = true;
        open.value = false;
      }
      // Пауза — чтобы слайды новостей, открывающиеся при входе, успели встать первыми
      watch(ready, on => { if (on) setTimeout(show, 400); }, { immediate: true });
      onBeforeUnmount(() => clearInterval(timer));
      return { open, left, close };
    },
  };


  const SaladLoaderView = {
    template: '#tpl-salad-loader',
    setup() {
      const comp = Vue.shallowRef(C.salad ? C.salad.SaladView : null);
      const error = ref('');
      async function load() {
        error.value = '';
        try { await loadSalad(); comp.value = C.salad.SaladView; } catch (e) { if (e.code !== 'AUTH') error.value = e.message; }
      }
      onMounted(() => { if (!comp.value) load(); });
      return { comp, error, load };
    },
  };


  C.admin = { components: { DashboardView, CalcView, ArchiveView, EmployeesView, IntegrationsView, DayPicker, SaladView: SaladLoaderView, SaladNotice }, openCalc };

})(window.MFC);
</script>

  <!-- Аналитика (запрос 2026-10-08): сверка «сделано по приложению» с продажами и списаниями iiko.
     Строка — точка × блюдо за день или период; расхождение больше допуска из «Настроек» — красным.
     Сверху закреплены итоги: сделано, продано + списано, разница, доля расхождений. -->

<script type="text/x-template" id="tpl-analytics">
  <div class="page wa-an">
    <div class="page-head">
      <h1 class="h-screen page-head__title">Аналитика</h1>
      <button type="button" class="sync-indicator wa-sync-btn" :disabled="an.loading" @click="load(true)" aria-label="Обновить продажи из iiko">

<script>
(function (C) {
  if (!C) return;

  const { reactive, ref, computed, watch, onMounted } = Vue;
  const { store, MF, asset, callApi, addDays, atText, initials } = C;
  const fmt = MF.fmt;

  // Ответы по периодам: к открытому дню возвращаемся без ожидания
  const an = reactive({ to: '', span: 1, byKey: {}, loading: false, error: '' });
  const fl = reactive({ tt: '', emp: '', tab: 'dishes', show: '', q: '' });

  const AnalyticsView = {
    template: '#tpl-analytics',
    components: { DayPicker: C.admin.components.DayPicker },
    setup() {
      // По умолчанию — вчера: сегодняшние продажи ещё идут. Дата нужна до первой отрисовки
      if (!an.to) an.to = addDays(store.today, -1);
      const limit = ref(100);
      const fromOf = () => addDays(an.to, 1 - an.span);
      const key = () => fromOf() + '|' + an.to;
      const data = computed(() => an.byKey[key()] || null);

      let seq = 0;
      async function load(fresh) {
        const k = key();
        if (an.byKey[k] && !fresh) return;
        const my = ++seq;
        an.loading = true;
        an.error = '';
        try {
          const r = await callApi('admin.analytics', { from: fromOf(), to: an.to, fresh: !!fresh });
          an.byKey[r.from + '|' + r.to] = r;
        } catch (e) {
          if (my === seq && e.code !== 'AUTH') an.error = e.message;
        } finally {
          if (my === seq) an.loading = false;
        }
      }
      const setDate = d => { an.to = d > store.today ? store.today : d; limit.value = 100; load(); };
      const setSpan = n => { an.span = n; limit.value = 100; load(); };
      watch(() => [fl.tt, fl.emp, fl.tab, fl.show, fl.q], () => { limit.value = 100; });

      // ---------- Расхождение: |сделано − нужно| больше допуска (% от большего и не меньше abs)
      const isBad = (made, need, abs) => {
        const t = data.value.tol;
        const diff = Math.abs(made - need);
        return diff > 1e-9 && diff >= abs - 1e-9 && diff > t.pct / 100 * Math.max(made, need) + 1e-9;
      };
      const pointRef = tt => store.points.find(p => p.tt === tt) || { tt, name: tt, emoji: '' };
      const pointLabel = tt => (pointRef(tt).emoji ? pointRef(tt).emoji + ' ' : '') + pointRef(tt).name;
      const shortName = n => { const [a, b] = String(n).split(/\s+/); return b ? a + ' ' + b[0] + '.' : a; };
      const whoText = emp => Object.entries(emp || {}).sort((a, b) => b[1] - a[1]).map(([e, q]) => (e === '—' ? 'без имени' : shortName(e)) + ' ' + fmt(q)).join(', ');
      const match = r => !fl.q || r.name.toLowerCase().includes(fl.q.trim().toLowerCase());
      const byEmpFilter = r => !fl.emp || (r.emp && r.emp[fl.emp] > 0);

      // Блюда: точка, сотрудник — фильтры итогов; «показать» и поиск — только списка
      const enrich = r => {
        const demand = Math.round((r.sold + r.wo) * 1000) / 1000;
        const diff = Math.round((r.made - demand) * 1000) / 1000;
        return Object.assign({}, r, { key: r.tt + '|' + r.name, demand, diff, bad: isBad(r.made, demand, data.value.tol.abs), who: whoText(r.emp) });
      };
      const dishRows = computed(() => !data.value ? [] : data.value.dishes
        .filter(r => (!fl.tt || r.tt === fl.tt) && byEmpFilter(r)).map(enrich));
      const SHOW = [
        { v: '', label: 'Все' }, { v: 'bad', label: 'Расхождения', cls: 'wa-an-chip--bad' },
        { v: 'surplus', label: 'Излишек' }, { v: 'shortage', label: 'Недостача' },
        { v: 'nomark', label: 'Без отметки' }, { v: 'nosale', label: 'Без продаж' },
      ];
      const showOk = (r, v) => !v || (v === 'bad' ? r.bad : v === 'surplus' ? r.bad && r.diff > 0 : v === 'shortage' ? r.bad && r.diff < 0
        : v === 'nomark' ? !r.made && r.demand > 0 : v === 'nosale' ? r.made > 0 && !r.demand : true);
      const order = (a, b) => (b.bad - a.bad) || (Math.abs(b.diff) - Math.abs(a.diff)) || a.name.localeCompare(b.name, 'ru');
      const dishShown = computed(() => dishRows.value.filter(r => showOk(r, fl.show) && match(r)).sort(order));
      const dishPage = computed(() => dishShown.value.slice(0, limit.value));
      const showCount = computed(() => Object.fromEntries(SHOW.map(s => [s.v, dishRows.value.filter(r => showOk(r, s.v)).length])));
      // «Без отметки» и «Без продаж» — только когда такие есть
      const showChips = computed(() => SHOW.filter(s => !['nomark', 'nosale'].includes(s.v) || showCount.value[s.v] || fl.show === s.v));
      watch(() => fl.tab, t => { if (t === 'preps' && ['nomark', 'nosale'].includes(fl.show)) fl.show = ''; });

      // Заготовки: допуск — только процент (кг и л — дробные), разница от 0,01
      const prepRows = computed(() => !data.value ? [] : data.value.preps
        .filter(r => (!fl.tt || r.tt === fl.tt) && byEmpFilter(r))
        .map(r => {
          const diff = Math.round((r.made - r.need) * 1000) / 1000;
          return Object.assign({}, r, { key: r.tt + '|' + r.name, diff, bad: isBad(r.made, r.need, 0.01), who: whoText(r.emp) });
        }));
      const prepShown = computed(() => prepRows.value.filter(r => showOk(Object.assign({ demand: r.need }, r), fl.show) && match(r)).sort(order));
      const prepPage = computed(() => prepShown.value.slice(0, limit.value));
      const prepCount = computed(() => Object.fromEntries(SHOW.map(s => [s.v, prepRows.value.filter(r => showOk(Object.assign({ demand: r.need }, r), s.v)).length])));

      // ---------- Итоги
      function sumRows(rows) {
        const t = { made: 0, plan: 0, sold: 0, wo: 0, demand: 0, diff: 0, surplus: 0, shortage: 0, rows: rows.length, bad: 0,
          notMarked: 0, notMarkedQty: 0, notSold: 0, accBase: 0, accErr: 0 };
        for (const r of rows) {
          t.made += r.made; t.plan += r.plan; t.sold += r.sold; t.wo += r.wo; t.demand += r.demand; t.diff += r.diff;
          if (r.diff > 0) t.surplus += r.diff; else t.shortage -= r.diff;
          if (r.bad) t.bad++;
          if (!r.made && r.demand > 0) { t.notMarked++; t.notMarkedQty += r.demand; }
          if (r.made > 0 && !r.demand) t.notSold++;
          if (r.plan > 0 || r.demand > 0) { t.accBase += r.demand; t.accErr += Math.abs(r.plan - r.demand); }
        }
        t.diffBad = isBad(t.made, t.demand, data.value.tol.abs);
        t.planAcc = t.accBase > 0 ? Math.max(0, Math.round((1 - t.accErr / t.accBase) * 100)) : null;
        t.badPct = t.rows ? Math.round(t.bad / t.rows * 100) : 0;
        return t;
      }
      const k = computed(() => data.value ? sumRows(dishRows.value) : sumRows([]));

      // Точки — всегда все (выбранная подсвечена), с учётом фильтра сотрудника
      const byPoint = computed(() => {
        if (!data.value) return [];
        const all = data.value.dishes.filter(byEmpFilter);
        return store.points.map(p => Object.assign(sumRows(all.filter(r => r.tt === p.tt).map(enrich)), { tt: p.tt, name: p.name, emoji: p.emoji }))
          .filter(p => p.rows);
      });

      // Сотрудник: блюда, которые он отмечал; разница строки — по его доле в сделанном
      const byEmp = computed(() => {
        if (!data.value) return [];
        const by = {};
        const get = e => by[e] = by[e] || { name: e, made: 0, rows: 0, bad: 0, surplus: 0, shortage: 0, preps: 0 };
        for (const r of dishRows.value) {
          for (const [e, q] of Object.entries(r.emp || {})) {
            if (e === '—' || !(q > 0)) continue;
            const x = get(e);
            const share = r.made ? q / r.made : 0;
            x.made += q;
            x.rows++;
            if (r.bad) x.bad++;
            if (r.diff > 0) x.surplus += r.diff * share; else x.shortage -= r.diff * share;
          }
        }
        for (const r of prepRows.value) for (const [e, q] of Object.entries(r.emp || {})) if (e !== '—' && by[e]) by[e].preps += q;
        return Object.values(by).map(x => Object.assign(x, { badPct: x.rows ? Math.round(x.bad / x.rows * 100) : 0 }))
          .sort((a, b) => b.badPct - a.badPct || b.made - a.made);
      });

      // По дням (период): итоги дня по выбранной точке
      const byDay = computed(() => {
        if (!data.value) return [];
        const by = {};
        for (const d of data.value.daily) {
          if (fl.tt && d.tt !== fl.tt) continue;
          const x = by[d.date] = by[d.date] || { date: d.date, made: 0, demand: 0 };
          x.made += d.made;
          x.demand += d.sold + d.wo;
        }
        return Object.values(by).sort((a, b) => b.date.localeCompare(a.date))
          .map(x => Object.assign(x, { diff: x.made - x.demand, diffBad: isBad(x.made, x.demand, data.value.tol.abs) }));
      });

      const employees = computed(() => {
        const set = new Set();
        for (const r of data.value ? data.value.dishes.concat(data.value.preps) : []) for (const e of Object.keys(r.emp || {})) if (e !== '—') set.add(e);
        if (fl.emp) set.add(fl.emp);
        return [...set].sort((a, b) => a.localeCompare(b, 'ru'));
      });

      const TABS = [{ v: 'dishes', label: 'Блюда', short: 'Блюда' }, { v: 'preps', label: 'Заготовки', short: 'Загот.' },
        { v: 'points', label: 'Точки', short: 'Точки' }, { v: 'emps', label: 'Сотрудники', short: 'Сотр.' }];
      const pickPoint = tt => { fl.tt = fl.tt === tt ? '' : tt; fl.tab = 'dishes'; window.scrollTo(0, 0); };
      const pickEmp = e => { fl.emp = fl.emp === e ? '' : e; fl.tab = 'dishes'; window.scrollTo(0, 0); };
      const openShow = v => { fl.show = v; fl.tab = 'dishes'; };
      const openDay = d => { an.span = 1; setDate(d); fl.tab = 'dishes'; window.scrollTo(0, 0); };

      const num = n => (Math.round(n * 10) / 10).toLocaleString('ru-RU');
      const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
      // «+2», «−0,36», «0»; большие числа — с пробелами между разрядами
      const signed = n => {
        const v = Math.round(n * 1000) / 1000;
        const a = Math.abs(v) >= 1000 ? num(Math.abs(v)) : fmt(Math.abs(v));
        return v > 0 ? '+' + a : v < 0 ? '−' + a : '0';
      };
      const MON = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
      const dayShort = d => MF.day(d).split(', ')[0] + ', ' + Number(d.slice(8)) + ' ' + MON[Number(d.slice(5, 7)) - 1];
      const periodLabel = computed(() => an.span === 1 ? MF.day(an.to).toLowerCase() : dayShort(fromOf()).toLowerCase() + ' – ' + dayShort(an.to).toLowerCase());

      onMounted(() => load());

      return {
        store, an, fl, data, load, setDate, setSpan, limit, TABS, SHOW, showChips, showCount, prepCount,
        dishRows, dishShown, dishPage, prepRows, prepShown, prepPage, k, byPoint, byEmp, byDay, employees,
        pickPoint, pickEmp, openShow, openDay, pointLabel, num, pct, signed, fmt, dayShort, periodLabel, atText, initials, asset,
      };
    },
  };

  C.analytics = { components: { AnalyticsView } };

})(window.MFC);
</script>

        <div class="wa-switch-row">
          <span><b>Активен</b><small>Заблокированный не войдёт, открытые сессии закроются</small></span>
          <button type="button" class="switch" role="switch" :aria-checked="form.active ? 'true' : 'false'"
                  :disabled="form.login === store.user.login" @click="form.active = !form.active" aria-label="Активен"></button>

        <p v-if="!form.isNew" class="wa-hint">Обучение: {{ form.training ? 'пройдено ' + atText(form.training) : 'ещё не пройдено — откроется при входе' }}</p>

            <svg class="icon icon--sm"><use href="#i-key"></use></svg>Сбросить пароль
          </button>
          <button type="button" class="btn btn--ghost" :disabled="!!busy" @click="ask('logout')">

            <svg class="icon icon--sm"><use href="#i-undo"></use></svg>Пройти обучение заново
          </button>

        <div v-if="form.confirm" class="banner banner--warning" role="alert">

            ? 'Старый пароль перестанет работать, все устройства выйдут. Новый покажем один раз.'

    </div>
    <div class="sheet-backdrop" :class="{ 'is-open': form.open }" @click="form.open = false"></div>

    <!-- Новый пароль: показывается один раз -->

          <div class="wa-news-pub__ltitle">Опубликованные и запланированные · хранятся сегодня и вчера</div>
          <div v-for="n in newsList" :key="n.id" class="wa-news-pub__item">

            <span class="wa-news-pub__kind">{{ NEWS_KINDS[n.kind] || 'Новость' }}</span>

            <button type="button" class="wa-news-pub__a" @click="showNews(n)">Показать</button>

          </div>
