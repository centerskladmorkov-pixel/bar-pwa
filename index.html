.wa-dir-card { display: flex; flex-direction: column; gap: 10px; padding: var(--space-4); border: 1.5px solid transparent; cursor: pointer; transition: border-color var(--dur), box-shadow var(--dur); animation: fadeUp 260ms var(--ease) both; }
.wa-dir-card--open { border-color: var(--accent); }
.wa-dir-card__head { display: flex; align-items: flex-start; gap: var(--space-3); }
.wa-dir-card__title { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.wa-dir-card__title b { font-size: 15px; line-height: 1.25; color: var(--text-brand); }
.wa-dir-card__title span { font-size: 13px; color: var(--text-muted); }
.wa-dir-card__place { margin-top: 0; color: var(--text); }
.wa-dir-card__row { display: flex; justify-content: space-between; padding-top: 10px; border-top: 1px solid var(--border); font-size: var(--fs-sm); color: var(--text-muted); }
.wa-dir-card__row b { color: var(--text-brand); }

@media (min-width: 768px) {
html[data-layout="auto"] .wa-dir-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
html[data-layout="auto"] .wa-hero__title { font-size: 30px; }

}

html[data-layout="tablet"] .wa-dir-grid, html[data-layout="desktop"] .wa-dir-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
html[data-layout="tablet"] .wa-hero__title, html[data-layout="desktop"] .wa-hero__title { font-size: 30px; }


@media (min-width: 1280px) {
html[data-layout="auto"] .wa-dir-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }

}

html[data-layout="desktop"] .wa-dir-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }



/* ===================================================================== Правки по отзыву с телефона */

/* Фильтры: на телефоне кнопки в одну строку без прокрутки (три или с «Планом на завтра» четыре) — число сверху,
   подпись снизу. Колонка не уже самого длинного слова («выполнению»): узкий экран или крупный шрифт телефона
   сужают остальные, а не вытесняют текст за край; углы — не «таблеткой», чтобы подпись не срезало закруглением */
.wa-filter-chips { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(min-content, 1fr); gap: 6px; overflow: visible; }
.wa-filter-chips .chip {
  flex-direction: column; justify-content: center; gap: 2px; height: auto; min-height: 54px; padding: 6px 5px;
  border-radius: 16px; font-size: 12px; line-height: 1.15; white-space: normal; text-align: center;
}
.wa-filter-chips .chip__count,
.wa-filter-chips .chip[aria-pressed="true"] .chip__count {
  order: -1; min-width: 0; height: auto; padding: 0; background: transparent;
  font: 700 18px/1 var(--font-display); color: inherit;
}

/* Компактная шапка точки на телефоне: одна строка; дата и смена — мелко под названием */
.app-header { padding: 8px var(--space-4); gap: 0; }
.app-header__row { gap: 10px; }
.app-header .point-avatar { width: 34px; height: 34px; border-radius: 10px; font-size: 18px; }
.app-header__name { font-size: 15px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.app-header__date { font-size: 12px; line-height: 1.3; }
.wa-header-line { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wa-header-line b { font-weight: 700; color: var(--text-brand); }
.wa-header-line__empty { font-weight: 700; color: var(--accent); }
.app-header .wa-header-actions .btn--icon { width: 40px; min-height: 40px; }
.app-header .wa-header-actions .icon { width: 20px; height: 20px; }
.app-header .app-header__shift { display: none; }

/* Автостатус «больше плана»: сохранить можно, администратор увидит перевыполнение */
.auto-status--over { background: var(--accent-soft); color: var(--text); }
.auto-status--over .auto-status__dot { background: var(--accent); }

/* Настройки устройства: тема и вид экрана */
.wa-device { display: flex; flex-direction: column; gap: var(--space-4); }
.wa-device__row { display: flex; flex-direction: column; gap: var(--space-2); }
.wa-device__label { font-size: 13px; font-weight: 700; color: var(--text-muted); }
.wa-device .tabs { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); width: 100%; }
.wa-device .tabs__tab { padding: 0 6px; font-size: 13px; }

/* Планшет и ПК: шапка и фильтры как в макетах */
@media (min-width: 768px) {
html[data-layout="auto"] .wa-filter-chips { display: flex; }
html[data-layout="auto"] .wa-filter-chips .chip {
    flex-direction: row; gap: var(--space-2); height: 44px; min-height: 0; padding: 0 14px;
    border-radius: var(--radius-pill); font-size: var(--fs-sm); line-height: inherit; white-space: nowrap;
  }
html[data-layout="auto"] .wa-filter-chips .chip__count {
    order: 0; min-width: 22px; height: 22px; padding: 0 6px; background: var(--surface-2);
    font: 700 var(--fs-xs)/1 var(--font-body);
  }
html[data-layout="auto"] .wa-filter-chips .chip[aria-pressed="true"] .chip__count { background: color-mix(in oklab, var(--bg) 22%, transparent); }
html[data-layout="auto"] .app-header { padding: var(--space-4) var(--space-6); gap: 10px; }
html[data-layout="auto"] .app-header .point-avatar { width: 44px; height: 44px; border-radius: 14px; font-size: 24px; }
html[data-layout="auto"] .app-header__name { font-size: 17px; }
html[data-layout="auto"] .app-header__date { font-size: 13px; }
html[data-layout="auto"] .wa-header-line .wa-header-line__shift { display: none; }
html[data-layout="auto"] .app-header .wa-header-actions .btn--icon { width: var(--tap); min-height: var(--tap); }
html[data-layout="auto"] .app-header .wa-header-actions .icon { width: 24px; height: 24px; }
html[data-layout="auto"] .app-header .app-header__shift { display: flex; }
html[data-layout="auto"] .wa-device .tabs { width: auto; }
html[data-layout="auto"] .wa-device__row { flex-direction: row; align-items: center; justify-content: space-between; }

}

html[data-layout="tablet"] .wa-filter-chips, html[data-layout="desktop"] .wa-filter-chips { display: flex; }
html[data-layout="tablet"] .wa-filter-chips .chip, html[data-layout="desktop"] .wa-filter-chips .chip {
    flex-direction: row; gap: var(--space-2); height: 44px; min-height: 0; padding: 0 14px;
    border-radius: var(--radius-pill); font-size: var(--fs-sm); line-height: inherit; white-space: nowrap;
  }
html[data-layout="tablet"] .wa-filter-chips .chip__count, html[data-layout="desktop"] .wa-filter-chips .chip__count {
    order: 0; min-width: 22px; height: 22px; padding: 0 6px; background: var(--surface-2);
    font: 700 var(--fs-xs)/1 var(--font-body);
  }
html[data-layout="tablet"] .wa-filter-chips .chip[aria-pressed="true"] .chip__count, html[data-layout="desktop"] .wa-filter-chips .chip[aria-pressed="true"] .chip__count { background: color-mix(in oklab, var(--bg) 22%, transparent); }
html[data-layout="tablet"] .app-header, html[data-layout="desktop"] .app-header { padding: var(--space-4) var(--space-6); gap: 10px; }
html[data-layout="tablet"] .app-header .point-avatar, html[data-layout="desktop"] .app-header .point-avatar { width: 44px; height: 44px; border-radius: 14px; font-size: 24px; }
html[data-layout="tablet"] .app-header__name, html[data-layout="desktop"] .app-header__name { font-size: 17px; }
html[data-layout="tablet"] .app-header__date, html[data-layout="desktop"] .app-header__date { font-size: 13px; }
html[data-layout="tablet"] .wa-header-line .wa-header-line__shift, html[data-layout="desktop"] .wa-header-line .wa-header-line__shift { display: none; }
html[data-layout="tablet"] .app-header .wa-header-actions .btn--icon, html[data-layout="desktop"] .app-header .wa-header-actions .btn--icon { width: var(--tap); min-height: var(--tap); }
html[data-layout="tablet"] .app-header .wa-header-actions .icon, html[data-layout="desktop"] .app-header .wa-header-actions .icon { width: 24px; height: 24px; }
html[data-layout="tablet"] .app-header .app-header__shift, html[data-layout="desktop"] .app-header .app-header__shift { display: flex; }
html[data-layout="tablet"] .wa-device .tabs, html[data-layout="desktop"] .wa-device .tabs { width: auto; }
html[data-layout="tablet"] .wa-device__row, html[data-layout="desktop"] .wa-device__row { flex-direction: row; align-items: center; justify-content: space-between; }



/* Полоска синхронизации вверху экрана: бежит, пока сервер сохраняет в фоне;
   зелёная — сохранено; красная — ошибка (позиция вернулась, подробности в уведомлении) */
.wa-syncbar { position: fixed; top: 0; left: 0; right: 0; z-index: 90; height: 3px; overflow: hidden; pointer-events: none; opacity: 0; transition: opacity 400ms var(--ease); }
.wa-syncbar::before { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 100%; background: var(--accent); transform-origin: left; }
.wa-syncbar--saving, .wa-syncbar--done, .wa-syncbar--error { opacity: 1; }
.wa-syncbar--saving::before { width: 40%; animation: wa-sync 1.1s var(--ease) infinite; }
.wa-syncbar--done::before { background: var(--fresh); animation: wa-sync-done 450ms var(--ease) both; }
.wa-syncbar--error { height: 4px; }
.wa-syncbar--error::before { background: var(--danger); }
@keyframes wa-sync { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
@keyframes wa-sync-done { from { transform: scaleX(.4); } to { transform: scaleX(1); } }

/* Смузи: строка «Отметить все по плану» */
.wa-check--all { background: transparent; box-shadow: inset 0 0 0 1.5px var(--border-strong); }
.wa-check--all .wa-check__name { font-weight: 700; color: var(--text-brand); }
.wa-check--all .wa-check__box .icon { opacity: .35; transform: none; color: var(--text-brand); }

/* «Ещё»: блок устройства под списком */
.wa-more + .wa-device { margin-top: var(--space-2); }

/* ===================================================================== Кабинет администратора */

/* Админ открыл точку с дашборда: «←» в шапке точки */
.app-header .wa-back { width: 36px; min-height: 40px; margin-left: -6px; }

/* Дашборд: шапка страницы. Телефон — заголовок и «Обновлено» в строку, ниже дата и вкладки */
.wa-dash .page-head { gap: var(--space-2) var(--space-3); }
.wa-dash .page-head__title { flex: 1 1 auto; }
.wa-sync-btn { justify-content: center; width: 40px; height: 40px; padding: 0; border: 0; border-radius: 50%; background: transparent; font: inherit; font-size: 13px; color: var(--text-muted); cursor: pointer; }
.wa-sync-btn .spinner { width: 16px; height: 16px; border-width: 2px; color: var(--text-brand); }
.wa-sync-icon { width: 22px; height: 22px; color: var(--text-brand); }
.wa-sync-btn .sync-indicator__dot, .wa-sync-text { display: none; }
.wa-dash__controls { flex: 1 1 100%; display: flex; align-items: center; gap: var(--space-2); }
.wa-dash__controls .date-picker { flex: 1; min-width: 0; justify-content: space-between; }
.wa-dash__controls .date-picker__btn { width: 36px; flex: none; }
.wa-date-label { min-width: 0; padding: 0; border: 0; background: transparent; color: var(--text-brand); font: inherit; font-size: 14px; font-weight: 700; white-space: nowrap; cursor: pointer; }
.wa-date-label .icon, .wa-date-full { display: none; }
.wa-dash__controls .tabs { flex: none; }
.wa-dash__controls .tabs__tab { padding: 0 9px; font-size: 13px; }

/* Общий прогресс: на телефоне кольцо меньше и рядом с полосами */
.wa-dash .network-summary { grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: var(--space-4); padding: var(--space-4); }
.wa-dash .network-summary__ring { width: 96px; height: 96px; }
.wa-dash .network-summary__alerts { grid-column: 1 / -1; gap: 0; }
.wa-dash .network-summary__bars { gap: 10px; }
.wa-dash .network-summary__bars .metric { grid-template-columns: 74px minmax(0, 1fr) 52px; }
.wa-net-label { display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
.wa-dash .progress-ring--lg .wa-net-label { font-size: 24px; }
.wa-net-label small { margin-top: 4px; font: 500 12px var(--font-body); color: var(--text-muted); }

/* «Требуют внимания»: строка ведёт на точку */
.wa-alerts-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-2); }
.wa-alert-btn { width: 100%; min-height: 36px; padding: 4px 0; border: 0; background: transparent; color: var(--text); font: inherit; font-size: var(--fs-sm); text-align: left; cursor: pointer; }
.wa-alert-ok { min-height: 36px; font-weight: 700; color: var(--fresh); }
.wa-alert-ok .icon { stroke-width: 2.4; }
.wa-link { align-self: flex-start; padding: 6px 0; border: 0; background: transparent; color: var(--accent); font: inherit; font-size: var(--fs-sm); font-weight: 700; cursor: pointer; }

/* Плитка точки — кнопка перехода в режим точки */
.wa-tile { cursor: pointer; }
.wa-tile:active { transform: scale(.99); }
.wa-tile__title { flex: 1; min-width: 0; }
.point-tile__pct.wa-pct--done { color: var(--fresh); }
.wa-badge-icon { width: 14px; height: 14px; stroke-width: 2; flex: none; }
.wa-badge-wrap { height: auto; min-height: 28px; padding-top: 4px; padding-bottom: 4px; line-height: 1.25; white-space: normal; }

/* План: таблица на планшете и ПК, карточки на телефоне */
.wa-plan-table { display: none; }
.wa-plan-grouprow td { height: 40px; background: var(--surface-2); font-size: var(--fs-xs); font-weight: 700; letter-spacing: var(--ls-caps); text-transform: uppercase; color: var(--text-muted); }
.wa-plan-list { display: flex; flex-direction: column; gap: var(--space-4); }
.wa-plan-group { display: flex; flex-direction: column; gap: var(--space-2); }
.wa-plan-group__title { display: flex; justify-content: space-between; padding: 0 4px; }
.wa-plan-item { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-radius: var(--radius-md); background: var(--surface); box-shadow: var(--shadow-sm); }
.wa-plan-item__head { display: flex; align-items: baseline; gap: var(--space-3); }
.wa-plan-item__head b { flex: 1; min-width: 0; font-size: 15px; line-height: 1.25; color: var(--text-brand); }
.wa-plan-item__total { flex: none; font: 700 20px var(--font-display); color: var(--text-brand); }
.wa-plan-item__total small { margin-left: 4px; font: 500 12px var(--font-body); color: var(--text-muted); }
.wa-plan-item__by { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; font-weight: 700; }
.wa-plan-item__by .is-empty { font-weight: 500; color: var(--text-muted); }
.wa-inline-icon { display: inline-block; margin-right: 6px; vertical-align: -3px; }
/* Столбцы точек — по ширине чисел, остальное место — названию блюда */
.wa-plan-table .is-num { width: 1%; white-space: nowrap; }

/* ---------------------------------------------------------------- Расчёт заготовок */
.wa-calc-loading { display: flex; align-items: center; gap: var(--space-4); }
.wa-calc-loading .spinner { flex: none; width: 28px; height: 28px; border-width: 3px; color: var(--accent); }
.wa-calc-loading b { color: var(--text-brand); }

/* Точки: на телефоне «Все» и значки в один ряд без прокрутки, имя выбранной — строкой ниже */
.wa-pt-chips { overflow: visible; gap: 6px; }
.wa-pt-chips .chip { flex: 1 1 0; min-width: 0; justify-content: center; gap: 0; padding: 0 6px; font-size: 18px; }
.wa-pt-chips .chip:first-child { flex: none; padding: 0 14px; font-size: var(--fs-sm); }
.wa-chip-name { display: none; }
.wa-chip-lock { width: 12px; height: 12px; margin-left: 4px; opacity: .7; }
.wa-pt-title { margin-top: calc(-1 * var(--space-2)); font-size: var(--fs-sm); font-weight: 700; color: var(--text-muted); }

.wa-calc-grid { display: flex; flex-direction: column; gap: var(--space-4); }
.wa-calc-side { display: flex; flex-direction: column; gap: var(--space-3); }
.wa-calc-card { display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-4); }
.wa-warn { display: flex; gap: 10px; padding: 10px 12px; border-radius: 12px; font-size: var(--fs-sm); line-height: 1.35; }
.wa-warn b { display: block; }
.wa-warn > span:last-child > span { color: var(--text-muted); }
.wa-warn__dot { flex: none; width: 8px; height: 8px; margin-top: 6px; border-radius: 50%; }
.wa-warn--err { background: var(--danger-soft); }
.wa-warn--err .wa-warn__dot { background: var(--danger); }
.wa-warn--warn { background: var(--partial-soft); }
.wa-warn--warn .wa-warn__dot { background: var(--partial); }
.wa-warn--info { background: var(--surface-2); }
.wa-warn--info .wa-warn__dot { background: var(--text-muted); }
.wa-calc-sm { display: flex; justify-content: space-between; gap: var(--space-3); padding: 8px 0; border-top: 1px solid var(--border); font-size: var(--fs-sm); }
.wa-calc-sm small { color: var(--text-muted); }
.wa-calc-sm b { flex: none; font-family: var(--font-display); color: var(--text-brand); }
.wa-calc-sm b small { font: 500 12px var(--font-body); }

/* Таблица заготовок: на телефоне — строка-карточка (название и количество, ниже группа и место) */
.wa-calc-table { overflow: hidden; }
.wa-calc-row {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "name qty" "meta qty";
  column-gap: var(--space-3); row-gap: 2px; align-items: center; padding: 10px var(--space-4); border-bottom: 1px solid var(--border);
}
.wa-calc-row:last-child { border-bottom: 0; }
.wa-calc-row--head { display: none; }
/* Заготовка → из каких блюд: строка нажимается, ниже раскрывается список */
.wa-calc-row--tap { cursor: pointer; }
.wa-calc-row--tap:hover, .wa-calc-row--tap.is-open { background: var(--surface-2); }
.wa-calc-src { display: flex; flex-direction: column; gap: 6px; padding: 8px var(--space-4) 12px; border-bottom: 1px solid var(--border); background: var(--surface-2); }
.wa-calc-src__title { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; }
.wa-calc-src__row { display: flex; align-items: baseline; gap: var(--space-3); font-size: var(--fs-sm); }
.wa-calc-src__dish { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; font-weight: 700; }
.wa-calc-src__dish small { font-weight: 500; font-size: 12px; color: var(--text-muted); }
.wa-calc-src__qty { flex: none; white-space: nowrap; font-variant-numeric: tabular-nums; }
.wa-calc-src__qty small { font-weight: 500; color: var(--text-muted); }
.wa-calc-src .wa-hint { margin: 0; }
.wa-calc-tip { margin: 0; padding: 10px var(--space-4); font-size: 12px; }
.wa-calc-row__name { grid-area: name; font-size: 15px; font-weight: 700; line-height: 1.25; }
.wa-calc-row__group { display: none; }
.wa-calc-row__place { grid-area: meta; font-size: 13px; color: var(--text-muted); }
.wa-calc-row__qty { grid-area: qty; text-align: right; white-space: nowrap; font: 700 18px var(--font-display); color: var(--text-brand); }
.wa-calc-row__qty small { font: 500 12px var(--font-body); color: var(--text-muted); }

/* «Детально» */
.wa-detail-grid { display: grid; gap: var(--space-3); grid-template-columns: 1fr; }
.wa-detail-grid > .wa-hint { grid-column: 1 / -1; }
.wa-detail { display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-4); }
.wa-detail .tech-card { padding: 0; box-shadow: none; background: transparent; }
.wa-detail__head { display: flex; align-items: baseline; gap: var(--space-3); }
.wa-detail__head b { flex: 1; min-width: 0; font-size: 15px; line-height: 1.25; color: var(--text-brand); }
.wa-detail__qty { flex: none; font: 700 18px var(--font-display); color: var(--text-brand); }
.wa-detail__qty small { font: 500 12px var(--font-body); color: var(--text-muted); }

/* Панель действия внизу экрана: над нижним меню на телефоне */
.wa-actionbar {
  position: sticky; bottom: calc(var(--bottom-nav-h) + env(safe-area-inset-bottom) + var(--space-2)); z-index: 5;
  display: flex; align-items: center; gap: var(--space-3); padding: 12px 12px 12px var(--space-4);
  border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-md);
}
.wa-actionbar__text { flex: 1; min-width: 0; font-size: 13px; line-height: 1.35; color: var(--text-muted); }
.wa-actionbar .btn { flex: none; }
.wa-actionbar__ok { display: flex; align-items: center; gap: 8px; min-height: var(--tap); font-weight: 700; color: var(--fresh); animation: pop 300ms var(--ease) both; }
.wa-actionbar__ok .icon { stroke-width: 2.6; }
.wa-calc-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 4px var(--space-4); margin-top: calc(-1 * var(--space-2)); }

/* Все дни без заготовок: плашка над расчётом дня и список дней в подтверждении */
.wa-pending, .wa-stale { padding-top: 10px; padding-bottom: 10px; }
.wa-pending .btn--secondary, .wa-stale .btn--secondary { flex: none; padding: 0 var(--space-4); font-size: var(--fs-sm); }
.wa-pending .btn--icon, .wa-stale .btn--icon { flex: none; }
.wa-pending .spinner, .wa-stale .spinner { flex: none; }
.wa-pending-list { display: flex; flex-direction: column; gap: 8px; max-height: 280px; overflow-y: auto; }
.wa-pending-day { display: flex; align-items: baseline; gap: var(--space-3); font-size: var(--fs-sm); }
.wa-pending-day b { flex: none; width: 104px; }
.wa-pending-day__pts { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wa-pending-day__n { flex: none; font-size: 13px; color: var(--text-muted); white-space: nowrap; }
/* Пересчёт: было → станет */
.wa-recalc { gap: 6px; }
.wa-recalc__pt { font-size: var(--fs-sm); margin-top: 4px; }
.wa-recalc__row { display: flex; align-items: baseline; gap: var(--space-3); font-size: var(--fs-sm); }
.wa-recalc__name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.wa-recalc__name small { color: var(--text-muted); }
.wa-recalc__qty { flex: none; white-space: nowrap; font-weight: 700; font-variant-numeric: tabular-nums; }
.wa-recalc__qty small { font-weight: 500; color: var(--text-muted); }
.wa-recalc__qty.is-up { color: var(--fresh); }
.wa-recalc__qty.is-down { color: var(--accent); }
.wa-link:disabled { opacity: .5; }

/* ---------------------------------------------------------------- Закрытие дня */
.wa-close-points { display: grid; grid-template-columns: 1fr; gap: var(--space-2); }
.wa-close-pt {
  display: flex; align-items: center; gap: var(--space-3); min-height: 60px; padding: 8px 14px;
  border: 2px solid transparent; border-radius: var(--radius-md); background: var(--surface); box-shadow: var(--shadow-sm);
  color: var(--text); text-align: left; transition: border-color var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
}
.wa-close-pt:active:not(:disabled) { transform: scale(.98); }
.wa-close-pt.is-on { border-color: var(--accent); }
.wa-close-pt:disabled { opacity: .55; box-shadow: none; }
.wa-close-pt__box { flex: none; width: 26px; height: 26px; border: 2px solid var(--border-strong); border-radius: 8px; display: grid; place-items: center; color: var(--on-accent); transition: all var(--dur-fast); }
.wa-close-pt__box .icon { width: 15px; height: 15px; stroke-width: 3; opacity: 0; }
.wa-close-pt.is-on .wa-close-pt__box { background: var(--accent); border-color: var(--accent); }
.wa-close-pt.is-on .wa-close-pt__box .icon { opacity: 1; }
.wa-close-pt__emoji { font-size: 22px; line-height: 1; }
.wa-close-pt__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.wa-close-pt__body b { font-size: 15px; line-height: 1.2; color: var(--text-brand); hyphens: auto; overflow-wrap: anywhere; }
.wa-close-pt__body small { font-size: 12px; line-height: 1.3; color: var(--text-muted); }

.wa-close-grid, .wa-close-side { display: flex; flex-direction: column; gap: var(--space-4); }
.wa-donut-card { display: flex; align-items: center; gap: var(--space-5); }
.wa-donut { position: relative; flex: none; width: 132px; height: 132px; }
.wa-donut svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.wa-donut__track { fill: none; stroke: var(--border); stroke-width: 22; }
.wa-donut__seg { fill: none; stroke-width: 22; transition: stroke-dasharray 600ms var(--ease), stroke-dashoffset 600ms var(--ease); }
.wa-donut__seg--done { stroke: var(--fresh); }
.wa-donut__seg--partial { stroke: var(--partial); }
.wa-donut__seg--todo { stroke: var(--accent); }
.wa-donut__label { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.wa-donut__label b { font: 700 28px/1 var(--font-display); color: var(--text-brand); }
.wa-donut__label span { margin-top: 4px; font-size: 12px; color: var(--text-muted); }
.wa-donut__legend { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.wa-donut__row { display: flex; align-items: center; gap: 10px; font-size: 15px; }
.wa-donut__row span:nth-child(2) { flex: 1; }
.wa-donut__row b { font-family: var(--font-display); color: var(--text-brand); }
.wa-donut__swatch { flex: none; width: 12px; height: 12px; border-radius: 4px; }
.wa-donut__swatch--done { background: var(--fresh); }
.wa-donut__swatch--partial { background: var(--partial); }
.wa-donut__swatch--todo { background: var(--accent); }

.wa-unfinished { display: flex; flex-direction: column; gap: 4px; background: var(--accent-soft); box-shadow: none; }
.wa-unfinished__title { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; font-size: 16px; font-weight: 700; }
.wa-unfinished__title .icon { color: var(--accent); }
.wa-unfinished__row { display: flex; justify-content: space-between; gap: var(--space-3); padding: 8px 0; border-top: 1px solid var(--border); font-size: var(--fs-sm); }
.wa-unfinished__row span:first-child { flex: 1; min-width: 0; }
.wa-unfinished__row span:last-child { flex: none; text-align: right; font-size: 13px; white-space: nowrap; color: var(--text-muted); }
.wa-unfinished .wa-hint { margin-top: 4px; }
.wa-unfinished--ok { background: var(--fresh-soft); }
.wa-unfinished--ok .wa-unfinished__title { margin: 0; color: var(--fresh); }
.wa-unfinished--ok .wa-unfinished__title .icon { color: var(--fresh); stroke-width: 2.4; }
.wa-actionbar--static { position: static; }

.wa-open-days { display: flex; flex-direction: column; gap: var(--space-3); }
.wa-open-days__head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-3); }
.wa-open-days__head .wa-hint { margin-top: 4px; }
.wa-open-days__head .wa-link { flex: none; }
.wa-open-days__list { display: grid; grid-template-columns: 1fr; column-gap: var(--space-5); max-height: 320px; overflow-y: auto; }
.wa-open-day { display: flex; gap: var(--space-3); }
.wa-open-day__date { flex: 1; font-weight: 700; }
.wa-open-day__n { font-size: 13px; color: var(--text-muted); white-space: nowrap; }

/* Окно выгрузки: морковка «взлетает», полоса ждёт ответа сервера */
.wa-upload { display: flex; flex-direction: column; align-items: center; gap: var(--space-4); text-align: center; }
.wa-upload .progress-bar { width: 100%; }
.wa-upload .modal__text { margin: 0; }
.wa-upload .banner { width: 100%; text-align: left; }
.wa-upload__carrot { width: 56px; animation: wa-rise 1.1s ease-in infinite; }
@keyframes wa-rise { 0% { opacity: 0; transform: translateY(14px); } 30% { opacity: 1; } 100% { opacity: 0; transform: translateY(-40px); } }
.wa-done-circle { width: 88px; height: 88px; border-radius: 50%; background: var(--fresh); display: grid; place-items: center; animation: pop 360ms var(--ease) both; }
.wa-done-circle svg { width: 46px; height: 46px; fill: none; stroke: var(--brand-cream); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 40; stroke-dashoffset: 40; animation: draw 400ms 120ms var(--ease) forwards; }

/* ---------------------------------------------------------------- Архив */
.wa-archive .page-head__title { flex: 1 1 auto; }
.wa-archive .page-head .btn { gap: 8px; }
.wa-filters { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2) var(--space-3); }
.wa-filters .field { gap: 4px; }
.wa-filters .field__label { font-size: 12px; }
.wa-filters .field__input { min-width: 0; width: 100%; }
.wa-filters__q, .wa-filters__toggle { grid-column: 1 / -1; }
.wa-filters__toggle { justify-content: center; }
.wa-filters__chevron { transition: transform var(--dur) var(--ease); }
.wa-filters__toggle[aria-pressed="true"] .wa-filters__chevron { transform: rotate(180deg); }
.wa-filters__more { display: none; }
.wa-filters__more.is-open { display: contents; }

.wa-arch { overflow: hidden; transition: opacity var(--dur); }
.wa-arch.is-loading { opacity: .6; }
.wa-arch-row {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "name status" "meta qty";
  column-gap: var(--space-3); row-gap: 4px; align-items: center; padding: 10px var(--space-4); border-bottom: 1px solid var(--border); font-size: var(--fs-sm);
}
.wa-arch-row--head, .wa-arch-row__date, .wa-arch-row__tt, .wa-arch-row__kind, .wa-arch-row__plan, .wa-arch-row__fact, .wa-arch-row__who { display: none; }
.wa-arch-row__name { grid-area: name; min-width: 0; display: flex; flex-direction: column; }
.wa-arch-row__name b { font-size: 15px; line-height: 1.25; }
.wa-arch-row__name small { font-size: 12px; color: var(--text-muted); }
/* Архив: пометки строки — «Остаток» (после «Частично»), «Вне плана» */
.wa-arch-row__marks { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
.wa-arch-row__status { grid-area: status; justify-self: end; }
.wa-arch-row__meta { grid-area: meta; min-width: 0; font-size: 12px; color: var(--text-muted); }
.wa-arch-row__mqty { grid-area: qty; justify-self: end; white-space: nowrap; font-size: 12px; color: var(--text-muted); }
.wa-arch-row__mqty b { font: 700 16px var(--font-display); color: var(--text-brand); }
.wa-arch-row.is-editable { cursor: pointer; transition: background-color var(--dur-fast); }
.wa-arch-row.is-editable:hover { background: var(--surface-2); }
.wa-arch-sort { display: flex; align-items: center; gap: 4px; padding: 0; border: 0; background: transparent; font: inherit; font-size: 13px; font-weight: 700; color: var(--text-muted); cursor: pointer; }
.wa-arch-sort:disabled { cursor: default; }
.wa-arch-sort.is-on { color: var(--text-brand); }
.wa-arch-sort.is-num { justify-content: flex-end; }
.wa-arch-sort span { font-size: 10px; }
.wa-arch-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 12px var(--space-4); }
.wa-arch-foot .wa-hint { flex: 1 1 100%; }
.wa-page { width: 40px; height: 40px; border: 0; border-radius: 12px; background: transparent; color: var(--text); font-weight: 700; }
.wa-page.is-on { background: var(--text-brand); color: var(--bg); }

/* ---------------------------------------------------------------- Сотрудники */
.wa-emp-add { display: flex; gap: var(--space-2); align-items: flex-end; }
.wa-emp-add .field { flex: 1; min-width: 0; }
.wa-emp-add .btn { flex: none; gap: 6px; }
.wa-emp-list { display: flex; flex-direction: column; gap: var(--space-2); }
.wa-emp-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); padding: 10px 10px 10px var(--space-4); }
.wa-emp-row .user-avatar { background: var(--brand-green); color: var(--brand-cream); }
.wa-emp-row__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.wa-emp-row__body b { font-size: 15px; color: var(--text-brand); }
.wa-emp-row__body small { font-size: 12px; color: var(--accent); font-weight: 700; }
.wa-emp-row__confirm { flex-basis: 100%; display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: var(--space-2); }
.wa-emp-row__confirm .wa-hint { flex: 1 1 100%; text-align: right; }

/* ---------------------------------------------------------------- Интеграции */
.wa-int-hero { position: relative; overflow: hidden; padding: 22px 20px; border-radius: var(--radius-lg); background: var(--brand-green-dark); color: var(--brand-cream); }
.wa-int-hero__dome { position: absolute; right: -40px; bottom: -1px; width: 180px; height: 90px; border-radius: 9999px 9999px 0 0; background: var(--brand-green); }
.wa-int-hero__eyebrow { position: relative; font-size: var(--fs-xs); font-weight: 700; letter-spacing: var(--ls-caps); text-transform: uppercase; color: var(--brand-carrot); }
.wa-int-hero__title { position: relative; margin-top: 6px; font: 700 22px/1.2 var(--font-display); }
.wa-int-hero__text { position: relative; max-width: 560px; margin: 8px 0 0; font-size: var(--fs-sm); opacity: .8; }
.wa-int-list { display: flex; flex-direction: column; gap: var(--space-3); }
.wa-int-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); padding: var(--space-4); }
.wa-int-row > .btn { flex: 1 1 100%; }
.wa-int-row__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.wa-int-row__body b { font-size: 16px; color: var(--text-brand); }
.wa-int-row__body small { font-size: 13px; line-height: 1.4; color: var(--text-muted); }
.wa-int-row__body small.is-error { color: var(--danger); }
.wa-int-row .btn { flex: none; gap: 6px; }
.wa-int-row__bar { margin-top: 6px; }
.wa-int-row__bar .progress-bar__fill { width: 40%; animation: wa-sync 1.2s var(--ease) infinite; }
.wa-spin { animation: spin 900ms linear infinite; }

/* ---------------------------------------------------------------- Фото блюд из iiko */
.thumb--photo { overflow: hidden; background: var(--surface-2); }
.thumb.thumb--photo img.wa-photo { width: 100%; height: 100%; object-fit: cover; animation: wa-fade 260ms var(--ease) both; }
@keyframes wa-fade { from { opacity: 0; } to { opacity: 1; } }
.wa-photo-card { display: flex; flex-direction: column; gap: var(--space-3); padding: var(--space-4); }
.wa-photo-card__head { display: flex; align-items: center; gap: var(--space-3); }
.wa-photo-card__head b { flex: 1; font-size: 16px; color: var(--text-brand); }
.wa-photo-card__strip { display: flex; gap: 6px; overflow: hidden; }
.wa-photo-card__strip .thumb { flex: none; width: 44px; height: 44px; border-radius: 12px; }
.wa-photo-card small { font-size: 13px; line-height: 1.4; color: var(--text-muted); }
.wa-photo-card small.is-error { color: var(--danger); }

/* ---------------------------------------------------------------- Справочник: правка (админ) */
.wa-dir-edit { display: flex; flex-direction: column; gap: var(--space-3); padding-top: var(--space-3); border-top: 1px solid var(--border); cursor: default; }
.wa-dir-edit__avail { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); width: 100%; }
.wa-dir-edit__avail .tabs__tab { padding: 0 6px; font-size: 13px; }
/* Автоплан в справочнике: все точки и переключатель у каждой точки */
.wa-dir-plan__sub { display: block; margin: 8px 0 4px; font-size: 12px; font-weight: 700; color: var(--text-muted); }
.wa-dir-plan__pts { display: flex; flex-direction: column; gap: 8px; }
.wa-dir-plan__pt b { font-size: 14px; }
/* Заготовки и смузи: на какой день и через сколько — заготовки следующего дня; в строке заголовка */
/* Узкий экран: день и таймер переносятся в две мелкие строки, шапка остаётся в одну строку */
.screen-head--day { align-items: center; }
.screen-head--day .h-screen, .screen-head--day .screen-head__count { flex: none; white-space: nowrap; }
/* «Лимонады и смузи»: на телефоне — в две строки помельче, день, таймер и счётчик остаются рядом */
.wa-h-sets { font-size: 22px; line-height: 1.05; }
.wa-h-sets span { display: block; }
@media (min-width: 768px) {
html[data-layout="auto"] .wa-h-sets { font-size: var(--fs-2xl); line-height: var(--lh-tight); }
html[data-layout="auto"] .wa-h-sets span { display: inline; }

}

html[data-layout="tablet"] .wa-h-sets, html[data-layout="desktop"] .wa-h-sets { font-size: var(--fs-2xl); line-height: var(--lh-tight); }
html[data-layout="tablet"] .wa-h-sets span, html[data-layout="desktop"] .wa-h-sets span { display: inline; }


.wa-dayline { display: inline-flex; flex: 0 1 auto; flex-wrap: wrap; align-items: center; column-gap: 6px; row-gap: 2px; margin-right: auto; min-width: 0; font-size: 13px; line-height: 1.2; color: var(--text-muted); white-space: nowrap; }
.wa-dayline__day { overflow: hidden; text-overflow: ellipsis; font-weight: 700; color: var(--text-brand); }
.wa-dayline__t { display: inline-flex; flex: none; align-items: center; gap: 3px; padding: 1px 7px 1px 5px; border-radius: var(--radius-pill); background: var(--surface-2); font-size: 12px; font-variant-numeric: tabular-nums; }
/* Таймер идёт в реальном времени: у часиков бежит секундная стрелка, секунды сменяются сдвигом сверху вниз;
   за 10 минут до смены дня — оранжевый, в последнюю минуту — пульсирует */
.wa-clock { flex: none; width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; }
.wa-clock line { transform-origin: 8px 8px; }
.wa-clock__m { animation: wa-clock-spin 3600s linear infinite; }
.wa-clock__s { stroke: var(--accent); stroke-width: 1.1; animation: wa-clock-spin 60s steps(60, end) infinite; }
@keyframes wa-clock-spin { to { transform: rotate(360deg); } }
.wa-clock__c { fill: currentColor; stroke: none; }
.wa-timer { display: inline-flex; font-variant-numeric: tabular-nums; }
.wa-timer__s { position: relative; display: inline-block; width: 2ch; height: 1.2em; overflow: hidden; }
.wa-timer__s > span { display: block; }
.wa-tick-enter-active, .wa-tick-leave-active { transition: transform .3s ease, opacity .3s ease; }
.wa-tick-leave-active { position: absolute; left: 0; top: 0; }
.wa-tick-enter-from { transform: translateY(-70%); opacity: 0; }
.wa-tick-leave-to { transform: translateY(70%); opacity: 0; }
.wa-dayline__t.is-soon { background: color-mix(in oklab, var(--accent) 16%, var(--surface)); color: var(--accent); }
.wa-dayline__t.is-last { animation: wa-timer-pulse 1s ease-in-out infinite; }
@keyframes wa-timer-pulse { 50% { box-shadow: 0 0 0 4px color-mix(in oklab, var(--accent) 22%, transparent); } }
@media (prefers-reduced-motion: reduce) {
  .wa-tick-enter-active, .wa-tick-leave-active { transition: none; }
  .wa-clock line { animation: none; }
  .wa-dayline__t.is-last { animation: none; }
}

/* =====================================================================  Кабинет руководителя */

/* Пользователи: на телефоне — карточка (логин и роль, точки, вход и кнопки), на ПК — таблица */
.wa-users .page-head__title { flex: 1 1 auto; }
.wa-users .page-head .btn { gap: 6px; }
.wa-utable { overflow: hidden; }
.wa-urow {
  display: grid; grid-template-columns: minmax(0, 1fr) auto auto; grid-template-areas: "login login role" "pts pts pts" "last active edit";
  column-gap: var(--space-3); row-gap: 6px; align-items: center; padding: 12px var(--space-4); border-bottom: 1px solid var(--border); font-size: var(--fs-sm);
}
.wa-urow:last-child { border-bottom: 0; }
.wa-urow.is-off { opacity: .55; }
.wa-urow--head, .wa-urow__mode { display: none; }
.wa-urow__login { grid-area: login; min-width: 0; display: flex; flex-direction: column; }
.wa-urow__login b { font-size: 15px; color: var(--text-brand); overflow-wrap: anywhere; }
.wa-urow__login small { font-size: 12px; color: var(--text-muted); }
.wa-urow__role { grid-area: role; justify-self: end; }
.wa-urow__pts { grid-area: pts; }
.wa-urow__last { grid-area: last; font-size: 12px; color: var(--text-muted); }
.wa-urow__active { grid-area: active; }
.wa-urow__edit { grid-area: edit; }
.wa-role--owner { background: var(--brand-green); color: var(--brand-cream); }
.wa-role--admin { background: var(--accent-soft); color: var(--text); }
.wa-role--point { background: var(--surface-2); color: var(--text); }
.switch:disabled { opacity: .5; }

.wa-user-sheet .sheet__body { gap: var(--space-4); }
.wa-seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); width: 100%; }
.wa-seg .tabs__tab { padding: 0 6px; font-size: 13px; }
.wa-seg .tabs__tab:disabled { opacity: .4; }
.wa-chips-wrap { flex-wrap: wrap; overflow: visible; }
.wa-switch-row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); }
.wa-switch-row span { display: flex; flex-direction: column; gap: 2px; }
.wa-switch-row b { font-size: 15px; color: var(--text-brand); }
.wa-switch-row small { font-size: 12px; color: var(--text-muted); }
.wa-switch-row .switch { flex: none; }
.wa-user-actions { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.wa-user-actions .btn { gap: 6px; }
.wa-pw { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 16px; border: 1.5px dashed var(--border-strong); border-radius: var(--radius-md); background: var(--surface); }
.wa-pw__value { flex: 1; min-width: 0; border: 0; background: transparent; font: 700 20px var(--font-display); letter-spacing: .06em; color: var(--text-brand); outline: none; }

/* Настройки: карточки по прототипу */
.wa-set-grid { display: grid; grid-template-columns: 1fr; gap: var(--space-4); align-items: start; }
/* Колонка карточек: карточки идут друг за другом, высота соседней колонки не влияет */
.wa-set-col { display: flex; flex-direction: column; gap: var(--space-4); min-width: 0; }
.wa-set-card { display: flex; flex-direction: column; gap: var(--space-4); padding: var(--space-5) var(--space-4); }
/* «Настройки» → «Обучение»: учётные записи с галочкой «пройдено» */
.wa-tr-list { display: flex; flex-direction: column; gap: 2px; }
.wa-tr-user { align-items: flex-start; padding: 6px 0; min-height: 0; }
.wa-tr-user .checkbox__box { flex: none; margin-top: 1px; }
.wa-tr-user__body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.wa-tr-user__body b { font-size: 15px; color: var(--text-brand); overflow-wrap: anywhere; }
.wa-tr-user__body b small { font-weight: 500; font-size: 13px; color: var(--text-muted); }
.wa-tr-user__body > small { font-size: 12px; color: var(--text-muted); }
.wa-tr-user.is-off { opacity: .6; }

html.wa-news-open, html.wa-news-open body { overflow: hidden; }
.wa-news { position: fixed; inset: 0; z-index: 80; display: flex; align-items: stretch; justify-content: center; background: var(--scrim); animation: wa-fade 220ms var(--ease) both; }
.wa-news__card { position: relative; display: flex; flex-direction: column; width: 100%; height: 100%; overflow: hidden; background: var(--bg); animation: wa-news-in 320ms var(--ease) both; }
@keyframes wa-news-in { from { opacity: 0; transform: translateX(28px) scale(.98); } to { opacity: 1; transform: none; } }
.wa-news__bars { position: absolute; top: calc(12px + env(safe-area-inset-top)); left: 16px; right: 16px; z-index: 2; display: flex; gap: 4px; }
.wa-news__bar { flex: 1; height: 4px; border-radius: var(--radius-pill); background: rgba(249, 245, 221, .35); }
.wa-news__bar.is-done, .wa-news__bar.is-on { background: var(--brand-cream); }
.wa-news__bar.is-on { transform-origin: left; animation: wa-news-bar 700ms var(--ease) both; }
@keyframes wa-news-bar { from { transform: scaleX(.15); } to { transform: none; } }
.wa-news__scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
.wa-news__hero {
  position: relative; display: flex; flex-direction: column; gap: 10px; overflow: hidden;
  padding: calc(42px + env(safe-area-inset-top)) 20px 28px; border-radius: 0 0 28px 28px;
  background: var(--brand-green); color: var(--brand-cream);
}

.wa-news__chip { position: relative; align-self: flex-start; padding: 5px 12px; border-radius: var(--radius-pill); background: rgba(249, 245, 221, .18); font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.wa-news__title { position: relative; max-width: 80%; margin: 0; font: 700 28px/1.12 var(--font-display); overflow-wrap: anywhere; }
.wa-news__lead { position: relative; max-width: 80%; margin: 0; font-size: 15px; line-height: 1.4; opacity: .92; }
.wa-news--techcards .wa-news__hero { background: var(--group-fresh); color: var(--brand-green-dark); }
.wa-news--techcards .wa-news__chip { background: rgba(11, 50, 32, .12); }
.wa-news--techcards .wa-news__bar { background: rgba(11, 50, 32, .22); }
.wa-news--techcards .wa-news__bar.is-done, .wa-news--techcards .wa-news__bar.is-on { background: var(--brand-green-dark); }
.wa-news--newplan .wa-news__hero { background: var(--group-smoothie); }
.wa-news--rating .wa-news__hero { background: var(--brand-carrot); }
.wa-news--contest .wa-news__hero { background: var(--group-dessert); }

.wa-news__foot { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 16px calc(14px + env(safe-area-inset-bottom)); background: var(--bg); box-shadow: 0 -8px 20px rgba(11, 50, 32, .07); }
.wa-news__count { font-size: 12px; color: var(--text-muted); }

/* Тех. карты: блоки одинаковых изменений */
.wa-nb { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-sm); animation: fadeUp 360ms var(--ease) both; }
.wa-nb__dishes { display: flex; flex-wrap: wrap; gap: 6px; }
.wa-nb__dish { padding: 4px 10px; border-radius: var(--radius-pill); background: var(--surface-2); color: var(--text-brand); font-size: 13px; font-weight: 700; }
.wa-nb__dish.is-more { background: transparent; color: var(--text-muted); }
.wa-nb__list { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; }
.wa-nb__row { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.wa-nb__sign { width: 26px; height: 26px; flex: none; display: grid; place-items: center; border-radius: 8px; font-weight: 800; }
.wa-nb__row.is-add .wa-nb__sign { background: var(--fresh-soft); color: var(--fresh); }
.wa-nb__row.is-del .wa-nb__sign { background: var(--danger-soft); color: var(--danger); }
.wa-nb__row.is-chg .wa-nb__sign { background: var(--partial-soft); color: var(--text); }
.wa-nb__row.is-first .wa-nb__sign { background: var(--accent-soft); color: var(--accent); }
.wa-nb__name { flex: 1; min-width: 0; font-weight: 700; overflow-wrap: anywhere; }
.wa-nb__row.is-del .wa-nb__name { color: var(--text-muted); text-decoration: line-through; }
.wa-nb__qty { flex: none; font-size: 13px; color: var(--text-muted); white-space: nowrap; }
.wa-nb__qty s { margin-right: 4px; opacity: .7; }

/* Новинки в плане */
.wa-np { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-sm); animation: fadeUp 360ms var(--ease) both; }
.wa-np__head { display: flex; align-items: center; gap: 12px; }
.wa-np__photo { width: 64px; height: 64px; flex: none; display: grid; place-items: center; overflow: hidden; border-radius: var(--radius-md); background: var(--accent-soft); color: var(--accent); font: 700 26px var(--font-display); }
.wa-np__photo img { width: 100%; height: 100%; object-fit: cover; }
.wa-np__title { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.wa-np__title b { font-size: 17px; line-height: 1.25; color: var(--text-brand); overflow-wrap: anywhere; }
.wa-np__title small { font-size: 12px; color: var(--text-muted); }
.wa-np__points { display: flex; flex-wrap: wrap; gap: 6px; }
.wa-np__pt { padding: 4px 10px; border-radius: var(--radius-pill); background: var(--fresh-soft); color: var(--fresh); font-size: 13px; font-weight: 700; }
.wa-np__card { display: flex; flex-direction: column; gap: 4px; margin: 0; padding: 8px 0 0; border-top: 1px dashed var(--border-strong); list-style: none; }
.wa-np__card li { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; }
.wa-np__card li span:last-child { flex: none; color: var(--text-muted); white-space: nowrap; }
.wa-np__place { margin: 0; font-size: 12px; color: var(--text-muted); }

/* Рейтинг: пьедестал, места, сотрудники */
.wa-rt-podium { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: end; gap: 8px; padding-top: 6px; }
.wa-rt-step { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; text-align: center; animation: fadeUp 420ms var(--ease) both; }
.wa-rt-step.is-1 { animation-delay: 80ms; }
.wa-rt-step.is-3 { animation-delay: 160ms; }
.wa-rt-step__medal { font-size: 34px; line-height: 1; }
.wa-rt-step.is-1 .wa-rt-step__medal { font-size: 46px; }
.wa-rt-step__name { display: -webkit-box; overflow: hidden; font-size: 13px; line-height: 1.2; color: var(--text-brand); overflow-wrap: anywhere; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
.wa-rt-step__val { font-size: 12px; font-weight: 700; color: var(--text-muted); }
.wa-rt-step__col { width: 100%; height: 72px; padding-top: 8px; border-radius: 14px 14px 0 0; background: var(--brand-green); color: var(--brand-cream); font: 700 22px var(--font-display); }
.wa-rt-step.is-1 .wa-rt-step__col { height: 98px; background: var(--brand-carrot); }
.wa-rt-step.is-3 .wa-rt-step__col { height: 54px; background: var(--group-bowl); }
.wa-rt-list { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
.wa-rt-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--radius-md); background: var(--surface); }
.wa-rt-row__n { width: 28px; height: 28px; flex: none; display: grid; place-items: center; border-radius: 50%; background: var(--surface-2); font-size: 13px; font-weight: 800; }
.wa-rt-row__main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.wa-rt-row__main b { font-size: 14px; overflow-wrap: anywhere; }
.wa-rt-row__bar { height: 6px; overflow: hidden; border-radius: var(--radius-pill); background: var(--surface-2); }
.wa-rt-row__bar span { display: block; height: 100%; border-radius: inherit; background: var(--accent); transform-origin: left; animation: wa-grow 700ms var(--ease) both; }
@keyframes wa-grow { from { transform: scaleX(0); } to { transform: none; } }
.wa-rt-row__val { flex: none; font-size: 13px; font-weight: 700; color: var(--text-brand); }
.wa-rt-staff { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; padding: 16px; border-radius: var(--radius-lg); background: var(--brand-green); color: var(--brand-cream); }
.wa-rt-staff__title { margin: 0; font: 700 18px var(--font-display); }
.wa-rt-staff__sub { margin: 0 0 6px; font-size: 13px; opacity: .85; }
.wa-rt-emp { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-top: 1px solid rgba(249, 245, 221, .15); }
.wa-rt-emp__ava { position: relative; width: 40px; height: 40px; flex: none; display: grid; place-items: center; border-radius: 50%; background: rgba(249, 245, 221, .16); font-size: 14px; font-weight: 800; }
.wa-rt-emp.is-top .wa-rt-emp__ava { background: var(--brand-carrot); }
.wa-rt-emp__ava i { position: absolute; right: -6px; bottom: -6px; font-size: 18px; font-style: normal; }
.wa-rt-emp__main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.wa-rt-emp__main b { font-size: 15px; overflow-wrap: anywhere; }
.wa-rt-emp__main small { font-size: 12px; opacity: .8; }
.wa-rt-emp__val { flex: none; font: 700 18px var(--font-display); }
.wa-rt-emp__val small { font: 500 12px var(--font-body); opacity: .8; }

/* «Настройки»: своя новость — зелёная карточка в самом верху */
.wa-news-pub { display: flex; flex-direction: column; gap: var(--space-3); padding: var(--space-5) var(--space-4); border-radius: var(--radius-lg); background: var(--brand-green); color: var(--brand-cream); box-shadow: var(--shadow-md); }
.wa-news-pub__head { display: flex; align-items: center; gap: 12px; }
.wa-news-pub__icon { width: 46px; height: 46px; flex: none; display: grid; place-items: center; border-radius: 14px; background: var(--brand-carrot); font-size: 22px; }
.wa-news-pub__head b { display: block; font: 700 18px var(--font-display); }
.wa-news-pub__head small { font-size: 13px; opacity: .85; }
.wa-news-pub .field__label { color: var(--brand-cream); opacity: .9; }
.wa-news-pub .field__input { border-color: transparent; background: var(--brand-cream); color: var(--brand-green-dark); }
.wa-news-pub__text { min-height: 110px; padding-top: 10px; resize: vertical; font-family: inherit; line-height: 1.4; }
.wa-news-pub__row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--space-2); }
.wa-news-pub__date { flex: 1 1 100%; }
.wa-news-pub__row .btn { flex: 1 1 0; }
.wa-news-pub .wa-news-pub__btn { border-color: transparent; background: var(--brand-carrot); color: var(--brand-cream); }
.wa-news-pub .wa-news-pub__ghost { border: 1.5px solid rgba(249, 245, 221, .45); background: transparent; color: var(--brand-cream); }
.wa-news-pub__info { margin: 0; font-size: 13px; font-weight: 700; }
.wa-news-pub__list { display: flex; flex-direction: column; margin-top: 4px; padding-top: 12px; border-top: 1px solid rgba(249, 245, 221, .2); }
.wa-news-pub__ltitle { margin-bottom: 4px; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; opacity: .75; }
.wa-news-pub__item { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding: 6px 0; font-size: 14px; }
.wa-news-pub__when { flex: none; min-width: 52px; font-weight: 700; }
.wa-news-pub__kind { flex: none; padding: 2px 8px; border-radius: var(--radius-pill); background: rgba(249, 245, 221, .16); font-size: 11px; font-weight: 700; }
.wa-news-pub__ttl { flex: 1 1 140px; min-width: 0; overflow-wrap: anywhere; }
.wa-news-pub__a { padding: 6px 4px; border: 0; background: transparent; color: var(--group-fresh); font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
.wa-news-pub__a.is-danger { color: #ffb4a8; }
.wa-news-auto__acts { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: calc(-1 * var(--space-2)); }

/* Фото в новости (своя новость, конкурс) */
.wa-news__photo { display: block; width: 100%; max-height: 62vh; object-fit: cover; border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); animation: fadeUp 360ms var(--ease) both; }
.wa-news__photo.skeleton { height: 220px; }
.wa-news__photo-err { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px; border-radius: var(--radius-lg); background: var(--surface-2); color: var(--text-muted); font-size: 14px; overflow-wrap: anywhere; }
.wa-news__title.is-long { font-size: 23px; line-height: 1.15; }
.wa-news__title.is-xlong { font-size: 19px; line-height: 1.2; }

/* Конкурс: товары, места точек (пьедестал и список — как у рейтинга), итог по сети */
.wa-ct-items { display: flex; flex-wrap: wrap; gap: 6px; }
.wa-ct-items__i { padding: 4px 10px; border-radius: var(--radius-pill); background: var(--surface-2); color: var(--text-brand); font-size: 13px; font-weight: 700; overflow-wrap: anywhere; }
.wa-ct-mix { font-size: 12px; color: var(--text-muted); overflow-wrap: anywhere; }
.wa-ct-total { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 14px 16px; border-radius: var(--radius-lg); background: var(--brand-green); color: var(--brand-cream); }
.wa-ct-total span { font-size: 14px; opacity: .9; }
.wa-ct-total b { font: 700 18px var(--font-display); text-align: right; }

/* «Настройки»: фото к новости, конкурсы, «Пачка» */
.wa-photo-pick { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }
.wa-photo-pick__img { width: 72px; height: 72px; flex: none; object-fit: cover; border-radius: var(--radius-md); background: var(--surface-2); }
.wa-link.is-danger { color: var(--danger); }
.wa-ct-row { display: flex; flex-direction: column; gap: var(--space-2); padding-bottom: var(--space-3); border-bottom: 1px solid var(--border); }
.wa-ct-row.is-off .wa-switch-row b { color: var(--text-muted); }
.wa-ct-edit { display: flex; flex-direction: column; gap: var(--space-3); padding: var(--space-4); border-radius: var(--radius-lg); background: var(--surface-2); }
.wa-ct-edit__title { font: 700 16px var(--font-display); color: var(--text-brand); }
.wa-ct-edit__btns { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.wa-ct-edit .wa-set-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }   /* поле даты не сжимается само — без этого шире экрана телефона */
.wa-ct-edit input[type=date] { min-width: 0; width: 100%; }
.wa-ct-chip span { margin-left: 6px; opacity: .7; }
.wa-ct-found { display: flex; flex-direction: column; max-height: 264px; overflow-y: auto; border-radius: var(--radius-md); background: var(--surface); box-shadow: var(--shadow-sm); }
.wa-ct-found__i { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 10px 12px; border: 0; border-bottom: 1px solid var(--border); background: transparent; color: var(--text); font: inherit; font-size: 14px; text-align: left; cursor: pointer; }
.wa-ct-found__i:last-child { border-bottom: 0; }
.wa-ct-found__i small { font-size: 12px; color: var(--text-muted); }
.wa-ct-found__i.is-on { background: var(--fresh-soft); }
.wa-ct-found__i.is-on small { color: var(--fresh); font-weight: 700; }
.wa-ct-pachca { display: flex; flex-direction: column; gap: var(--space-2); padding-top: var(--space-3); border-top: 1px solid var(--border); }
.wa-ct-pachca__title { font-size: 15px; color: var(--text-brand); }
.wa-ct-pachca .wa-emp-add { flex-wrap: wrap; }
.wa-ct-pachca .wa-emp-add .field { flex: 1 1 200px; }   /* на телефоне кнопка — строкой ниже, поле токена во всю ширину */
.wa-ct-pachca .field__hint.is-ok { color: var(--fresh); }
.wa-ct-pachca .field__hint.is-error, .wa-ct-edit .field__hint.is-error { color: var(--danger); }

@media (min-width: 768px) {
html[data-layout="auto"] .wa-news { align-items: center; padding: 24px; }
html[data-layout="auto"] .wa-news__card { width: 560px; height: auto; max-height: min(880px, calc(100dvh - 48px)); border-radius: 28px; box-shadow: var(--shadow-lg); }
html[data-layout="auto"] .wa-news__foot { padding-bottom: 16px; }
html[data-layout="auto"] .wa-news-pub { padding: var(--space-5) var(--space-6); }
html[data-layout="auto"] .wa-news-pub__date { flex: 0 1 220px; }
html[data-layout="auto"] .wa-news-pub__row .btn { flex: none; }

}

html[data-layout="tablet"] .wa-news, html[data-layout="desktop"] .wa-news { align-items: center; padding: 24px; }
html[data-layout="tablet"] .wa-news__card, html[data-layout="desktop"] .wa-news__card { width: 560px; height: auto; max-height: min(880px, calc(100dvh - 48px)); border-radius: 28px; box-shadow: var(--shadow-lg); }
html[data-layout="tablet"] .wa-news__foot, html[data-layout="desktop"] .wa-news__foot { padding-bottom: 16px; }
html[data-layout="tablet"] .wa-news-pub, html[data-layout="desktop"] .wa-news-pub { padding: var(--space-5) var(--space-6); }
html[data-layout="tablet"] .wa-news-pub__date, html[data-layout="desktop"] .wa-news-pub__date { flex: 0 1 220px; }
html[data-layout="tablet"] .wa-news-pub__row .btn, html[data-layout="desktop"] .wa-news-pub__row .btn { flex: none; }



/* «Исправили ошибку» в салат-базе (26–28.10): окно при входе, читается целиком, закрыть — через 10 с (ui_admin.html) */
.wa-fixnote { max-width: 520px; max-height: calc(100dvh - 32px); gap: var(--space-3); padding: var(--space-5); }
.wa-fixnote .modal__title { line-height: 1.2; }
.wa-fixnote__eyebrow { font-size: 11px; font-weight: 700; letter-spacing: var(--ls-caps); text-transform: uppercase; color: var(--text-muted); }
.wa-fixnote__body { display: flex; flex-direction: column; gap: 10px; min-height: 0; margin: 0 -6px; padding: 0 6px; overflow-y: auto; }
.wa-fixnote__box { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-radius: var(--radius-md); background: color-mix(in oklab, var(--partial) 30%, var(--surface)); color: var(--text); font-size: 14px; line-height: 1.45; }
.wa-fixnote__box > b { font-size: 15px; }
.wa-fixnote__box p, .wa-fixnote__box ul { margin: 0; }
.wa-fixnote__box ul { display: flex; flex-direction: column; gap: 4px; padding-left: 18px; }
.wa-fixnote__box.is-bad { background: var(--danger-soft); }
.wa-fixnote__box.is-bad > b { color: var(--danger); }
.wa-fixnote__box.is-ok { background: color-mix(in oklab, var(--fresh) 12%, var(--surface)); }
.wa-fixnote__box.is-ok > b { color: var(--fresh); }
.wa-fixnote .modal__actions .btn { flex: 1; }

/* Без интернета (PWA, 2026-10-26): полоса-журнал «не отправлено / не принято» и окно очереди (ui_app.html) */
.wa-journal-bar { position: sticky; top: 0; z-index: 12; width: 100%; border: 0; font: inherit; font-size: 13px; font-weight: 700; text-align: center; cursor: pointer; }
.app-header { top: var(--journal-h, 0px); }
.wa-journal-bar.is-offline { background: var(--partial); color: var(--brand-green-dark); }
.wa-journal-bar.is-sync { background: var(--brand-green); color: var(--brand-cream); }
.wa-journal-bar.is-fail { background: var(--danger); color: #fff; }
.wa-journal-bar__go { flex: none; opacity: .8; }
.wa-journal { max-width: 520px; max-height: calc(100dvh - 32px); }
.wa-journal__list { display: flex; flex-direction: column; min-height: 0; margin: 0 -6px; padding: 0 6px; overflow-y: auto; }
.wa-journal__row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--border); }
.wa-journal__time { flex: none; min-width: 44px; color: var(--text-muted); font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
.wa-journal__main { display: flex; flex: 1; flex-direction: column; gap: 2px; min-width: 0; font-size: 14px; }
.wa-journal__main small { color: var(--text-muted); font-size: 12px; overflow-wrap: anywhere; }
.wa-journal__row.is-send small { color: var(--brand-green); }
.wa-journal__row.is-fail small { color: var(--danger); }
.wa-journal__x { flex: none; min-height: 36px; padding: 0 12px; font-size: 13px; }

</style>

  <!-- Ядро клиента: утилиты, общее состояние, вызовы API, навигация.
     Подключается первым; экраны (ui_point.html) и оболочка (ui_app.html) берут всё из window.MFC. -->
<script type="text/x-template" id="tpl-device">
  <div class="card card--pad wa-device">

    <div class="wa-device__row">
