    const seconds = undoInfo ? (store.settings.undo_seconds || 10) : (error ? 6 : 4);
    toastTimer = setTimeout(() => { toast.visible = false; toast.undo = null; }, seconds * 1000);
  }

  async function dirList(kind) {
    if (!dirCache[kind]) dirCache[kind] = await callApi('dir.list', { kind });
    return dirCache[kind];
  }

  async function techCard(dishId) {
    if (work.data && work.data.techCards[dishId]) return work.data.techCards[dishId];
    if (!(dishId in techCache)) techCache[dishId] = await callApi('dir.techCard', { dishId });
    return techCache[dishId];
  }

  // Дни заготовок: обычно один; если окно точки начинается раньше, чем кончается вчерашнее
  // (точка хочет видеть завтрашние заготовки с утра), — два: сегодня и завтра
  const prepDates = computed(() => !work.data ? [] : work.data.prepDates || (work.data.prepDate ? [work.data.prepDate] : []));
  const prepPick = ref('');
  // Открытый день: выбранный, иначе первый, где есть невыполненное, иначе последний
  const prepDay = computed(() => {
    const ds = prepDates.value;
    if (ds.includes(prepPick.value)) return prepPick.value;
    return ds.find(d => work.data.preps.some(p => p.date === d && p.status === 'todo')) || ds[ds.length - 1] || null;
  });
  const prepDays = computed(() => prepDates.value.map(d => ({
    date: d,
    label: d === work.data.today ? 'Сегодня' : 'Завтра',
    left: work.data.preps.filter(p => p.date === d && !p.dishFor && p.status === 'todo').length,   // для экрана «Заготовки»
    sets: work.data.smoothies.filter(x => x.date === d && work.data.preps.some(p => p.date === d && p.dishFor === x.dish && p.status === 'todo')).length,   // «Лимонады и смузи»
  })));
  const pickPrepDay = d => { prepPick.value = d; };

  // Таймер: через сколько появятся заготовки следующего дня — ближайшее «с» окна точки (накануне дня заготовок).
  // Время — серверное (Москва): время ответа + сколько прошло с загрузки; часы тикают каждую секунду
  const tick = ref(Date.now());
  setInterval(() => { tick.value = Date.now(); }, 1000);
  const nextPrep = computed(() => {
    const d = work.data;
    if (!d || !d.serverTime || !d.prepWindow || !d.prepWindow.start) return null;
    const now = Date.parse(d.serverTime.replace(' ', 'T') + 'Z') + Math.max(0, tick.value - work.at);
    let at = Date.parse(new Date(now).toISOString().slice(0, 10) + 'T' + d.prepWindow.start + ':00Z');
    if (at <= now) at += 864e5;
    const sec = Math.max(0, Math.ceil((at - now) / 1000));
    return { day: new Date(at + 864e5).toISOString().slice(0, 10), sec, min: Math.ceil(sec / 60), start: d.prepWindow.start };
  });
  // Время вышло — заготовки следующего дня уже есть: перечитать, не дожидаясь автообновления
  watch(() => nextPrep.value && nextPrep.value.sec, (v, was) => { if (v === 0 && was > 0) load(true); });
  const SHORT_WD = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
  const SHORT_MON = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
  const shortDay = d => { const x = new Date(d + 'T12:00:00Z'); return SHORT_WD[x.getUTCDay()] + ' ' + x.getUTCDate() + ' ' + SHORT_MON[x.getUTCMonth()]; };
  // «5:12:08» — часы, минуты и секунды до смены дня
  const leftText = computed(() => {
    const t = nextPrep.value ? nextPrep.value.sec : 0;
    return Math.floor(t / 3600) + ':' + String(Math.floor(t % 3600 / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0');
  });
  const PrepTimer = {
    template: '#tpl-prep-timer',
    setup() {
      // Стрелки — CSS-анимацией (секундная — шагами раз в секунду), начало — по серверному времени на момент показа
      const t = nextPrep.value ? Date.parse(work.data.serverTime.replace(' ', 'T') + 'Z') + (Date.now() - work.at) : Date.now();
      const delayS = -((t / 1000) % 60).toFixed(2) + 's';
      const delayM = -((t / 1000) % 3600).toFixed(1) + 's';
      return { nextPrep, delayS, delayM, hm: computed(() => leftText.value.slice(0, -2)), ss: computed(() => leftText.value.slice(-2)) };
    },
  };
  const nextTitle = computed(() => {
    const n = nextPrep.value;
    if (!n) return '';
    const h = Math.floor(n.min / 60), m = n.min % 60;
    return 'Заготовки на ' + shortDay(n.day) + ' появятся через ' + (h ? h + ' ч ' : '') + m + ' мин — в ' + n.start;
  });
  const onPrepDay = it => !it.date || it.date === prepDay.value;

  // Наборы лимонадов и смузи: заготовки с dish_for, считаем по живому списку (там же появятся остатки).
  // Сначала лимонады, потом смузи — как в названии раздела; набор без признака (старый сервер) — смузи
  const SET_ORDER = { lemonade: 0, smoothie: 1 };
  const smoothies = computed(() => {
    if (!work.data) return [];
    return work.data.smoothies.filter(onPrepDay).map(s => {
      const items = work.data.preps.filter(p => p.dishFor === s.dish && (!s.date || p.date === s.date));
      const done = items.filter(p => p.status !== 'todo').length;
      return Object.assign({}, s, {
        set: s.set === 'lemonade' ? 'lemonade' : 'smoothie',
        items, done, total: items.length,
        p: items.length ? done / items.length : 0,
        complete: items.length > 0 && done === items.length,
      });
    }).sort((a, b) => SET_ORDER[a.set] - SET_ORDER[b.set] || a.dish.localeCompare(b.dish, 'ru'));
  });

  const point = computed(() => store.points.find(p => p.tt === work.tt) || { tt: work.tt, name: work.tt, emoji: '' });

  // ================================================================== компоненты

  const ItemCard = {
    template: '#tpl-item-card',
    props: { item: Object, selected: Boolean },
    emits: ['open'],
    setup(props) {
      const st = computed(() => stateOf(props.item));
      const cardClass = computed(() => ({
        'item-card--work': st.value === 'work',
        'item-card--done': st.value === 'done',
        'item-card--partial': st.value === 'partial',
        'item-card--selected': props.selected,
      }));
      const badge = computed(() => {
        const it = props.item;
        if (st.value === 'work') return { cls: 'work', text: 'В работе · ' + drafts[it.uid].fact };
        if (st.value === 'partial') return { cls: 'partial', text: 'Частично ' + fmt(it.fact) + '/' + fmt(it.amount) };
        if (st.value === 'done' && it.over) return { cls: 'rest', text: 'Больше плана · ' + fmt(it.fact) };
        if (st.value === 'done') return { cls: 'done', text: it.fact != null && it.fact !== it.amount ? 'Готово · ' + fmt(it.fact) : 'Готово' };
        return { cls: 'todo', text: 'К выполнению' };
      });
      const img = computed(() => thumbImg(props.item.thumb));
      const photo = computed(() => props.item.kind === 'dishes' ? photoOf(props.item.dishId) : '');
      const letter = computed(() => (props.item.name[0] || '').toUpperCase());
      return { cardClass, badge, img, photo, letter, fmt };
    },
  };


  const PlanCard = {
    template: '#tpl-plan-card',
    props: { item: Object, kind: String },
    setup(props) {
      return {
        fmt,
        img: computed(() => thumbImg(props.item.thumb)),
        photo: computed(() => props.kind === 'dishes' ? photoOf(props.item.dishId) : ''),
        letter: computed(() => (props.item.name[0] || '').toUpperCase()),
      };
    },
  };


  const ShiftView = {
    template: '#tpl-shift',
    components: { DeviceSettings: C.DeviceSettings },
    emits: ['pick', 'go'],
    setup() {
      const ready = ref(false);
      onMounted(() => setTimeout(() => { ready.value = true; }, 60));  // кольца заполняются после первого кадра

      const mode = computed(() => store.user.role === 'point' ? store.user.mode : 'both');
      const shift = computed(() => work.data.shift);
      const roles = computed(() => [
        { id: 'bar', label: 'Бармен' },
        { id: 'prep', label: 'Заготовщик' },
      ].filter(r => mode.value === 'both' || (mode.value === 'bar' ? r.id === 'bar' : r.id === 'prep')));

      const missing = computed(() => {
        const noBar = mode.value !== 'prep' && !shift.value.bar;
        const noPrep = mode.value !== 'bar' && !shift.value.prep;
        if (noBar && noPrep) return 'Выберите бармена и заготовщика — без них отметки не сохранить';
        if (noBar) return 'Без бармена блюда не сохранить';
        if (noPrep) return 'Без заготовщика заготовки не сохранить';
        return '';
      });

      const ring = (id, label, list, isDone) => {
        const done = list.filter(isDone).length;
        return { id, label, done, total: list.length, p: list.length ? done / list.length : 0 };
      };
      const finished = it => it.status !== 'todo';
      const rings = computed(() => {
        const out = [];
        if (mode.value !== 'prep') out.push(ring('dishes', 'Блюда', work.data.dishes, finished));
        if (mode.value !== 'bar') {
          out.push(ring('preps', 'Заготовки', work.data.preps.filter(p => !p.dishFor && onPrepDay(p)), finished));
          out.push(ring('smoothies', 'Лимонады и смузи', smoothies.value, s => s.complete));
        }
        return out;
      });

      const hour = new Date().getHours();
      const greeting = hour < 5 ? 'Доброй ночи' : hour < 12 ? 'Доброе утро' : hour < 17 ? 'Добрый день' : 'Добрый вечер';

      const summary = computed(() => {
        const parts = [];
        const d = work.data.dishes.length;
        const p = work.data.preps.filter(onPrepDay).length;
        if (mode.value !== 'prep') parts.push(d + ' ' + plural(d, ['блюдо', 'блюда', 'блюд']));
        if (mode.value !== 'bar') parts.push(p + ' ' + plural(p, ['заготовка', 'заготовки', 'заготовок']));
        return 'Сегодня ' + parts.join(' и ');
      });

      return {
        work, shift, roles, missing, rings, ready, greeting, summary, initials, asset,
        dateLabel: computed(() => MF.day(work.data.today)),
        pointName: computed(() => point.value.name),
      };
    },
  };


  const ItemsView = {
    template: '#tpl-items',
    components: { ItemCard, PlanCard, PrepTimer },
    props: { kind: String, selectedUid: String },
    emits: ['open', 'add', 'go'],
    setup(props) {
      const filter = ref(null);
      const query = ref('');
      const filters = [
        { id: 'todo', label: 'К выполнению' },
        { id: 'work', label: 'В работе' },
        { id: 'done', label: 'Готово' },
      ];
      const PLAN = { id: 'tomorrow', label: 'План на завтра' };

      const title = computed(() => props.kind === 'dishes' ? 'Блюда' : 'Заготовки');
      const closed = computed(() => props.kind === 'preps' && !prepDay.value);
      const items = computed(() => props.kind === 'dishes' ? work.data.dishes : work.data.preps.filter(p => !p.dishFor && onPrepDay(p)));
      const dayLabel = computed(() => MF.day(props.kind === 'dishes' ? work.data.today : prepDay.value));

      // «План на завтра» — только у блюд и только просмотр
      const plan = computed(() => props.kind === 'dishes' && work.data.tomorrow ? work.data.tomorrow.dishes : null);
      const canPlan = computed(() => !!plan.value);
      const planMode = computed(() => filter.value === PLAN.id && canPlan.value);
      const planItems = computed(() => plan.value || []);
      const planDayLabel = computed(() => work.data.tomorrow ? shortDay(work.data.tomorrow.date) : 'завтра');
      const shownFilters = computed(() => filters.concat(canPlan.value ? [PLAN] : []));

      const counts = computed(() => {
        const c = { todo: 0, work: 0, done: 0, tomorrow: planItems.value.length };
        for (const it of items.value) {
          const s = stateOf(it);
          c[s === 'partial' ? 'done' : s]++;
        }
        return c;
      });
      const allDone = computed(() => items.value.length > 0 && counts.value.todo + counts.value.work === 0);

      const match = it => !query.value || it.name.toLowerCase().includes(query.value.trim().toLowerCase());

      // Группы активных позиций: по группе, внутри — по плану ↓ (как в AppSheet)
      const groups = computed(() => {
        if (filter.value === 'done') return [];
        const byGroup = {};
        for (const it of items.value) {
          const s = stateOf(it);
          if (s === 'done' || s === 'partial') continue;
          if (filter.value && s !== filter.value) continue;
          if (!match(it)) continue;
          const g = it.group || 'Без группы';
          (byGroup[g] = byGroup[g] || []).push(it);
        }
        return Object.keys(byGroup).sort((a, b) => a.localeCompare(b, 'ru'))
          .map(name => ({ name, items: byGroup[name].sort((a, b) => b.amount - a.amount) }));
      });

      const showDone = computed(() => !filter.value || filter.value === 'done');
      const doneItems = computed(() => items.value
        .filter(it => it.status !== 'todo' && match(it))
        .sort((a, b) => String(b.statusAt).localeCompare(String(a.statusAt))));

      const noShift = computed(() => {
        const s = work.data.shift;
        if (props.kind === 'dishes' && !s.bar) return 'Выберите бармена на экране «Смена» — без него блюда не сохранить';
        if (props.kind === 'preps' && !s.prep) return 'Выберите заготовщика на экране «Смена» — без него заготовки не сохранить';
        return '';
      });

      // План на завтра — по группам, как список дня
      const planGroups = computed(() => {
        const byGroup = {};
        for (const it of planItems.value) {
          if (!match(it)) continue;
          const g = it.group || 'Без группы';
          (byGroup[g] = byGroup[g] || []).push(it);
        }
        return Object.keys(byGroup).sort((a, b) => a.localeCompare(b, 'ru'))
          .map(name => ({ name, items: byGroup[name].sort((a, b) => b.amount - a.amount) }));
      });

      // Конфетти — когда последняя позиция стала готовой у вас на глазах (не при загрузке)
      watch(allDone, (now, was) => { if (now && was === false) confetti(); });

      const toggleFilter = id => { filter.value = filter.value === id ? null : id; };

      return {
        work, filter, query, shownFilters, title, closed, items, counts, allDone, groups, showDone,
        doneItems, noShift, toggleFilter, dayLabel, asset, prepDays, prepDay, pickPrepDay, nextPrep, shortDay, leftText, nextTitle,
        canPlan, planMode, planItems, planGroups, planDayLabel,
      };
    },
  };


  const SmoothiesView = {
    template: '#tpl-smoothies',
    components: { PrepTimer },
    emits: ['open'],
    setup() {
      const openKey = ref('');
      const collecting = ref('');

      const list = computed(() => smoothies.value);
      const doneCount = computed(() => list.value.filter(s => s.complete).length);
      // Лимонады и смузи — двумя группами (порядок — как в списке)
      const sections = computed(() => [{ id: 'lemonade', title: 'Лимонады' }, { id: 'smoothie', title: 'Смузи' }]
        .map(x => Object.assign(x, { items: list.value.filter(s => s.set === x.id) }))
        .filter(x => x.items.length));
      const dayLabel = computed(() => MF.day(prepDay.value));

      // Первым раскрыт первый несобранный набор
      watch(list, l => {
        if (!openKey.value && l.length) openKey.value = (l.find(s => !s.complete) || l[0]).key;
      }, { immediate: true });

      // Другой день заготовок — раскрыть его первый несобранный набор
      watch(prepDay, () => {
        const l = list.value;
        openKey.value = l.length ? (l.find(s => !s.complete) || l[0]).key : '';
      });

      const toggle = key => { openKey.value = openKey.value === key ? '' : key; };

      // Галочка — «готово по плану»: факт = план. Сразу на экране, сервер пишет в фоне.
      function markDone(items, text) {
        const todo = items.filter(it => it.status === 'todo');
        if (!todo.length) return;
        if (!shiftEmployee('preps')) {
          showToast('Выберите заготовщика на экране «Смена»', null, true);
          return;
        }
        commitSave(todo.map(it => ({ item: it, fact: it.amount, comment: '' })), text);
      }

      const quickDone = it => markDone([it], 'Отмечено · ' + it.name);
      const allDone = s => markDone(s.items, 'Отмечено все · ' + s.dish);
      // Повторное нажатие на галочку — снять отметку заготовки (набор снова неполный)
      const unmark = it => { unmarkItem(it); };

      async function collect(s) {
        if (OFFLINE) {
          C.queueOp('work.smoothieDone', { tt: work.tt, date: s.date, dish: s.dish, at: Date.now() }, { tt: work.tt, label: 'Набор собран · ' + s.dish });
          showToast('Набор собран · ' + s.dish);
          const next = list.value.find(x => !x.collected && x.key !== s.key);
          openKey.value = next ? next.key : '';
          return;
        }
        collecting.value = s.key;
        try {
          await busy(() => callApi('work.smoothieDone', { tt: work.tt, date: s.date, dish: s.dish }));
          const src = work.data.smoothies.find(x => x.key === s.key);
          if (src) src.collected = true;
          showToast('Набор собран · ' + s.dish);
          const next = list.value.find(x => !x.collected && x.key !== s.key);
          openKey.value = next ? next.key : '';
        } catch (e) {
          if (e.code !== 'AUTH') showToast(e.message, null, true);
        } finally {
          collecting.value = '';
        }
      }

      return { work, list, sections, doneCount, dayLabel, openKey, toggle, quickDone, allDone, unmark, collect, collecting, asset, fmt, photoOf, prepDays, prepDay, pickPrepDay,
        nextPrep, shortDay, leftText, nextTitle };
    },
  };


  const DirectoryView = {
    template: '#tpl-directory',
    props: { editable: Boolean },   // админ: правка места хранения и доступности
    setup() {
      const kind = ref('dishes');
      const query = ref('');
      const error = ref('');
      const openName = ref('');
      const tech = ref(null);
      const LIMIT = 60;
      const AVAIL = [{ v: 'Да', label: 'Заказывается' }, { v: 'Нет', label: 'Не заказывается' }, { v: '', label: 'Не указано' }];
      const edit = reactive({ place: ['', '', ''], available: '', saving: false, saved: false, error: '', planBusy: false });

      // Статус автоплана: общий и свои статусы точек (planTt) — на точке свой, иначе общий
      const planAt = (d, tt) => (d.planTt && d.planTt[tt]) || d.planStatus || '';
      const planOn = d => store.points.some(p => planAt(d, p.tt) === 'Активно');
      // Во всех точках одинаково — этот статус, иначе ''
      const planAll = d => { const v = new Set(store.points.map(p => planAt(d, p.tt))); return v.size === 1 ? [...v][0] : ''; };
      function planBadge(d) {
        const n = store.points.filter(p => planAt(d, p.tt) === 'Активно').length;
        return !n ? 'Не в автоплане' : n === store.points.length ? 'В автоплане' : 'В автоплане: ' + n + ' из ' + store.points.length;
      }

      // Сразу, без кнопки «Сохранить»: tt — только эта точка, без tt — все точки (свои статусы точек сбрасываются)
      async function setPlanStatus(d, status, tt) {
        const want = status === 'active' ? 'Активно' : 'Заблокировано';
        if (tt ? planAt(d, tt) === want : planAll(d) === want && !Object.keys(d.planTt || {}).length) return;
        const was = { planStatus: d.planStatus, planTt: Object.assign({}, d.planTt || {}) };
        if (tt) {
          const own = Object.assign({}, d.planTt || {});
          if (want === d.planStatus) delete own[tt]; else own[tt] = want;
          d.planTt = own;
        } else {
          Object.assign(d, { planStatus: want, planTt: {} });
        }
        edit.planBusy = true;
        edit.error = '';
        try {
          await callApi('admin.autoplan.setStatus', { status, items: [{ id: d.id, name: d.name }], tts: tt ? [tt] : undefined });
        } catch (e) {
          Object.assign(d, was);
          if (e.code !== 'AUTH') edit.error = e.message;
        } finally {
          edit.planBusy = false;
        }
      }

      async function saveEdit(d) {
        Object.assign(edit, { saving: true, saved: false, error: '' });
        try {
          const r = await callApi('admin.dir.update', { kind: kind.value, id: d.id, name: d.name, place: edit.place, available: edit.available });
          Object.assign(d, { place: r.place, available: r.available });
          edit.saved = true;
        } catch (e) {
          if (e.code !== 'AUTH') edit.error = e.message;
        } finally {
          edit.saving = false;
        }
      }

      const items = computed(() => dirCache[kind.value]);

      async function load() {
        error.value = '';
        try { await dirList(kind.value); } catch (e) { if (e.code !== 'AUTH') error.value = e.message; }
      }

      const filtered = computed(() => {
        const q = query.value.trim().toLowerCase();
        return (items.value || []).filter(d => !q || d.name.toLowerCase().includes(q) || d.group.toLowerCase().includes(q));
      });
      const shown = computed(() => filtered.value.slice(0, LIMIT));

      function setKind(k) { kind.value = k; openName.value = ''; load(); }

      async function toggle(d) {
        if (openName.value === d.name) { openName.value = ''; return; }
        openName.value = d.name;
        Object.assign(edit, { place: [0, 1, 2].map(i => d.place[i] || ''), available: d.available || '', saved: false, error: '' });
        if (kind.value !== 'dishes') return;
        tech.value = null;
        try { tech.value = d.id ? await techCard(d.id) : []; } catch (e) { tech.value = []; }
      }

      onMounted(load);
      return { store, kind, query, error, items, filtered, shown, openName, tech, setKind, toggle, load, thumbImg, fmt, AVAIL, edit, saveEdit, setPlanStatus, photoOf, planAt, planOn, planAll, planBadge };
    },
  };


  const ItemSheet = {
    template: '#tpl-item-sheet',
    props: { open: Boolean, item: Object, mode: String, kind: String },
    emits: ['close', 'go'],
    setup(props, { emit }) {
      const fact = ref('');
      const comment = ref('');
      const showComment = ref(false);
      const saving = ref(false);
      const success = ref('');
      const shake = ref(false);
      const banner = ref(null);
      const commentEl = ref(null);
      const picked = ref(null);
      const addQuery = ref('');
      const dirItems = ref(null);
      const tech = ref([]);
      const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', ',', '0', 'del'];

      // Позиция в шторке: из списка или выбранная из справочника для внеплановой
      const target = computed(() => props.mode === 'add' ? picked.value : props.item);
      const photo = computed(() => target.value && target.value.kind === 'dishes' ? photoOf(target.value.dishId) : '');
      const isDone = computed(() => target.value && target.value.status && target.value.status !== 'todo');
      const auto = computed(() => target.value ? autoStatus(target.value.amount, MF.num(fact.value), target.value.unit) : { tone: 'error', text: '' });
      const doneText = computed(() => {
        const t = target.value;
        return t.status === 'done'
          ? 'Готово · факт ' + fmt(t.fact) + ' ' + t.unit
          : 'Частично готово · ' + fmt(t.fact) + ' из ' + fmt(t.amount) + ' ' + t.unit;
      });

      const addOptions = computed(() => {
        const q = addQuery.value.trim().toLowerCase();
        return (dirItems.value || []).filter(d => !q || d.name.toLowerCase().includes(q)).slice(0, 40);
      });

      // Тех. карта — на введённый факт; пока факта нет — на план; у отмеченной позиции — на её факт
      const techQty = computed(() => {
        const t = target.value;
        if (!t) return 0;
        if (isDone.value) return t.fact || 0;
        const f = MF.num(fact.value);
        return f > 0 ? f : t.amount;
      });
      const techBasis = computed(() => {
        const t = target.value;
        if (isDone.value) return 'по факту';
        const f = MF.num(fact.value);
        return f > 0 && f !== t.amount ? 'по факту' : 'по плану';
      });

      // Вернуть отмеченную позицию в работу — всем ролям, в два нажатия; сервер — в фоне
      const confirmReset = ref(false);
      const unplanned = computed(() => !!target.value && !target.value.parentUid && /^Вне плана/.test(target.value.comment || ''));
      const resetText = computed(() => unplanned.value
        ? 'Внеплановая позиция будет удалена.'
        : 'Позиция вернётся в «К выполнению»' + (target.value.status === 'partial' ? ', нетронутый остаток удалится.' : '.') +
          (target.value.dishFor ? ' Отметка «Набор собран» снимется.' : ''));

      function reset() {
        if (!confirmReset.value) { confirmReset.value = true; return; }
        confirmReset.value = false;
        unmarkItem(props.item);
        emit('close');
      }

      // Открытие шторки: восстановить черновик, подтянуть тех. карту
      watch(() => [props.open, props.item && props.item.uid, props.mode], async ([open]) => {
        if (!open) return;
        banner.value = null;
        confirmReset.value = false;
        success.value = '';
        saving.value = false;
        picked.value = null;
        addQuery.value = '';
        tech.value = [];
        if (props.mode === 'add') {
          fact.value = '';
          comment.value = '';
          showComment.value = false;
          dirItems.value = null;
          try { dirItems.value = await dirList(props.kind); } catch (e) { dirItems.value = []; }
          return;
        }
        const it = props.item;
        const d = drafts[it.uid];
        fact.value = d && d.fact ? d.fact : (it.fact != null ? fmt(it.fact) : '');
        comment.value = d && d.comment ? d.comment : it.comment;
        showComment.value = !!comment.value;
        if (it.kind === 'dishes' && it.dishId) {
          try { tech.value = await techCard(it.dishId); } catch (e) { tech.value = []; }
        }
      });

      function keepDraft() {
        if (props.mode === 'add' || !props.item || isDone.value) return;
        setDraft(props.item.uid, { fact: fact.value, comment: comment.value });
      }
      watch(comment, keepDraft);

      function press(k) {
        let v = fact.value;
        if (k === 'del') v = v.slice(0, -1);
        else if (k === ',') { if (!v.includes(',')) v = (v || '0') + ','; }
        else {
          if (v === '0') v = '';
          const decimals = v.includes(',') ? v.split(',')[1].length : 0;
          if (v.replace(',', '').length < 7 && decimals < 3) v += k;
        }
        fact.value = v;
        banner.value = null;
        keepDraft();
      }

      function step(d) {
        fact.value = fmt(Math.max(0, MF.num(fact.value) + d));
        keepDraft();
      }

      function setPlan() {
        fact.value = fmt(target.value.amount);
        keepDraft();
      }

      function toggleComment() {
        showComment.value = !showComment.value;
        if (showComment.value) nextTick(() => commentEl.value && commentEl.value.focus());
      }

      async function pick(d) {
        picked.value = {
          uid: '', kind: props.kind, name: d.name, amount: 0, unit: d.unit, group: d.group,
          thumb: d.thumb, place: d.place, status: 'todo', dishId: d.id, dishFor: '',
        };
        // Состав внепланового блюда появится, как только введут количество
        if (props.kind === 'dishes' && d.id) {
          try { tech.value = await techCard(d.id); } catch (e) { tech.value = []; }
        }
      }

      function doShake() {
        shake.value = false;
        nextTick(() => { shake.value = true; setTimeout(() => { shake.value = false; }, 400); });
      }

      const ERR = {
        NO_SHIFT: { tone: 'warning', icon: '#i-alert', go: 'shift' },
        CONFLICT: { tone: 'conflict', icon: '#i-refresh' },
        NETWORK: { tone: 'error', icon: '#i-wifi-off' },
      };

      // Сохранение: галочка, через ~0,65 с шторка закрывается; сервер пишет в фоне
      // (полоска вверху экрана). Внеплановая позиция ждёт ответа — ей нужен uid с сервера.
      async function save() {
        if (saving.value || success.value) return;
        if (auto.value.tone === 'error') { doShake(); return; }
        const value = MF.num(fact.value);
        const partial = auto.value.tone === 'partial';
        const kind = props.mode === 'add' ? props.kind : props.item.kind;
        banner.value = null;

        if (!shiftEmployee(kind)) {
          banner.value = Object.assign({
            text: kind === 'dishes' ? 'Выберите бармена на экране «Смена»' : 'Выберите заготовщика на экране «Смена»',
          }, ERR.NO_SHIFT);
          return;
        }

        if (props.mode === 'add') {
          saving.value = true;
          try {
            await addItem(props.kind, target.value.name, value, comment.value, target.value);
          } catch (e) {
            if (e.code === 'AUTH') return;
            banner.value = Object.assign({ text: e.code === 'NETWORK' ? 'Нет связи — попробуйте ещё раз' : e.message }, ERR[e.code] || { tone: 'error', icon: '#i-alert' });
            return;
          } finally {
            saving.value = false;
          }
        } else {
          commitSave([{ item: props.item, fact: value, comment: comment.value }]);
        }

        success.value = partial ? 'partial' : 'ok';
        setTimeout(() => { success.value = ''; emit('close'); }, 650);
      }

      // Физическая клавиатура: цифры, запятая, Backspace, Enter, Esc
      function onKey(e) {
        if (!props.open || e.target.matches('textarea, input')) return;
        if (e.key === 'Escape') { emit('close'); return; }
        if (isDone.value || !target.value) return;
        if (/^[0-9]$/.test(e.key)) press(e.key);
        else if (e.key === ',' || e.key === '.') press(',');
        else if (e.key === 'Backspace') press('del');
        else if (e.key === 'Enter') save();
      }
      const globalKey = e => { if (props.open) onKey(e); };
      onMounted(() => document.addEventListener('keydown', globalKey));
      onBeforeUnmount(() => document.removeEventListener('keydown', globalKey));

      return {
        fact, comment, showComment, saving, success, shake, banner, commentEl, picked, addQuery, dirItems, tech, keys,
        target, isDone, auto, doneText, addOptions, press, step, setPlan, toggleComment, pick, save, onKey,
        confirmReset, unplanned, resetText, reset, techQty, techBasis,
        thumbImg, fmt, photo,
      };
    },
  };


  const PickerSheet = {
    template: '#tpl-picker',
    props: { open: Boolean, role: String },
    emits: ['close', 'pick'],
    setup(props) {
      const employees = computed(() => work.data ? work.data.employees : []);
      const current = computed(() => work.data && props.role ? work.data.shift[props.role] : '');
      return { employees, current, initials, busy: computed(() => work.busy > 0) };
    },
  };


  const UndoToast = {
    template: '#tpl-toast',
    setup() {
      const undoing = ref(false);
      async function doUndo() {
        undoing.value = true;
        try { await undo(); } finally { undoing.value = false; }
      }
      return { toast, undo: doUndo, undoing };
    },
  };


  const PointScreens = {
    template: '#tpl-point',
    components: { ShiftView, ItemsView, SmoothiesView, DirectoryView, ItemSheet, PickerSheet, UndoToast },
    props: { view: String },
    emits: ['go'],
    setup(props, { emit }) {
      const sheet = reactive({ open: false, item: null, mode: 'item', kind: 'dishes' });
      const picker = reactive({ open: false, role: 'bar' });

      // В шторке — всегда свежая версия позиции из списка (после опроса сервера)
      watch(() => work.data, data => {
        if (!data || !sheet.item || sheet.mode !== 'item') return;
        const fresh = listOf(sheet.item.kind).find(x => x.uid === sheet.item.uid);
        if (fresh) sheet.item = fresh;
      });

      function openItem(it) { Object.assign(sheet, { open: true, item: it, mode: 'item', kind: it.kind }); }
      function openAdd(kind) { Object.assign(sheet, { open: true, item: null, mode: 'add', kind }); }
      function closeSheet() { sheet.open = false; }
      function goFromSheet(view) { sheet.open = false; emit('go', view); }
      function openPicker(role) { Object.assign(picker, { open: true, role }); }

      // Выбор сотрудника: шторка закрывается сразу, сервер подтверждает в фоне
      async function pickEmployee(name) {
        const role = picker.role;
        picker.open = false;
        showToast(name ? (role === 'bar' ? 'Бармен: ' : 'Заготовщик: ') + name : 'Сотрудник снят со смены');
        try {
          await setShift(role, name);
        } catch (e) {
          if (e.code !== 'AUTH') showToast('Смена не сохранена: ' + e.message, null, true);
        }
      }

      return {
        work, sheet, picker, openItem, openAdd, closeSheet, goFromSheet, openPicker, pickEmployee,
        reload: () => load(),
      };
    },
  };

  C.point = { work, start, stop, point, components: { PointScreens, DirectoryView } };

})(window.MFC);
</script>

  <!-- Кабинет администратора: дашборд сети и план на дату, расчёт заготовок.
     Разметка и классы — из design/dashboard.html и прототипа «кабинет администратора». -->

<!-- ===================================================================== Выбор дня: ‹ Сегодня › -->
<script type="text/x-template" id="tpl-day-picker">
  <div class="date-picker">
    <button type="button" class="date-picker__btn" @click="move(-1)" aria-label="Предыдущий день">
      <svg class="icon icon--sm"><use href="#i-chevron-left"></use></svg>
    </button>
    <button type="button" class="date-picker__label wa-date-label" @click="set(store.today)"
            :title="modelValue !== store.today ? 'Вернуться к сегодня' : null">
      <svg class="icon icon--sm"><use href="#i-calendar"></use></svg>
      <span class="wa-date-full">{{ full }}</span><span class="wa-date-short">{{ short }}</span>
    </button>
    <button type="button" class="date-picker__btn" :disabled="!!max && modelValue >= max" @click="move(1)" aria-label="Следующий день">
      <svg class="icon icon--sm"><use href="#i-chevron-right"></use></svg>
    </button>
  </div>
</script>

<!-- ===================================================================== Дашборд сети -->
<script type="text/x-template" id="tpl-dashboard">
  <div class="page wa-dash">
    <div class="page-head">
      <h1 class="h-screen page-head__title">Дашборд сети</h1>
      <button type="button" class="sync-indicator wa-sync-btn" :disabled="dash.loading" @click="refresh" :aria-label="'Обновить. ' + syncText">
        <span v-if="dash.loading" class="spinner"></span>
        <template v-else><span class="sync-indicator__dot"></span><svg class="icon wa-sync-icon"><use href="#i-refresh"></use></svg></template>
        <span class="wa-sync-text">{{ syncText }}</span>
      </button>
      <div class="wa-dash__controls">
        <day-picker :model-value="dash.date" @update:model-value="setDate"></day-picker>
        <div class="tabs" role="tablist">
          <button type="button" class="tabs__tab" role="tab" :aria-selected="tab === 'points'" @click="tab = 'points'">Точки</button>
          <button type="button" class="tabs__tab" role="tab" :aria-selected="tab === 'plan'" @click="tab = 'plan'">План</button>
        </div>
      </div>
    </div>

    <div v-if="dash.error && !data" class="banner banner--error" role="alert">
      <svg class="icon icon--sm"><use href="#i-alert"></use></svg>
      <span class="banner__text">{{ dash.error }}</span>
      <button type="button" class="btn btn--secondary" @click="refresh">Повторить</button>
    </div>

    <template v-else-if="!data">
      <div class="skeleton" style="height:180px;border-radius:var(--radius-lg)"></div>
      <div class="point-grid">
        <div v-for="i in 3" :key="i" class="skeleton" style="height:240px;border-radius:var(--radius-lg)"></div>
      </div>
    </template>

    <template v-else>
      <!-- Общий прогресс сети -->
      <section class="card network-summary">
        <div class="progress-ring progress-ring--lg network-summary__ring" :class="{ 'progress-ring--done': net.total && net.p === 1 }"
             :style="{ '--p': ready ? net.p : 0 }">
          <svg viewBox="0 0 132 132"><circle class="progress-ring__track" cx="66" cy="66" r="56"/><circle class="progress-ring__value" cx="66" cy="66" r="56" style="stroke-dasharray:351.9;stroke-dashoffset:calc(351.9 * (1 - var(--p, 0)))"/></svg>
          <span class="progress-ring__label wa-net-label">{{ pct(net.p) }}%<small>сеть</small></span>
        </div>
        <div class="network-summary__bars">
          <div class="eyebrow">Прогресс · {{ tiles.length }} {{ plural(tiles.length, ['точка', 'точки', 'точек']) }}</div>
          <div v-for="m in net.metrics" :key="m.label" class="metric">
            <span class="metric__label">{{ m.label }}</span>
            <span class="progress-bar progress-bar--lg progress-bar--brand"><span class="progress-bar__fill" :style="{ '--p': ready ? m.p : 0 }"></span></span>
            <span class="metric__value num">{{ m.done }}/{{ m.total }}</span>
          </div>
        </div>
        <div class="network-summary__alerts">
          <div class="eyebrow wa-alerts-head">Требуют внимания <span v-if="alerts.length" class="counter">{{ alerts.length }}</span></div>
          <button v-for="(a, i) in shownAlerts" :key="i" type="button" class="alert-line wa-alert-btn"
                  :class="'alert-line--' + a.tone" :title="a.names ? a.names.join(', ') : null" @click="open(a.tt)">
            <span class="alert-line__dot"></span><span>{{ a.emoji }} {{ a.name }}: {{ a.text }}</span>
          </button>
          <button v-if="alerts.length > shownAlerts.length" type="button" class="wa-link" @click="allAlerts = true">
            Показать ещё {{ alerts.length - shownAlerts.length }}
          </button>
          <div v-if="!alerts.length" class="alert-line wa-alert-ok">
            <svg class="icon icon--sm"><use href="#i-check"></use></svg>{{ net.total ? 'Всё идёт по плану' : 'На эту дату плана нет' }}
          </div>
        </div>
      </section>

      <!-- Вкладка «Точки» -->
      <section v-if="tab === 'points'" class="point-grid">
        <article v-for="t in tiles" :key="t.tt" class="card point-tile wa-tile" :class="{ 'point-tile--alert': t.hasError }"
                 role="button" tabindex="0" :aria-label="'Открыть точку ' + t.name" @click="open(t.tt)" @keydown.enter="open(t.tt)">
          <div class="point-tile__head">
            <span class="point-avatar point-avatar--lg">{{ t.emoji || '🥕' }}</span>
            <div class="wa-tile__title">
              <div class="point-tile__name">{{ t.name }}</div>
              <div class="point-tile__last">{{ t.lastText }}</div>
            </div>
            <span class="point-tile__pct" :class="{ 'wa-pct--done': t.total && t.p === 1 }">{{ pct(t.p) }}%</span>
          </div>
          <div class="point-tile__metrics">
            <div v-for="m in t.metrics" :key="m.label" class="metric">
              <span class="metric__label">{{ m.label }}</span>
              <span class="progress-bar" :class="{ 'progress-bar--done': m.total && m.done === m.total }"><span class="progress-bar__fill" :style="{ '--p': ready ? m.p : 0 }"></span></span>
              <span class="metric__value">{{ m.done }}/{{ m.total }}</span>
            </div>
          </div>
          <div v-if="t.staff !== null" class="point-tile__staff" :class="{ 'point-tile__staff--empty': !t.staff }">
            <svg class="icon icon--sm"><use href="#i-user"></use></svg>{{ t.staff || 'Смена не выбрана' }}
          </div>
          <div class="point-tile__alerts">
            <span v-for="(a, i) in t.alerts" :key="i" class="badge badge--lg wa-badge-wrap" :class="a.tone === 'error' ? 'badge--error' : 'badge--partial'"
                  :title="a.names ? a.names.join(', ') : null">
              <svg class="icon wa-badge-icon"><use href="#i-alert"></use></svg>{{ a.text }}
            </span>
            <span v-if="t.ok" class="badge badge--done badge--lg"><svg class="icon wa-badge-icon"><use href="#i-check"></use></svg>Всё по плану</span>
            <span v-if="t.empty" class="badge badge--todo badge--lg">Плана на дату нет</span>
          </div>
        </article>
      </section>

      <!-- Вкладка «План» — только просмотр -->
      <section v-else class="wa-plan">
        <div v-if="!data.plan.length" class="card">
          <div class="empty-state">
            <img class="empty-state__art" :src="asset('leaf-pair')" alt="">
            <div class="empty-state__title">Плана на {{ dayLabel }} нет</div>
            <div class="empty-state__text">План приходит из «Автоплана» — отправьте его там.</div>
          </div>
        </div>
        <template v-else>
          <div class="table-wrap wa-plan-table">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Блюдо</th>
                  <th v-for="t in tiles" :key="t.tt" class="is-num" :title="t.name">{{ t.emoji }} {{ shortName(t.name) }}</th>
                  <th class="is-num">Итого</th>
                </tr>
              </thead>
              <tbody>
                <template v-for="g in planGroups" :key="g.name">
                  <tr class="wa-plan-grouprow"><td :colspan="tiles.length + 2">{{ g.name }}</td></tr>
                  <tr v-for="r in g.rows" :key="r.name">
                    <td><b>{{ r.name }}</b> <span class="is-muted">· {{ r.unit }}</span></td>
                    <td v-for="t in tiles" :key="t.tt" class="is-num" :class="{ 'is-muted': !r.by[t.tt] }">{{ r.by[t.tt] ? fmt(r.by[t.tt]) : '—' }}</td>
                    <td class="is-num num">{{ fmt(r.total) }}</td>
                  </tr>
                </template>
              </tbody>
            </table>
            <div class="data-table__foot"><svg class="icon icon--sm"><use href="#i-lock"></use></svg>Только просмотр — план правится в «Автоплане»</div>
          </div>

          <!-- Телефон: карточки вместо таблицы, без прокрутки вбок -->
          <div class="wa-plan-list">
            <section v-for="g in planGroups" :key="g.name" class="wa-plan-group">
              <div class="eyebrow wa-plan-group__title"><span>{{ g.name }}</span><span>{{ g.rows.length }}</span></div>
              <div v-for="r in g.rows" :key="r.name" class="wa-plan-item">
                <div class="wa-plan-item__head">
                  <b>{{ r.name }}</b>
                  <span class="wa-plan-item__total">{{ fmt(r.total) }}<small>{{ r.unit }}</small></span>
                </div>
                <div class="wa-plan-item__by">
                  <span v-for="t in tiles" :key="t.tt" :class="{ 'is-empty': !r.by[t.tt] }" :title="t.name">{{ t.emoji }} {{ r.by[t.tt] ? fmt(r.by[t.tt]) : '—' }}</span>
                </div>
              </div>
            </section>
            <p class="wa-hint wa-center"><svg class="icon icon--sm wa-inline-icon"><use href="#i-lock"></use></svg>Только просмотр — план правится в «Автоплане»</p>
          </div>
        </template>
      </section>
    </template>
  </div>
</script>


<!-- ===================================================================== Расчёт заготовок -->
<script type="text/x-template" id="tpl-calc">
  <div class="page wa-calc">
    <div class="page-head">
      <h1 class="h-screen page-head__title">Расчёт заготовок</h1>
      <div class="wa-dash__controls">
        <day-picker :model-value="calc.date" @update:model-value="setDate"></day-picker>
        <div class="tabs" role="tablist">
          <button type="button" class="tabs__tab" role="tab" :aria-selected="tab === 'preps'" @click="tab = 'preps'">Заготовки</button>
          <button type="button" class="tabs__tab" role="tab" :aria-selected="tab === 'detail'" @click="tab = 'detail'">Детально</button>
        </div>
      </div>
    </div>

    <!-- Все дни без заготовок — одной кнопкой, а не по одному дню -->
    <div v-if="calc.allSaving" class="banner banner--info wa-pending" role="status">
      <span class="spinner"></span>
      <span class="banner__text">Записываем заготовки на {{ pendingN }} {{ plural(pendingN, ['день', 'дня', 'дней']) }}…<span class="banner__sub">Обычно до минуты — не закрывайте страницу</span></span>
    </div>
    <div v-else-if="calc.allDone" class="banner banner--success wa-pending" role="status">
      <svg class="icon icon--sm"><use href="#i-check"></use></svg>
      <span class="banner__text">Записано {{ calc.allDone.days.length }} {{ plural(calc.allDone.days.length, ['день', 'дня', 'дней']) }} · {{ calc.allDone.rows }} {{ plural(calc.allDone.rows, ['строка', 'строки', 'строк']) }}
        <span class="banner__sub">{{ calc.allDone.days.map(d => dayShort(d.date)).join(' · ') }}</span></span>
      <button type="button" class="btn btn--icon" aria-label="Скрыть" @click="calc.allDone = null"><svg class="icon"><use href="#i-x"></use></svg></button>
    </div>
    <div v-else-if="pendingShown" class="banner banner--info wa-pending" role="status">
      <svg class="icon icon--sm"><use href="#i-calendar"></use></svg>
      <span class="banner__text">{{ pendingN }} {{ plural(pendingN, ['день', 'дня', 'дней']) }} без заготовок<span class="banner__sub">{{ pendingRange }}</span></span>
      <button type="button" class="btn btn--secondary" :disabled="calc.saving" @click="askAll = true">Рассчитать все</button>
    </div>
    <div v-if="calc.allError" class="banner banner--error" role="alert">
      <svg class="icon icon--sm"><use href="#i-alert"></use></svg>
      <span class="banner__text">{{ calc.allError }}</span>
    </div>

    <!-- Пересчёт: завтра и позже, где заготовки записаны, а план или тех. карты с тех пор изменились -->
    <div v-if="calc.recalcing" class="banner banner--info wa-stale" role="status">
      <span class="spinner"></span>
      <span class="banner__text">Пересчитываем заготовки…<span class="banner__sub">Обычно до минуты — не закрывайте страницу</span></span>
    </div>
    <div v-else-if="calc.recalcDone" class="banner banner--success wa-stale" role="status">
      <svg class="icon icon--sm"><use href="#i-check"></use></svg>
      <span class="banner__text">Пересчитано: {{ calc.recalcDone.days.map(d => dayShort(d.date)).join(' · ') }}
        <span class="banner__sub">Изменилось позиций: {{ calc.recalcDone.changes }} · строк было {{ calc.recalcDone.removed }}, стало {{ calc.recalcDone.rows }}</span></span>
      <button type="button" class="btn btn--icon" aria-label="Скрыть" @click="calc.recalcDone = null"><svg class="icon"><use href="#i-x"></use></svg></button>
    </div>
    <div v-else-if="staleShown" class="banner banner--warning wa-stale" role="status">
      <svg class="icon icon--sm"><use href="#i-refresh"></use></svg>
      <span class="banner__text">Заготовки устарели: {{ staleN }} {{ plural(staleN, ['день', 'дня', 'дней']) }}<span class="banner__sub">{{ staleRange }}</span></span>
      <button type="button" class="btn btn--secondary" :disabled="calc.saving || calc.allSaving" @click="askRecalcAll = true">Пересчитать все</button>
    </div>
    <div v-if="calc.recalcError" class="banner banner--error" role="alert">
      <svg class="icon icon--sm"><use href="#i-alert"></use></svg>
      <span class="banner__text">{{ calc.recalcError }}</span>
    </div>

    <div v-if="calc.error && !data" class="banner banner--error" role="alert">
      <svg class="icon icon--sm"><use href="#i-alert"></use></svg>
      <span class="banner__text">{{ calc.error }}</span>
      <button type="button" class="btn btn--secondary" @click="reload(false)">Повторить</button>
    </div>

    <div v-else-if="!data" class="card card--pad wa-calc-loading" aria-busy="true">
      <span class="spinner"></span>
      <div>
        <b>Считаем заготовки на {{ dayLabel }}</b>
        <div class="wa-hint">План — с листа «Блюда», тех. карты — из iiko. Обычно до 15 секунд.</div>
      </div>
    </div>

    <template v-else>
      <!-- Точки: на телефоне — только значки, чтобы ряд не прокручивался -->
      <div class="chips wa-pt-chips" role="group" aria-label="Точка">
        <button type="button" class="chip" :aria-pressed="pt === ''" @click="pt = ''">Все<span class="wa-chip-name">&nbsp;точки</span></button>
        <button v-for="p in data.points" :key="p.tt" type="button" class="chip" :aria-pressed="pt === p.tt"
                :title="p.name + (p.locked ? ' — уже рассчитано' : '')" :aria-label="p.name" @click="pt = p.tt">
          {{ p.emoji || '🥕' }}<span class="wa-chip-name">&nbsp;{{ p.name }}</span>
          <svg v-if="p.locked" class="icon wa-chip-lock"><use href="#i-lock"></use></svg>
        </button>
      </div>

      <div v-if="pt" class="wa-pt-title">{{ point.emoji }} {{ point.name }} · {{ point.dishes }} {{ plural(point.dishes, ['блюдо', 'блюда', 'блюд']) }} в плане</div>

      <div v-if="recalcPoints.length" class="banner banner--warning wa-recalc-day" role="status">
        <svg class="icon icon--sm"><use href="#i-refresh"></use></svg>
        <span class="banner__text"><b>План изменился после расчёта</b>
          <span class="banner__sub">{{ recalcPoints.map(p => (pt ? '' : (p.emoji || p.name) + ' ') + p.recalc.changes.length + ' ' + plural(p.recalc.changes.length, ['позиция', 'позиции', 'позиций'])).join(' · ') }}</span></span>
        <button type="button" class="btn btn--secondary" :disabled="calc.saving || calc.allSaving || calc.recalcing" @click="askRecalc = true">Пересчитать</button>
      </div>
      <div v-if="lockedAll && !recalcPoints.length" class="banner banner--success" role="status">
        <svg class="icon icon--sm"><use href="#i-lock"></use></svg>
        <span class="banner__text"><b>На эту дату заготовки уже рассчитаны.</b>
          {{ future ? 'Они совпадают с нынешним планом — пересчитывать нечего.' : 'Повторный расчёт недоступен — ниже записанные данные.' }}</span>
      </div>
      <div v-else-if="lockedSome.length" class="banner banner--info" role="status">
        <svg class="icon icon--sm"><use href="#i-lock"></use></svg>
        <span class="banner__text">Уже записаны: {{ lockedSome.map(p => p.emoji + ' ' + p.name).join(', ') }}. Записать можно остальные точки.</span>
      </div>

      <!-- Вкладка «Заготовки» -->
      <div v-if="tab === 'preps'" class="wa-calc-grid">
        <aside class="wa-calc-side">
          <div class="card card--pad wa-calc-card">
            <div class="eyebrow">Предупреждения</div>
            <div v-for="w in warnings" :key="w.title" class="wa-warn" :class="'wa-warn--' + w.tone">
              <span class="wa-warn__dot"></span>
              <span><b>{{ w.title }}</b><span>{{ w.text }}</span></span>
            </div>
            <div v-if="!warnings.length" class="wa-hint">Предупреждений нет</div>
          </div>
          <div v-if="smoothies.length" class="card card--pad wa-calc-card">
            <div class="eyebrow">Лимонады и смузи — отдельные наборы</div>
            <div v-for="s in smoothies" :key="s.dish" class="wa-calc-sm">
              <span>{{ s.dish }}<small v-if="!pt"> · {{ s.points }}</small></span>
              <b>{{ s.qty ? fmt(s.qty) : '—' }} <small>{{ s.unit }}</small></b>
            </div>
          </div>
        </aside>

        <div class="card wa-calc-table">
          <div class="wa-calc-row wa-calc-row--head"><span>Заготовка</span><span>Группа</span><span class="wa-calc-row__qty">Количество</span><span>Хранение</span></div>
          <!-- Нажатие на заготовку — из каких блюд она набирается и с какой даты их тех. карты -->
          <template v-for="r in mainRows" :key="r.name">
            <div class="wa-calc-row wa-calc-row--tap" :class="{ 'is-open': openPrep === r.name }" role="button" tabindex="0" :aria-expanded="openPrep === r.name"
                 @click="togglePrep(r.name)" @keydown.enter="togglePrep(r.name)">
              <span class="wa-calc-row__name">{{ r.name }}</span>
              <span class="wa-calc-row__group">{{ r.group || '—' }}</span>
              <span class="wa-calc-row__qty">{{ fmt(r.amount) }} <small>{{ r.unit }}</small></span>
              <span class="wa-calc-row__place">{{ r.place.length ? r.place.join(' · ') : '—' }}</span>
            </div>
            <div v-if="openPrep === r.name" class="wa-calc-src">
              <template v-if="sourcesOf(r.name).length">
                <div class="wa-calc-src__title">Из каких блюд<template v-if="freshSrc"> · по нынешним тех. картам</template></div>
                <div v-for="x in sourcesOf(r.name)" :key="x.dish" class="wa-calc-src__row">
                  <span class="wa-calc-src__dish">{{ x.dish }}<small>{{ [pt ? '' : x.emojis.join(' '), fmt(x.qty) + ' ' + x.unit, x.cardFrom ? 'тех. карта с ' + dmy(x.cardFrom) : ''].filter(Boolean).join(' · ') }}</small></span>
                  <b class="wa-calc-src__qty">{{ fmt(x.amount) }} <small>{{ r.unit }}</small></b>
                </div>
              </template>
              <p v-else class="wa-hint">{{ data.detail.length ? 'В блюдах без отметки этой заготовки нет.' : 'Из каких блюд — видно до записи заготовок и на завтра и дальше.' }}</p>
              <p v-if="smoothiesWith(r.name).length" class="wa-hint">Ещё в наборах лимонадов и смузи (идут отдельно, справа): {{ smoothiesWith(r.name).join(', ') }}.</p>
            </div>
          </template>
          <p v-if="mainRows.length" class="wa-hint wa-calc-tip">Нажмите на заготовку — увидите, из каких блюд она набирается и с какой даты их тех. карты.</p>
          <div v-if="!mainRows.length" class="empty-state">
            <img class="empty-state__art" :src="asset('leaf-pair')" alt="">
            <div class="empty-state__title">{{ emptyTitle }}</div>
            <div class="empty-state__text">{{ emptyText }}</div>
          </div>
        </div>
      </div>

      <!-- Вкладка «Детально»: блюдо → заготовки -->
      <div v-else class="wa-detail-grid">
        <p v-if="detailNote" class="wa-hint">{{ detailNote }}</p>
        <article v-for="d in detailRows" :key="d.tt + d.dish" class="card wa-detail">
          <div class="wa-detail__head">
            <b>{{ d.dish }}</b>
            <span class="wa-detail__qty">{{ fmt(d.qty) }} <small>{{ d.unit }}</small></span>
          </div>
          <div class="wa-hint">{{ [pt ? '' : d.emoji + ' ' + d.point, d.cardFrom ? 'тех. карта с ' + dmy(d.cardFrom) : ''].filter(Boolean).join(' · ') }}</div>
          <div class="tech-card">
            <div v-for="x in d.preps" :key="x[0]" class="tech-card__row">
              <span>{{ x[0] }}</span><span class="tech-card__qty">{{ fmt(x[1]) }} {{ x[2] }}</span>
            </div>
            <div v-if="!d.preps.length" class="tech-card__row"><span>Все заготовки — в исключениях</span></div>
          </div>
        </article>
      </div>

      <div v-if="calc.error" class="banner banner--error" role="alert">
        <svg class="icon icon--sm"><use href="#i-alert"></use></svg>
        <span class="banner__text">{{ calc.error }}</span>
      </div>

      <!-- Запись: всегда под рукой -->
      <div class="wa-actionbar">
        <span class="wa-actionbar__text">{{ summary }}</span>
        <span v-if="calc.done === calc.date" class="wa-actionbar__ok">
          <svg class="icon"><use href="#i-check"></use></svg>Записано
        </span>
        <button v-else type="button" class="btn btn--primary btn--lg" :class="{ 'is-loading': calc.saving }"
                :disabled="!writable.length || calc.saving || calc.allSaving" @click="ask = true">{{ btnText }}</button>
      </div>

      <div class="wa-calc-foot">
        <span v-if="data.cardsAt" class="wa-hint">Тех. карты iiko от {{ data.cardsAt.slice(11, 16) }}</span>
        <button v-if="cardsLink" type="button" class="wa-link" :disabled="calc.loading" @click="reload(true)">
          {{ calc.loading ? 'Обновляем…' : 'Обновить тех. карты из iiko' }}
        </button>
        <button v-if="store.user.role === 'owner'" type="button" class="wa-link" :disabled="calc.cmpLoading" @click="compare">
          {{ calc.cmpLoading ? 'Сверяем…' : 'Сверить со старым расчётом' }}
        </button>
      </div>
      <div v-if="calc.cmp" class="banner" :class="calc.cmp.diffCount ? 'banner--warning' : 'banner--success'" role="status">
        <svg class="icon icon--sm"><use :href="calc.cmp.diffCount ? '#i-alert' : '#i-check'"></use></svg>
        <span class="banner__text">
          <template v-if="calc.cmp.error">{{ calc.cmp.error }}</template>
          <template v-else-if="!calc.cmp.diffCount">Совпадает со старым расчётом: {{ calc.cmp.same }} {{ plural(calc.cmp.same, ['строка', 'строки', 'строк']) }}.</template>
          <template v-else>
            Расхождений: {{ calc.cmp.diffCount }} (совпало {{ calc.cmp.same }}).
            <span v-for="(x, i) in calc.cmp.diffs.slice(0, 10)" :key="i" class="banner__sub">
              {{ x.tt }} · {{ x.name }}{{ x.dishFor ? ' (' + x.dishFor + ')' : '' }}: старый {{ x.legacy == null ? '—' : fmt(x.legacy) }}, новый {{ x.web == null ? '—' : fmt(x.web) }}
            </span>
          </template>
        </span>
      </div>
    </template>

    <div class="modal-backdrop" :class="{ 'is-open': ask }" @click.self="ask = false">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="calc-ask-title">
        <h2 class="modal__title" id="calc-ask-title">Записать заготовки?</h2>
        <p class="modal__text">{{ dayLabel }} · {{ writable.map(p => p.emoji + ' ' + p.name).join(', ') }}.
          {{ future ? 'Если потом поправить план, заготовки можно будет пересчитать.' : 'Повторный расчёт на эту дату для этих точек будет недоступен.' }}</p>
        <div class="modal__actions">
          <button type="button" class="btn btn--ghost" @click="ask = false">Отмена</button>
          <button type="button" class="btn btn--primary" @click="commit">Записать</button>
        </div>
      </div>
    </div>

    <div class="modal-backdrop" :class="{ 'is-open': askAll }" @click.self="askAll = false">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="calc-all-title">
        <h2 class="modal__title" id="calc-all-title">Рассчитать {{ pendingN }} {{ plural(pendingN, ['день', 'дня', 'дней']) }}?</h2>
        <div class="wa-pending-list">
          <div v-for="d in calc.pending || []" :key="d.date" class="wa-pending-day">
            <b>{{ dayShort(d.date) }}</b>
            <span class="wa-pending-day__pts" :title="d.tts.map(t => pointName(t)).join(', ')">{{ d.tts.map(t => pointEmoji(t)).join(' ') }}</span>
            <span class="wa-pending-day__n">{{ d.rows }} {{ plural(d.rows, ['строка', 'строки', 'строк']) }}</span>
          </div>
        </div>
        <p class="modal__text">Заготовки посчитаются по плану и тех. картам iiko на сейчас. Если потом поправить план в «Автоплане»,
          заготовки на завтра и позже можно будет пересчитать.</p>
        <p v-if="pendingNoCard" class="wa-hint">У части блюд нет тех. карты — по ним заготовок не будет. Список — на экране каждого дня.</p>
        <div class="modal__actions">
          <button type="button" class="btn btn--ghost" @click="askAll = false">Отмена</button>
          <button type="button" class="btn btn--primary" @click="commitAll">Записать все</button>
        </div>
      </div>
    </div>

    <!-- Пересчёт открытого дня: что изменится по каждой точке -->
    <div class="modal-backdrop" :class="{ 'is-open': askRecalc }" @click.self="askRecalc = false">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="calc-re-title">
        <h2 class="modal__title" id="calc-re-title">Пересчитать заготовки?</h2>
        <p class="modal__text">{{ dayLabel }} · по нынешнему плану и тех. картам iiko. Было → станет:</p>
        <div class="wa-pending-list wa-recalc">
          <template v-for="p in recalcPoints" :key="p.tt">
            <b v-if="recalcPoints.length > 1 || !pt" class="wa-recalc__pt">{{ p.emoji }} {{ p.name }}</b>
            <div v-for="c in p.recalc.changes" :key="c.name + '|' + c.dishFor" class="wa-recalc__row">
              <span class="wa-recalc__name">{{ c.name }}<small v-if="c.dishFor"> · {{ c.dishFor }}</small></span>
              <span v-if="c.now" class="wa-recalc__qty" :class="c.now > c.was ? 'is-up' : 'is-down'">{{ c.was ? fmt(c.was) : 'нет' }} → {{ fmt(c.now) }} <small>{{ c.unit }}</small></span>
              <span v-else class="wa-recalc__qty is-down">{{ fmt(c.was) }} <small>{{ c.unit }}</small> → убрать</span>
            </div>
          </template>
        </div>
        <p v-if="recalcKept" class="wa-hint">Не изменятся — уже отмечены на точке или набор собран: {{ recalcKept }} {{ plural(recalcKept, ['позиция', 'позиции', 'позиций']) }}.</p>
        <div class="modal__actions">
          <button type="button" class="btn btn--ghost" @click="askRecalc = false">Отмена</button>
          <button type="button" class="btn btn--primary" @click="recalc([calc.date], recalcPoints.map(p => p.tt))">Пересчитать</button>
        </div>
      </div>
    </div>

    <!-- Пересчёт всех устаревших дней -->
    <div class="modal-backdrop" :class="{ 'is-open': askRecalcAll }" @click.self="askRecalcAll = false">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="calc-reall-title">
        <h2 class="modal__title" id="calc-reall-title">Пересчитать {{ staleN }} {{ plural(staleN, ['день', 'дня', 'дней']) }}?</h2>
        <div class="wa-pending-list">
          <div v-for="d in calc.stale || []" :key="d.date" class="wa-pending-day">
            <b>{{ dayShort(d.date) }}</b>
            <span class="wa-pending-day__pts" :title="d.tts.map(t => pointName(t)).join(', ')">{{ d.tts.map(t => pointEmoji(t)).join(' ') }}</span>
            <span class="wa-pending-day__n">{{ d.changes }} {{ plural(d.changes, ['позиция', 'позиции', 'позиций']) }}</span>
          </div>
        </div>
        <p class="modal__text">Неотмеченные заготовки этих дней заменятся расчётом по нынешнему плану и тех. картам iiko.
          Отмеченные на точках, внеплановые и собранные наборы лимонадов и смузи не изменятся. Что именно поменяется — на экране каждого дня.</p>
        <div class="modal__actions">
          <button type="button" class="btn btn--ghost" @click="askRecalcAll = false">Отмена</button>
          <button type="button" class="btn btn--primary" @click="recalc((calc.stale || []).map(d => d.date))">Пересчитать все</button>
        </div>
      </div>
    </div>
  </div>
</script>


<!-- ===================================================================== Архив -->
<script type="text/x-template" id="tpl-archive">
  <div class="page wa-archive">
    <div class="page-head">
      <h1 class="h-screen page-head__title">Архив</h1>
      <div class="tabs" role="tablist">
        <button type="button" class="tabs__tab" role="tab" :aria-selected="tab === 'sum'" @click="tab = 'sum'">Сводка</button>
        <button type="button" class="tabs__tab" role="tab" :aria-selected="tab === 'rows'" @click="tab = 'rows'">Подробно</button>
      </div>
      <button v-if="tab === 'rows'" type="button" class="btn btn--secondary wa-ar-csv" :disabled="!rows.length" @click="csv" aria-label="Скачать CSV">
        <svg class="icon icon--sm"><use href="#i-download"></use></svg><span>{{ csvDone ? 'Файл скачан' : 'CSV' }}</span>
      </button>
    </div>

    <!-- ===== Сводка: общая картина за период, отсюда — в подробности ===== -->
    <template v-if="tab === 'sum'">
      <div class="wa-ar-period">
        <div class="chips" role="group" aria-label="Период">
          <button v-for="o in PERIODS" :key="o.v" type="button" class="chip" :aria-pressed="period === o.v" @click="setPeriod(o.v)">{{ o.label }}</button>
        </div>
        <div class="wa-ar-period__dates">
          <label class="field field--sm"><span class="visually-hidden">С</span><input class="field__input" type="date" v-model="sp.from" :max="sp.to"></label>
          <span aria-hidden="true">–</span>
          <label class="field field--sm"><span class="visually-hidden">По</span><input class="field__input" type="date" v-model="sp.to" :min="sp.from" :max="store.today"></label>
        </div>
      </div>

      <div class="wa-ar-filters">
        <div class="chips wa-pt-chips" role="group" aria-label="Точка">
          <button type="button" class="chip" :aria-pressed="!sf.tt" @click="sf.tt = ''">Все<span class="wa-chip-name">&nbsp;точки</span></button>
          <button v-for="p in store.points" :key="p.tt" type="button" class="chip" :aria-pressed="sf.tt === p.tt" :title="p.name" :aria-label="p.name" @click="sf.tt = sf.tt === p.tt ? '' : p.tt">
            {{ p.emoji || '🥕' }}<span class="wa-chip-name">&nbsp;{{ p.name }}</span>
          </button>
        </div>
        <div class="tabs wa-seg" role="radiogroup" aria-label="Что">
          <button v-for="k in KINDS" :key="k.v" type="button" class="tabs__tab" role="radio" :aria-checked="sf.kind === k.v" :aria-selected="sf.kind === k.v" @click="sf.kind = k.v">{{ k.label }}</button>
        </div>
      </div>
      <div v-if="sf.tt" class="wa-pt-title">{{ pointLabel(sf.tt) }}</div>

      <div v-if="sm.error" class="banner banner--error" role="alert">
        <svg class="icon icon--sm"><use href="#i-alert"></use></svg><span class="banner__text">{{ sm.error }}</span>
        <button type="button" class="btn btn--secondary" @click="loadSummary(true)">Повторить</button>
      </div>

      <template v-if="!summary && !sm.error">
        <div class="wa-ar-kpis"><div v-for="i in 4" :key="i" class="skeleton" style="height:92px;border-radius:var(--radius-lg)"></div></div>
        <div class="skeleton" style="height:220px;border-radius:var(--radius-lg)"></div>
      </template>

      <template v-else-if="summary">
        <div v-if="!tot.n" class="card">
          <div class="empty-state">
            <img class="empty-state__art" :src="asset('leaf-pair')" alt="">
            <div class="empty-state__title">За период в архиве пусто</div>
            <div class="empty-state__text">В архив попадают закрытые дни — день закрывается сам в {{ store.settings.day_close_time || '23:00' }}.</div>
          </div>
        </div>

        <template v-else>
          <!-- Главные цифры: нажмите — откроются эти строки -->
          <section class="wa-ar-kpis" :class="{ 'is-loading': sm.loading }">
            <button type="button" class="card wa-kpi" @click="drill({})">
              <span class="wa-kpi__label">Выполнено</span>
              <b class="wa-kpi__value">{{ pct(tot.done + tot.partial, tot.n) }}%</b>
              <small>{{ num(tot.done + tot.partial) }} из {{ num(tot.n) }} позиций</small>
            </button>
            <button type="button" class="card wa-kpi wa-kpi--warn" @click="drill({ status: 'partial' })">
              <span class="wa-kpi__label">Частично</span>
              <b class="wa-kpi__value">{{ num(tot.partial) }}</b>
              <small>{{ pct(tot.partial, tot.n) }}% позиций<template v-if="tot.rest"> · остаток не доделан: {{ num(tot.rest) }}</template></small>
            </button>
            <button type="button" class="card wa-kpi wa-kpi--bad" @click="drill({ status: 'none' })">
              <span class="wa-kpi__label">Не сделано</span>
              <b class="wa-kpi__value">{{ num(tot.none) }}</b>
              <small>{{ pct(tot.none, tot.n) }}% позиций</small>
            </button>
            <button type="button" class="card wa-kpi" @click="drill({ status: 'done' })">
              <span class="wa-kpi__label">Больше плана</span>
              <b class="wa-kpi__value">{{ num(tot.over) }}</b>
              <small>выше {{ Math.round((store.settings.status_ready_max || 1.5) * 100) }}% плана</small>
            </button>
          </section>

          <div class="wa-ar-grid">
            <section class="card card--pad wa-donut-card">
              <div class="wa-donut">
                <svg viewBox="0 0 160 160">
                  <circle cx="80" cy="80" r="60" class="wa-donut__track"/>
                  <circle v-for="s in donut.segments" :key="s.cls" cx="80" cy="80" r="60" :class="'wa-donut__seg wa-donut__seg--' + s.cls"
                          :stroke-dasharray="s.len + ' ' + CIRC" :stroke-dashoffset="-s.offset"/>
                </svg>
                <div class="wa-donut__label"><b>{{ pct(tot.done, tot.n) }}%</b><span>готово</span></div>
              </div>
              <div class="wa-donut__legend">
                <div v-for="l in donut.legend" :key="l.label" class="wa-donut__row">
                  <span class="wa-donut__swatch" :class="'wa-donut__swatch--' + l.cls"></span><span>{{ l.label }}</span><b>{{ num(l.n) }}</b>
                </div>
                <p class="wa-hint">По количеству: сделано {{ num(tot.fact) }} из {{ num(tot.plan) }} по плану · {{ pct(tot.fact, tot.plan) }}%</p>
              </div>
            </section>

            <!-- По дням: доля готово / частично / не сделано; нажмите — строки дня -->
            <section class="card card--pad wa-ar-days">
              <div class="wa-ar-days__head"><b class="wa-set-card__title">По дням</b><span class="wa-hint">нажмите на день — его строки</span></div>
              <div class="wa-ar-bars" :class="{ 'is-dense': byDay.length > 14 }" :style="{ '--n': byDay.length }">
                <button v-for="d in byDay" :key="d.date" type="button" class="wa-ar-bar" :title="dayTitle(d)" @click="drill({ from: d.date, to: d.date })">
                  <span class="wa-ar-bar__stack">
                    <span class="wa-ar-bar__seg wa-ar-bar__seg--none" :style="{ flexGrow: d.none }"></span>
                    <span class="wa-ar-bar__seg wa-ar-bar__seg--partial" :style="{ flexGrow: d.partial }"></span>
                    <span class="wa-ar-bar__seg wa-ar-bar__seg--done" :style="{ flexGrow: d.done }"></span>
                  </span>
                  <span class="wa-ar-bar__pct">{{ d.n ? pct(d.done + d.partial, d.n) : '—' }}</span>
                  <span class="wa-ar-bar__day">{{ d.label }}</span>
                </button>
              </div>
            </section>
          </div>

          <!-- Точки: нажмите — сводка только по точке -->
          <section v-if="!sf.tt" class="point-grid">
            <article v-for="t in byPoint" :key="t.tt" class="card point-tile wa-tile" :class="{ 'point-tile--alert': t.bad }"
                     role="button" tabindex="0" @click="sf.tt = t.tt" @keydown.enter="sf.tt = t.tt">
              <div class="point-tile__head">
                <span class="point-avatar point-avatar--lg">{{ t.emoji || '🥕' }}</span>
                <div class="wa-tile__title">
                  <div class="point-tile__name">{{ t.name }}</div>
                  <div class="point-tile__last">{{ num(t.n) }} позиций · {{ t.days }} {{ plural(t.days, ['день', 'дня', 'дней']) }}</div>
                </div>
                <span class="point-tile__pct" :class="{ 'wa-pct--done': t.n && t.done + t.partial === t.n }">{{ pct(t.done + t.partial, t.n) }}%</span>
              </div>
              <div class="point-tile__metrics">
                <div v-for="m in t.metrics" :key="m.label" class="metric">
                  <span class="metric__label">{{ m.label }}</span>
                  <span class="progress-bar" :class="{ 'progress-bar--done': m.total && m.done === m.total }"><span class="progress-bar__fill" :style="{ '--p': m.total ? m.done / m.total : 0 }"></span></span>
                  <span class="metric__value">{{ m.done }}/{{ m.total }}</span>
                </div>
              </div>
              <div class="point-tile__alerts">
                <span v-if="t.none" class="badge badge--lg badge--error">Не сделано · {{ t.none }}</span>
                <span v-if="t.partial" class="badge badge--lg badge--partial">Частично · {{ t.partial }}</span>
                <span v-if="t.rest" class="badge badge--lg badge--partial">Остаток не доделан · {{ t.rest }}</span>
                <span v-if="t.over" class="badge badge--lg badge--rest">Больше плана · {{ t.over }}</span>
                <span v-if="!t.none && !t.partial && t.n" class="badge badge--done badge--lg"><svg class="icon wa-badge-icon"><use href="#i-check"></use></svg>Всё сделано</span>
              </div>
            </article>
          </section>
          <button v-else type="button" class="btn btn--secondary wa-ar-more" @click="drill({})">Все строки точки за период →</button>

          <div class="wa-ar-grid wa-ar-grid--2">
            <!-- Что чаще всего не делают -->
            <section class="card card--pad wa-ar-list">
              <b class="wa-set-card__title">Чаще всего не сделано</b>
              <p v-if="!topNames.length" class="wa-hint">Всё сделано — нечего показать.</p>
              <button v-for="x in topNames" :key="x.kind + x.name" type="button" class="wa-ar-line" @click="drill({ q: x.name, kind: x.kind })">
                <span class="wa-ar-line__name"><b>{{ x.name }}</b><small>{{ x.kind === 'dishes' ? 'блюдо' : 'заготовка' }}<template v-if="!sf.tt"> · {{ x.tts.map(pointEmoji).join(' ') }}</template></small></span>
                <span class="wa-ar-line__nums"><b v-if="x.none" class="is-bad">{{ x.none }}</b><span v-if="x.partial" class="is-partial">{{ x.partial }} частично</span></span>
              </button>
            </section>

            <!-- Сотрудники: сколько отметок и как -->
            <section class="card card--pad wa-ar-list">
              <b class="wa-set-card__title">Сотрудники</b>
              <p v-if="!byEmp.length" class="wa-hint">Отметок за период нет.</p>
              <button v-for="e in byEmp" :key="e.name" type="button" class="wa-ar-line" @click="drill({ employee: e.name })">
                <span class="user-avatar wa-avatar-sm">{{ initials(e.name) }}</span>
                <span class="wa-ar-line__name"><b>{{ e.name }}</b><small>{{ num(e.n) }} отметок · блюд {{ num(e.dishes) }} · заготовок {{ num(e.preps) }}</small></span>
                <span class="wa-ar-line__nums"><span v-if="e.partial" class="is-partial">частично {{ pct(e.partial, e.n) }}%</span><span v-if="e.over" class="is-over">больше плана {{ e.over }}</span></span>
              </button>
            </section>
          </div>
        </template>
      </template>
    </template>

    <!-- ===== Подробно: строки архива с фильтрами ===== -->
    <template v-else>
    <!-- На телефоне на виду период и поиск, остальное — под «Фильтры» -->
    <div class="wa-filters">
      <label class="field field--sm"><span class="field__label">С</span><input class="field__input" type="date" v-model="f.from" :max="f.to"></label>
      <label class="field field--sm"><span class="field__label">По</span><input class="field__input" type="date" v-model="f.to" :min="f.from" :max="store.today"></label>
      <label class="field field--sm wa-filters__q"><span class="field__label">Поиск</span>
        <span class="field__control"><svg class="icon icon--sm field__icon"><use href="#i-search"></use></svg>
        <input class="field__input field__input--with-icon" type="search" v-model="f.q" placeholder="Название позиции"></span></label>
      <button type="button" class="chip wa-filters__toggle" :aria-pressed="more" @click="more = !more">
        Фильтры<span v-if="activeFilters" class="chip__count">{{ activeFilters }}</span>
        <svg class="icon icon--sm wa-filters__chevron"><use href="#i-chevron-down"></use></svg>
      </button>
      <div class="wa-filters__more" :class="{ 'is-open': more }">
        <label class="field field--sm"><span class="field__label">Точка</span>
          <select class="field__input" v-model="f.tt"><option value="">Все точки</option><option v-for="p in store.points" :key="p.tt" :value="p.tt">{{ p.emoji }} {{ p.name }}</option></select></label>
        <label class="field field--sm"><span class="field__label">Что</span>
          <select class="field__input" v-model="f.kind"><option value="">Всё</option><option value="dishes">Блюда</option><option value="preps">Заготовки</option></select></label>
        <label class="field field--sm"><span class="field__label">Статус</span>
          <select class="field__input" v-model="f.status"><option value="">Любой</option><option value="done">Готово</option><option value="partial">Частично</option><option value="none">Не сделано</option><option value="rest">Остаток не доделан</option></select></label>
        <label class="field field--sm"><span class="field__label">Сотрудник</span>
          <select class="field__input" v-model="f.employee"><option value="">Все</option><option v-for="e in employees" :key="e" :value="e">{{ e }}</option></select></label>
      </div>
    </div>

    <div v-if="ar.error" class="banner banner--error" role="alert">
      <svg class="icon icon--sm"><use href="#i-alert"></use></svg><span class="banner__text">{{ ar.error }}</span>
      <button type="button" class="btn btn--secondary" @click="query">Повторить</button>
    </div>
    <div v-if="ar.truncated" class="banner banner--warning" role="status">
      <svg class="icon icon--sm"><use href="#i-alert"></use></svg><span class="banner__text">Показаны первые {{ rows.length }} строк — сузьте период или фильтры.</span>
    </div>

    <div class="card wa-arch" :class="{ 'is-loading': ar.loading }">
      <div class="wa-arch-row wa-arch-row--head">
        <button v-for="h in heads" :key="h.label" type="button" class="wa-arch-sort" :class="{ 'is-num': h.num, 'is-on': sort.key === h.key }"
                :disabled="!h.key" @click="sortBy(h.key)">{{ h.label }}<span v-if="sort.key === h.key">{{ sort.dir > 0 ? '▲' : '▼' }}</span></button>
      </div>
      <div v-for="(r, i) in pageRows" :key="i" class="wa-arch-row" :class="{ 'is-editable': canEdit }"
           :role="canEdit ? 'button' : null" :tabindex="canEdit ? 0 : null" @click="edit(r)" @keydown.enter="edit(r)">
        <span class="wa-arch-row__date">{{ r.dateLabel }}</span>
        <span class="wa-arch-row__tt">{{ r.ttLabel }}</span>
        <span class="wa-arch-row__name"><b>{{ r.name }}</b><small v-if="r.dishFor">для: {{ r.dishFor }}</small>
          <small v-if="r.rest || r.unplanned" class="wa-arch-row__marks"><span v-if="r.rest" class="badge badge--rest">Остаток</span><span v-if="r.unplanned" class="badge badge--todo">Вне плана</span></small></span>
        <span class="wa-arch-row__kind">{{ r.kind === 'dishes' ? 'Блюдо' : 'Заготовка' }}</span>
