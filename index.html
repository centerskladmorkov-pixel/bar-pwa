      <div class="wa-set-grid">
        <!-- Две колонки карточек — каждая сплошным столбцом, без пустот по строкам -->
        <div class="wa-set-col">
          <!-- Настройки салат-базы — внутри раздела; здесь — переход к ним -->
          <section class="card card--pad wa-set-card">
            <div><b class="wa-set-card__title">Заготовки Салат БАЗА</b><p class="wa-hint">Ключи iikoCloud, точки (организация и склад), блюдо САЛАТ-БАЗА, готовые салаты, счёт списания и ингредиенты — в настройках раздела.</p></div>
            <button type="button" class="btn btn--secondary" @click="openSalad">Открыть настройки салат-базы</button>
          </section>

          <!-- Обучение: галочка ставится сама после теста; сняли — при следующем обновлении приложения обучение откроется снова -->
          <section v-if="data.training" class="card card--pad wa-set-card wa-tr-card">
            <div><b class="wa-set-card__title">Обучение</b><p class="wa-hint">При первом входе каждый проходит обучение с тестом — после него галочка ставится сама.
              Снимите галочку — при следующем обновлении приложения обучение откроется снова, и пока его не пройти, приложение не откроется. Сохраняется сразу.</p></div>
            <div class="wa-tr-list">
              <label v-for="u in data.training" :key="u.login" class="checkbox wa-tr-user" :class="{ 'is-off': !u.active }">
                <input type="checkbox" class="checkbox__input" :checked="u.done" :disabled="trBusy === u.login || trBusy === '*'" @change="setTrained(u, $event.target.checked)">
                <span class="checkbox__box"><svg class="icon"><use href="#i-check"></use></svg></span>
                <span class="wa-tr-user__body"><b>{{ u.name }}<small v-if="u.name !== u.login"> · {{ u.login }}</small></b>
                  <small>{{ TR_KIND[u.kind] }}{{ u.active ? '' : ' · заблокирован(а)' }} · {{ u.done ? 'пройдено ' + atText(u.at) : 'не пройдено — откроется при входе' }}</small></span>
              </label>
            </div>
            <p v-if="trError" class="wa-hint is-warn">{{ trError }}</p>
            <div v-if="trAll" class="banner banner--warning" role="alert">
              <svg class="icon icon--sm"><use href="#i-alert"></use></svg>
              <span class="banner__text">Снять галочку у всех? Каждый пройдёт обучение заново при следующем обновлении приложения.</span>
              <button type="button" class="btn btn--secondary" :class="{ 'is-loading': trBusy === '*' }" @click="resetAllTraining">Да, у всех</button>
            </div>
            <button v-else-if="data.training.some(u => u.done)" type="button" class="btn btn--ghost" :disabled="!!trBusy" @click="trAll = true">
              <svg class="icon icon--sm"><use href="#i-undo"></use></svg>Снять у всех
            </button>
          </section>

          <section class="card card--pad wa-set-card">
            <div><b class="wa-set-card__title">Автоновости</b><p class="wa-hint">Публикуются сами раз в день с этого времени — команда видит их при входе в приложение.</p></div>
            <label class="field field--sm"><span class="field__label">Время публикации</span><input class="field__input" type="time" v-model="f.news_time"></label>

            <div class="wa-switch-row">
              <span><b>Изменения тех. карт</b><small>В день, когда вступает в силу новый состав блюда или заготовки: что добавили, что убрали, сколько стало</small></span>
              <button type="button" class="switch" role="switch" :aria-checked="on('news_techcards') ? 'true' : 'false'" @click="flip('news_techcards')" aria-label="Изменения тех. карт"></button>
            </div>
            <div class="wa-news-auto__acts">
              <button type="button" class="wa-link" :class="{ 'is-loading': na.busy === 'techcards' }" :disabled="!!na.busy" @click="runNews('techcards')">Посмотреть сегодняшнюю</button>
              <button type="button" class="wa-link" :class="{ 'is-loading': na.busy === 'techcards:pub' }" :disabled="!!na.busy" @click="runNews('techcards', true)">Опубликовать сейчас</button>
            </div>

            <div class="wa-switch-row">
              <span><b>Новинки в плане</b><small>Блюдо снова в плане, а долго его не было ни в плане, ни в продажах — с составом и местом хранения</small></span>
              <button type="button" class="switch" role="switch" :aria-checked="on('news_newplan') ? 'true' : 'false'" @click="flip('news_newplan')" aria-label="Новинки в плане"></button>
            </div>
            <label v-if="on('news_newplan')" class="field field--sm">
              <span class="field__label">Не продавалось и не было в плане, дней</span>
              <input class="field__input" inputmode="numeric" v-model="f.news_newplan_days">
            </label>
            <div class="wa-news-auto__acts">
              <button type="button" class="wa-link" :class="{ 'is-loading': na.busy === 'newplan' }" :disabled="!!na.busy" @click="runNews('newplan')">Посмотреть сегодняшнюю</button>
              <button type="button" class="wa-link" :class="{ 'is-loading': na.busy === 'newplan:pub' }" :disabled="!!na.busy" @click="runNews('newplan', true)">Опубликовать сейчас</button>
            </div>

            <div class="wa-switch-row">
              <span><b>Рейтинг</b><small>По понедельникам — за всю прошлую неделю, в остальные дни — за вчера</small></span>
              <button type="button" class="switch" role="switch" :aria-checked="on('news_rating') ? 'true' : 'false'" @click="flip('news_rating')" aria-label="Рейтинг"></button>
            </div>
            <template v-if="on('news_rating')">
              <div class="field">
                <span class="field__label">Рейтинг по</span>
                <div class="tabs wa-seg" role="radiogroup">
                  <button v-for="o in RATING_BY" :key="o.v" type="button" class="tabs__tab" role="radio" :aria-checked="f.news_rating_by === o.v" :aria-selected="f.news_rating_by === o.v" @click="f.news_rating_by = o.v">{{ o.label }}</button>
                </div>
              </div>
              <div class="field">
                <span class="field__label">Считать</span>
                <div class="tabs wa-seg" role="radiogroup">
                  <button v-for="o in RATING_MEASURE" :key="o.v" type="button" class="tabs__tab" role="radio" :aria-checked="f.news_rating_measure === o.v" :aria-selected="f.news_rating_measure === o.v" @click="f.news_rating_measure = o.v">{{ o.label }}</button>
                </div>
              </div>
              <div class="wa-switch-row">
                <span><b>Лучшие сотрудники</b><small>Кто больше всех сделал блюд — по отмеченным порциям</small></span>
                <button type="button" class="switch" role="switch" :aria-checked="on('news_rating_staff') ? 'true' : 'false'" @click="flip('news_rating_staff')" aria-label="Лучшие сотрудники"></button>
              </div>
              <div v-if="on('news_rating_staff')" class="field">
                <span class="field__label">Кто участвует — нажмите, чтобы выключить или включить</span>
                <div class="chips wa-chips-wrap" role="group" aria-label="Сотрудники в рейтинге">
                  <button v-for="n in staffNames" :key="n" type="button" class="chip" :aria-pressed="staffOff(n) ? 'false' : 'true'" @click="toggleStaff(n)">{{ n }}</button>
                </div>
                <span class="field__hint">{{ staffText }}</span>
              </div>
              <div class="field">
                <span class="field__label">Мест в рейтинге</span>
                <div class="tabs wa-seg" role="radiogroup">
                  <button v-for="n in [3, 5, 10]" :key="n" type="button" class="tabs__tab" role="radio" :aria-checked="Number(f.news_rating_top) === n" :aria-selected="Number(f.news_rating_top) === n" @click="f.news_rating_top = String(n)">{{ n }}</button>
                </div>
              </div>
              <div class="field">
                <span class="field__label">Категории блюд в рейтинге</span>
                <span class="field__hint">{{ catsText }}</span>
                <button v-if="!cats.open" type="button" class="wa-link" @click="openCats">Выбрать категории</button>
                <div v-else-if="cats.busy" class="skeleton" style="height:44px;border-radius:var(--radius-pill)"></div>
                <div v-else class="chips wa-chips-wrap" role="group" aria-label="Категории блюд">
                  <button v-for="c in cats.list" :key="c.id" type="button" class="chip" :aria-pressed="catOn(c.id) ? 'true' : 'false'" @click="toggleCat(c)">{{ c.name }}<span v-if="c.dishes" class="chip__count">{{ c.dishes }}</span></button>
                </div>
                <span v-if="cats.error" class="field__hint is-error" role="alert">{{ cats.error }}</span>
              </div>
            </template>
            <div class="wa-news-auto__acts">
              <button type="button" class="wa-link" :class="{ 'is-loading': na.busy === 'rating' }" :disabled="!!na.busy" @click="runNews('rating')">Посмотреть сегодняшний</button>
              <button type="button" class="wa-link" :class="{ 'is-loading': na.busy === 'rating:pub' }" :disabled="!!na.busy" @click="runNews('rating', true)">Опубликовать сейчас</button>
            </div>
            <p v-if="na.info" class="wa-hint is-warn" role="status">{{ na.info }}</p>
            <p v-if="newsRunText" class="wa-hint">{{ newsRunText }}</p>
            <p v-if="data.schedule && data.schedule.trigger === false && (on('news_techcards') || on('news_newplan') || on('news_rating'))" class="wa-hint">Начнёт действовать после «Сохранить».</p>
          </section>

          <!-- Конкурсы: итог продаж выбранных товаров по точкам — новостью каждый день и, если выбрано, в «Пачку» -->
          <section class="card card--pad wa-set-card wa-ct-card">
            <div><b class="wa-set-card__title">Конкурсы</b><p class="wa-hint">Выберите блюда или товары — каждый день с {{ f.news_time }} команда увидит новость: какая точка продала больше вчера,
              по понедельникам — за прошлую неделю. Название конкурса — заголовок новости.</p></div>
            <div v-if="!ct.ready && !ct.error" class="skeleton" style="height:64px;border-radius:var(--radius-md)"></div>
            <template v-else>
              <div v-for="c in ct.list" :key="c.id" class="wa-ct-row" :class="{ 'is-off': !c.enabled }">
                <div class="wa-switch-row">
                  <span><b>{{ c.title }}</b><small>{{ ctSummary(c) }}</small></span>
                  <button type="button" class="switch" role="switch" :aria-checked="c.enabled ? 'true' : 'false'" :disabled="!!ct.busy" @click="ctToggle(c)" :aria-label="'Публиковать «' + c.title + '»'"></button>
                </div>
                <p v-if="ctAutoText(c)" class="wa-hint" :class="{ 'is-warn': ct.auto[c.id] && ct.auto[c.id].error }">{{ ctAutoText(c) }}</p>
                <div class="wa-news-auto__acts">
                  <button type="button" class="wa-link" :disabled="!!ct.busy" @click="ctEdit(c)">Изменить</button>
                  <button type="button" class="wa-link" :class="{ 'is-loading': ct.busy === 'look:' + c.id }" :disabled="!!ct.busy" @click="ctRun(c, 'look')">Посмотреть сегодняшний</button>
                  <button type="button" class="wa-link" :class="{ 'is-loading': ct.busy === 'pub:' + c.id }" :disabled="!!ct.busy" @click="ctRun(c, 'pub')">Опубликовать сейчас</button>
                </div>
              </div>
              <p v-if="!ct.list.length && !ct.edit" class="wa-hint">Конкурсов пока нет.</p>

              <!-- Редактор конкурса -->
              <div v-if="ct.edit" class="wa-ct-edit">
                <b class="wa-ct-edit__title">{{ ct.edit.id ? 'Изменить конкурс' : 'Новый конкурс' }}</b>
                <label class="field field--sm"><span class="field__label">Название — заголовок новости</span>
                  <input class="field__input" v-model="ct.edit.title" maxlength="120" placeholder="Например: Битва лимонадов"></label>
                <div class="field">
                  <span class="field__label">Блюда и товары{{ ct.edit.items.length ? ' — ' + ct.edit.items.length : '' }}</span>
                  <div v-if="ct.edit.items.length" class="chips wa-chips-wrap" role="group" aria-label="Выбранные товары">
                    <button v-for="x in ct.edit.items" :key="x.name" type="button" class="chip wa-ct-chip" aria-pressed="true" :aria-label="'Убрать ' + x.name" @click="ctDrop(x)">{{ x.name }}<span aria-hidden="true">×</span></button>
                  </div>
                  <input class="field__input" type="search" v-model="ct.q" placeholder="Найти в iiko: название блюда или товара" autocomplete="off" @input="ctSearch">
                  <div v-if="ct.found.length" class="wa-ct-found">
                    <button v-for="x in ct.found" :key="x.id" type="button" class="wa-ct-found__i" :class="{ 'is-on': ctHas(x) }" @click="ctAdd(x)">
                      <span>{{ x.name }}</span><small>{{ ctHas(x) ? 'выбрано' : x.group || (x.type === 'GOODS' ? 'товар' : 'блюдо') }}</small></button>
                  </div>
                  <span v-else-if="ct.searching" class="field__hint">Ищу в iiko… первый поиск — до полминуты</span>
                  <span v-else-if="ct.searched" class="field__hint">Не нашлось — проверьте название</span>
                </div>
                <div class="field">
                  <span class="field__label">Кто победил — по</span>
                  <div class="tabs wa-seg" role="radiogroup">
                    <button v-for="o in RATING_MEASURE" :key="o.v" type="button" class="tabs__tab" role="radio" :aria-checked="ct.edit.measure === o.v" :aria-selected="ct.edit.measure === o.v" @click="ct.edit.measure = o.v">{{ o.label }}</button>
                  </div>
                </div>
                <div class="wa-set-2">
                  <label class="field field--sm"><span class="field__label">Начало (необязательно)</span><input class="field__input" type="date" v-model="ct.edit.from"></label>
                  <label class="field field--sm"><span class="field__label">Конец (необязательно)</span><input class="field__input" type="date" v-model="ct.edit.to"></label>
                </div>
                <div class="field">
                  <span class="field__label">Фото в новости</span>
                  <div class="wa-photo-pick">
                    <img v-if="phSrc(ct.edit.photo)" class="wa-photo-pick__img" :src="phSrc(ct.edit.photo)" alt="">
                    <button type="button" class="btn btn--secondary" :class="{ 'is-loading': ph.busy === 'contest' }" :disabled="!!ph.busy" @click="pickPhoto('contest')">{{ ct.edit.photo ? 'Другое фото' : 'Добавить фото' }}</button>
                    <button v-if="ct.edit.photo" type="button" class="wa-link is-danger" @click="ct.edit.photo = ''">Убрать</button>
                  </div>
                  <span v-if="ph.error && ph.target === 'contest'" class="field__hint is-error" role="alert">{{ ph.error }}</span>
                </div>
                <div class="field">
                  <span class="field__label">Отправлять итог в «Пачку»</span>
                  <div class="tabs wa-seg" role="radiogroup">
                    <button v-for="o in PACHCA_TO" :key="o.v" type="button" class="tabs__tab" role="radio" :aria-checked="ct.edit.pachca === o.v" :aria-selected="ct.edit.pachca === o.v" @click="ct.edit.pachca = o.v">{{ o.label }}</button>
                  </div>
                </div>
                <div class="wa-switch-row">
                  <span><b>Публиковать каждый день</b><small>Выключено — конкурс сохранится, но новостей не будет</small></span>
                  <button type="button" class="switch" role="switch" :aria-checked="ct.edit.enabled ? 'true' : 'false'" @click="ct.edit.enabled = !ct.edit.enabled" aria-label="Публиковать каждый день"></button>
                </div>
                <p v-if="ct.editError" class="wa-hint is-warn" role="alert">{{ ct.editError }}</p>
                <div class="wa-ct-edit__btns">
                  <button type="button" class="btn btn--primary" :class="{ 'is-loading': ct.busy === 'save' }" :disabled="!!ct.busy" @click="ctSave">Сохранить конкурс</button>
                  <button type="button" class="btn btn--ghost" :disabled="!!ct.busy" @click="ctCancel">Отмена</button>
                </div>
                <div class="wa-news-auto__acts">
                  <button type="button" class="wa-link" :class="{ 'is-loading': ct.busy === 'look:draft' }" :disabled="!!ct.busy || !ct.edit.items.length" @click="ctRun(null, 'look')">Посмотреть сегодняшний</button>
                  <button type="button" class="wa-link" :class="{ 'is-loading': ct.busy === 'test:draft' }" :disabled="!!ct.busy || !ct.edit.items.length" @click="ctRun(null, 'test')">Отправить в тестовый чат</button>
                  <button v-if="ct.edit.id" type="button" class="wa-link is-danger" :class="{ 'is-loading': ct.busy === 'del' }" :disabled="!!ct.busy" @click="ctDelete">{{ ct.confirm ? 'Да, удалить конкурс' : 'Удалить конкурс' }}</button>
                </div>
              </div>
              <button v-else-if="ct.list.length < 10" type="button" class="btn btn--secondary" :disabled="!!ct.busy" @click="ctNew">
                <svg class="icon icon--sm"><use href="#i-plus"></use></svg>Новый конкурс
              </button>
              <p v-if="ct.info" class="wa-hint is-warn" role="status">{{ ct.info }}</p>
              <p v-if="ct.error" class="wa-hint is-warn" role="alert">{{ ct.error }}</p>

              <!-- «Пачка»: токен бота — сразу (проверяется входом), номера чатов — общей кнопкой «Сохранить» -->
              <div class="wa-ct-pachca">
                <b class="wa-ct-pachca__title">Мессенджер «Пачка»</b>
                <span class="field__hint" :class="{ 'is-ok': ct.pachca.set }">{{ ct.pachca.set ? 'Подключено: бот «' + (ct.pachca.bot || 'без имени') + '», токен …' + ct.pachca.tail : 'Не подключено — вставьте токен бота «Пачки»' }}</span>
                <form class="wa-emp-add" @submit.prevent="savePachca(false)">
                  <label class="field field--sm"><span class="visually-hidden">Токен бота</span>
                    <input class="field__input" type="password" v-model="ct.token" placeholder="Токен бота" autocomplete="off" spellcheck="false"></label>
                  <button type="submit" class="btn btn--secondary" :class="{ 'is-loading': ct.tokenBusy }" :disabled="!ct.token.trim() || ct.tokenBusy">Проверить и сохранить</button>
                </form>
                <span v-if="ct.tokenInfo" class="field__hint is-ok">{{ ct.tokenInfo }}</span>
                <span v-if="ct.tokenError" class="field__hint is-error" role="alert">{{ ct.tokenError }}</span>
                <div class="wa-set-2">
                  <label class="field field--sm"><span class="field__label">Тестовый чат, ID</span><input class="field__input" inputmode="numeric" v-model="f.pachca_chat_test"></label>
                  <label class="field field--sm"><span class="field__label">Основной чат, ID</span><input class="field__input" inputmode="numeric" v-model="f.pachca_chat_main"></label>
                </div>
                <span class="field__hint">Бот должен состоять в обоих чатах. Номера чатов сохраняются кнопкой «Сохранить» внизу, токен — сразу.</span>
                <button v-if="ct.pachca.set" type="button" class="wa-link" :disabled="ct.tokenBusy" @click="savePachca(true)">Удалить токен</button>
              </div>
            </template>
          </section>

          <section class="card card--pad wa-set-card">
            <div><b class="wa-set-card__title">Пороги статусов</b><p class="wa-hint">k = факт ÷ план</p></div>
            <div class="wa-thr" aria-hidden="true">
              <span class="wa-thr__seg wa-thr__seg--partial" :style="{ flex: thr.a }">Частично</span>
              <span class="wa-thr__seg wa-thr__seg--done" :style="{ flex: thr.b }">Готово</span>
              <span class="wa-thr__seg wa-thr__seg--over" :style="{ flex: thr.c }">Больше плана</span>
            </div>
            <div class="wa-set-2">
              <label class="field field--sm"><span class="field__label">Нижний порог</span><input class="field__input" inputmode="decimal" v-model="f.status_ready_min"></label>
              <label class="field field--sm"><span class="field__label">Верхний порог</span><input class="field__input" inputmode="decimal" v-model="f.status_ready_max"></label>
            </div>
            <p class="wa-hint">{{ thrText }}</p>
          </section>

          <section class="card card--pad wa-set-card">
            <div><b class="wa-set-card__title">Окно заготовок</b><p class="wa-hint">Когда точка видит и отмечает заготовки на дату. Общее — для всех точек; ниже точке можно задать своё.</p></div>
            <div class="wa-set-2">
              <label class="field field--sm"><span class="field__label">С (накануне)</span><input class="field__input" type="time" v-model="f.prep_window_start"></label>
              <label class="field field--sm"><span class="field__label">До (в день плана)</span><input class="field__input" type="time" v-model="f.prep_window_end"></label>
            </div>
            <p class="wa-hint">{{ winText(f.prep_window_start, f.prep_window_end) }}</p>

            <!-- Свои окна точек: например, точка хочет видеть заготовки на завтра уже с утра -->
            <div class="wa-ptwin">
              <div class="eyebrow">По точкам</div>
              <div v-for="p in store.points" :key="p.tt" class="wa-ptwin__row">
                <div class="wa-switch-row">
                  <span><b>{{ p.emoji }} {{ p.name }}</b>
                    <small>{{ pw[p.tt] && pw[p.tt].on ? 'своё окно: ' + pw[p.tt].start + ' накануне – ' + pw[p.tt].end : 'как у всех: ' + f.prep_window_start + ' накануне – ' + f.prep_window_end }}</small></span>
                  <button type="button" class="switch" role="switch" :aria-checked="pw[p.tt] && pw[p.tt].on ? 'true' : 'false'"
                          :aria-label="'Своё окно заготовок: ' + p.name" @click="togglePw(p.tt)"></button>
                </div>
                <template v-if="pw[p.tt] && pw[p.tt].on">
                  <div class="wa-set-2">
                    <label class="field field--sm"><span class="field__label">С (накануне)</span><input class="field__input" type="time" v-model="pw[p.tt].start"></label>
                    <label class="field field--sm"><span class="field__label">До (в день плана)</span><input class="field__input" type="time" v-model="pw[p.tt].end"></label>
                  </div>
                  <p class="wa-hint">{{ winText(pw[p.tt].start, pw[p.tt].end) }}</p>
                </template>
              </div>
            </div>
            <div class="field">
              <span class="field__label">Автообновление списков</span>
              <div class="tabs wa-seg" role="radiogroup">
                <button v-for="o in REFRESH" :key="o.v" type="button" class="tabs__tab" role="radio"
                        :aria-checked="Number(f.refresh_seconds) === o.v" :aria-selected="Number(f.refresh_seconds) === o.v" @click="f.refresh_seconds = String(o.v)">{{ o.label }}</button>
              </div>
            </div>
          </section>

          <section class="card card--pad wa-set-card">
            <div><b class="wa-set-card__title">Исключённые заготовки</b><p class="wa-hint">Не попадают в расчёт: лёд, газированная вода, тара… Сохраняются сразу.</p></div>
            <div class="wa-tags">
              <span v-for="t in exclusions" :key="t" class="wa-tag">{{ t }}
                <button type="button" class="wa-tag__x" :disabled="tagBusy" :aria-label="'Убрать ' + t" @click="removeTag(t)"><svg class="icon"><use href="#i-x"></use></svg></button>
              </span>
              <span v-if="!exclusions.length" class="wa-hint">Список пуст</span>
            </div>
            <form class="wa-emp-add" @submit.prevent="addTag">
              <label class="field field--sm"><span class="visually-hidden">Заготовка</span>
                <input class="field__input" v-model="newTag" list="wa-preps-list" placeholder="Название заготовки" autocomplete="off"></label>
              <button type="submit" class="btn btn--secondary" :class="{ 'is-loading': tagBusy }" :disabled="!newTag.trim() || tagBusy">Добавить</button>
            </form>
            <datalist id="wa-preps-list"><option v-for="n in prepNames" :key="n" :value="n"></option></datalist>
          </section>

          <section class="card card--pad wa-set-card">
            <div><b class="wa-set-card__title">Автозаготовки</b><p class="wa-hint">Если к этому времени заготовки на ближайший день никто не рассчитал, они считаются сами —
              для точек, где их ещё нет. Вечером это заготовки на завтра.</p></div>
            <div class="wa-switch-row">
              <span><b>Считать заготовки сами</b><small>Рассчитанные вручную точки не меняются</small></span>
              <button type="button" class="switch" role="switch" :aria-checked="String(f.prep_auto_enabled) === '1' ? 'true' : 'false'"
                      @click="f.prep_auto_enabled = String(f.prep_auto_enabled) === '1' ? '0' : '1'" aria-label="Автозаготовки"></button>
            </div>
            <label v-if="String(f.prep_auto_enabled) === '1'" class="field field--sm">
              <span class="field__label">Время расчёта</span>
              <input class="field__input" type="time" v-model="f.prep_auto_time">
              <span class="field__hint">Срабатывает в течение 15 минут после этого времени</span>
            </label>
            <p v-if="data.schedule && data.schedule.prepAuto" class="wa-hint" :class="{ 'is-warn': !data.schedule.prepAuto.ok }">
              Последний запуск {{ atText(data.schedule.prepAuto.at) }}: на {{ ddmm(data.schedule.prepAuto.date) }} —
              {{ data.schedule.prepAuto.ok ? data.schedule.prepAuto.text : 'не удалось: ' + data.schedule.prepAuto.text }}</p>
            <p v-if="data.schedule && data.schedule.trigger === false && String(f.prep_auto_enabled) === '1'" class="wa-hint">Начнёт действовать после «Сохранить».</p>
          </section>

          <section class="card card--pad wa-set-card">
            <div><b class="wa-set-card__title">Ночная синхронизация iiko</b><p class="wa-hint">Каждую ночь новые блюда и заготовки дописываются в справочники,
              тех. карты читаются из iiko заново. Сразу после этого заготовки с завтрашнего дня пересчитываются там, где изменился план или тех. карта.</p></div>
            <div class="wa-switch-row">
              <span><b>Синхронизировать ночью</b><small>Отмеченные на точках заготовки не меняются</small></span>
              <button type="button" class="switch" role="switch" :aria-checked="String(f.iiko_night_enabled) === '1' ? 'true' : 'false'"
                      @click="f.iiko_night_enabled = String(f.iiko_night_enabled) === '1' ? '0' : '1'" aria-label="Ночная синхронизация iiko"></button>
            </div>
            <label v-if="String(f.iiko_night_enabled) === '1'" class="field field--sm">
              <span class="field__label">Время</span>
              <input class="field__input" type="time" v-model="f.iiko_night_time">
              <span class="field__hint">Московское время, в течение 15 минут после него</span>
            </label>
            <p v-if="nightBusy" class="wa-hint">Идёт синхронизация и пересчёт — обычно 1–3 минуты, не закрывайте страницу…</p>
            <p v-else-if="data.schedule && data.schedule.iikoNight && data.schedule.iikoNight.running" class="wa-hint">Идёт синхронизация с {{ atText(data.schedule.iikoNight.at) }}…</p>
            <p v-else-if="data.schedule && data.schedule.iikoNight" class="wa-hint" :class="{ 'is-warn': !data.schedule.iikoNight.ok }">
              Последний запуск {{ atText(data.schedule.iikoNight.at) }}<template v-if="data.schedule.iikoNight.by"> · {{ data.schedule.iikoNight.by }}</template>: {{ data.schedule.iikoNight.text }}</p>
            <p v-if="nightError" class="wa-hint is-warn">{{ nightError }}</p>
            <button type="button" class="btn btn--secondary" :class="{ 'is-loading': nightBusy }" :disabled="nightBusy" @click="runNight">Запустить сейчас</button>
            <p v-if="data.schedule && data.schedule.trigger === false && String(f.iiko_night_enabled) === '1'" class="wa-hint">Начнёт действовать после «Сохранить».</p>
          </section>

          <section class="card card--pad wa-set-card">
            <div><b class="wa-set-card__title">Закрытие дня</b><p class="wa-hint">В это время смена закрывается сама: строки дня уходят в архив и с листов «Блюда» и «Заготовки»
              (невыполненные — как «Не сделано»), бармен и заготовщик точек сбрасываются. Заготовки на завтра остаются.</p></div>
            <div class="wa-switch-row">
              <span><b>Закрывать день сам</b><small>Заодно уходят в архив и незакрытые прошлые дни</small></span>
              <button type="button" class="switch" role="switch" :aria-checked="String(f.day_close_enabled) === '1' ? 'true' : 'false'"
                      @click="f.day_close_enabled = String(f.day_close_enabled) === '1' ? '0' : '1'" aria-label="Закрытие дня"></button>
            </div>
            <label v-if="String(f.day_close_enabled) === '1'" class="field field--sm">
              <span class="field__label">Время закрытия</span>
              <input class="field__input" type="time" v-model="f.day_close_time">
              <span class="field__hint">Срабатывает в течение 15 минут после этого времени. Отметки, сделанные позже, попадут в архив на следующий вечер.</span>
            </label>
            <p v-if="data.schedule && data.schedule.dayClose" class="wa-hint" :class="{ 'is-warn': !data.schedule.dayClose.ok }">
              Последнее закрытие {{ atText(data.schedule.dayClose.at) }} —
              {{ data.schedule.dayClose.ok ? data.schedule.dayClose.text : 'не удалось, повторим через полчаса: ' + data.schedule.dayClose.text }}</p>
            <p v-if="data.schedule && data.schedule.trigger === false && String(f.day_close_enabled) === '1'" class="wa-hint">Начнёт действовать после «Сохранить».</p>
          </section>
        </div>

        <div class="wa-set-col">
          <section class="card card--pad wa-set-card">
            <div><b class="wa-set-card__title">Автоплан</b><p class="wa-hint">План на день = большее из двух: такой же день прошлой недели и такой же день той же недели год назад.
              Недели — по номерам недель года; неделя продаж закрыта в воскресенье в 22:00.</p></div>
            <div class="wa-switch-row">
              <span><b>Автоотправка в план</b><small>Раз в неделю план на следующую неделю сам уходит в лист «Блюда»</small></span>
              <button type="button" class="switch" role="switch" :aria-checked="String(f.autoplan_enabled) === '1' ? 'true' : 'false'"
                      @click="f.autoplan_enabled = String(f.autoplan_enabled) === '1' ? '0' : '1'" aria-label="Автоотправка в план"></button>
            </div>
            <div class="field">
              <span class="field__label">День отправки</span>
              <div class="tabs wa-seg" role="radiogroup">
                <button v-for="(w, i) in WEEKDAYS" :key="w" type="button" class="tabs__tab" role="radio"
                        :aria-checked="Number(f.autoplan_weekday) === i + 1" :aria-selected="Number(f.autoplan_weekday) === i + 1"
                        @click="f.autoplan_weekday = String(i + 1)">{{ w }}</button>
              </div>
            </div>
            <label class="field field--sm">
              <span class="field__label">Час отправки (с этого часа, московское время)</span>
              <select class="field__input" v-model="f.autoplan_hour">
                <option v-for="h in 23" :key="h" :value="String(h)">{{ String(h).padStart(2, '0') }}:00</option>
              </select>
              <span class="field__hint">{{ weekHint(f.autoplan_weekday, f.autoplan_hour) }}</span>
            </label>
            <div class="wa-switch-row">
              <span><b>Понедельник отдельно</b><small>План понедельника уходит раньше недели — чтобы заготовки на понедельник успели в воскресенье</small></span>
              <button type="button" class="switch" role="switch" :aria-checked="String(f.autoplan_monday_enabled) === '1' ? 'true' : 'false'"
                      @click="f.autoplan_monday_enabled = String(f.autoplan_monday_enabled) === '1' ? '0' : '1'" aria-label="Понедельник отдельно"></button>
            </div>
            <template v-if="String(f.autoplan_monday_enabled) === '1'">
              <div class="field">
                <span class="field__label">День отправки понедельника</span>
                <div class="tabs wa-seg" role="radiogroup">
                  <button v-for="(w, i) in WEEKDAYS" :key="w" type="button" class="tabs__tab" role="radio"
                          :aria-checked="Number(f.autoplan_monday_weekday) === i + 1" :aria-selected="Number(f.autoplan_monday_weekday) === i + 1"
                          @click="f.autoplan_monday_weekday = String(i + 1)">{{ w }}</button>
                </div>
              </div>
              <label class="field field--sm">
                <span class="field__label">Час отправки понедельника</span>
                <select class="field__input" v-model="f.autoplan_monday_hour">
                  <option v-for="h in 23" :key="h" :value="String(h)">{{ String(h).padStart(2, '0') }}:00</option>
                </select>
                <span class="field__hint">{{ weekHint(f.autoplan_monday_weekday, f.autoplan_monday_hour) }}</span>
              </label>
            </template>
            <p v-if="runText(data.schedule && data.schedule.week)" class="wa-hint">Неделя: {{ runText(data.schedule.week) }}</p>
            <p v-if="runText(data.schedule && data.schedule.monday)" class="wa-hint">Понедельник: {{ runText(data.schedule.monday) }}</p>
          </section>

          <section class="card card--pad wa-set-card">
            <div><b class="wa-set-card__title">Gemma 4</b><p class="wa-hint">ИИ-план: та же неделя год назад × динамика (прошлая неделя к ней же год назад) × условия, которые оценивает Gemma — погода, праздники, заметки, разовые всплески. Работает в облаке Google (Gemini API).</p></div>
            <div class="wa-switch-row">
              <span><b>ИИ-план</b><small>В лист уходит ИИ-план. Gemma выключена или не ответила — уходит «большее из двух»</small></span>
              <button type="button" class="switch" role="switch" :aria-checked="String(f.gemma_enabled) === '1' ? 'true' : 'false'"
                      @click="f.gemma_enabled = String(f.gemma_enabled) === '1' ? '0' : '1'" aria-label="ИИ-план"></button>
            </div>
            <div class="field">
              <span class="field__label">Модель</span>
              <div class="tabs wa-seg" role="radiogroup">
                <button v-for="m in GEMMA_MODELS" :key="m.v" type="button" class="tabs__tab" role="radio"
                        :aria-checked="f.gemma_model === m.v" :aria-selected="f.gemma_model === m.v" @click="f.gemma_model = m.v">{{ m.label }}</button>
              </div>
              <span class="field__hint">26B отвечает за 10–15 секунд. 31B подробнее, но думает около минуты — если не успеет, ответит 26B.</span>
            </div>
            <label class="field field--sm">
              <span class="field__label">Предел условий Gemma на позицию, ± %</span>
              <input class="field__input" inputmode="numeric" v-model="f.gemma_limit">
            </label>
            <div class="wa-switch-row">
              <span><b>Учитывать погоду</b><small>{{ String(f.gemma_weather) === '1' ? 'Gemma видит прогноз и погоду прошлых недель и делает поправки на неё' : 'Погода не влияет на ИИ-план: Gemma её не видит, поправок на погоду нет' }}</small></span>
              <button type="button" class="switch" role="switch" :aria-checked="String(f.gemma_weather) === '1' ? 'true' : 'false'"
                      @click="f.gemma_weather = String(f.gemma_weather) === '1' ? '0' : '1'" aria-label="Учитывать погоду"></button>
            </div>
            <label v-if="String(f.gemma_weather) === '1'" class="field field--sm">
              <span class="field__label">Город для прогноза погоды</span>
              <input class="field__input" v-model="f.weather_city" placeholder="Например, Краснодар" autocomplete="off">
              <span class="field__hint">{{ data.gemma.place ? 'Найден: ' + data.gemma.place + '. ' : 'Без города Gemma не учитывает погоду. ' }}Погода — Open-Meteo: прогноз на 16 дней и архив прошлых лет, бесплатно и без ключа.</span>
            </label>
            <div class="field wa-gm-key">
              <span class="field__label">Ключ Gemini API</span>
              <span class="field__hint" :class="{ 'is-ok': data.gemma.hasKey }">{{ data.gemma.hasKey ? 'Ключ задан: …' + data.gemma.keyTail : 'Ключ не задан' }}</span>
              <form class="wa-emp-add" @submit.prevent="saveKey()">
                <label class="field field--sm"><span class="visually-hidden">Новый ключ</span>
                  <input class="field__input" type="password" v-model="newKey" placeholder="AIza… или AQ.…" autocomplete="off" spellcheck="false"></label>
                <button type="submit" class="btn btn--secondary" :class="{ 'is-loading': keyBusy }" :disabled="!newKey.trim() || keyBusy">Проверить и сохранить</button>
              </form>
              <span v-if="keyInfo" class="field__hint is-ok">{{ keyInfo }}</span>
              <span v-if="keyError" class="field__hint is-error" role="alert">{{ keyError }}</span>
              <span class="field__hint">Ключ бесплатно: aistudio.google.com/apikey → «Create API key». Сохраняется сразу, хранится в свойствах скрипта.</span>
              <button v-if="data.gemma.hasKey" type="button" class="wa-link" :disabled="keyBusy" @click="saveKey('')">Удалить ключ</button>
            </div>
          </section>

          <section class="card card--pad wa-set-card">
            <div><b class="wa-set-card__title">Аналитика</b><p class="wa-hint">Когда «сделано» и «продано + списано» не сходятся настолько, позиция горит красным.</p></div>
            <div class="wa-set-2">
              <label class="field field--sm"><span class="field__label">Допуск, %</span><input class="field__input" inputmode="numeric" v-model="f.analytics_tol_pct"></label>
              <label class="field field--sm"><span class="field__label">И не меньше, шт</span><input class="field__input" inputmode="decimal" v-model="f.analytics_tol_abs"></label>
            </div>
            <p class="wa-hint">{{ tolText }}</p>
          </section>

          <section class="card card--pad wa-set-card">
            <b class="wa-set-card__title">Прочее</b>
            <label class="field field--sm"><span class="field__label">Признак смузи — слово в группе блюда</span><input class="field__input" v-model="f.smoothie_marker"></label>
            <div class="wa-switch-row">
              <span><b>Лимонады — наборами</b><small>{{ String(f.lemonade_sets) === '1' ? 'Заготовки лимонадов идут наборами в разделе «Лимонады и смузи», как у смузи' : 'Заготовки лимонадов — в общих заготовках, как раньше' }}</small></span>
              <button type="button" class="switch" role="switch" :aria-checked="String(f.lemonade_sets) === '1' ? 'true' : 'false'"
                      @click="f.lemonade_sets = String(f.lemonade_sets) === '1' ? '0' : '1'" aria-label="Лимонады — наборами"></button>
            </div>
            <label v-if="String(f.lemonade_sets) === '1'" class="field field--sm">
              <span class="field__label">Признак лимонада — слово в группе блюда</span>
              <input class="field__input" v-model="f.lemonade_marker" placeholder="лимонад, limonad">
              <span class="field__hint">Несколько слов — через запятую. Пусто — «лимонад, limonad».</span>
            </label>
            <label class="field field--sm"><span class="field__label">Сколько секунд точка может нажать «Отменить»</span><input class="field__input" inputmode="numeric" v-model="f.undo_seconds"></label>
            <label class="field field--sm">
              <span class="field__label">Значок вкладки и ярлыка на телефоне — ссылка на картинку</span>
              <input class="field__input" v-model="f.app_icon_url" placeholder="https://drive.google.com/file/d/…" autocomplete="off" spellcheck="false">
              <span class="field__hint">Картинка PNG 512×512 на Google Диске с доступом «Все, у кого есть ссылка». Новый значок появится после обновления страницы.</span>
            </label>
            <div class="field">
              <span class="field__label">Архив BigQuery — куда пишет «Закрытие дня»</span>
              <div class="tabs wa-seg" role="radiogroup">
                <button type="button" class="tabs__tab" role="radio" :aria-checked="!isProd" :aria-selected="!isProd" :disabled="busy" @click="setDataset('dev')">Тестовый</button>
                <button type="button" class="tabs__tab" role="radio" :aria-checked="isProd" :aria-selected="isProd" :disabled="busy" @click="askProd = true">Рабочий</button>
              </div>
              <span class="field__hint">{{ data.dataset }}{{ isProd ? ' — рабочий архив' : ' — тестовый, рабочий не затрагивается' }}</span>
            </div>
          </section>
        </div>
      </div>

      <div v-if="error" class="banner banner--error" role="alert">
        <svg class="icon icon--sm"><use href="#i-alert"></use></svg><span class="banner__text">{{ error }}</span>
      </div>
      <div class="wa-actionbar">
        <span class="wa-actionbar__text">{{ dirty ? 'Есть несохранённые изменения' : saved ? 'Сохранено — правила уже действуют' : 'Изменения вступают в силу сразу после сохранения' }}</span>
        <button type="button" class="btn btn--ghost" :disabled="!dirty || busy" @click="fill">Отменить</button>
        <button type="button" class="btn btn--primary btn--lg" :class="{ 'is-loading': busy }" :disabled="!dirty || busy" @click="save">Сохранить</button>
      </div>
    </template>

    <div class="modal-backdrop" :class="{ 'is-open': askProd && !isProd }" @click.self="askProd = false">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="prod-title">
        <h2 class="modal__title" id="prod-title">Переключить на рабочий архив?</h2>
        <p class="modal__text">«Закрытие дня» начнёт писать в <b>{{ data && data.datasets.prod }}</b> — рабочий архив, которым пользуется AppSheet. Делайте это только в день перехода, после закрытия дня в AppSheet.</p>
        <div class="modal__actions">
          <button type="button" class="btn btn--ghost" @click="askProd = false">Отмена</button>
          <button type="button" class="btn btn--danger" @click="setDataset('prod')">Переключить</button>
        </div>
      </div>
    </div>
  </div>
</script>


<!-- ===================================================================== Упаковка: загрузчик -->
<!-- Сам экран (ui_pack.html) приходит с сервера при первом открытии — остальным страница не тяжелеет -->
<script type="text/x-template" id="tpl-pack-loader">
  <component v-if="comp" :is="comp"></component>
  <div v-else class="page">
    <div class="page-head"><h1 class="h-screen page-head__title">Упаковка</h1></div>
    <div v-if="error" class="banner banner--error" role="alert">
      <svg class="icon icon--sm"><use href="#i-alert"></use></svg><span class="banner__text">{{ error }}</span>
      <button type="button" class="btn btn--secondary" @click="load">Повторить</button>
    </div>
    <template v-else>
      <div v-for="i in 3" :key="i" class="skeleton" style="height:120px;border-radius:var(--radius-lg)"></div>
    </template>
  </div>
</script>


<!-- ===================================================================== Журнал -->
<script type="text/x-template" id="tpl-journal">
  <div class="page wa-journal">
    <div class="page-head"><h1 class="h-screen page-head__title">Журнал</h1></div>

    <div class="wa-journal-filters">
      <div class="tabs wa-seg" role="radiogroup" aria-label="Период">
        <button v-for="o in PERIODS" :key="o.v" type="button" class="tabs__tab" role="radio" :aria-checked="period === o.v" :aria-selected="period === o.v" @click="period = o.v">{{ o.label }}</button>
      </div>
      <div class="chips wa-chips-wrap" role="group" aria-label="Что показывать">
        <button v-for="g in GROUPS" :key="g.v" type="button" class="chip" :aria-pressed="group === g.v" @click="group = g.v">{{ g.label }}</button>
      </div>
      <label v-if="store.points.length > 1" class="field field--sm">
        <span class="visually-hidden">Точка</span>
        <select class="field__input" v-model="tt"><option value="">Все точки</option><option v-for="p in store.points" :key="p.tt" :value="p.tt">{{ p.emoji }} {{ p.name }}</option></select>
      </label>
    </div>

    <div v-if="error" class="banner banner--error" role="alert">
      <svg class="icon icon--sm"><use href="#i-alert"></use></svg><span class="banner__text">{{ error }}</span>
      <button type="button" class="btn btn--secondary" @click="load">Повторить</button>
    </div>

    <div v-if="!data" class="wa-log">
      <div v-for="i in 6" :key="i" class="skeleton" style="height:64px;border-radius:var(--radius-md)"></div>
    </div>
    <div v-else class="wa-log" :class="{ 'is-loading': loading }">
      <template v-for="e in rows" :key="e.key">
        <div v-if="e.dayHead" class="eyebrow wa-log__day">{{ e.dayHead }}</div>
        <div class="wa-log-entry">
          <span class="user-avatar wa-log__av" :class="'wa-log__av--' + e.tone">{{ e.ini }}</span>
          <div class="wa-log__body">
            <b>{{ e.who }}</b> <span class="wa-log__verb">{{ e.verb }}</span> <b v-if="e.target" class="wa-log__target">{{ e.target }}</b>
            <small v-if="e.detail">{{ e.detail }}</small>
          </div>
          <span v-if="e.emoji" class="wa-log__emoji" :title="e.tt">{{ e.emoji }}</span>
          <span class="wa-log__time">{{ e.time }}</span>
        </div>
      </template>
      <div v-if="!rows.length" class="card">
        <div class="empty-state">
          <img class="empty-state__art" :src="asset('leaf-pair')" alt="">
          <div class="empty-state__title">Записей нет</div>
          <div class="empty-state__text">Измените период или фильтр.</div>
        </div>
      </div>
      <p v-if="data.truncated" class="wa-hint wa-center">Показаны последние записи — сузьте период или фильтр</p>
    </div>
  </div>
</script>


<script>
(function (C) {
  if (!C) return;

  const { reactive, ref, computed, watch, onMounted, nextTick } = Vue;
  const { store, callApi, atText } = C;

  const ROLE = { owner: 'Руководитель', admin: 'Админ', point: 'Точка' };
  const MODE = { bar: 'Бар', prep: 'Заготовка', both: 'Бар и заготовка' };

  const UsersView = {
    template: '#tpl-users',
    setup() {
      const users = ref(null);
      const error = ref('');
      const busy = ref('');
      const pwEl = ref(null);
      const form = reactive({ open: false, isNew: true, login: '', name: '', role: 'point', tt: '', mode: 'both', tts: [], active: true, devices: 0, confirm: '', error: '' });
      const pw = reactive({ login: '', value: '', copied: false });

      const pointName = tt => { const p = store.points.find(x => x.tt === tt); return p ? p.emoji + ' ' + p.name : tt; };
      const pointsText = u => u.role === 'owner' ? 'Все точки'
        : u.role === 'admin' ? (u.tts.length ? u.tts.map(pointName).join(', ') : 'Все точки')
        : pointName(u.tt);

      async function load() {
        try { users.value = await callApi('owner.users'); } catch (e) { if (e.code !== 'AUTH') error.value = e.message; }
      }

      function openNew() {
        Object.assign(form, { open: true, isNew: true, login: '', name: '', role: 'point', tt: '', mode: 'both', tts: [], active: true, devices: 0, training: '', confirm: '', error: '' });
      }
      function openEdit(u) {
        Object.assign(form, { open: true, isNew: false, login: u.login, name: u.name, role: u.role, tt: u.tt, mode: u.mode || 'both', tts: u.tts.slice(), active: u.active, devices: u.devices, training: u.training || '', confirm: '', error: '' });
      }
      const toggleTt = tt => { form.tts = form.tts.includes(tt) ? form.tts.filter(x => x !== tt) : form.tts.concat(tt); };

      function showPassword(login, value) {
        Object.assign(pw, { login, value, copied: false });
        nextTick(() => pwEl.value && pwEl.value.select());
      }

      async function save() {
        busy.value = 'save';
        form.error = '';
        try {
          const r = await callApi('owner.users.save', {
            isNew: form.isNew, login: form.login, name: form.name, role: form.role, tt: form.tt, mode: form.mode, tts: form.tts, active: form.active,
          });
          users.value = r.users;
          form.open = false;
          if (r.password) showPassword(form.login.toLowerCase(), r.password);
        } catch (e) {
          if (e.code !== 'AUTH') form.error = e.message;
        } finally {
          busy.value = '';
        }
      }

      // Блокировка — сразу из списка
      async function toggleActive(u) {
        busy.value = 'active';
        error.value = '';
        try {
          const r = await callApi('owner.users.save', { isNew: false, login: u.login, name: u.name, role: u.role, tt: u.tt, mode: u.mode, tts: u.tts, active: !u.active });
          users.value = r.users;
        } catch (e) {
          if (e.code !== 'AUTH') error.value = e.message;
        } finally {
          busy.value = '';
        }
      }

      // Сброс пароля и выход на всех устройствах — в два нажатия
      const ask = what => { form.confirm = form.confirm === what ? '' : what; };
      async function confirmAction() {
        const what = form.confirm;
        busy.value = what;
        form.error = '';
        try {
          const r = await callApi(what === 'password' ? 'owner.users.password' : what === 'training' ? 'owner.users.training' : 'owner.users.logoutAll', { login: form.login });
          users.value = r.users;
          form.confirm = '';
          if (what === 'training') form.training = '';
          else form.devices = 0;
          if (r.password) { form.open = false; showPassword(form.login, r.password); }
        } catch (e) {
          if (e.code !== 'AUTH') form.error = e.message;
        } finally {
          busy.value = '';
        }
      }

      // Буфер обмена в окне Apps Script может быть недоступен — тогда выделяем и копируем по-старому
      async function copy() {
        try {
          await navigator.clipboard.writeText(pw.value);
        } catch (e) {
          if (pwEl.value) { pwEl.value.select(); document.execCommand('copy'); }
        }
        pw.copied = true;
      }

      onMounted(load);
      return {
        store, users, error, busy, form, pw, pwEl, ROLE, MODE, atText, pointsText,
        ROLES: [{ v: 'point', label: 'Точка' }, { v: 'admin', label: 'Админ' }, { v: 'owner', label: 'Руководитель' }],
        MODES: [{ v: 'bar', label: 'Бар' }, { v: 'prep', label: 'Заготовка' }, { v: 'both', label: 'Оба' }],
        openNew, openEdit, toggleTt, save, toggleActive, ask, confirmAction, copy,
      };
    },
  };

  // ================================================================== Настройки

  const SETTING_KEYS = ['status_ready_min', 'status_ready_max', 'prep_window_start', 'prep_window_end', 'smoothie_marker', 'lemonade_sets', 'lemonade_marker', 'undo_seconds', 'refresh_seconds',
    'autoplan_enabled', 'autoplan_weekday', 'autoplan_hour', 'autoplan_monday_enabled', 'autoplan_monday_weekday', 'autoplan_monday_hour',
    'prep_auto_enabled', 'prep_auto_time', 'iiko_night_enabled', 'iiko_night_time', 'gemma_enabled', 'gemma_model', 'gemma_limit', 'gemma_weather', 'weather_city', 'app_icon_url',
    'day_close_enabled', 'day_close_time', 'analytics_tol_pct', 'analytics_tol_abs',
    'news_time', 'news_techcards', 'news_newplan', 'news_newplan_days', 'news_rating', 'news_rating_by', 'news_rating_measure', 'news_rating_staff', 'news_rating_top',
    'news_rating_staff_skip', 'news_rating_categories', 'pachca_chat_test', 'pachca_chat_main'];
  const NEWS_KINDS = { custom: 'Новость', techcards: 'Тех. карты', newplan: 'Новинки', rating: 'Рейтинг', contest: 'Конкурс' };
  const WEEKDAY_NAMES = ['понедельник', 'вторник', 'среду', 'четверг', 'пятницу', 'субботу', 'воскресенье'];
  const num = s => parseFloat(String(s).replace(',', '.'));
  // Фото новости: не больше 1280 px по длинной стороне, JPEG; качество снижается, пока картинка не станет меньше ~500 КБ
  function shrinkPhoto(file) {
    return new Promise((resolve, reject) => {
      if (file.type && !/^image\//.test(file.type)) { reject(new Error('это не картинка — выберите фото JPG или PNG')); return; }
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        URL.revokeObjectURL(url);
        const k = Math.min(1, 1280 / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(img.width * k));
        canvas.height = Math.max(1, Math.round(img.height * k));
        const g = canvas.getContext('2d');
        g.fillStyle = '#ffffff';   // прозрачный PNG — на белом
        g.fillRect(0, 0, canvas.width, canvas.height);
        g.drawImage(img, 0, 0, canvas.width, canvas.height);
        let q = 0.82;
        let uri = canvas.toDataURL('image/jpeg', q);
        while (uri.length > 680000 && q > 0.4) { q -= 0.1; uri = canvas.toDataURL('image/jpeg', q); }
        resolve(uri);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('картинка не открылась — выберите фото JPG или PNG')); };
      img.src = url;
    });
  }
  const show = v => typeof v === 'number' ? String(v).replace('.', ',') : String(v ?? '');

  const SettingsView = {
    template: '#tpl-settings',
    setup() {
      const data = ref(null);
      const f = reactive({});
      const error = ref('');
      const busy = ref(false);
      const saved = ref(false);
      const askProd = ref(false);
      const exclusions = ref([]);
      const newTag = ref('');
      const tagBusy = ref(false);
      const prepNames = ref([]);

      function apply(d) {
        data.value = d;
        exclusions.value = d.exclusions;
        Object.assign(store.settings, d.values);   // новые пороги — сразу и в этом окне
        fill();
      }
      // Свои окна заготовок точек: точка → { on, start, end }; в настройку уходят только включённые
      const pw = reactive({});
      function fillPw() {
        let saved = {};
        try { saved = JSON.parse(data.value.values.prep_windows || '{}') || {}; } catch (e) { saved = {}; }
        Object.keys(pw).forEach(k => { delete pw[k]; });
        for (const p of store.points) {
          const w = saved[p.tt];
          pw[p.tt] = w ? { on: true, start: w.start, end: w.end } : { on: false, start: '08:00', end: data.value.values.prep_window_end };
        }
      }
      // Как на сервере (waPrepWindowsParam_): ключи по порядку, пустое — ''
      function pwJson() {
        const out = {};
        Object.keys(pw).sort().forEach(tt => { if (pw[tt].on) out[tt] = { start: pw[tt].start, end: pw[tt].end }; });
        return Object.keys(out).length ? JSON.stringify(out) : '';
      }
      const togglePw = tt => { pw[tt].on = !pw[tt].on; };
      // Окно словами: «с 17:00 накануне до 15:00»; если начинается раньше, чем кончается, — два дня сразу
      function winText(start, end) {
        if (!start || !end) return '';
        if (start <= end) return 'Заготовки на завтра видны уже с ' + start + ' сегодня. С ' + start + ' до ' + end +
          ' на экране два дня — вкладки «Сегодня» и «Завтра».';
        return 'Заготовки на день видны с ' + start + ' накануне до ' + end + ' в день плана. С ' + end + ' до ' + start + ' заготовок на экране нет.';
      }

      function fill() { SETTING_KEYS.forEach(k => { f[k] = show(data.value.values[k]); }); fillPw(); }

      const dirty = computed(() => !!data.value && (SETTING_KEYS.some(k => {
        const a = data.value.values[k];
        return typeof a === 'number' ? num(f[k]) !== a : String(f[k]).trim() !== String(a);
      }) || pwJson() !== (data.value.values.prep_windows || '')));

      // Шкала: доля «Частично», «Готово» и «Больше плана» на отрезке 0…2 плана
      const thr = computed(() => {
        const lo = num(f.status_ready_min) || 0.75;
        const hi = num(f.status_ready_max) || 1.5;
        return { a: lo, b: Math.max(0.05, hi - lo), c: Math.max(0.3, 2 - hi) };
      });
      const pct = v => Math.round((num(v) || 0) * 100) + '%';
      const thrText = computed(() => 'Меньше ' + pct(f.status_ready_min) + ' плана — «Частично готово» и строка на остаток. ' +
        'Больше ' + pct(f.status_ready_max) + ' — «Готово» с пометкой «Больше плана», её видит администратор.');
      // Пример допуска аналитики: сделано 10 — где граница красного
      const tolText = computed(() => {
        const p = num(f.analytics_tol_pct) || 0;
        const a = num(f.analytics_tol_abs) || 0;
        const edge = Math.max(a, 10 * p / 100);
        return 'Например, сделано 10: красным станет, если продано + списано меньше ' + String(Math.round((10 - edge) * 100) / 100).replace('.', ',') +
          ' или больше ' + String(Math.round((10 + edge) * 100) / 100).replace('.', ',') + '.';
      });

      async function load() {
        error.value = '';
        try { apply(await callApi('owner.settings')); } catch (e) { if (e.code !== 'AUTH') error.value = e.message; }
        try { prepNames.value = (await callApi('dir.list', { kind: 'preps' })).map(d => d.name); } catch (e) { /* подсказки не обязательны */ }
      }

      async function save() {
        busy.value = true;
        error.value = '';
        try {
          apply(await callApi('owner.settings.save', { values: Object.assign({}, f, { prep_windows: pwJson() }) }));
          saved.value = true;
        } catch (e) {
          if (e.code !== 'AUTH') error.value = e.message;
        } finally {
          busy.value = false;
        }
      }

      // ---------- Обучение: галочка «пройдено» — сразу на экране, при ошибке — обратно
      const TR_KIND = { point: 'бармен и заготовщик', admin: 'администратор' };
      const trBusy = ref('');
      const trAll = ref(false);
      const trError = ref('');
      async function setTrained(u, done) {
        const was = { done: u.done, at: u.at };
        Object.assign(u, { done, at: done ? store.today + ' ' + new Date().toTimeString().slice(0, 8) : '' });
        trBusy.value = u.login;
        trError.value = '';
        try {
          data.value.training = (await callApi('owner.training.set', { login: u.login, done })).training;
        } catch (e) {
          Object.assign(u, was);
          if (e.code !== 'AUTH') trError.value = u.name + ': ' + e.message;
        } finally {
          trBusy.value = '';
        }
      }
      // Прошли обучение (или его открыли снова) — галочки перечитать: список мог устареть
      watch(() => store.training && store.training.at, () => { if (data.value) load(); });
      async function resetAllTraining() {
        trBusy.value = '*';
        trError.value = '';
        try {
          data.value.training = (await callApi('owner.training.set', { all: true })).training;
          trAll.value = false;
        } catch (e) {
          if (e.code !== 'AUTH') trError.value = e.message;
        } finally {
          trBusy.value = '';
        }
      }

      // «Запустить сейчас»: синхронизация и пересчёт заготовок с завтрашнего дня — не дожидаясь ночи
      const nightBusy = ref(false);
      const nightError = ref('');
      async function runNight() {
        nightBusy.value = true;
        nightError.value = '';
        try {
          const r = await callApi('admin.iiko.nightly');
          if (data.value && data.value.schedule) data.value.schedule.iikoNight = r.night;
        } catch (e) {
          if (e.code !== 'AUTH') nightError.value = e.message;
        } finally {
          nightBusy.value = false;
        }
      }

      async function saveTags(list) {
        tagBusy.value = true;
        error.value = '';
        try {
          const d = await callApi('owner.settings.exclusions', { list });
          data.value = d;
          exclusions.value = d.exclusions;
          return true;
        } catch (e) {
          if (e.code !== 'AUTH') error.value = e.message;
          return false;
        } finally {
          tagBusy.value = false;
        }
      }
      async function addTag() {
        const t = newTag.value.trim();
        if (!t) return;
        if (await saveTags(exclusions.value.concat(t))) newTag.value = '';
      }
      const removeTag = t => saveTags(exclusions.value.filter(x => x !== t));

      // Ключ Gemini API: сервер проверяет его запросом к модели и только потом сохраняет; пустой — удалить
      const newKey = ref('');
      const keyBusy = ref(false);
      const keyInfo = ref('');
      const keyError = ref('');
      async function saveKey(key) {
        const value = key === undefined ? newKey.value.trim() : key;
        keyBusy.value = true;
        keyInfo.value = '';
        keyError.value = '';
        try {
          const d = await callApi('owner.gemma.key', { key: value });
          data.value = Object.assign({}, data.value, { gemma: d.gemma });
          newKey.value = '';
          keyInfo.value = value ? 'Ключ работает и сохранён' : 'Ключ удалён';
        } catch (e) {
          if (e.code !== 'AUTH') keyError.value = e.message;
        } finally {
          keyBusy.value = false;
        }
      }

      const isProd = computed(() => !!data.value && data.value.dataset === data.value.datasets.prod);
      async function setDataset(which) {
        askProd.value = false;
        if ((which === 'prod') === isProd.value) return;
        busy.value = true;
        error.value = '';
        try { apply(await callApi('owner.settings.dataset', { dataset: which })); } catch (e) { if (e.code !== 'AUTH') error.value = e.message; }
        finally { busy.value = false; }
      }

      // Воскресенье с 22:00 — по только что закрытой неделе; раньше — по предыдущей
      function weekHint(weekday, hour) {
        const fresh = Number(weekday) === 7 && Number(hour) >= 22;
        return 'В ' + WEEKDAY_NAMES[Number(weekday) - 1] + ' в ' + String(hour).padStart(2, '0') + ':00 прошлой неделей будет ' +
          (fresh ? 'только что закрытая' : 'предыдущая закрытая: текущая закроется в воскресенье в 22:00');
      }
      // Последний автозапуск: «12.10 · сегодня в 22:05 — 120 строк плана…»
      const runText = st => !st ? '' : 'план на неделю с ' + ddmm(st.week) + ', ' + atText(st.at) + ' — ' + (st.ok ? '' : 'не удалось: ') + (st.text || '');

      // Своя новость: публикуется своей кнопкой; список — опубликованные и запланированные
      const nw = reactive({ title: '', text: '', date: store.today, photo: '', busy: false, info: '', confirm: '' });
      const newsList = ref([]);
      const yesterday = computed(() => C.addDays(store.today, -1));   // новости хранятся сегодня и вчера
      const nwReady = computed(() => !!(nw.title.trim() || nw.text.trim()) && /^\d{4}-\d{2}-\d{2}$/.test(nw.date || ''));
      async function loadNews() {
        try { newsList.value = (await callApi('owner.news.list')).list; } catch (e) { /* список не обязателен */ }
      }
      async function publishNews() {
        nw.busy = true;
        nw.info = '';
        try {
          newsList.value = (await callApi('owner.news.publish', { title: nw.title, text: nw.text, date: nw.date, photo: nw.photo })).list;
          nw.info = nw.date > store.today ? 'Запланировано: увидят с ' + ddmm(nw.date) : 'Опубликовано — увидят при входе в приложение';
          Object.assign(nw, { title: '', text: '', date: store.today, photo: '' });
        } catch (e) {
          if (e.code !== 'AUTH') nw.info = 'Не опубликовано: ' + e.message;
        } finally {
          nw.busy = false;
        }
      }
      const previewNews = () => C.news.preview([{ id: 'preview', date: nw.date, kind: 'custom', title: nw.title.trim() || 'Новость', body: { text: nw.text.trim(), photo: nw.photo } }]);
      const showNews = n => C.news.preview([n]);
      async function deleteNews(n) {
        if (nw.confirm !== n.id) { nw.confirm = n.id; return; }
        nw.busy = true;
        try { newsList.value = (await callApi('owner.news.delete', { id: n.id })).list; nw.info = 'Новость удалена'; }
        catch (e) { if (e.code !== 'AUTH') nw.info = e.message; }
        finally { nw.busy = false; nw.confirm = ''; }
      }

      // Автоновости: переключатели, «Посмотреть» — сегодняшняя по текущим (ещё не сохранённым) параметрам
      const on = k => String(f[k]) === '1';
      const flip = k => { f[k] = on(k) ? '0' : '1'; };
      const na = reactive({ busy: '', info: '' });
      // publish — опубликовать на сегодня (заменит сегодняшнюю того же вида), иначе только показать
      async function runNews(kind, publish) {
        na.busy = kind + (publish ? ':pub' : '');
        na.info = '';
        try {
          const d = await callApi('owner.news.run', { kind, publish: !!publish, params: {
            news_rating_by: f.news_rating_by, news_rating_measure: f.news_rating_measure, news_rating_staff: f.news_rating_staff,
            news_rating_top: f.news_rating_top, news_newplan_days: f.news_newplan_days,
            news_rating_staff_skip: f.news_rating_staff_skip, news_rating_categories: f.news_rating_categories } });
          if (d.item) C.news.preview([d.item]); else na.info = d.text;
          if (d.item && publish) { na.info = 'Опубликовано на сегодня — все увидят при входе в приложение'; loadNews(); }
        } catch (e) {
          if (e.code !== 'AUTH') na.info = 'Не получилось: ' + e.message;
        } finally {
          na.busy = '';
        }
      }
      // Рейтинг: сотрудники вне рейтинга и категории блюд — JSON в настройках (порядок как на сервере)
      const parseList = v => { try { return JSON.parse(v || '[]') || []; } catch (e) { return []; } };
      const skipList = computed(() => parseList(f.news_rating_staff_skip));
      const staffOff = n => skipList.value.includes(n);
      function toggleStaff(n) {
        const list = [...new Set(staffOff(n) ? skipList.value.filter(x => x !== n) : skipList.value.concat(n))].sort();
        f.news_rating_staff_skip = list.length ? JSON.stringify(list) : '';
      }
      const staffNames = computed(() => [...new Set((data.value && data.value.employees || []).concat(skipList.value))]);
      const staffText = computed(() => skipList.value.length ? 'Не участвуют: ' + skipList.value.join(', ') : 'Участвуют все сотрудники');
      const cats = reactive({ open: false, list: [], busy: false, error: '' });
      const catList = computed(() => parseList(f.news_rating_categories));
      const catOn = id => catList.value.some(c => c.id === id);
      function toggleCat(c) {

          .map(x => ({ id: x.id, name: x.name })).sort((a, b) => (a.id < b.id ? -1 : a.id > b.id ? 1 : 0));

      async function openCats() {

      // Последний автозапуск: «сегодня в 06:05 — тех. карты: …; рейтинг: …»
      const newsRunText = computed(() => {
        const st = data.value && data.value.schedule && data.value.schedule.news;

      // ---------- Конкурсы (wa_contest.js): список, редактор, «Пачка»
      const ct = reactive({ ready: false, list: [], pachca: {}, auto: {}, edit: null, confirm: false, q: '', found: [], searching: false, searched: false,

      const ctApply = d => Object.assign(ct, { ready: true, list: d.list, pachca: d.pachca || {}, auto: d.auto || {} });
      async function loadContests() {
        try { ctApply(await callApi('owner.news.contests')); ct.error = ''; } catch (e) { if (e.code !== 'AUTH') ct.error = 'Конкурсы не загрузились: ' + e.message; }
      }
      const CHAT = { test: 'тестовый чат', main: 'основной чат' };
      const ctSummary = c => ['товаров: ' + c.items.length, c.measure === 'sum' ? 'по сумме' : 'по количеству',

        c.pachca ? '«Пачка»: ' + CHAT[c.pachca] : '', c.photo ? 'с фото' : '', c.enabled ? '' : 'выключен'].filter(Boolean).join(' · ');
      // Последний автозапуск конкурса: «21.10 в 06:05 — опубликовано, отправлено в «Пачку»»
      function ctAutoText(c) {
        const a = ct.auto[c.id];
        if (!a) return '';
        const what = a.item ? 'опубликовано' : a.ok ? a.text : 'не удалось: ' + a.text;

        return 'Последний запуск ' + ddmm(a.day) + (a.at ? ' в ' + String(a.at).slice(11, 16) : '') + ' — ' + what + chat;
      }
      const ctBlank = () => ({ id: '', title: '', enabled: true, items: [], measure: 'qty', from: '', to: '', pachca: '', photo: '' });
      function ctOpen(c) {

      async function ctSave() {
        ct.busy = 'save';

        try {

      // Итог сегодня: look — посмотреть, test — отправить в тестовый чат (черновик из редактора),

      async function ctRun(c, mode) {
        const draft = !c;

          const d = await callApi('owner.news.contestRun', p);

        } finally {
          ct.busy = '';

      // Поиск в справочнике iiko — после паузы в наборе; ответ на устаревший запрос не показываем
      let ctTimer = 0;
      let ctSeq = 0;
      function ctSearch() {
        clearTimeout(ctTimer);

        const seq = ++ctSeq;

        ctTimer = setTimeout(async () => {
          try {
            const d = await callApi('owner.news.contestSearch', { q });
            if (seq === ctSeq) Object.assign(ct, { found: d.list, searched: true });
          } catch (e) {
            if (seq === ctSeq && e.code !== 'AUTH') Object.assign(ct, { found: [], editError: 'Поиск не получился: ' + e.message });

          }

      const ctHas = x => ct.edit.items.some(i => ctKey(i.name) === ctKey(x.name));
      const ctDrop = x => { ct.edit.items = ct.edit.items.filter(i => ctKey(i.name) !== ctKey(x.name)); };

        REFRESH: [{ v: 30, label: '30 с' }, { v: 45, label: '45 с' }, { v: 60, label: '1 мин' }, { v: 120, label: '2 мин' }, { v: 300, label: '5 мин' }],

  // ================================================================== Журнал

  const SETTING_LABELS = {

  // Запись журнала → «кто · что сделал · с чем» и подробности
  function describe(e, names) {

        detail: ['bar', 'prep'].filter(k => k in a).map(k => (k === 'bar' ? 'бармен: ' : 'заготовщик: ') + (a[k] || 'снят(а)')).join(' · '),

          'ингредиентов: ' + (a.items || 0), a.account ? 'счёт списания: ' + a.account : ''].filter(Boolean).join(' · '),
      };
      case 'salad.keys': return { who: actor, verb: a.removed ? 'удалил(а) ключи iikoCloud' : 'сменил(а) ключи iikoCloud', target: '', tone: 'warn', detail: a.tail ? 'API-ключ …' + a.tail : '' };

        who: actor, verb: 'исправил(а) акт салат-базы без «со вчера»', target: (a.tt || '') + ' за ' + ddmm(a.date) + (a.number ? ' · № ' + a.number : ''),
        tone: a.error ? 'warn' : 'sys', detail: [(a.lines || []).join(', '), a.error].filter(Boolean).join(' · '),
      };
      case 'salad.reopen': return {
        who: actor, verb: a.clear ? 'открыл(а) день салат-базы заново и очистил(а) внесённое' : 'открыл(а) день салат-базы заново',
        target: (a.tt || '') + ' за ' + ddmm(a.date), tone: 'warn',
        detail: (a.docs || []).length ? 'документы в iiko остались: ' + a.docs.join(', ') : '',
      };
    }
    return { who: actor, verb: e.action, target: '' };
  }

  const JournalView = {
    template: '#tpl-journal',
    setup() {
      const data = ref(null);
      const error = ref('');
      const loading = ref(false);
      const period = ref('today');
      const group = ref('');
      const tt = ref('');
      let seq = 0;

      async function load() {
        const to = period.value === 'yesterday' ? C.addDays(store.today, -1) : store.today;
        const from = period.value === 'week' ? C.addDays(store.today, -6) : to;
        const my = ++seq;
        loading.value = true;
        error.value = '';
        try {
          const d = await callApi('journal.query', { from, to, group: group.value, tt: tt.value });
          if (my === seq) data.value = d;
        } catch (e) {
          if (my === seq && e.code !== 'AUTH') error.value = e.message;
        } finally {
          if (my === seq) loading.value = false;
        }
      }
      watch([period, group, tt], load);
      onMounted(load);

      const dayTitle = d => d === store.today ? 'Сегодня' : d === C.addDays(store.today, -1) ? 'Вчера, ' + C.MF.day(d).split(', ')[1] : C.MF.day(d);
      const rows = computed(() => {
        if (!data.value) return [];
        let lastDay = '';
        return data.value.entries.map((e, i) => {
          const d = describe(e, data.value.names);
          const day = e.ts.slice(0, 10);
          const pt = store.points.find(p => p.tt === e.tt);
          const row = Object.assign({ tone: '' }, d, {
            key: i + e.ts, tt: e.tt, time: e.ts.slice(11, 16), emoji: pt ? pt.emoji : '',
            ini: C.initials(d.who) || '·', dayHead: day !== lastDay ? dayTitle(day) : '',
          });
          lastDay = day;
          return row;
        });
      });

      return {
        store, data, error, loading, period, group, tt, rows, load, asset: C.asset,
        PERIODS: [{ v: 'today', label: 'Сегодня' }, { v: 'yesterday', label: 'Вчера' }, { v: 'week', label: '7 дней' }],
        GROUPS: [{ v: '', label: 'Все' }, { v: 'save', label: 'Отметки' }, { v: 'undo', label: 'Отмены и сбросы' },
          { v: 'calc', label: 'Расчёты и закрытия' }, { v: 'users', label: 'Входы и настройки' }],
      };
    },
  };


  // ================================================================== Упаковка: загрузка экрана

  let packPart = null;
  // HTML с сервера: стили и шаблоны остаются на странице, скрипты выполняются заново
  function loadPack() {
    if (C.pack) return Promise.resolve();
    if (!packPart) {
      packPart = callApi('owner.pack.ui').then(html => {
        const box = document.createElement('div');
        box.hidden = true;
        box.innerHTML = html;
        const scripts = [...box.querySelectorAll('script')].filter(s => !s.type || s.type === 'text/javascript');
        scripts.forEach(s => s.remove());
        document.body.appendChild(box);
        scripts.forEach(s => { const el = document.createElement('script'); el.textContent = s.textContent; document.body.appendChild(el); });
        if (!C.pack) throw new Error('Экран «Упаковка» не загрузился');
      }).catch(e => { packPart = null; throw e; });
    }
    return packPart;
  }

  const PackagingView = {
    template: '#tpl-pack-loader',
    setup() {
      const comp = Vue.shallowRef(C.pack ? C.pack.PackagingView : null);
      const error = ref('');
      async function load() {
        error.value = '';
        try { await loadPack(); comp.value = C.pack.PackagingView; } catch (e) { if (e.code !== 'AUTH') error.value = e.message; }
      }
      onMounted(() => { if (!comp.value) load(); });
      return { comp, error, load };
    },
  };


  C.owner = { components: { UsersView, SettingsView, JournalView, PackagingView } };

})(window.MFC);
</script>

              <button type="button" class="wa-link" @click="showSeen = !showSeen">{{ showSeen ? 'Скрыть данные' : gm.rec.noWx ? 'Что видела Gemma: календарь' : 'Что видела Gemma: календарь, погода и надёжность прогноза' }}</button>
              <ul v-if="showSeen" class="wa-gm__seen">
                <li v-for="x in gm.rec.seen" :key="x.d">
                  <b>{{ WD[data.days.indexOf(x.d)] }} {{ dm(x.d) }}</b> — {{ x.info }}<template v-if="!gm.rec.noWx"> · вес прогноза {{ pct(x.conf) }}</template>
                  <small>год назад, {{ dmy(x.ly) }}: {{ x.lyInfo }} · прошлая неделя, {{ dm(x.lw) }}: {{ x.lwInfo }}<template v-if="x.py"> · она же год назад, {{ dmy(x.py) }}: {{ x.pyInfo }}</template></small>
