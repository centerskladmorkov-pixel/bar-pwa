<script>
(function (C) {

  if (!C) {
    document.getElementById('app').innerHTML =
      '<div class="wa-boot"><p style="max-width:320px">Не удалось загрузить интерфейс. Проверьте интернет и обновите страницу.</p></div>';
    return;
  }

  const { createApp, reactive, ref, computed, watch, nextTick, onMounted, onBeforeUnmount } = Vue;
  const { store, LS, MF, initials, asset, ROLE_LABELS, toggleTheme, rawApi, loadApp, toLogin, boot, screen, navFor, leavePoint, plural } = C;


  const LoginView = {
    template: '#tpl-login',
    setup() {
      const form = reactive({ login: LS.get('mf-last-login') || '', password: '', remember: true });
      const state = ref('idle');   // idle | error | blocked | loading
      const message = ref('');
      const showPw = ref(false);
      const shake = ref(false);
      const left = ref(0);
      let timer = null;

      const countdown = computed(() => Math.floor(left.value / 60) + ':' + String(left.value % 60).padStart(2, '0'));

      const fruits = [
        { name: 'strawberry', style: 'left:9%;top:11%;--w:64px;--t:6s' },
        { name: 'lemon',      style: 'right:9%;top:9%;--w:76px;--t:7s;--delay:-2s' },
        { name: 'avocado',    style: 'left:13%;top:29%;--w:58px;--t:8s;--delay:-4s' },
        { name: 'carrot',     style: 'right:18%;top:26%;--w:70px;--t:6.5s;--delay:-1s' },
        { name: 'plum',       style: 'left:26%;top:4%;--w:48px;--t:7.5s;--delay:-3s' },
      ];

      function fail(text) {
        state.value = 'error';
        message.value = text;
        shake.value = false;
        nextTick(() => { shake.value = true; setTimeout(() => { shake.value = false; }, 400); });
      }

      function lock(seconds) {
        state.value = 'blocked';
        left.value = seconds;
        clearInterval(timer);
        timer = setInterval(() => {
          left.value -= 1;
          if (left.value <= 0) { clearInterval(timer); state.value = 'idle'; }
        }, 1000);
      }

      async function submit() {
        if (state.value === 'loading' || state.value === 'blocked') return;
        if (!form.login || !form.password) { fail('Введите логин и пароль'); return; }

        state.value = 'loading';
        store.notice = '';
        try {
          const r = await rawApi('auth.login', { login: form.login, password: form.password, remember: form.remember });
          LS.set('mf-session', r.token);
          LS.set('mf-session-login', r.user ? r.user.login : form.login.toLowerCase());
          LS.set('mf-device', r.deviceToken || null);
          LS.set('mf-last-login', form.login.toLowerCase());
          form.password = '';
          await loadApp();
        } catch (e) {
          if (e.code === 'LOCKED') lock(e.data.retryAfter || 300);
          else fail(e.code === 'BAD_CREDENTIALS' ? 'Неверный логин или пароль' : e.message);
        }
      }

      onBeforeUnmount(() => clearInterval(timer));
      return { store, form, state, message, showPw, shake, countdown, fruits, submit, asset };
    },
  };


  const PlaceholderView = {
    template: '#tpl-placeholder',
    props: { screen: { type: Object, required: true } },
    setup(props) {
      const isHome = computed(() => navFor(store.user).main[0].id === props.screen.id);
      const roleLabel = computed(() => ROLE_LABELS[store.user.role] || store.user.role);
      return { store, isHome, roleLabel, asset };
    },
  };


  // Поддержка (запрос заказчика 2026-10-05)
  const SUPPORT = { name: 'Михаил Митюков', phone: '8 952 824 32 59', tel: '+79528243259' };


  const MoreView = {
    template: '#tpl-more',
    components: { DeviceSettings: C.DeviceSettings },
    props: { items: Array, theme: String },
    emits: ['go', 'theme', 'logout'],
  };


  const AppShell = {
    template: '#tpl-shell',
    components: Object.assign({ PlaceholderView, MoreView, NewsStories: C.news.NewsStories, TrainingOverlay: C.training.TrainingOverlay }, C.point.components, C.admin.components, C.analytics.components, C.owner.components, C.plan.components, C.help.components),
    setup() {
      // Обучение — раньше всего: не пройдено — открывается само, новости ждут его окончания.
      // Новости при входе и после обновления данных — непрочитанные, слайдами
      const startNews = () => { if (!C.training.gate()) C.news.openUnread(); };
      onMounted(startNews);
      watch(() => store.news, startNews);
      watch(() => store.training, () => C.training.gate());
      // Экраны точки: у учётной записи точки — всегда, у админа — когда он открыл точку с дашборда
      const nav = computed(() => navFor(store.user, store.pointTt));
      const isPointUser = computed(() => store.user.role === 'point');
      const isPoint = computed(() => isPointUser.value || !!store.pointTt);
      const adminInPoint = computed(() => !isPointUser.value && !!store.pointTt);
      const point = computed(() => store.pointTt
        ? store.points.find(p => p.tt === store.pointTt) || { tt: store.pointTt, name: store.pointTt, emoji: '' }
        : store.points[0] || { name: store.user.tt, emoji: '' });
      const todayLabel = computed(() => MF.day(store.today));
      const currentScreen = computed(() => screen(store.view));
      const roleLabel = computed(() => ROLE_LABELS[store.user.role] || '');
      const themeIcon = computed(() => store.theme === 'dark' ? '#i-sun' : '#i-moon');

      // Нижняя навигация: до 5 пунктов, остальное — в «Ещё»
      const bottomItems = computed(() => nav.value.more.length ? nav.value.main.concat([screen('more')]) : nav.value.main);
      const activeBottom = computed(() => nav.value.more.some(i => i.id === store.view) ? 'more' : store.view);

      // Смена в шапке точки
      const shift = computed(() => C.point.work.data && C.point.work.data.shift);
      const shiftChips = computed(() => {
        const mode = isPointUser.value ? store.user.mode : 'both';
        return [
          { role: 'bar', label: 'Бармен', name: shift.value && shift.value.bar },
          { role: 'prep', label: 'Заготовщик', name: shift.value && shift.value.prep },
        ].filter(c => mode === 'both' || c.role === mode);
      });

      // «Анна Смирнова» → «Анна С.», как в макете шапки
      const shortName = name => {
        const [first, second] = String(name).split(/\s+/);
        return second ? first + ' ' + second[0] + '.' : first;
      };

      // Смена одной строкой для телефона: «Смена: Анна С.» или «Б: Анна С. · З: Илья К.»
      const shiftLine = computed(() => {
        const chips = shiftChips.value;
        if (chips.every(c => !c.name)) return { empty: true, text: '' };
        if (chips.length === 2 && chips[0].name === chips[1].name) return { empty: false, text: 'Смена: ' + shortName(chips[0].name) };
        const letter = { bar: 'Б', prep: 'З' };
        return {
          empty: false,
          text: chips.map(c => (chips.length > 1 ? letter[c.role] : c.label) + ': ' + (c.name ? shortName(c.name) : '—')).join(' · '),
        };
      });

      const confirmLogout = ref(false);
      const helpMenu = ref(false);
      const supportOpen = ref(false);
      const copied = ref(false);
      const phoneEl = ref(null);
      async function copyPhone() {
        try {
          await navigator.clipboard.writeText(SUPPORT.phone);
        } catch (e) {
          if (phoneEl.value) { phoneEl.value.select(); document.execCommand('copy'); }
        }
        copied.value = true;
      }
      const syncing = ref(false);
      const hasDevice = computed(() => !!LS.get('mf-device'));
      const headerEl = ref(null);

      if (isPoint.value) C.point.start(point.value.tt);
      watch(() => store.pointTt, tt => {
        if (isPointUser.value) return;
        if (tt) C.point.start(tt); else C.point.stop();
      });
      onBeforeUnmount(() => C.point.stop());

      // Заголовки групп закрепляются под шапкой: её высота → --sticky-offset.
      // Шапка появляется и позже — когда админ открывает точку. Полоса-журнал (без интернета) закреплена над шапкой:
      // её высота → --journal-h, шапка и заголовки — ниже на неё
      let ro = null;
      function stickyOffsets() {
        const bar = document.querySelector('.wa-journal-bar');
        const jh = bar ? bar.offsetHeight : 0;
        const root = document.documentElement.style;
        root.setProperty('--journal-h', jh + 'px');
        root.setProperty('--sticky-offset', (headerEl.value ? headerEl.value.offsetHeight : 0) + jh + 'px');
      }
      watch(headerEl, el => {
        if (ro) ro.disconnect();
        if (!el || !window.ResizeObserver) return;
        ro = new ResizeObserver(stickyOffsets);
        ro.observe(el);
      }, { flush: 'post' });
      onBeforeUnmount(() => ro && ro.disconnect());

      // Пункты бокового меню прокручиваются: открытый экран — в видимой части списка
      const navToActive = () => nextTick(() => {
        const el = document.querySelector('.sidebar__nav .sidebar__item--active');
        if (el && el.offsetParent) el.scrollIntoView({ block: 'nearest' });
      });
      onMounted(navToActive);
      watch(() => store.view, navToActive);

      // Экран админа запоминается; экраны открытой им точки — нет (после перезагрузки — дашборд)
      function go(id) {
        if (id === 'support') { copied.value = false; supportOpen.value = true; return; }
        if (id === 'training') { C.training.open(); return; }   // окно поверх, не экран
        store.view = id;
        if (!store.pointTt) LS.set('mf-view:' + store.user.login, id);
        window.scrollTo(0, 0);
      }

      async function refresh() {
        syncing.value = true;
        try {
          await loadApp();
          if (isPoint.value) { C.point.start(point.value.tt); }
        } catch (e) {
          if (e.code !== 'AUTH') store.fatal = e.message;
        }
        syncing.value = false;
      }

      async function logout() {
        confirmLogout.value = false;
        try { await rawApi('auth.logout', { deviceToken: LS.get('mf-device') }); } catch (e) {}
        LS.set('mf-device', null);
        C.forgetDevice();
        toLogin();
      }

      // ---------------------------------------------------------------- журнал очереди (OFFLINE, 2026-10-26)
      const OFFLINE = C.OFFLINE;
      const outbox = C.outbox;
      const journalOps = computed(() => C.myOps().slice().sort((a, b) => a.at - b.at));
      const journalFailed = computed(() => journalOps.value.filter(o => o.state === 'fail').length);
      // Очередь салат-базы — своя (ui_salad.html, на устройстве): здесь только её размер
      const saladWaiting = ref(0);
      if (OFFLINE) {
        const readSalad = () => {
          let n = 0;
          try { const a = JSON.parse(LS.get('mf-salad-outbox:' + (store.user ? store.user.login : '')) || '[]'); n = Array.isArray(a) ? a.length : 0; } catch (e) { n = 0; }
          saladWaiting.value = n;
        };
        readSalad();
        setInterval(readSalad, 3000);
      }
      const journalWaiting = computed(() => journalOps.value.length - journalFailed.value + saladWaiting.value);
      const journal = computed(() => {
        const n = journalWaiting.value;
        const bad = journalFailed.value;
        if (bad) return { show: true, tone: 'fail', icon: '#i-alert', text: 'Не принято: ' + bad + (n ? ' · не отправлено: ' + n : '') };
        if (store.offline) return { show: true, tone: 'offline', icon: '#i-wifi-off', text: n ? 'Нет интернета · не отправлено: ' + n : 'Нет интернета · работаем без него' };
        if (n) return { show: true, tone: 'sync', icon: '#i-refresh', text: (outbox.busy ? 'Отправляем · ' : 'Ждут отправки · ') + n };
        return { show: false };
      });
      const timeOf = ms => {
        const d = new Date(ms);
        const p = n => String(n).padStart(2, '0');
        const today = new Date().toDateString() === d.toDateString();
        return (today ? '' : p(d.getDate()) + '.' + p(d.getMonth() + 1) + ' ') + p(d.getHours()) + ':' + p(d.getMinutes());
      };
      const pointName = tt => { const p = store.points.find(x => x.tt === tt); return p ? p.name : tt || ''; };
      const stateText = o => o.state === 'send' ? 'отправляется…' : o.state === 'fail' ? 'не принято: ' + o.error
        : o.error ? 'ждёт, повторим: ' + o.error : 'ждёт отправки';
      const cancelOp = id => C.cancelOp(id);
      const sendNow = () => { outbox.tries = 0; C.kickOps(0); };
      if (OFFLINE) watch(() => journal.value.show && journal.value.text, () => nextTick(stickyOffsets), { immediate: true });

      return {
        store, nav, isPoint, isPointUser, adminInPoint, point, todayLabel, currentScreen, roleLabel, themeIcon, initials,
        bottomItems, activeBottom, shift, shiftChips, shiftLine, shortName, confirmLogout, syncing, hasDevice, headerEl,
        go, refresh, logout, toggleTheme, leavePoint,
        helpMenu, supportOpen, copied, phoneEl, copyPhone, SUPPORT,
        OFFLINE, outbox, journal, journalOps, journalFailed, journalWaiting, saladWaiting, timeOf, pointName, stateText, cancelOp, sendNow, plural,
      };
    },
  };


  createApp({
    template: '#tpl-root',
    components: { LoginView, AppShell },
    setup() { return { store, retry: boot }; },
  }).mount('#app');

  boot();

})(window.MFC);
</script>

<script>
// PWA (2026-10-26): регистрация фонового помощника (sw.js), плашка «Есть новая версия — Обновить», цвет полосы
// телефона по теме приложения. Вставляется в конец страницы сборкой tools/build_pwa.js — в приложение Apps Script не входит.
(function () {
  // Цвет полосы состояния телефона — как фон приложения (тема меняется в «Экран и тема»)
  var meta = document.querySelector('meta[name="theme-color"]');
  function paint() {
    if (meta) meta.setAttribute('content', getComputedStyle(document.body).backgroundColor || '#f9f5dd');
  }
  paint();
  new MutationObserver(paint).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  if (!('serviceWorker' in navigator)) return;
  // Перезагрузка — только когда помощник сменился на новую версию. Первая установка тоже даёт controllerchange
  // (помощник сразу берёт страницу), но страница и так свежая
  var hadController = !!navigator.serviceWorker.controller;
  var reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (!hadController) { hadController = true; return; }
    if (reloading) return;
    reloading = true;
    location.reload();
  });

  function offer(worker) {
    // Первая установка (страница ещё без помощника) — обновлять нечего
    if (!worker || !navigator.serviceWorker.controller || document.getElementById('mf-pwa-update')) return;
    var bar = document.createElement('div');
    bar.id = 'mf-pwa-update';
    bar.setAttribute('role', 'status');
    bar.innerHTML = '<span>Есть новая версия</span><button type="button">Обновить</button>';
    bar.querySelector('button').addEventListener('click', function () {
      this.disabled = true;
      this.textContent = 'Обновляем…';
      worker.postMessage('skipWaiting');
    });
    document.body.appendChild(bar);
  }

  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').then(function (reg) {
      if (reg.waiting) offer(reg.waiting);
      reg.addEventListener('updatefound', function () {
        var w = reg.installing;
        if (w) w.addEventListener('statechange', function () { if (w.state === 'installed') offer(w); });
      });
      // Новую версию ищем при возвращении в приложение и раз в час
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') reg.update().catch(function () {});
      });
      setInterval(function () { reg.update().catch(function () {}); }, 3600 * 1000);
    }).catch(function (e) { console.warn('PWA: фоновый помощник не установлен', e); });
  });
})();
</script>
</body>
</html>
