   Тёмная тема: [data-theme="dark"] на <html>, либо системная (prefers-color-scheme),
   если data-theme не задан явно.
   ========================================================================= */

:root, [data-theme="light"] {
  /* ---- Бренд (не меняются между темами) ---- */
  --brand-green:      #225d2f;
  --brand-green-dark: #0b3220;
  --brand-carrot:     #f7611e;
  --brand-cream:      #f9f5dd;
  /* Цвета групп — только для заглушек-иллюстраций */
  --group-smoothie: #f5355a;
  --group-fresh:    #fccf00;
  --group-bowl:     #7e9c02;
  --group-dessert:  #6d0f58;

  /* ---- Семантика: светлая тема ---- */
  --bg:            #f9f5dd;   /* тёплый кремовый фон */
  --surface:       #ffffff;   /* карточки */
  --surface-2:     #f1ecd2;   /* вторичные поверхности, чипы, аватар точки */
  --inverse:       #0b3220;   /* тёмные блоки: боковое меню, уведомления */
  --on-inverse:    #f9f5dd;
  --text:          #0b3220;   /* основной текст */
  --text-brand:    #225d2f;   /* заголовки, крупные цифры */
  --text-muted:    #5a6e58;   /* вторичный текст (AA на --bg и --surface) */
  --accent:        #f7611e;   /* морковный: главные кнопки, активная вкладка */
  --accent-pressed:#d8500e;
  --on-accent:     #f9f5dd;
  --fresh:         #225d2f;   /* «Готово» */
  --partial:       #fccf00;   /* «Частично готово», «В работе» — только фон/точка, текст на нём = --text */
  --danger:        #dc161d;   /* ошибки */
  --border:        rgba(11, 50, 32, .12);
  --border-strong: rgba(11, 50, 32, .24);
  --scrim:         rgba(8, 38, 26, .48);
  --disabled:      color-mix(in oklab, var(--text-brand) 30%, var(--bg));

  /* Мягкие подложки статусов */
  --fresh-soft:   color-mix(in oklab, var(--fresh) 15%, var(--surface));
  --partial-soft: color-mix(in oklab, var(--partial) 40%, var(--surface));
  --danger-soft:  color-mix(in oklab, var(--danger) 12%, var(--surface));
  --accent-soft:  color-mix(in oklab, var(--accent) 14%, var(--surface));

  /* ---- Отступы: шкала 4/8/12/16/24/32 ---- */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;

  /* ---- Радиусы ---- */
  --radius-sm:   12px;  /* поля, мелкие кнопки */
  --radius-md:   16px;  /* кнопки клавиатуры, заглушки */
  --radius-lg:   20px;  /* карточки, плитки */
  --radius-xl:   28px;  /* шторка, окна */
  --radius-pill: 999px;
  --radius-dome: 9999px 9999px 0 0; /* фирменный «купол» моркови */

  /* ---- Тени ---- */
  --shadow-sm: 0 1px 2px rgba(11, 50, 32, .08);
  --shadow-md: 0 6px 18px rgba(11, 50, 32, .10);
  --shadow-lg: 0 20px 40px rgba(11, 50, 32, .14);

  /* ---- Типографика ---- */
  --font-display: "Freigeist Wide", "Unbounded", system-ui, sans-serif;
  --font-body:    "Freigeist Wide", "Manrope", system-ui, sans-serif;
  --font-mono:    ui-monospace, "SF Mono", Menlo, monospace;
  --fs-xs:   12px;  /* бейджи, подписи */
  --fs-sm:   14px;
  --fs-md:   16px;  /* минимум для полей ввода */
  --fs-lg:   18px;  /* крупные кнопки */
  --fs-xl:   22px;
  --fs-2xl:  30px;  /* заголовок экрана */
  --fs-num:  44px;  /* ввод факта */
  --lh-tight: 1.1;
  --lh-base:  1.45;
  --ls-caps:  .14em; /* фирменные разреженные капсы */

  /* ---- Анимации ---- */
  --ease:        cubic-bezier(.2, .8, .2, 1);
  --ease-spring: cubic-bezier(.22, 1.12, .36, 1); /* шторки */
  --dur-fast: 150ms;
  --dur:      220ms;
  --dur-slow: 350ms;
  --dur-sheet: 420ms;

  /* ---- Размеры ---- */
  --tap: 48px;          /* минимальная зона нажатия */
  --tap-lg: 56px;
  --bottom-nav-h: 84px;
  --sidebar-w: 256px;

  color-scheme: light;
}

/* ---- Тёмная тема ---- */
[data-theme="dark"] {
  --bg:            #0b3220;
  --surface:       #143f2b;
  --surface-2:     #1b4a34;
  --inverse:       #06200f;
  --text:          #f9f5dd;
  --text-brand:    #f9f5dd;
  --text-muted:    #b8c4a9;
  --accent:        #f7611e;
  --fresh:         #9cbf1e;
  --danger:        #ff6b5e;
  --border:        rgba(249, 245, 221, .14);
  --border-strong: rgba(249, 245, 221, .28);
  --shadow-md: 0 6px 18px rgba(0, 0, 0, .30);
  --shadow-lg: 0 20px 40px rgba(0, 0, 0, .40);
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b3220; --surface: #143f2b; --surface-2: #1b4a34; --inverse: #06200f;
    --text: #f9f5dd; --text-brand: #f9f5dd; --text-muted: #b8c4a9;
    --fresh: #9cbf1e; --danger: #ff6b5e;
    --border: rgba(249, 245, 221, .14); --border-strong: rgba(249, 245, 221, .28);
    --shadow-md: 0 6px 18px rgba(0, 0, 0, .30); --shadow-lg: 0 20px 40px rgba(0, 0, 0, .40);
    color-scheme: dark;
  }
}

/* =========================================================================
   Морковь Фрут · БАР — стили компонентов и экранов
   Классы по БЭМ: .block, .block__element, .block--modifier. Состояния — модификаторы
   или .is-* (is-open, is-loading), которые ставит JS. Стилей по id нет.
   Mobile-first: 360 → 768 (планшет) → 1280 (ПК).
   ========================================================================= */

/* ---------- База ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; min-height: 100dvh;
  background: var(--bg); color: var(--text);
  font: 500 var(--fs-md)/var(--lh-base) var(--font-body);
  -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }
img, svg { display: block; max-width: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-pressed); text-decoration: underline; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.icon { width: 24px; height: 24px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.icon--sm { width: 18px; height: 18px; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Типографика ---------- */
.h-screen { margin: 0; font: 700 var(--fs-2xl)/var(--lh-tight) var(--font-display); color: var(--text-brand); letter-spacing: -.01em; }
.h-section { margin: 0; font: 700 var(--fs-xl)/1.2 var(--font-display); color: var(--text-brand); }
.eyebrow { font-size: var(--fs-xs); font-weight: 700; letter-spacing: var(--ls-caps); text-transform: uppercase; color: var(--text-muted); }
.num { font-family: var(--font-display); font-weight: 700; color: var(--text-brand); }

/* ---------- Логотип ---------- */
.logo { display: flex; align-items: center; gap: var(--space-3); }
.logo__mark { width: 30px; height: 44px; }
.logo__name { font: 700 17px/1.1 var(--font-display); }
.logo__sub { font-size: 11px; font-weight: 700; letter-spacing: .3em; color: var(--accent); }

/* =========================================================================
   Кнопки. Нажатие «пружинит»: scale(.97) за 150мс.
   ========================================================================= */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
  min-height: var(--tap); padding: 0 var(--space-5);
  border: 0; border-radius: var(--radius-pill);
  font-size: var(--fs-md); font-weight: 700; white-space: nowrap;
  transition: transform var(--dur-fast) var(--ease), background-color var(--dur-fast) var(--ease), color var(--dur-fast);
}
.btn:active:not(:disabled) { transform: scale(.97); }
.btn--primary { background: var(--accent); color: var(--on-accent); }
.btn--primary:hover:not(:disabled) { background: var(--accent-pressed); }
.btn--secondary { background: transparent; color: var(--text-brand); box-shadow: inset 0 0 0 1.5px currentColor; }
.btn--secondary:hover:not(:disabled) { background: color-mix(in oklab, var(--text-brand) 8%, transparent); }
.btn--ghost { background: transparent; color: var(--text-brand); box-shadow: inset 0 0 0 1.5px var(--border-strong); }
.btn--danger { background: var(--danger); color: var(--on-accent); }
.btn--lg { min-height: 60px; font-size: var(--fs-lg); }
.btn--block { width: 100%; }
.btn:disabled { background: var(--disabled); color: var(--on-accent); box-shadow: none; cursor: not-allowed; }
.btn--secondary:disabled, .btn--ghost:disabled { background: transparent; color: var(--text-muted); box-shadow: inset 0 0 0 1.5px var(--border); }
/* Иконочная кнопка: 48×48 */
.btn--icon { width: var(--tap); padding: 0; border-radius: var(--radius-sm); background: transparent; color: var(--text-brand); }
.btn--icon:hover { background: var(--surface-2); }
.btn--icon.btn--filled { background: var(--surface-2); }
/* Загрузка: спиннер слева, клики блокируются */
.btn.is-loading { pointer-events: none; }
.btn.is-loading::before {
  content: ""; width: 18px; height: 18px; border-radius: 50%;
  border: 2.5px solid color-mix(in oklab, currentColor 35%, transparent); border-top-color: currentColor;
  animation: spin 700ms linear infinite;
}

/* ---------- Спиннер ---------- */
.spinner { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid var(--border-strong); border-top-color: currentColor; animation: spin 700ms linear infinite; }

/* =========================================================================
   Поля ввода. Шрифт ≥16px (без зума на iOS).
   ========================================================================= */
.field { display: flex; flex-direction: column; gap: 6px; }
.field__label { font-size: 13px; font-weight: 700; color: var(--text-muted); }
.field__control { position: relative; }
.field__input {
  width: 100%; height: var(--tap-lg); padding: 0 var(--space-4);
  border: 1.5px solid var(--border-strong); border-radius: 14px;
  background: var(--surface); color: var(--text); font-size: 17px; outline: none;
  transition: border-color var(--dur-fast), box-shadow var(--dur-fast);
}
.field__input::placeholder { color: var(--text-muted); }
.field__input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in oklab, var(--accent) 22%, transparent); }
.field__input--with-btn { padding-right: 56px; }
.field__input--with-icon { padding-left: 46px; }
.field__icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
.field__btn { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); }
.field__hint { font-size: 13px; color: var(--text-muted); }
.field--error .field__input { border-color: var(--danger); }
.field--error .field__hint { color: var(--danger); font-weight: 700; }
.field--sm .field__input { height: var(--tap); font-size: var(--fs-md); }
.select { height: var(--tap); padding: 0 var(--space-3); border: 1px solid var(--border-strong); border-radius: 14px; background: var(--surface); font-size: var(--fs-md); }

/* Флажок */
.checkbox { display: inline-flex; align-items: center; gap: var(--space-3); min-height: var(--tap); cursor: pointer; user-select: none; }
.checkbox__input { position: absolute; opacity: 0; pointer-events: none; }
.checkbox__box {
  width: 26px; height: 26px; border-radius: 8px; border: 1.5px solid var(--border-strong);
  display: grid; place-items: center; color: var(--on-accent);
  transition: background-color var(--dur-fast), border-color var(--dur-fast);
}
.checkbox__box .icon { width: 16px; height: 16px; stroke-width: 3; opacity: 0; transform: scale(.6); transition: all var(--dur-fast) var(--ease); }
.checkbox__input:checked + .checkbox__box { background: var(--text-brand); border-color: var(--text-brand); color: var(--bg); }
.checkbox__input:checked + .checkbox__box .icon { opacity: 1; transform: none; }
.checkbox__input:focus-visible + .checkbox__box { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Переключатель */
.switch { position: relative; width: 52px; height: 30px; border: 0; border-radius: var(--radius-pill); background: var(--border-strong); transition: background-color var(--dur) var(--ease); }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--brand-cream); box-shadow: var(--shadow-sm); transition: transform var(--dur) var(--ease); }
.switch[aria-checked="true"] { background: var(--brand-green); }
.switch[aria-checked="true"]::after { transform: translateX(22px); }

/* =========================================================================
   Чипы-фильтры и бейджи статусов
   ========================================================================= */
.chips { display: flex; gap: var(--space-2); overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chip {
  flex: none; display: inline-flex; align-items: center; gap: var(--space-2);
  height: 44px; padding: 0 14px; border: 1px solid var(--border-strong); border-radius: var(--radius-pill);
  background: var(--surface); color: var(--text); font-size: var(--fs-sm); font-weight: 700; white-space: nowrap;
  transition: background-color var(--dur-fast), color var(--dur-fast), transform var(--dur-fast) var(--ease);
}
.chip:active { transform: scale(.96); }
.chip__count { min-width: 22px; height: 22px; padding: 0 6px; border-radius: var(--radius-pill); display: grid; place-items: center; font-size: var(--fs-xs); background: var(--surface-2); }
.chip--active, .chip[aria-pressed="true"] { background: var(--text-brand); border-color: var(--text-brand); color: var(--bg); }
.chip--active .chip__count, .chip[aria-pressed="true"] .chip__count { background: color-mix(in oklab, var(--bg) 22%, transparent); }

.badge { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: var(--radius-pill); font-size: var(--fs-xs); font-weight: 700; white-space: nowrap; }
.badge--todo    { background: var(--surface-2); color: var(--text-muted); }
.badge--work    { background: var(--partial-soft); color: var(--text); }
.badge--partial { background: var(--partial-soft); color: var(--text); }
.badge--done    { background: var(--fresh-soft); color: var(--fresh); }
.badge--error   { background: var(--danger-soft); color: var(--danger); }
.badge--rest    { background: transparent; color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; }
.badge--lg { height: 28px; padding: 0 10px; gap: 6px; }

/* =========================================================================
   Оболочка приложения: шапка, нижняя навигация (≤1279), боковое меню (≥1280)
   ========================================================================= */
.app { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
.app__main { flex: 1; min-width: 0; padding: 0 var(--space-4) calc(var(--bottom-nav-h) + var(--space-6)); }

.app-header { position: sticky; top: 0; z-index: 10; background: var(--bg); padding: var(--space-3) var(--space-4); display: flex; flex-direction: column; gap: 10px; }
.app-header__row { display: flex; align-items: center; gap: var(--space-3); }
.app-header__point { flex: 1; min-width: 0; }
.app-header__name { font-size: 17px; font-weight: 700; color: var(--text-brand); }
.app-header__date { font-size: 13px; color: var(--text-muted); }
.app-header__shift { display: flex; gap: var(--space-2); flex-wrap: wrap; }

.point-avatar { flex: none; width: 44px; height: 44px; border-radius: 14px; background: var(--surface-2); display: grid; place-items: center; font-size: 24px; line-height: 1; }
.point-avatar--lg { width: 48px; height: 48px; font-size: 26px; }

.shift-chip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: var(--radius-pill); background: var(--surface-2); font-size: 13px; }
.shift-chip__role { color: var(--text-muted); }
.shift-chip--empty { background: var(--accent-soft); color: var(--accent); font-weight: 700; }

/* Индикатор связи: под шапкой */
.net-status { display: flex; align-items: center; justify-content: center; gap: var(--space-2); min-height: 36px; padding: 0 var(--space-4); font-size: 13px; font-weight: 700; }
.net-status--offline { background: var(--partial); color: var(--brand-green-dark); }
.net-status--sync { background: var(--brand-green); color: var(--brand-cream); }
.net-status--sync .spinner { width: 14px; height: 14px; border-color: rgba(249,245,221,.35); border-top-color: var(--brand-cream); }

/* Нижняя навигация */
.bottom-nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  height: calc(var(--bottom-nav-h) + env(safe-area-inset-bottom)); padding: 0 var(--space-2) calc(18px + env(safe-area-inset-bottom));
  display: grid; grid-template-columns: repeat(5, 1fr);
  background: var(--surface); border-top: 1px solid var(--border);
}
.bottom-nav__item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--text-muted); font-size: 11px; font-weight: 700; text-decoration: none; }
.bottom-nav__item:hover { text-decoration: none; color: var(--text-brand); }
.bottom-nav__pill { width: 56px; height: 30px; border-radius: var(--radius-pill); display: grid; place-items: center; transition: background-color var(--dur) var(--ease); }
.bottom-nav__item--active { color: var(--accent); }
.bottom-nav__item--active .bottom-nav__pill { background: var(--accent-soft); }

/* Боковое меню (ПК) */
.sidebar { display: none; }
.sidebar__nav { display: flex; flex-direction: column; gap: 4px; }
.sidebar__section { padding: 18px 14px 6px; font-size: 11px; font-weight: 700; letter-spacing: var(--ls-caps); text-transform: uppercase; color: rgba(249,245,221,.55); }
.sidebar__item { display: flex; align-items: center; gap: var(--space-3); height: var(--tap); padding: 0 14px; border-radius: 14px; color: rgba(249,245,221,.78); font-size: 15px; text-decoration: none; transition: background-color var(--dur-fast); }
.sidebar__item:hover { background: rgba(249,245,221,.1); color: var(--brand-cream); text-decoration: none; }
.sidebar__item--active { background: var(--brand-green); color: var(--brand-cream); font-weight: 700; }
.sidebar__profile { margin-top: auto; display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3); border-radius: var(--radius-md); background: rgba(249,245,221,.06); }
.sidebar__profile .btn--icon { color: var(--brand-cream); }
.sidebar__profile .btn--icon:hover { background: rgba(249,245,221,.1); }
.user-avatar { flex: none; width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-size: 14px; font-weight: 700; }

/* ---------- Табы ---------- */
.tabs { display: inline-flex; padding: 4px; border-radius: var(--radius-pill); background: color-mix(in oklab, var(--text-brand) 8%, var(--bg)); }
.tabs__tab { height: 40px; padding: 0 20px; border: 0; border-radius: var(--radius-pill); background: transparent; color: var(--text-muted); font-size: var(--fs-sm); font-weight: 700; transition: all var(--dur) var(--ease); }
.tabs__tab[aria-selected="true"] { background: var(--surface); color: var(--text-brand); box-shadow: var(--shadow-sm); }

/* ---------- Выбор даты ---------- */
.date-picker { display: inline-flex; align-items: center; height: var(--tap); border-radius: var(--radius-pill); background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
.date-picker__btn { width: var(--tap); height: 46px; border: 0; border-radius: var(--radius-pill); background: transparent; color: var(--text-brand); display: grid; place-items: center; }
.date-picker__btn:hover { background: var(--surface-2); }
.date-picker__label { display: flex; align-items: center; gap: var(--space-2); min-width: 150px; justify-content: center; font-size: 15px; font-weight: 700; }

/* =========================================================================
   Экран «Блюда» / «Заготовки»: заголовок, группы, карточки
   ========================================================================= */
.screen-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-3); padding: var(--space-2) 0 var(--space-3); }
.screen-head__count { font-size: 15px; color: var(--text-muted); }
.screen-head__count b { font: 700 20px var(--font-display); color: var(--text-brand); }
.toolbar { display: flex; flex-direction: column; gap: var(--space-3); margin-bottom: var(--space-2); }

.item-group__title {
  position: sticky; top: var(--sticky-offset, 0); z-index: 5;
  display: flex; justify-content: space-between; padding: 14px 0 8px; background: var(--bg);
}
.item-group__list { display: grid; gap: var(--space-2); }

/* Карточка позиции.
   Состояния: (по умолчанию) к выполнению · --work · --done · --partial · --rest · --selected
   Появление: fadeUp 260мс. Уход в «Готово»: JS делает FLIP (см. dishes.html). */
.item-card {
  display: flex; align-items: center; gap: var(--space-3); width: 100%; min-height: 76px; padding: var(--space-3);
  border: 1.5px solid transparent; border-radius: 18px; background: var(--surface); box-shadow: var(--shadow-sm);
  text-align: left; color: var(--text);
  transition: transform var(--dur-fast) var(--ease), box-shadow var(--dur) var(--ease), border-color var(--dur), opacity var(--dur);
  animation: fadeUp 260ms var(--ease) both;
}
.item-card:active { transform: scale(.98); }
@media (hover: hover) { .item-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); } }
.item-card__thumb { flex: none; }
.item-card__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.item-card__title { font-size: 15px; font-weight: 700; line-height: 1.25; }
.item-card__meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.item-card__qty { flex: none; text-align: right; }
.item-card__num { display: block; font: 700 26px/1 var(--font-display); color: var(--text-brand); }
.item-card__unit { display: block; margin-top: 4px; font-size: var(--fs-xs); color: var(--text-muted); }
.item-card--selected { border-color: var(--accent); }
.item-card--done, .item-card--partial { box-shadow: none; background: color-mix(in oklab, var(--surface) 60%, var(--bg)); }
.item-card--done .item-card__num, .item-card--partial .item-card__num { color: var(--text-muted); }
.item-card.is-leaving { opacity: 0; transform: translateX(24px) scale(.98); }

/* Заглушка вместо фото: цвет стабильно по группе */
.thumb { width: 52px; height: 52px; border-radius: var(--radius-md); display: grid; place-items: center; background: color-mix(in oklab, var(--thumb-c) 20%, var(--surface)); }
.thumb img { width: 30px; height: 30px; }
.thumb--sm { width: 40px; height: 40px; border-radius: var(--radius-sm); }
.thumb--sm img { width: 24px; height: 24px; }
.thumb--smoothie { --thumb-c: var(--group-smoothie); }
.thumb--fresh    { --thumb-c: var(--group-fresh); }
.thumb--bowl     { --thumb-c: var(--group-bowl); }
.thumb--dessert  { --thumb-c: var(--group-dessert); }
.thumb--letter { font: 700 22px var(--font-display); color: var(--text-brand); }

/* Свёрнутый раздел «Готово» (нативный <details>) */
.done-section { margin-top: var(--space-5); }
.done-section__summary {
  list-style: none; display: flex; align-items: center; justify-content: space-between; gap: var(--space-2);
  min-height: 52px; padding: 0 var(--space-4); border-radius: var(--radius-md);
  background: var(--fresh-soft); color: var(--fresh); font-size: 15px; font-weight: 700; cursor: pointer;
}
.done-section__summary::-webkit-details-marker { display: none; }
.done-section__chevron { transition: transform var(--dur) var(--ease); }
.done-section[open] .done-section__chevron { transform: rotate(180deg); }
.done-section__list { display: grid; gap: var(--space-2); padding-top: var(--space-2); }

/* =========================================================================
   Нижняя шторка. Открытие: translateY(105%) → 0, 420мс, пружинная кривая.
   На планшете и ПК — по центру, ширина до 560px.
   ========================================================================= */
.sheet-backdrop { position: fixed; inset: 0; z-index: 40; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity 260ms var(--ease); }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 41;
  max-height: 94vh; max-height: 94dvh; display: flex; flex-direction: column;
  background: var(--bg); border-radius: var(--radius-xl) var(--radius-xl) 0 0; box-shadow: var(--shadow-lg);
  transform: translateY(105%); transition: transform var(--dur-sheet) var(--ease-spring);
  padding-bottom: env(safe-area-inset-bottom);
}
.sheet.is-open { transform: none; }
.sheet.is-open + .sheet-backdrop, .sheet-backdrop.is-open { opacity: 1; pointer-events: auto; }
.sheet__handle { align-self: center; width: 44px; height: 5px; margin: 10px 0 4px; border-radius: var(--radius-pill); background: var(--border-strong); }
.sheet__body { overflow-y: auto; overscroll-behavior: contain; padding: 4px 20px 20px; display: flex; flex-direction: column; gap: 14px; }
.sheet__header { display: flex; align-items: flex-start; gap: var(--space-3); }
.sheet__title { margin: 0; font: 700 19px/1.2 var(--font-display); color: var(--text-brand); }
.sheet__place { display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 13px; color: var(--text-muted); }
.sheet__close { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--surface-2); color: var(--text-brand); display: grid; place-items: center; }
.sheet__actions { display: flex; gap: var(--space-2); }
.sheet__actions .btn--lg { flex: 1; }

/* Тех. карта */
.tech-card { border-radius: var(--radius-md); background: var(--surface); box-shadow: var(--shadow-sm); padding: var(--space-3) 14px; }
.tech-card__head { display: flex; justify-content: space-between; gap: var(--space-3); margin-bottom: 6px; white-space: nowrap; }
.tech-card__row { display: flex; justify-content: space-between; gap: var(--space-3); padding: 5px 0; border-top: 1px solid var(--border); font-size: var(--fs-sm); }
.tech-card__qty { font-weight: 700; color: var(--text-brand); white-space: nowrap; }

/* Ввод количества: −  [число]  + */
.qty { display: flex; align-items: center; gap: 10px; }
.qty__btn { flex: none; width: var(--tap-lg); height: var(--tap-lg); border-radius: 18px; border: 1.5px solid var(--border-strong); background: var(--surface); color: var(--text-brand); display: grid; place-items: center; transition: transform 120ms var(--ease); }
.qty__btn:active { transform: scale(.92); }
.qty__display { flex: 1; text-align: center; }
.qty__caption { font-size: var(--fs-xs); font-weight: 700; color: var(--text-muted); }
.qty__value { font: 700 var(--fs-num)/1.05 var(--font-display); color: var(--text-brand); }
.qty__value.is-empty { color: var(--border-strong); }
.qty__unit { margin-left: 6px; font-size: var(--fs-md); color: var(--text-muted); }
.qty.is-shake { animation: shake 360ms var(--ease); }

/* Автостатус: меняется при каждом нажатии клавиши */
.auto-status {
  display: flex; align-items: center; gap: 10px; min-height: var(--tap); padding: 8px 14px; border-radius: 14px;
  font-size: var(--fs-sm); font-weight: 700; line-height: 1.3;
  transition: background-color 200ms var(--ease), color 200ms var(--ease);
}
.auto-status__dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: currentColor; }
.auto-status__text { flex: 1; }
.auto-status__plan { flex: none; height: 36px; padding: 0 12px; border-radius: var(--radius-pill); border: 1.5px solid currentColor; background: transparent; color: inherit; font-size: 13px; font-weight: 700; }
.auto-status--ok      { background: var(--fresh-soft);   color: var(--fresh); }
.auto-status--partial { background: color-mix(in oklab, var(--partial) 34%, var(--surface)); color: var(--text); }
.auto-status--partial .auto-status__dot { background: var(--partial); }
.auto-status--error   { background: var(--danger-soft);  color: var(--danger); }

/* Цифровая клавиатура 3×4 */
.numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-2); }
.numpad__key {
  height: 54px; border: 0; border-radius: var(--radius-md); background: var(--surface); box-shadow: var(--shadow-sm);
  font: 700 var(--fs-xl) var(--font-display); color: var(--text); display: grid; place-items: center;
  transition: transform 120ms var(--ease), background-color 120ms;
  touch-action: manipulation;
}
.numpad__key:active { transform: scale(.93); background: var(--accent-soft); }
.numpad__key--fn { background: var(--surface-2); }

.comment { width: 100%; min-height: 72px; padding: var(--space-3) 14px; border: 1px solid var(--border-strong); border-radius: 14px; background: var(--surface); font-size: var(--fs-md); resize: vertical; outline: none; }
.comment:focus { border-color: var(--accent); }

/* Успех: круг «выпрыгивает», галочка «рисуется» */
.success { position: absolute; inset: 0; z-index: 2; display: none; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-4); background: var(--bg); border-radius: inherit; }
.success.is-visible { display: flex; animation: fadeUp 180ms var(--ease); }
.success__circle { width: 96px; height: 96px; border-radius: 50%; background: var(--brand-green); display: grid; place-items: center; animation: pop 360ms var(--ease); }
.success--partial .success__circle { background: var(--accent); }
.success__check { width: 52px; height: 52px; stroke: var(--brand-cream); stroke-width: 2.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.success__check path { stroke-dasharray: 40; stroke-dashoffset: 40; animation: draw 380ms 120ms var(--ease) forwards; }
.success__text { font: 700 20px var(--font-display); color: var(--text-brand); }

/* =========================================================================
   Уведомление с отменой: полоска отсчёта 10с
   ========================================================================= */
.toast {
  position: fixed; left: var(--space-3); right: var(--space-3); bottom: calc(var(--bottom-nav-h) + var(--space-3)); z-index: 30;
  max-width: 480px; margin: 0 auto; overflow: hidden;
  background: var(--inverse); color: var(--on-inverse); border-radius: var(--radius-md); box-shadow: var(--shadow-lg);
  transform: translateY(calc(100% + 120px)); transition: transform var(--dur-slow) var(--ease-spring);
}
.toast.is-visible { transform: none; }
.toast__row { display: flex; align-items: center; gap: var(--space-3); min-height: 60px; padding: 0 var(--space-2) 0 var(--space-4); }
.toast__icon { stroke: #9cbf1e; stroke-width: 2.4; }
.toast__text { flex: 1; font-size: 15px; font-weight: 700; }
.toast__action { height: 44px; padding: 0 var(--space-4); border: 0; border-radius: var(--radius-pill); background: transparent; color: var(--accent); font-weight: 700; }
.toast__bar { height: 4px; background: var(--accent); transform-origin: left; }
.toast.is-visible .toast__bar { animation: countdown 10s linear forwards; }

/* Конфетти: JS создаёт 24 .confetti__piece со случайными --x, --d, --c */
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; overflow: hidden; }
.confetti__piece { position: absolute; top: -20px; left: var(--x); width: 8px; height: 12px; border-radius: 2px; background: var(--c); animation: confetti 2.4s cubic-bezier(.2,.6,.4,1) var(--d) forwards; }

/* =========================================================================
   Пустые состояния, баннеры, скелетоны
   ========================================================================= */
.empty-state { text-align: center; padding: var(--space-7) var(--space-4) var(--space-5); }
.empty-state__art { width: 72px; margin: 0 auto var(--space-4); animation: sway 5s ease-in-out infinite; }
.empty-state__title { font: 700 var(--fs-xl) var(--font-display); color: var(--text-brand); }
.empty-state__text { margin-top: 6px; font-size: 15px; color: var(--text-muted); }

.banner { display: flex; align-items: center; gap: var(--space-3); padding: 14px var(--space-4); border-radius: 14px; font-size: var(--fs-sm); font-weight: 700; line-height: 1.35; animation: fadeUp 220ms var(--ease); }
.banner__text { flex: 1; }
.banner__sub { display: block; font-weight: 500; color: var(--text-muted); margin-top: 2px; }
.banner--error    { background: var(--danger-soft); color: var(--danger); }
.banner--warning  { background: color-mix(in oklab, var(--partial) 32%, var(--surface)); color: var(--text); }
.banner--success  { background: var(--fresh-soft); color: var(--fresh); }
.banner--offline  { background: var(--partial); color: var(--brand-green-dark); }
.banner--conflict { background: var(--accent-soft); color: var(--text); }
.banner--conflict .icon { color: var(--accent); }
.banner--info     { background: var(--surface-2); color: var(--text); }

.skeleton { border-radius: 6px; background: linear-gradient(90deg, var(--border) 0, var(--surface-2) 50%, var(--border) 100%); background-size: 400px 100%; animation: shimmer 1.4s linear infinite; }

/* =========================================================================
   Прогресс: кольцо и полоса
   ========================================================================= */
/* Кольцо: r=34, длина окружности 213.6. JS ставит --p (0…1) после загрузки — заполнение 1.1с */
.progress-ring { position: relative; width: 84px; height: 84px; }
.progress-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.progress-ring__track { fill: none; stroke: var(--border); stroke-width: 9; }
.progress-ring__value { fill: none; stroke: var(--accent); stroke-width: 9; stroke-linecap: round; stroke-dasharray: 213.6; stroke-dashoffset: calc(213.6 * (1 - var(--p, 0))); transition: stroke-dashoffset 1100ms var(--ease); }
.progress-ring--done .progress-ring__value { stroke: var(--fresh); }
.progress-ring__label { position: absolute; inset: 0; display: grid; place-items: center; font: 700 17px var(--font-display); color: var(--text-brand); }
.progress-ring--lg { width: 132px; height: 132px; }
.progress-ring--lg .progress-ring__track, .progress-ring--lg .progress-ring__value { stroke-width: 12; }
.progress-ring--lg .progress-ring__label { font-size: 32px; }

.progress-bar { display: block; height: 8px; border-radius: var(--radius-pill); background: var(--border); overflow: hidden; }
.progress-bar__fill { display: block; height: 100%; width: calc(var(--p, 0) * 100%); border-radius: inherit; background: var(--accent); transition: width 700ms var(--ease); }
.progress-bar--done .progress-bar__fill { background: var(--fresh); }
.progress-bar--brand .progress-bar__fill { background: var(--text-brand); }
.progress-bar--lg { height: 10px; }

.metric { display: grid; grid-template-columns: 86px minmax(0,1fr) 52px; align-items: center; gap: 10px; font-size: 13px; }
.metric__label { color: var(--text-muted); }
.metric__value { text-align: right; font-weight: 700; }

/* =========================================================================
   Дашборд сети
   ========================================================================= */
.page { display: flex; flex-direction: column; gap: var(--space-5); padding-top: var(--space-4); }
.page-head { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
.page-head__title { flex: 1 1 100%; }
.sync-indicator { display: flex; align-items: center; gap: var(--space-2); font-size: 13px; color: var(--text-muted); }
.sync-indicator__dot { width: 8px; height: 8px; border-radius: 50%; background: var(--fresh); }

.card { border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-sm); }
.card--pad { padding: var(--space-5); }

.network-summary { display: grid; gap: var(--space-5); padding: var(--space-5); }
.network-summary__ring { justify-self: center; }
.network-summary__bars { display: flex; flex-direction: column; gap: 14px; }
.network-summary__bars .metric { grid-template-columns: 100px minmax(0,1fr) 64px; font-size: var(--fs-sm); }
.network-summary__bars .metric__label { color: var(--text); font-weight: 700; }
.network-summary__alerts { display: flex; flex-direction: column; gap: var(--space-2); }
.alert-line { display: flex; align-items: center; gap: 10px; font-size: var(--fs-sm); line-height: 1.3; }
.alert-line__dot { flex: none; width: 8px; height: 8px; border-radius: 50%; }
.alert-line--warn .alert-line__dot { background: var(--partial); }
.alert-line--error .alert-line__dot { background: var(--danger); }
.counter { min-width: 24px; height: 24px; padding: 0 6px; border-radius: var(--radius-pill); background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-size: var(--fs-xs); font-weight: 700; letter-spacing: 0; }

.point-grid { display: grid; gap: var(--space-4); grid-template-columns: 1fr; }
.point-tile { display: flex; flex-direction: column; gap: 14px; padding: 20px; border: 1.5px solid transparent; transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease); animation: fadeUp 320ms var(--ease) both; }
@media (hover: hover) { .point-tile:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); } }
.point-tile--alert { border-color: color-mix(in oklab, var(--danger) 45%, transparent); }
.point-tile__head { display: flex; align-items: center; gap: var(--space-3); }
.point-tile__name { font-size: 17px; font-weight: 700; color: var(--text-brand); }
.point-tile__last { font-size: 13px; color: var(--text-muted); }
.point-tile__pct { margin-left: auto; font: 700 22px var(--font-display); color: var(--text-brand); }
.point-tile__metrics { display: flex; flex-direction: column; gap: var(--space-2); }
.point-tile__staff { display: flex; align-items: center; gap: var(--space-2); padding-top: var(--space-3); border-top: 1px solid var(--border); font-size: 13px; color: var(--text-muted); }
.point-tile__staff--empty { color: var(--danger); font-weight: 700; }
.point-tile__alerts { display: flex; gap: 6px; flex-wrap: wrap; min-height: 28px; }

/* =========================================================================
   Таблица (ПК). На мобильном прокручивается горизонтально.
   ========================================================================= */
.data-table { width: 100%; border-collapse: collapse; font-size: 15px; }
.table-wrap { overflow-x: auto; border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-sm); }
.data-table th { height: var(--tap); padding: 0 var(--space-4); text-align: left; font-size: 13px; font-weight: 700; color: var(--text-muted); border-bottom: 1px solid var(--border); white-space: nowrap; }
.data-table td { height: 52px; padding: 0 var(--space-4); border-bottom: 1px solid var(--border); }
.data-table tbody tr { transition: background-color var(--dur-fast); }
.data-table tbody tr:hover { background: color-mix(in oklab, var(--text-brand) 4%, var(--surface)); }
.data-table .is-num { text-align: right; font-variant-numeric: tabular-nums; }
.data-table .is-muted { color: var(--text-muted); }
.data-table__foot { padding: 14px var(--space-4); font-size: 13px; color: var(--text-muted); display: flex; align-items: center; gap: var(--space-2); }

/* ---------- Окно подтверждения ---------- */
.modal-backdrop { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: var(--space-4); background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity var(--dur) var(--ease); }
.modal-backdrop.is-open { opacity: 1; pointer-events: auto; }
.modal { width: 100%; max-width: 460px; padding: var(--space-6) 28px 28px; border-radius: 24px; background: var(--bg); box-shadow: var(--shadow-lg); display: flex; flex-direction: column; gap: var(--space-4); transform: scale(.94); transition: transform var(--dur-slow) var(--ease-spring); }
.modal-backdrop.is-open .modal { transform: none; }
.modal__title { margin: 0; font: 700 var(--fs-xl) var(--font-display); color: var(--text-brand); }
.modal__actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }

/* =========================================================================
   Экран входа
   ========================================================================= */
.login { position: relative; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; overflow: hidden; background: var(--brand-green-dark); }
.login__art { position: absolute; inset: 0; pointer-events: none; }
.login__dome { position: absolute; border-radius: var(--radius-dome); }
.login__dome--green  { width: 320px; height: 160px; left: -60px; top: 34%; background: var(--brand-green); opacity: .7; }
.login__dome--carrot { width: 220px; height: 110px; right: -50px; top: 40%; background: var(--brand-carrot); }
/* Плавающие фрукты: ±12px по вертикали и ±2° — медленно, 6–8с */
.login__fruit { position: absolute; width: var(--w, 64px); animation: float var(--t, 6s) ease-in-out infinite; animation-delay: var(--delay, 0s); }
/* Капли сока падают и тают */
.login__drop { position: absolute; width: 9px; height: 13px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; background: var(--c, var(--brand-carrot)); animation: drop var(--t, 4s) ease-in infinite; animation-delay: var(--delay, 0s); }
.login__brand { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: var(--space-6) var(--space-4); color: var(--brand-cream); text-align: center; }
.login__mark { width: 54px; height: 78px; }
.login__name { font: 700 28px var(--font-display); }
.login__sub { margin-top: 4px; font-size: 13px; font-weight: 700; letter-spacing: .3em; color: var(--brand-carrot); }
.login__card { position: relative; z-index: 1; width: 100%; padding: 28px var(--space-5) calc(36px + env(safe-area-inset-bottom)); background: var(--bg); border-radius: var(--radius-xl) var(--radius-xl) 0 0; display: flex; flex-direction: column; gap: 14px; }
.login__card.is-shake { animation: shake 360ms var(--ease); }
.login__title { margin: 0; font: 700 24px var(--font-display); color: var(--text-brand); }
.login__hint { margin: 4px 0 0; font-size: var(--fs-sm); color: var(--text-muted); }
.login [hidden] { display: none; }

/* =========================================================================
   Адаптивность
   ========================================================================= */
@media (min-width: 768px) {
html[data-layout="auto"] .app__main { padding-left: var(--space-6); padding-right: var(--space-6); }
html[data-layout="auto"] .app-header { padding: var(--space-4) var(--space-6); flex-direction: row; align-items: center; }
html[data-layout="auto"] .app-header__row { flex: 1; }
html[data-layout="auto"] .toolbar { flex-direction: row; align-items: center; }
html[data-layout="auto"] .toolbar .field { flex: 0 1 320px; margin-left: auto; }
html[data-layout="auto"] .item-group__list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
html[data-layout="auto"] .done-section__list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
html[data-layout="auto"] .sheet { left: 50%; right: auto; bottom: var(--space-5); width: 560px; margin-left: -280px; border-radius: var(--radius-xl); max-height: calc(100vh - 48px); max-height: calc(100dvh - 48px); transform: translateY(calc(100% + 48px)); }
html[data-layout="auto"] .sheet.is-open { transform: none; }
html[data-layout="auto"] .point-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
html[data-layout="auto"] .network-summary { grid-template-columns: auto minmax(0, 1fr); align-items: center; }
html[data-layout="auto"] .network-summary__alerts { grid-column: 1 / -1; }
html[data-layout="auto"] .page-head__title { flex: 1 1 auto; }
html[data-layout="auto"] .login { align-items: center; justify-content: center; }
html[data-layout="auto"] .login__brand { flex: none; padding-bottom: var(--space-5); }
html[data-layout="auto"] .login__card { max-width: 440px; border-radius: var(--radius-xl); padding-bottom: 32px; box-shadow: var(--shadow-lg); }

}
